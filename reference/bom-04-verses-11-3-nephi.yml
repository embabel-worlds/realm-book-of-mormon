- type: BomVerse
  data:
    ref: 3-nephi.15.1
    scripture: book-of-mormon
    name: 3 Nephi 15:1
    book: 3 Nephi
    chapter: 15
    verse: 1
    ordinal: 5354
    text: 'And now it came to pass that when Jesus had ended these sayings he cast his eyes round about on the multitude, and said unto them: Behold, ye have heard the things which I taught before I ascended to my Father; therefore, whoso remembereth these sayings of mine and doeth them, him will I raise up at the last day.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.2
    scripture: book-of-mormon
    name: 3 Nephi 15:2
    book: 3 Nephi
    chapter: 15
    verse: 2
    ordinal: 5355
    text: And it came to pass that when Jesus had said these words he perceived that there were some among them who marveled, and wondered what he would concerning the law of Moses; for they understood not the saying that old things had passed away, and that all things had become new.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.3
    scripture: book-of-mormon
    name: 3 Nephi 15:3
    book: 3 Nephi
    chapter: 15
    verse: 3
    ordinal: 5356
    text: 'And he said unto them: Marvel not that I said unto you that old things had passed away, and that all things had become new.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.4
    scripture: book-of-mormon
    name: 3 Nephi 15:4
    book: 3 Nephi
    chapter: 15
    verse: 4
    ordinal: 5357
    text: Behold, I say unto you that the law is fulfilled that was given unto Moses.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.5
    scripture: book-of-mormon
    name: 3 Nephi 15:5
    book: 3 Nephi
    chapter: 15
    verse: 5
    ordinal: 5358
    text: Behold, I am he that gave the law, and I am he who covenanted with my people Israel; therefore, the law in me is fulfilled, for I have come to fulfil the law; therefore it hath an end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.6
    scripture: book-of-mormon
    name: 3 Nephi 15:6
    book: 3 Nephi
    chapter: 15
    verse: 6
    ordinal: 5359
    text: Behold, I do not destroy the prophets, for as many as have not been fulfilled in me, verily I say unto you, shall all be fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.7
    scripture: book-of-mormon
    name: 3 Nephi 15:7
    book: 3 Nephi
    chapter: 15
    verse: 7
    ordinal: 5360
    text: And because I said unto you that old things have passed away, I do not destroy that which hath been spoken concerning things which are to come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.8
    scripture: book-of-mormon
    name: 3 Nephi 15:8
    book: 3 Nephi
    chapter: 15
    verse: 8
    ordinal: 5361
    text: For behold, the covenant which I have made with my people is not all fulfilled; but the law which was given unto Moses hath an end in me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.9
    scripture: book-of-mormon
    name: 3 Nephi 15:9
    book: 3 Nephi
    chapter: 15
    verse: 9
    ordinal: 5362
    text: Behold, I am the law, and the light. Look unto me, and endure to the end, and ye shall live; for unto him that endureth to the end will I give eternal life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.10
    scripture: book-of-mormon
    name: 3 Nephi 15:10
    book: 3 Nephi
    chapter: 15
    verse: 10
    ordinal: 5363
    text: Behold, I have given unto you the commandments; therefore keep my commandments. And this is the law and the prophets, for they truly testified of me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.11
    scripture: book-of-mormon
    name: 3 Nephi 15:11
    book: 3 Nephi
    chapter: 15
    verse: 11
    ordinal: 5364
    text: 'And now it came to pass that when Jesus had spoken these words, he said unto those twelve whom he had chosen:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.12
    scripture: book-of-mormon
    name: 3 Nephi 15:12
    book: 3 Nephi
    chapter: 15
    verse: 12
    ordinal: 5365
    text: Ye are my disciples; and ye are a light unto this people, who are a remnant of the house of Joseph.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.13
    scripture: book-of-mormon
    name: 3 Nephi 15:13
    book: 3 Nephi
    chapter: 15
    verse: 13
    ordinal: 5366
    text: And behold, this is the land of your inheritance; and the Father hath given it unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.14
    scripture: book-of-mormon
    name: 3 Nephi 15:14
    book: 3 Nephi
    chapter: 15
    verse: 14
    ordinal: 5367
    text: And not at any time hath the Father given me commandment that I should tell it unto your brethren at Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.15
    scripture: book-of-mormon
    name: 3 Nephi 15:15
    book: 3 Nephi
    chapter: 15
    verse: 15
    ordinal: 5368
    text: Neither at any time hath the Father given me commandment that I should tell unto them concerning the other tribes of the house of Israel, whom the Father hath led away out of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.16
    scripture: book-of-mormon
    name: 3 Nephi 15:16
    book: 3 Nephi
    chapter: 15
    verse: 16
    ordinal: 5369
    text: 'This much did the Father command me, that I should tell unto them:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.17
    scripture: book-of-mormon
    name: 3 Nephi 15:17
    book: 3 Nephi
    chapter: 15
    verse: 17
    ordinal: 5370
    text: That other sheep I have which are not of this fold; them also I must bring, and they shall hear my voice; and there shall be one fold, and one shepherd.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.18
    scripture: book-of-mormon
    name: 3 Nephi 15:18
    book: 3 Nephi
    chapter: 15
    verse: 18
    ordinal: 5371
    text: And now, because of stiffneckedness and unbelief they understood not my word; therefore I was commanded to say no more of the Father concerning this thing unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.19
    scripture: book-of-mormon
    name: 3 Nephi 15:19
    book: 3 Nephi
    chapter: 15
    verse: 19
    ordinal: 5372
    text: But, verily, I say unto you that the Father hath commanded me, and I tell it unto you, that ye were separated from among them because of their iniquity; therefore it is because of their iniquity that they know not of you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.20
    scripture: book-of-mormon
    name: 3 Nephi 15:20
    book: 3 Nephi
    chapter: 15
    verse: 20
    ordinal: 5373
    text: And verily, I say unto you again that the other tribes hath the Father separated from them; and it is because of their iniquity that they know not of them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.21
    scripture: book-of-mormon
    name: 3 Nephi 15:21
    book: 3 Nephi
    chapter: 15
    verse: 21
    ordinal: 5374
    text: 'And verily I say unto you, that ye are they of whom I said: Other sheep I have which are not of this fold; them also I must bring, and they shall hear my voice; and there shall be one fold, and one shepherd.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.22
    scripture: book-of-mormon
    name: 3 Nephi 15:22
    book: 3 Nephi
    chapter: 15
    verse: 22
    ordinal: 5375
    text: And they understood me not, for they supposed it had been the Gentiles; for they understood not that the Gentiles should be converted through their preaching.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.23
    scripture: book-of-mormon
    name: 3 Nephi 15:23
    book: 3 Nephi
    chapter: 15
    verse: 23
    ordinal: 5376
    text: And they understood me not that I said they shall hear my voice; and they understood me not that the Gentiles should not at any time hear my voice—that I should not manifest myself unto them save it were by the Holy Ghost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.15.24
    scripture: book-of-mormon
    name: 3 Nephi 15:24
    book: 3 Nephi
    chapter: 15
    verse: 24
    ordinal: 5377
    text: But behold, ye have both heard my voice, and seen me; and ye are my sheep, and ye are numbered among those whom the Father hath given me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.15
- type: BomVerse
  data:
    ref: 3-nephi.16.1
    scripture: book-of-mormon
    name: 3 Nephi 16:1
    book: 3 Nephi
    chapter: 16
    verse: 1
    ordinal: 5378
    text: And verily, verily, I say unto you that I have other sheep, which are not of this land, neither of the land of Jerusalem, neither in any parts of that land round about whither I have been to minister.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.2
    scripture: book-of-mormon
    name: 3 Nephi 16:2
    book: 3 Nephi
    chapter: 16
    verse: 2
    ordinal: 5379
    text: For they of whom I speak are they who have not as yet heard my voice; neither have I at any time manifested myself unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.3
    scripture: book-of-mormon
    name: 3 Nephi 16:3
    book: 3 Nephi
    chapter: 16
    verse: 3
    ordinal: 5380
    text: But I have received a commandment of the Father that I shall go unto them, and that they shall hear my voice, and shall be numbered among my sheep, that there may be one fold and one shepherd; therefore I go to show myself unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.4
    scripture: book-of-mormon
    name: 3 Nephi 16:4
    book: 3 Nephi
    chapter: 16
    verse: 4
    ordinal: 5381
    text: And I command you that ye shall write these sayings after I am gone, that if it so be that my people at Jerusalem, they who have seen me and been with me in my ministry, do not ask the Father in my name, that they may receive a knowledge of you by the Holy Ghost, and also of the other tribes whom they know not of, that these sayings which ye shall write shall be kept and shall be manifested unto the Gentiles, that through the fulness of the Gentiles, the remnant of their seed, who shall be scattered forth upon the face of the earth because of their unbelief, may be brought in, or may be brought to a knowledge of me, their Redeemer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.5
    scripture: book-of-mormon
    name: 3 Nephi 16:5
    book: 3 Nephi
    chapter: 16
    verse: 5
    ordinal: 5382
    text: And then will I gather them in from the four quarters of the earth; and then will I fulfil the covenant which the Father hath made unto all the people of the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.6
    scripture: book-of-mormon
    name: 3 Nephi 16:6
    book: 3 Nephi
    chapter: 16
    verse: 6
    ordinal: 5383
    text: And blessed are the Gentiles, because of their belief in me, in and of the Holy Ghost, which witnesses unto them of me and of the Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.7
    scripture: book-of-mormon
    name: 3 Nephi 16:7
    book: 3 Nephi
    chapter: 16
    verse: 7
    ordinal: 5384
    text: Behold, because of their belief in me, saith the Father, and because of the unbelief of you, O house of Israel, in the latter day shall the truth come unto the Gentiles, that the fulness of these things shall be made known unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.8
    scripture: book-of-mormon
    name: 3 Nephi 16:8
    book: 3 Nephi
    chapter: 16
    verse: 8
    ordinal: 5385
    text: But wo, saith the Father, unto the unbelieving of the Gentiles—for notwithstanding they have come forth upon the face of this land, and have scattered my people who are of the house of Israel; and my people who are of the house of Israel have been cast out from among them, and have been trodden under feet by them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.9
    scripture: book-of-mormon
    name: 3 Nephi 16:9
    book: 3 Nephi
    chapter: 16
    verse: 9
    ordinal: 5386
    text: And because of the mercies of the Father unto the Gentiles, and also the judgments of the Father upon my people who are of the house of Israel, verily, verily, I say unto you, that after all this, and I have caused my people who are of the house of Israel to be smitten, and to be afflicted, and to be slain, and to be cast out from among them, and to become hated by them, and to become a hiss and a byword among them—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.10
    scripture: book-of-mormon
    name: 3 Nephi 16:10
    book: 3 Nephi
    chapter: 16
    verse: 10
    ordinal: 5387
    text: 'And thus commandeth the Father that I should say unto you: At that day when the Gentiles shall sin against my gospel, and shall reject the fulness of my gospel, and shall be lifted up in the pride of their hearts above all nations, and above all the people of the whole earth, and shall be filled with all manner of lyings, and of deceits, and of mischiefs, and all manner of hypocrisy, and murders, and priestcrafts, and whoredoms, and of secret abominations; and if they shall do all those things, and shall reject the fulness of my gospel, behold, saith the Father, I will bring the fulness of my gospel from among them.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.11
    scripture: book-of-mormon
    name: 3 Nephi 16:11
    book: 3 Nephi
    chapter: 16
    verse: 11
    ordinal: 5388
    text: And then will I remember my covenant which I have made unto my people, O house of Israel, and I will bring my gospel unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.12
    scripture: book-of-mormon
    name: 3 Nephi 16:12
    book: 3 Nephi
    chapter: 16
    verse: 12
    ordinal: 5389
    text: And I will show unto thee, O house of Israel, that the Gentiles shall not have power over you; but I will remember my covenant unto you, O house of Israel, and ye shall come unto the knowledge of the fulness of my gospel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.13
    scripture: book-of-mormon
    name: 3 Nephi 16:13
    book: 3 Nephi
    chapter: 16
    verse: 13
    ordinal: 5390
    text: But if the Gentiles will repent and return unto me, saith the Father, behold they shall be numbered among my people, O house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.14
    scripture: book-of-mormon
    name: 3 Nephi 16:14
    book: 3 Nephi
    chapter: 16
    verse: 14
    ordinal: 5391
    text: And I will not suffer my people, who are of the house of Israel, to go through among them, and tread them down, saith the Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.15
    scripture: book-of-mormon
    name: 3 Nephi 16:15
    book: 3 Nephi
    chapter: 16
    verse: 15
    ordinal: 5392
    text: But if they will not turn unto me, and hearken unto my voice, I will suffer them, yea, I will suffer my people, O house of Israel, that they shall go through among them, and shall tread them down, and they shall be as salt that hath lost its savor, which is thenceforth good for nothing but to be cast out, and to be trodden under foot of my people, O house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.16
    scripture: book-of-mormon
    name: 3 Nephi 16:16
    book: 3 Nephi
    chapter: 16
    verse: 16
    ordinal: 5393
    text: Verily, verily, I say unto you, thus hath the Father commanded me—that I should give unto this people this land for their inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.17
    scripture: book-of-mormon
    name: 3 Nephi 16:17
    book: 3 Nephi
    chapter: 16
    verse: 17
    ordinal: 5394
    text: 'And then the words of the prophet Isaiah shall be fulfilled, which say:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.18
    scripture: book-of-mormon
    name: 3 Nephi 16:18
    book: 3 Nephi
    chapter: 16
    verse: 18
    ordinal: 5395
    text: Thy watchmen shall lift up the voice; with the voice together shall they sing, for they shall see eye to eye when the Lord shall bring again Zion.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 52:8
    kjvOsis:
    - Isa.52.8
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.19
    scripture: book-of-mormon
    name: 3 Nephi 16:19
    book: 3 Nephi
    chapter: 16
    verse: 19
    ordinal: 5396
    text: Break forth into joy, sing together, ye waste places of Jerusalem; for the Lord hath comforted his people, he hath redeemed Jerusalem.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 52:9
    kjvOsis:
    - Isa.52.9
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.16.20
    scripture: book-of-mormon
    name: 3 Nephi 16:20
    book: 3 Nephi
    chapter: 16
    verse: 20
    ordinal: 5397
    text: The Lord hath made bare his holy arm in the eyes of all the nations; and all the ends of the earth shall see the salvation of God.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 52:10
    kjvOsis:
    - Isa.52.10
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.16
- type: BomVerse
  data:
    ref: 3-nephi.17.1
    scripture: book-of-mormon
    name: 3 Nephi 17:1
    book: 3 Nephi
    chapter: 17
    verse: 1
    ordinal: 5398
    text: 'Behold, now it came to pass that when Jesus had spoken these words he looked round about again on the multitude, and he said unto them: Behold, my time is at hand.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.2
    scripture: book-of-mormon
    name: 3 Nephi 17:2
    book: 3 Nephi
    chapter: 17
    verse: 2
    ordinal: 5399
    text: I perceive that ye are weak, that ye cannot understand all my words which I am commanded of the Father to speak unto you at this time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.3
    scripture: book-of-mormon
    name: 3 Nephi 17:3
    book: 3 Nephi
    chapter: 17
    verse: 3
    ordinal: 5400
    text: Therefore, go ye unto your homes, and ponder upon the things which I have said, and ask of the Father, in my name, that ye may understand, and prepare your minds for the morrow, and I come unto you again.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.4
    scripture: book-of-mormon
    name: 3 Nephi 17:4
    book: 3 Nephi
    chapter: 17
    verse: 4
    ordinal: 5401
    text: But now I go unto the Father, and also to show myself unto the lost tribes of Israel, for they are not lost unto the Father, for he knoweth whither he hath taken them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.5
    scripture: book-of-mormon
    name: 3 Nephi 17:5
    book: 3 Nephi
    chapter: 17
    verse: 5
    ordinal: 5402
    text: And it came to pass that when Jesus had thus spoken, he cast his eyes round about again on the multitude, and beheld they were in tears, and did look steadfastly upon him as if they would ask him to tarry a little longer with them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.6
    scripture: book-of-mormon
    name: 3 Nephi 17:6
    book: 3 Nephi
    chapter: 17
    verse: 6
    ordinal: 5403
    text: 'And he said unto them: Behold, my bowels are filled with compassion towards you.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.7
    scripture: book-of-mormon
    name: 3 Nephi 17:7
    book: 3 Nephi
    chapter: 17
    verse: 7
    ordinal: 5404
    text: Have ye any that are sick among you? Bring them hither. Have ye any that are lame, or blind, or halt, or maimed, or leprous, or that are withered, or that are deaf, or that are afflicted in any manner? Bring them hither and I will heal them, for I have compassion upon you; my bowels are filled with mercy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.8
    scripture: book-of-mormon
    name: 3 Nephi 17:8
    book: 3 Nephi
    chapter: 17
    verse: 8
    ordinal: 5405
    text: For I perceive that ye desire that I should show unto you what I have done unto your brethren at Jerusalem, for I see that your faith is sufficient that I should heal you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.9
    scripture: book-of-mormon
    name: 3 Nephi 17:9
    book: 3 Nephi
    chapter: 17
    verse: 9
    ordinal: 5406
    text: And it came to pass that when he had thus spoken, all the multitude, with one accord, did go forth with their sick and their afflicted, and their lame, and with their blind, and with their dumb, and with all them that were afflicted in any manner; and he did heal them every one as they were brought forth unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.10
    scripture: book-of-mormon
    name: 3 Nephi 17:10
    book: 3 Nephi
    chapter: 17
    verse: 10
    ordinal: 5407
    text: And they did all, both they who had been healed and they who were whole, bow down at his feet, and did worship him; and as many as could come for the multitude did kiss his feet, insomuch that they did bathe his feet with their tears.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.11
    scripture: book-of-mormon
    name: 3 Nephi 17:11
    book: 3 Nephi
    chapter: 17
    verse: 11
    ordinal: 5408
    text: And it came to pass that he commanded that their little children should be brought.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.12
    scripture: book-of-mormon
    name: 3 Nephi 17:12
    book: 3 Nephi
    chapter: 17
    verse: 12
    ordinal: 5409
    text: So they brought their little children and set them down upon the ground round about him, and Jesus stood in the midst; and the multitude gave way till they had all been brought unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.13
    scripture: book-of-mormon
    name: 3 Nephi 17:13
    book: 3 Nephi
    chapter: 17
    verse: 13
    ordinal: 5410
    text: And it came to pass that when they had all been brought, and Jesus stood in the midst, he commanded the multitude that they should kneel down upon the ground.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.14
    scripture: book-of-mormon
    name: 3 Nephi 17:14
    book: 3 Nephi
    chapter: 17
    verse: 14
    ordinal: 5411
    text: 'And it came to pass that when they had knelt upon the ground, Jesus groaned within himself, and said: Father, I am troubled because of the wickedness of the people of the house of Israel.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.15
    scripture: book-of-mormon
    name: 3 Nephi 17:15
    book: 3 Nephi
    chapter: 17
    verse: 15
    ordinal: 5412
    text: And when he had said these words, he himself also knelt upon the earth; and behold he prayed unto the Father, and the things which he prayed cannot be written, and the multitude did bear record who heard him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.16
    scripture: book-of-mormon
    name: 3 Nephi 17:16
    book: 3 Nephi
    chapter: 17
    verse: 16
    ordinal: 5413
    text: 'And after this manner do they bear record: The eye hath never seen, neither hath the ear heard, before, so great and marvelous things as we saw and heard Jesus speak unto the Father;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.17
    scripture: book-of-mormon
    name: 3 Nephi 17:17
    book: 3 Nephi
    chapter: 17
    verse: 17
    ordinal: 5414
    text: And no tongue can speak, neither can there be written by any man, neither can the hearts of men conceive so great and marvelous things as we both saw and heard Jesus speak; and no one can conceive of the joy which filled our souls at the time we heard him pray for us unto the Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.18
    scripture: book-of-mormon
    name: 3 Nephi 17:18
    book: 3 Nephi
    chapter: 17
    verse: 18
    ordinal: 5415
    text: And it came to pass that when Jesus had made an end of praying unto the Father, he arose; but so great was the joy of the multitude that they were overcome.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.19
    scripture: book-of-mormon
    name: 3 Nephi 17:19
    book: 3 Nephi
    chapter: 17
    verse: 19
    ordinal: 5416
    text: And it came to pass that Jesus spake unto them, and bade them arise.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.20
    scripture: book-of-mormon
    name: 3 Nephi 17:20
    book: 3 Nephi
    chapter: 17
    verse: 20
    ordinal: 5417
    text: 'And they arose from the earth, and he said unto them: Blessed are ye because of your faith. And now behold, my joy is full.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.21
    scripture: book-of-mormon
    name: 3 Nephi 17:21
    book: 3 Nephi
    chapter: 17
    verse: 21
    ordinal: 5418
    text: And when he had said these words, he wept, and the multitude bare record of it, and he took their little children, one by one, and blessed them, and prayed unto the Father for them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.22
    scripture: book-of-mormon
    name: 3 Nephi 17:22
    book: 3 Nephi
    chapter: 17
    verse: 22
    ordinal: 5419
    text: And when he had done this he wept again;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.23
    scripture: book-of-mormon
    name: 3 Nephi 17:23
    book: 3 Nephi
    chapter: 17
    verse: 23
    ordinal: 5420
    text: 'And he spake unto the multitude, and said unto them: Behold your little ones.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.24
    scripture: book-of-mormon
    name: 3 Nephi 17:24
    book: 3 Nephi
    chapter: 17
    verse: 24
    ordinal: 5421
    text: And as they looked to behold they cast their eyes towards heaven, and they saw the heavens open, and they saw angels descending out of heaven as it were in the midst of fire; and they came down and encircled those little ones about, and they were encircled about with fire; and the angels did minister unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.17.25
    scripture: book-of-mormon
    name: 3 Nephi 17:25
    book: 3 Nephi
    chapter: 17
    verse: 25
    ordinal: 5422
    text: And the multitude did see and hear and bear record; and they know that their record is true for they all of them did see and hear, every man for himself; and they were in number about two thousand and five hundred souls; and they did consist of men, women, and children.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.17
- type: BomVerse
  data:
    ref: 3-nephi.18.1
    scripture: book-of-mormon
    name: 3 Nephi 18:1
    book: 3 Nephi
    chapter: 18
    verse: 1
    ordinal: 5423
    text: And it came to pass that Jesus commanded his disciples that they should bring forth some bread and wine unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.2
    scripture: book-of-mormon
    name: 3 Nephi 18:2
    book: 3 Nephi
    chapter: 18
    verse: 2
    ordinal: 5424
    text: And while they were gone for bread and wine, he commanded the multitude that they should sit themselves down upon the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.3
    scripture: book-of-mormon
    name: 3 Nephi 18:3
    book: 3 Nephi
    chapter: 18
    verse: 3
    ordinal: 5425
    text: And when the disciples had come with bread and wine, he took of the bread and brake and blessed it; and he gave unto the disciples and commanded that they should eat.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.4
    scripture: book-of-mormon
    name: 3 Nephi 18:4
    book: 3 Nephi
    chapter: 18
    verse: 4
    ordinal: 5426
    text: And when they had eaten and were filled, he commanded that they should give unto the multitude.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.5
    scripture: book-of-mormon
    name: 3 Nephi 18:5
    book: 3 Nephi
    chapter: 18
    verse: 5
    ordinal: 5427
    text: 'And when the multitude had eaten and were filled, he said unto the disciples: Behold there shall one be ordained among you, and to him will I give power that he shall break bread and bless it and give it unto the people of my church, unto all those who shall believe and be baptized in my name.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.6
    scripture: book-of-mormon
    name: 3 Nephi 18:6
    book: 3 Nephi
    chapter: 18
    verse: 6
    ordinal: 5428
    text: And this shall ye always observe to do, even as I have done, even as I have broken bread and blessed it and given it unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.7
    scripture: book-of-mormon
    name: 3 Nephi 18:7
    book: 3 Nephi
    chapter: 18
    verse: 7
    ordinal: 5429
    text: And this shall ye do in remembrance of my body, which I have shown unto you. And it shall be a testimony unto the Father that ye do always remember me. And if ye do always remember me ye shall have my Spirit to be with you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.8
    scripture: book-of-mormon
    name: 3 Nephi 18:8
    book: 3 Nephi
    chapter: 18
    verse: 8
    ordinal: 5430
    text: And it came to pass that when he said these words, he commanded his disciples that they should take of the wine of the cup and drink of it, and that they should also give unto the multitude that they might drink of it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.9
    scripture: book-of-mormon
    name: 3 Nephi 18:9
    book: 3 Nephi
    chapter: 18
    verse: 9
    ordinal: 5431
    text: And it came to pass that they did so, and did drink of it and were filled; and they gave unto the multitude, and they did drink, and they were filled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.10
    scripture: book-of-mormon
    name: 3 Nephi 18:10
    book: 3 Nephi
    chapter: 18
    verse: 10
    ordinal: 5432
    text: 'And when the disciples had done this, Jesus said unto them: Blessed are ye for this thing which ye have done, for this is fulfilling my commandments, and this doth witness unto the Father that ye are willing to do that which I have commanded you.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.11
    scripture: book-of-mormon
    name: 3 Nephi 18:11
    book: 3 Nephi
    chapter: 18
    verse: 11
    ordinal: 5433
    text: And this shall ye always do to those who repent and are baptized in my name; and ye shall do it in remembrance of my blood, which I have shed for you, that ye may witness unto the Father that ye do always remember me. And if ye do always remember me ye shall have my Spirit to be with you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.12
    scripture: book-of-mormon
    name: 3 Nephi 18:12
    book: 3 Nephi
    chapter: 18
    verse: 12
    ordinal: 5434
    text: And I give unto you a commandment that ye shall do these things. And if ye shall always do these things blessed are ye, for ye are built upon my rock.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.13
    scripture: book-of-mormon
    name: 3 Nephi 18:13
    book: 3 Nephi
    chapter: 18
    verse: 13
    ordinal: 5435
    text: But whoso among you shall do more or less than these are not built upon my rock, but are built upon a sandy foundation; and when the rain descends, and the floods come, and the winds blow, and beat upon them, they shall fall, and the gates of hell are ready open to receive them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.14
    scripture: book-of-mormon
    name: 3 Nephi 18:14
    book: 3 Nephi
    chapter: 18
    verse: 14
    ordinal: 5436
    text: Therefore blessed are ye if ye shall keep my commandments, which the Father hath commanded me that I should give unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.15
    scripture: book-of-mormon
    name: 3 Nephi 18:15
    book: 3 Nephi
    chapter: 18
    verse: 15
    ordinal: 5437
    text: Verily, verily, I say unto you, ye must watch and pray always, lest ye be tempted by the devil, and ye be led away captive by him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.16
    scripture: book-of-mormon
    name: 3 Nephi 18:16
    book: 3 Nephi
    chapter: 18
    verse: 16
    ordinal: 5438
    text: And as I have prayed among you even so shall ye pray in my church, among my people who do repent and are baptized in my name. Behold I am the light; I have set an example for you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.17
    scripture: book-of-mormon
    name: 3 Nephi 18:17
    book: 3 Nephi
    chapter: 18
    verse: 17
    ordinal: 5439
    text: 'And it came to pass that when Jesus had spoken these words unto his disciples, he turned again unto the multitude and said unto them:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.18
    scripture: book-of-mormon
    name: 3 Nephi 18:18
    book: 3 Nephi
    chapter: 18
    verse: 18
    ordinal: 5440
    text: Behold, verily, verily, I say unto you, ye must watch and pray always lest ye enter into temptation; for Satan desireth to have you, that he may sift you as wheat.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.19
    scripture: book-of-mormon
    name: 3 Nephi 18:19
    book: 3 Nephi
    chapter: 18
    verse: 19
    ordinal: 5441
    text: Therefore ye must always pray unto the Father in my name;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.20
    scripture: book-of-mormon
    name: 3 Nephi 18:20
    book: 3 Nephi
    chapter: 18
    verse: 20
    ordinal: 5442
    text: And whatsoever ye shall ask the Father in my name, which is right, believing that ye shall receive, behold it shall be given unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.21
    scripture: book-of-mormon
    name: 3 Nephi 18:21
    book: 3 Nephi
    chapter: 18
    verse: 21
    ordinal: 5443
    text: Pray in your families unto the Father, always in my name, that your wives and your children may be blessed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.22
    scripture: book-of-mormon
    name: 3 Nephi 18:22
    book: 3 Nephi
    chapter: 18
    verse: 22
    ordinal: 5444
    text: And behold, ye shall meet together oft; and ye shall not forbid any man from coming unto you when ye shall meet together, but suffer them that they may come unto you and forbid them not;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.23
    scripture: book-of-mormon
    name: 3 Nephi 18:23
    book: 3 Nephi
    chapter: 18
    verse: 23
    ordinal: 5445
    text: But ye shall pray for them, and shall not cast them out; and if it so be that they come unto you oft ye shall pray for them unto the Father, in my name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.24
    scripture: book-of-mormon
    name: 3 Nephi 18:24
    book: 3 Nephi
    chapter: 18
    verse: 24
    ordinal: 5446
    text: Therefore, hold up your light that it may shine unto the world. Behold I am the light which ye shall hold up—that which ye have seen me do. Behold ye see that I have prayed unto the Father, and ye all have witnessed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.25
    scripture: book-of-mormon
    name: 3 Nephi 18:25
    book: 3 Nephi
    chapter: 18
    verse: 25
    ordinal: 5447
    text: And ye see that I have commanded that none of you should go away, but rather have commanded that ye should come unto me, that ye might feel and see; even so shall ye do unto the world; and whosoever breaketh this commandment suffereth himself to be led into temptation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.26
    scripture: book-of-mormon
    name: 3 Nephi 18:26
    book: 3 Nephi
    chapter: 18
    verse: 26
    ordinal: 5448
    text: 'And now it came to pass that when Jesus had spoken these words, he turned his eyes again upon the disciples whom he had chosen, and said unto them:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.27
    scripture: book-of-mormon
    name: 3 Nephi 18:27
    book: 3 Nephi
    chapter: 18
    verse: 27
    ordinal: 5449
    text: Behold verily, verily, I say unto you, I give unto you another commandment, and then I must go unto my Father that I may fulfil other commandments which he hath given me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.28
    scripture: book-of-mormon
    name: 3 Nephi 18:28
    book: 3 Nephi
    chapter: 18
    verse: 28
    ordinal: 5450
    text: And now behold, this is the commandment which I give unto you, that ye shall not suffer any one knowingly to partake of my flesh and blood unworthily, when ye shall minister it;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.29
    scripture: book-of-mormon
    name: 3 Nephi 18:29
    book: 3 Nephi
    chapter: 18
    verse: 29
    ordinal: 5451
    text: For whoso eateth and drinketh my flesh and blood unworthily eateth and drinketh damnation to his soul; therefore if ye know that a man is unworthy to eat and drink of my flesh and blood ye shall forbid him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.30
    scripture: book-of-mormon
    name: 3 Nephi 18:30
    book: 3 Nephi
    chapter: 18
    verse: 30
    ordinal: 5452
    text: Nevertheless, ye shall not cast him out from among you, but ye shall minister unto him and shall pray for him unto the Father, in my name; and if it so be that he repenteth and is baptized in my name, then shall ye receive him, and shall minister unto him of my flesh and blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.31
    scripture: book-of-mormon
    name: 3 Nephi 18:31
    book: 3 Nephi
    chapter: 18
    verse: 31
    ordinal: 5453
    text: But if he repent not he shall not be numbered among my people, that he may not destroy my people, for behold I know my sheep, and they are numbered.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.32
    scripture: book-of-mormon
    name: 3 Nephi 18:32
    book: 3 Nephi
    chapter: 18
    verse: 32
    ordinal: 5454
    text: Nevertheless, ye shall not cast him out of your synagogues, or your places of worship, for unto such shall ye continue to minister; for ye know not but what they will return and repent, and come unto me with full purpose of heart, and I shall heal them; and ye shall be the means of bringing salvation unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.33
    scripture: book-of-mormon
    name: 3 Nephi 18:33
    book: 3 Nephi
    chapter: 18
    verse: 33
    ordinal: 5455
    text: Therefore, keep these sayings which I have commanded you that ye come not under condemnation; for wo unto him whom the Father condemneth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.34
    scripture: book-of-mormon
    name: 3 Nephi 18:34
    book: 3 Nephi
    chapter: 18
    verse: 34
    ordinal: 5456
    text: And I give you these commandments because of the disputations which have been among you. And blessed are ye if ye have no disputations among you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.35
    scripture: book-of-mormon
    name: 3 Nephi 18:35
    book: 3 Nephi
    chapter: 18
    verse: 35
    ordinal: 5457
    text: And now I go unto the Father, because it is expedient that I should go unto the Father for your sakes.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.36
    scripture: book-of-mormon
    name: 3 Nephi 18:36
    book: 3 Nephi
    chapter: 18
    verse: 36
    ordinal: 5458
    text: And it came to pass that when Jesus had made an end of these sayings, he touched with his hand the disciples whom he had chosen, one by one, even until he had touched them all, and spake unto them as he touched them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.37
    scripture: book-of-mormon
    name: 3 Nephi 18:37
    book: 3 Nephi
    chapter: 18
    verse: 37
    ordinal: 5459
    text: And the multitude heard not the words which he spake, therefore they did not bear record; but the disciples bare record that he gave them power to give the Holy Ghost. And I will show unto you hereafter that this record is true.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.38
    scripture: book-of-mormon
    name: 3 Nephi 18:38
    book: 3 Nephi
    chapter: 18
    verse: 38
    ordinal: 5460
    text: And it came to pass that when Jesus had touched them all, there came a cloud and overshadowed the multitude that they could not see Jesus.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.18.39
    scripture: book-of-mormon
    name: 3 Nephi 18:39
    book: 3 Nephi
    chapter: 18
    verse: 39
    ordinal: 5461
    text: And while they were overshadowed he departed from them, and ascended into heaven. And the disciples saw and did bear record that he ascended again into heaven.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.18
- type: BomVerse
  data:
    ref: 3-nephi.19.1
    scripture: book-of-mormon
    name: 3 Nephi 19:1
    book: 3 Nephi
    chapter: 19
    verse: 1
    ordinal: 5462
    text: And now it came to pass that when Jesus had ascended into heaven, the multitude did disperse, and every man did take his wife and his children and did return to his own home.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.2
    scripture: book-of-mormon
    name: 3 Nephi 19:2
    book: 3 Nephi
    chapter: 19
    verse: 2
    ordinal: 5463
    text: And it was noised abroad among the people immediately, before it was yet dark, that the multitude had seen Jesus, and that he had ministered unto them, and that he would also show himself on the morrow unto the multitude.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.3
    scripture: book-of-mormon
    name: 3 Nephi 19:3
    book: 3 Nephi
    chapter: 19
    verse: 3
    ordinal: 5464
    text: Yea, and even all the night it was noised abroad concerning Jesus; and insomuch did they send forth unto the people that there were many, yea, an exceedingly great number, did labor exceedingly all that night, that they might be on the morrow in the place where Jesus should show himself unto the multitude.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.4
    scripture: book-of-mormon
    name: 3 Nephi 19:4
    book: 3 Nephi
    chapter: 19
    verse: 4
    ordinal: 5465
    text: And it came to pass that on the morrow, when the multitude was gathered together, behold, Nephi and his brother whom he had raised from the dead, whose name was Timothy, and also his son, whose name was Jonas, and also Mathoni, and Mathonihah, his brother, and Kumen, and Kumenonhi, and Jeremiah, and Shemnon, and Jonas, and Zedekiah, and Isaiah—now these were the names of the disciples whom Jesus had chosen—and it came to pass that they went forth and stood in the midst of the multitude.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.5
    scripture: book-of-mormon
    name: 3 Nephi 19:5
    book: 3 Nephi
    chapter: 19
    verse: 5
    ordinal: 5466
    text: And behold, the multitude was so great that they did cause that they should be separated into twelve bodies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.6
    scripture: book-of-mormon
    name: 3 Nephi 19:6
    book: 3 Nephi
    chapter: 19
    verse: 6
    ordinal: 5467
    text: And the twelve did teach the multitude; and behold, they did cause that the multitude should kneel down upon the face of the earth, and should pray unto the Father in the name of Jesus.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.7
    scripture: book-of-mormon
    name: 3 Nephi 19:7
    book: 3 Nephi
    chapter: 19
    verse: 7
    ordinal: 5468
    text: And the disciples did pray unto the Father also in the name of Jesus. And it came to pass that they arose and ministered unto the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.8
    scripture: book-of-mormon
    name: 3 Nephi 19:8
    book: 3 Nephi
    chapter: 19
    verse: 8
    ordinal: 5469
    text: And when they had ministered those same words which Jesus had spoken—nothing varying from the words which Jesus had spoken—behold, they knelt again and prayed to the Father in the name of Jesus.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.9
    scripture: book-of-mormon
    name: 3 Nephi 19:9
    book: 3 Nephi
    chapter: 19
    verse: 9
    ordinal: 5470
    text: And they did pray for that which they most desired; and they desired that the Holy Ghost should be given unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.10
    scripture: book-of-mormon
    name: 3 Nephi 19:10
    book: 3 Nephi
    chapter: 19
    verse: 10
    ordinal: 5471
    text: And when they had thus prayed they went down unto the water's edge, and the multitude followed them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.11
    scripture: book-of-mormon
    name: 3 Nephi 19:11
    book: 3 Nephi
    chapter: 19
    verse: 11
    ordinal: 5472
    text: And it came to pass that Nephi went down into the water and was baptized.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.12
    scripture: book-of-mormon
    name: 3 Nephi 19:12
    book: 3 Nephi
    chapter: 19
    verse: 12
    ordinal: 5473
    text: And he came up out of the water and began to baptize. And he baptized all those whom Jesus had chosen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.13
    scripture: book-of-mormon
    name: 3 Nephi 19:13
    book: 3 Nephi
    chapter: 19
    verse: 13
    ordinal: 5474
    text: And it came to pass when they were all baptized and had come up out of the water, the Holy Ghost did fall upon them, and they were filled with the Holy Ghost and with fire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.14
    scripture: book-of-mormon
    name: 3 Nephi 19:14
    book: 3 Nephi
    chapter: 19
    verse: 14
    ordinal: 5475
    text: And behold, they were encircled about as if it were by fire; and it came down from heaven, and the multitude did witness it, and did bear record; and angels did come down out of heaven and did minister unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.15
    scripture: book-of-mormon
    name: 3 Nephi 19:15
    book: 3 Nephi
    chapter: 19
    verse: 15
    ordinal: 5476
    text: And it came to pass that while the angels were ministering unto the disciples, behold, Jesus came and stood in the midst and ministered unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.16
    scripture: book-of-mormon
    name: 3 Nephi 19:16
    book: 3 Nephi
    chapter: 19
    verse: 16
    ordinal: 5477
    text: And it came to pass that he spake unto the multitude, and commanded them that they should kneel down again upon the earth, and also that his disciples should kneel down upon the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.17
    scripture: book-of-mormon
    name: 3 Nephi 19:17
    book: 3 Nephi
    chapter: 19
    verse: 17
    ordinal: 5478
    text: And it came to pass that when they had all knelt down upon the earth, he commanded his disciples that they should pray.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.18
    scripture: book-of-mormon
    name: 3 Nephi 19:18
    book: 3 Nephi
    chapter: 19
    verse: 18
    ordinal: 5479
    text: And behold, they began to pray; and they did pray unto Jesus, calling him their Lord and their God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.19
    scripture: book-of-mormon
    name: 3 Nephi 19:19
    book: 3 Nephi
    chapter: 19
    verse: 19
    ordinal: 5480
    text: 'And it came to pass that Jesus departed out of the midst of them, and went a little way off from them and bowed himself to the earth, and he said:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.20
    scripture: book-of-mormon
    name: 3 Nephi 19:20
    book: 3 Nephi
    chapter: 19
    verse: 20
    ordinal: 5481
    text: Father, I thank thee that thou hast given the Holy Ghost unto these whom I have chosen; and it is because of their belief in me that I have chosen them out of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.21
    scripture: book-of-mormon
    name: 3 Nephi 19:21
    book: 3 Nephi
    chapter: 19
    verse: 21
    ordinal: 5482
    text: Father, I pray thee that thou wilt give the Holy Ghost unto all them that shall believe in their words.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.22
    scripture: book-of-mormon
    name: 3 Nephi 19:22
    book: 3 Nephi
    chapter: 19
    verse: 22
    ordinal: 5483
    text: Father, thou hast given them the Holy Ghost because they believe in me; and thou seest that they believe in me because thou hearest them, and they pray unto me; and they pray unto me because I am with them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.23
    scripture: book-of-mormon
    name: 3 Nephi 19:23
    book: 3 Nephi
    chapter: 19
    verse: 23
    ordinal: 5484
    text: And now Father, I pray unto thee for them, and also for all those who shall believe on their words, that they may believe in me, that I may be in them as thou, Father, art in me, that we may be one.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.24
    scripture: book-of-mormon
    name: 3 Nephi 19:24
    book: 3 Nephi
    chapter: 19
    verse: 24
    ordinal: 5485
    text: And it came to pass that when Jesus had thus prayed unto the Father, he came unto his disciples, and behold, they did still continue, without ceasing, to pray unto him; and they did not multiply many words, for it was given unto them what they should pray, and they were filled with desire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.25
    scripture: book-of-mormon
    name: 3 Nephi 19:25
    book: 3 Nephi
    chapter: 19
    verse: 25
    ordinal: 5486
    text: And it came to pass that Jesus blessed them as they did pray unto him; and his countenance did smile upon them, and the light of his countenance did shine upon them, and behold they were as white as the countenance and also the garments of Jesus; and behold the whiteness thereof did exceed all the whiteness, yea, even there could be nothing upon earth so white as the whiteness thereof.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.26
    scripture: book-of-mormon
    name: 3 Nephi 19:26
    book: 3 Nephi
    chapter: 19
    verse: 26
    ordinal: 5487
    text: 'And Jesus said unto them: Pray on; nevertheless they did not cease to pray.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.27
    scripture: book-of-mormon
    name: 3 Nephi 19:27
    book: 3 Nephi
    chapter: 19
    verse: 27
    ordinal: 5488
    text: 'And he turned from them again, and went a little way off and bowed himself to the earth; and he prayed again unto the Father, saying:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.28
    scripture: book-of-mormon
    name: 3 Nephi 19:28
    book: 3 Nephi
    chapter: 19
    verse: 28
    ordinal: 5489
    text: Father, I thank thee that thou hast purified those whom I have chosen, because of their faith, and I pray for them, and also for them who shall believe on their words, that they may be purified in me, through faith on their words, even as they are purified in me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.29
    scripture: book-of-mormon
    name: 3 Nephi 19:29
    book: 3 Nephi
    chapter: 19
    verse: 29
    ordinal: 5490
    text: Father, I pray not for the world, but for those whom thou hast given me out of the world, because of their faith, that they may be purified in me, that I may be in them as thou, Father, art in me, that we may be one, that I may be glorified in them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.30
    scripture: book-of-mormon
    name: 3 Nephi 19:30
    book: 3 Nephi
    chapter: 19
    verse: 30
    ordinal: 5491
    text: And when Jesus had spoken these words he came again unto his disciples; and behold they did pray steadfastly, without ceasing, unto him; and he did smile upon them again; and behold they were white, even as Jesus.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.31
    scripture: book-of-mormon
    name: 3 Nephi 19:31
    book: 3 Nephi
    chapter: 19
    verse: 31
    ordinal: 5492
    text: And it came to pass that he went again a little way off and prayed unto the Father;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.32
    scripture: book-of-mormon
    name: 3 Nephi 19:32
    book: 3 Nephi
    chapter: 19
    verse: 32
    ordinal: 5493
    text: And tongue cannot speak the words which he prayed, neither can be written by man the words which he prayed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.33
    scripture: book-of-mormon
    name: 3 Nephi 19:33
    book: 3 Nephi
    chapter: 19
    verse: 33
    ordinal: 5494
    text: And the multitude did hear and do bear record; and their hearts were open and they did understand in their hearts the words which he prayed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.34
    scripture: book-of-mormon
    name: 3 Nephi 19:34
    book: 3 Nephi
    chapter: 19
    verse: 34
    ordinal: 5495
    text: Nevertheless, so great and marvelous were the words which he prayed that they cannot be written, neither can they be uttered by man.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.35
    scripture: book-of-mormon
    name: 3 Nephi 19:35
    book: 3 Nephi
    chapter: 19
    verse: 35
    ordinal: 5496
    text: 'And it came to pass that when Jesus had made an end of praying he came again to the disciples, and said unto them: So great faith have I never seen among all the Jews; wherefore I could not show unto them so great miracles, because of their unbelief.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.19.36
    scripture: book-of-mormon
    name: 3 Nephi 19:36
    book: 3 Nephi
    chapter: 19
    verse: 36
    ordinal: 5497
    text: Verily I say unto you, there are none of them that have seen so great things as ye have seen; neither have they heard so great things as ye have heard.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.19
- type: BomVerse
  data:
    ref: 3-nephi.20.1
    scripture: book-of-mormon
    name: 3 Nephi 20:1
    book: 3 Nephi
    chapter: 20
    verse: 1
    ordinal: 5498
    text: And it came to pass that he commanded the multitude that they should cease to pray, and also his disciples. And he commanded them that they should not cease to pray in their hearts.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.2
    scripture: book-of-mormon
    name: 3 Nephi 20:2
    book: 3 Nephi
    chapter: 20
    verse: 2
    ordinal: 5499
    text: And he commanded them that they should arise and stand up upon their feet. And they arose up and stood upon their feet.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.3
    scripture: book-of-mormon
    name: 3 Nephi 20:3
    book: 3 Nephi
    chapter: 20
    verse: 3
    ordinal: 5500
    text: And it came to pass that he brake bread again and blessed it, and gave to the disciples to eat.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.4
    scripture: book-of-mormon
    name: 3 Nephi 20:4
    book: 3 Nephi
    chapter: 20
    verse: 4
    ordinal: 5501
    text: And when they had eaten he commanded them that they should break bread, and give unto the multitude.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.5
    scripture: book-of-mormon
    name: 3 Nephi 20:5
    book: 3 Nephi
    chapter: 20
    verse: 5
    ordinal: 5502
    text: And when they had given unto the multitude he also gave them wine to drink, and commanded them that they should give unto the multitude.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.6
    scripture: book-of-mormon
    name: 3 Nephi 20:6
    book: 3 Nephi
    chapter: 20
    verse: 6
    ordinal: 5503
    text: Now, there had been no bread, neither wine, brought by the disciples, neither by the multitude;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.7
    scripture: book-of-mormon
    name: 3 Nephi 20:7
    book: 3 Nephi
    chapter: 20
    verse: 7
    ordinal: 5504
    text: But he truly gave unto them bread to eat, and also wine to drink.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.8
    scripture: book-of-mormon
    name: 3 Nephi 20:8
    book: 3 Nephi
    chapter: 20
    verse: 8
    ordinal: 5505
    text: 'And he said unto them: He that eateth this bread eateth of my body to his soul; and he that drinketh of this wine drinketh of my blood to his soul; and his soul shall never hunger nor thirst, but shall be filled.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.9
    scripture: book-of-mormon
    name: 3 Nephi 20:9
    book: 3 Nephi
    chapter: 20
    verse: 9
    ordinal: 5506
    text: Now, when the multitude had all eaten and drunk, behold, they were filled with the Spirit; and they did cry out with one voice, and gave glory to Jesus, whom they both saw and heard.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.10
    scripture: book-of-mormon
    name: 3 Nephi 20:10
    book: 3 Nephi
    chapter: 20
    verse: 10
    ordinal: 5507
    text: 'And it came to pass that when they had all given glory unto Jesus, he said unto them: Behold now I finish the commandment which the Father hath commanded me concerning this people, who are a remnant of the house of Israel.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.11
    scripture: book-of-mormon
    name: 3 Nephi 20:11
    book: 3 Nephi
    chapter: 20
    verse: 11
    ordinal: 5508
    text: Ye remember that I spake unto you, and said that when the words of Isaiah should be fulfilled—behold they are written, ye have them before you, therefore search them—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.12
    scripture: book-of-mormon
    name: 3 Nephi 20:12
    book: 3 Nephi
    chapter: 20
    verse: 12
    ordinal: 5509
    text: And verily, verily, I say unto you, that when they shall be fulfilled then is the fulfilling of the covenant which the Father hath made unto his people, O house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.13
    scripture: book-of-mormon
    name: 3 Nephi 20:13
    book: 3 Nephi
    chapter: 20
    verse: 13
    ordinal: 5510
    text: And then shall the remnants, which shall be scattered abroad upon the face of the earth, be gathered in from the east and from the west, and from the south and from the north; and they shall be brought to the knowledge of the Lord their God, who hath redeemed them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.14
    scripture: book-of-mormon
    name: 3 Nephi 20:14
    book: 3 Nephi
    chapter: 20
    verse: 14
    ordinal: 5511
    text: And the Father hath commanded me that I should give unto you this land, for your inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.15
    scripture: book-of-mormon
    name: 3 Nephi 20:15
    book: 3 Nephi
    chapter: 20
    verse: 15
    ordinal: 5512
    text: And I say unto you, that if the Gentiles do not repent after the blessing which they shall receive, after they have scattered my people—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.16
    scripture: book-of-mormon
    name: 3 Nephi 20:16
    book: 3 Nephi
    chapter: 20
    verse: 16
    ordinal: 5513
    text: Then shall ye, who are a remnant of the house of Jacob, go forth among them; and ye shall be in the midst of them who shall be many; and ye shall be among them as a lion among the beasts of the forest, and as a young lion among the flocks of sheep, who, if he goeth through both treadeth down and teareth in pieces, and none can deliver.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Micah 5:8
    kjvOsis:
    - Mic.5.8
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.17
    scripture: book-of-mormon
    name: 3 Nephi 20:17
    book: 3 Nephi
    chapter: 20
    verse: 17
    ordinal: 5514
    text: Thy hand shall be lifted up upon thine adversaries, and all thine enemies shall be cut off.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Micah 5:9
    kjvOsis:
    - Mic.5.9
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.18
    scripture: book-of-mormon
    name: 3 Nephi 20:18
    book: 3 Nephi
    chapter: 20
    verse: 18
    ordinal: 5515
    text: And I will gather my people together as a man gathereth his sheaves into the floor.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Micah 4:12
    kjvAllusionOsis:
    - Mic.4.12
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.19
    scripture: book-of-mormon
    name: 3 Nephi 20:19
    book: 3 Nephi
    chapter: 20
    verse: 19
    ordinal: 5516
    text: For I will make my people with whom the Father hath covenanted, yea, I will make thy horn iron, and I will make thy hoofs brass. And thou shalt beat in pieces many people; and I will consecrate their gain unto the Lord, and their substance unto the Lord of the whole earth. And behold, I am he who doeth it.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Micah 4:13
    kjvOsis:
    - Mic.4.13
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.20
    scripture: book-of-mormon
    name: 3 Nephi 20:20
    book: 3 Nephi
    chapter: 20
    verse: 20
    ordinal: 5517
    text: And it shall come to pass, saith the Father, that the sword of my justice shall hang over them at that day; and except they repent it shall fall upon them, saith the Father, yea, even upon all the nations of the Gentiles.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.21
    scripture: book-of-mormon
    name: 3 Nephi 20:21
    book: 3 Nephi
    chapter: 20
    verse: 21
    ordinal: 5518
    text: And it shall come to pass that I will establish my people, O house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.22
    scripture: book-of-mormon
    name: 3 Nephi 20:22
    book: 3 Nephi
    chapter: 20
    verse: 22
    ordinal: 5519
    text: And behold, this people will I establish in this land, unto the fulfilling of the covenant which I made with your father Jacob; and it shall be a New Jerusalem. And the powers of heaven shall be in the midst of this people; yea, even I will be in the midst of you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.23
    scripture: book-of-mormon
    name: 3 Nephi 20:23
    book: 3 Nephi
    chapter: 20
    verse: 23
    ordinal: 5520
    text: 'Behold, I am he of whom Moses spake, saying: A prophet shall the Lord your God raise up unto you of your brethren, like unto me; him shall ye hear in all things whatsoever he shall say unto you. And it shall come to pass that every soul who will not hear that prophet shall be cut off from among the people.'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Acts 3:22
    kjvOsis:
    - Acts.3.22
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
