    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.26
    scripture: book-of-mormon
    name: 3 Nephi 21:26
    book: 3 Nephi
    chapter: 21
    verse: 26
    ordinal: 5569
