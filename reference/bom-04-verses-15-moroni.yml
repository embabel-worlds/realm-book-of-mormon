    book: Moroni
    chapter: 2
    verse: 3
    ordinal: 6448
    text: Now Christ spake these words unto them at the time of his first appearing; and the multitude heard it not, but the disciples heard it; and on as many as they laid their hands, fell the Holy Ghost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
