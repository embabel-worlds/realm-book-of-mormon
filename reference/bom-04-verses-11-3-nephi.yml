    verse: 15
    ordinal: 4992
    text: And their curse was taken from them, and their skin became white like unto the Nephites;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.2
- type: BomVerse
  data:
    ref: 3-nephi.2.16
    scripture: book-of-mormon
    name: 3 Nephi 2:16
    book: 3 Nephi
    chapter: 2
    verse: 16
    ordinal: 4993
    text: And their young men and their daughters became exceedingly fair, and they were numbered among the Nephites, and were called Nephites. And thus ended the thirteenth year.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.2
- type: BomVerse
  data:
    ref: 3-nephi.2.17
    scripture: book-of-mormon
    name: 3 Nephi 2:17
    book: 3 Nephi
    chapter: 2
    verse: 17
    ordinal: 4994
    text: And it came to pass in the commencement of the fourteenth year, the war between the robbers and the people of Nephi did continue and did become exceedingly sore; nevertheless, the people of Nephi did gain some advantage of the robbers, insomuch that they did drive them back out of their lands into the mountains and into their secret places.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.2
- type: BomVerse
  data:
    ref: 3-nephi.2.18
    scripture: book-of-mormon
    name: 3 Nephi 2:18
    book: 3 Nephi
    chapter: 2
    verse: 18
    ordinal: 4995
    text: And thus ended the fourteenth year. And in the fifteenth year they did come forth against the people of Nephi; and because of the wickedness of the people of Nephi, and their many contentions and dissensions, the Gadianton robbers did gain many advantages over them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.2
- type: BomVerse
  data:
    ref: 3-nephi.2.19
    scripture: book-of-mormon
    name: 3 Nephi 2:19
    book: 3 Nephi
    chapter: 2
    verse: 19
    ordinal: 4996
    text: And thus ended the fifteenth year, and thus were the people in a state of many afflictions; and the sword of destruction did hang over them, insomuch that they were about to be smitten down by it, and this because of their iniquity.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.2
- type: BomVerse
  data:
    ref: 3-nephi.3.1
    scripture: book-of-mormon
    name: 3 Nephi 3:1
    book: 3 Nephi
    chapter: 3
    verse: 1
    ordinal: 4997
    text: 'And now it came to pass that in the sixteenth year from the coming of Christ, Lachoneus, the governor of the land, received an epistle from the leader and the governor of this band of robbers; and these were the words which were written, saying:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.2
    scripture: book-of-mormon
    name: 3 Nephi 3:2
    book: 3 Nephi
    chapter: 3
    verse: 2
    ordinal: 4998
    text: Lachoneus, most noble and chief governor of the land, behold, I write this epistle unto you, and do give unto you exceedingly great praise because of your firmness, and also the firmness of your people, in maintaining that which ye suppose to be your right and liberty; yea, ye do stand well, as if ye were supported by the hand of a god, in the defence of your liberty, and your property, and your country, or that which ye do call so.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.3
    scripture: book-of-mormon
    name: 3 Nephi 3:3
    book: 3 Nephi
    chapter: 3
    verse: 3
    ordinal: 4999
    text: And it seemeth a pity unto me, most noble Lachoneus, that ye should be so foolish and vain as to suppose that ye can stand against so many brave men who are at my command, who do now at this time stand in their arms, and do await with great anxiety for the word—Go down upon the Nephites and destroy them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.4
    scripture: book-of-mormon
    name: 3 Nephi 3:4
    book: 3 Nephi
    chapter: 3
    verse: 4
    ordinal: 5000
    text: And I, knowing of their unconquerable spirit, having proved them in the field of battle, and knowing of their everlasting hatred towards you because of the many wrongs which ye have done unto them, therefore if they should come down against you they would visit you with utter destruction.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.5
    scripture: book-of-mormon
    name: 3 Nephi 3:5
    book: 3 Nephi
    chapter: 3
    verse: 5
    ordinal: 5001
    text: Therefore I have written this epistle, sealing it with mine own hand, feeling for your welfare, because of your firmness in that which ye believe to be right, and your noble spirit in the field of battle.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.6
    scripture: book-of-mormon
    name: 3 Nephi 3:6
    book: 3 Nephi
    chapter: 3
    verse: 6
    ordinal: 5002
    text: Therefore I write unto you, desiring that ye would yield up unto this my people, your cities, your lands, and your possessions, rather than that they should visit you with the sword and that destruction should come upon you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.7
    scripture: book-of-mormon
    name: 3 Nephi 3:7
    book: 3 Nephi
    chapter: 3
    verse: 7
    ordinal: 5003
    text: Or in other words, yield yourselves up unto us, and unite with us and become acquainted with our secret works, and become our brethren that ye may be like unto us—not our slaves, but our brethren and partners of all our substance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.8
    scripture: book-of-mormon
    name: 3 Nephi 3:8
    book: 3 Nephi
    chapter: 3
    verse: 8
    ordinal: 5004
    text: And behold, I swear unto you, if ye will do this, with an oath, ye shall not be destroyed; but if ye will not do this, I swear unto you with an oath, that on the morrow month I will command that my armies shall come down against you, and they shall not stay their hand and shall spare not, but shall slay you, and shall let fall the sword upon you even until ye shall become extinct.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.9
    scripture: book-of-mormon
    name: 3 Nephi 3:9
    book: 3 Nephi
    chapter: 3
    verse: 9
    ordinal: 5005
    text: And behold, I am Giddianhi; and I am the governor of this the secret society of Gadianton; which society and the works thereof I know to be good; and they are of ancient date and they have been handed down unto us.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.10
    scripture: book-of-mormon
    name: 3 Nephi 3:10
    book: 3 Nephi
    chapter: 3
    verse: 10
    ordinal: 5006
    text: And I write this epistle unto you, Lachoneus, and I hope that ye will deliver up your lands and your possessions, without the shedding of blood, that this my people may recover their rights and government, who have dissented away from you because of your wickedness in retaining from them their rights of government, and except ye do this, I will avenge their wrongs. I am Giddianhi.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.11
    scripture: book-of-mormon
    name: 3 Nephi 3:11
    book: 3 Nephi
    chapter: 3
    verse: 11
    ordinal: 5007
    text: And now it came to pass when Lachoneus received this epistle he was exceedingly astonished, because of the boldness of Giddianhi demanding the possession of the land of the Nephites, and also of threatening the people and avenging the wrongs of those that had received no wrong, save it were they had wronged themselves by dissenting away unto those wicked and abominable robbers.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.12
    scripture: book-of-mormon
    name: 3 Nephi 3:12
    book: 3 Nephi
    chapter: 3
    verse: 12
    ordinal: 5008
    text: Now behold, this Lachoneus, the governor, was a just man, and could not be frightened by the demands and the threatenings of a robber; therefore he did not hearken to the epistle of Giddianhi, the governor of the robbers, but he did cause that his people should cry unto the Lord for strength against the time that the robbers should come down against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.13
    scripture: book-of-mormon
    name: 3 Nephi 3:13
    book: 3 Nephi
    chapter: 3
    verse: 13
    ordinal: 5009
    text: Yea, he sent a proclamation among all the people, that they should gather together their women, and their children, their flocks and their herds, and all their substance, save it were their land, unto one place.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.14
    scripture: book-of-mormon
    name: 3 Nephi 3:14
    book: 3 Nephi
    chapter: 3
    verse: 14
    ordinal: 5010
    text: And he caused that fortifications should be built round about them, and the strength thereof should be exceedingly great. And he caused that armies, both of the Nephites and of the Lamanites, or of all them who were numbered among the Nephites, should be placed as guards round about to watch them, and to guard them from the robbers day and night.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.15
    scripture: book-of-mormon
    name: 3 Nephi 3:15
    book: 3 Nephi
    chapter: 3
    verse: 15
    ordinal: 5011
    text: 'Yea, he said unto them: As the Lord liveth, except ye repent of all your iniquities, and cry unto the Lord, ye will in nowise be delivered out of the hands of those Gadianton robbers.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.16
    scripture: book-of-mormon
    name: 3 Nephi 3:16
    book: 3 Nephi
    chapter: 3
    verse: 16
    ordinal: 5012
    text: And so great and marvelous were the words and prophecies of Lachoneus that they did cause fear to come upon all the people; and they did exert themselves in their might to do according to the words of Lachoneus.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.17
    scripture: book-of-mormon
    name: 3 Nephi 3:17
    book: 3 Nephi
    chapter: 3
    verse: 17
    ordinal: 5013
    text: And it came to pass that Lachoneus did appoint chief captains over all the armies of the Nephites, to command them at the time that the robbers should come down out of the wilderness against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.18
    scripture: book-of-mormon
    name: 3 Nephi 3:18
    book: 3 Nephi
    chapter: 3
    verse: 18
    ordinal: 5014
    text: Now the chiefest among all the chief captains and the great commander of all the armies of the Nephites was appointed, and his name was Gidgiddoni.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.19
    scripture: book-of-mormon
    name: 3 Nephi 3:19
    book: 3 Nephi
    chapter: 3
    verse: 19
    ordinal: 5015
    text: Now it was the custom among all the Nephites to appoint for their chief captains, (save it were in their times of wickedness) some one that had the spirit of revelation and also prophecy; therefore, this Gidgiddoni was a great prophet among them, as also was the chief judge.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.20
    scripture: book-of-mormon
    name: 3 Nephi 3:20
    book: 3 Nephi
    chapter: 3
    verse: 20
    ordinal: 5016
    text: 'Now the people said unto Gidgiddoni: Pray unto the Lord, and let us go up upon the mountains and into the wilderness, that we may fall upon the robbers and destroy them in their own lands.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.21
    scripture: book-of-mormon
    name: 3 Nephi 3:21
    book: 3 Nephi
    chapter: 3
    verse: 21
    ordinal: 5017
    text: 'But Gidgiddoni saith unto them: The Lord forbid; for if we should go up against them the Lord would deliver us into their hands; therefore we will prepare ourselves in the center of our lands, and we will gather all our armies together, and we will not go against them, but we will wait till they shall come against us; therefore as the Lord liveth, if we do this he will deliver them into our hands.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.22
    scripture: book-of-mormon
    name: 3 Nephi 3:22
    book: 3 Nephi
    chapter: 3
    verse: 22
    ordinal: 5018
    text: And it came to pass in the seventeenth year, in the latter end of the year, the proclamation of Lachoneus had gone forth throughout all the face of the land, and they had taken their horses, and their chariots, and their cattle, and all their flocks, and their herds, and their grain, and all their substance, and did march forth by thousands and by tens of thousands, until they had all gone forth to the place which had been appointed that they should gather themselves together, to defend themselves against their enemies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.23
    scripture: book-of-mormon
    name: 3 Nephi 3:23
    book: 3 Nephi
    chapter: 3
    verse: 23
    ordinal: 5019
    text: And the land which was appointed was the land of Zarahemla, and the land which was between the land Zarahemla and the land Bountiful, yea, to the line which was between the land Bountiful and the land Desolation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.24
    scripture: book-of-mormon
    name: 3 Nephi 3:24
    book: 3 Nephi
    chapter: 3
    verse: 24
    ordinal: 5020
    text: And there were a great many thousand people who were called Nephites, who did gather themselves together in this land. Now Lachoneus did cause that they should gather themselves together in the land southward, because of the great curse which was upon the land northward.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.25
    scripture: book-of-mormon
    name: 3 Nephi 3:25
    book: 3 Nephi
    chapter: 3
    verse: 25
    ordinal: 5021
    text: And they did fortify themselves against their enemies; and they did dwell in one land, and in one body, and they did fear the words which had been spoken by Lachoneus, insomuch that they did repent of all their sins; and they did put up their prayers unto the Lord their God, that he would deliver them in the time that their enemies should come down against them to battle.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.3.26
    scripture: book-of-mormon
    name: 3 Nephi 3:26
    book: 3 Nephi
    chapter: 3
    verse: 26
    ordinal: 5022
    text: And they were exceedingly sorrowful because of their enemies. And Gidgiddoni did cause that they should make weapons of war of every kind, and they should be strong with armor, and with shields, and with bucklers, after the manner of his instruction.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.3
- type: BomVerse
  data:
    ref: 3-nephi.4.1
    scripture: book-of-mormon
    name: 3 Nephi 4:1
    book: 3 Nephi
    chapter: 4
    verse: 1
    ordinal: 5023
    text: And it came to pass that in the latter end of the eighteenth year those armies of robbers had prepared for battle, and began to come down and to sally forth from the hills, and out of the mountains, and the wilderness, and their strongholds, and their secret places, and began to take possession of the lands, both which were in the land south and which were in the land north, and began to take possession of all the lands which had been deserted by the Nephites, and the cities which had been left desolate.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.2
    scripture: book-of-mormon
    name: 3 Nephi 4:2
    book: 3 Nephi
    chapter: 4
    verse: 2
    ordinal: 5024
    text: But behold, there were no wild beasts nor game in those lands which had been deserted by the Nephites, and there was no game for the robbers save it were in the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.3
    scripture: book-of-mormon
    name: 3 Nephi 4:3
    book: 3 Nephi
    chapter: 4
    verse: 3
    ordinal: 5025
    text: And the robbers could not exist save it were in the wilderness, for the want of food; for the Nephites had left their lands desolate, and had gathered their flocks and their herds and all their substance, and they were in one body.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.4
    scripture: book-of-mormon
    name: 3 Nephi 4:4
    book: 3 Nephi
    chapter: 4
    verse: 4
    ordinal: 5026
    text: Therefore, there was no chance for the robbers to plunder and to obtain food, save it were to come up in open battle against the Nephites; and the Nephites being in one body, and having so great a number, and having reserved for themselves provisions, and horses and cattle, and flocks of every kind, that they might subsist for the space of seven years, in the which time they did hope to destroy the robbers from off the face of the land; and thus the eighteenth year did pass away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.5
    scripture: book-of-mormon
    name: 3 Nephi 4:5
    book: 3 Nephi
    chapter: 4
    verse: 5
    ordinal: 5027
    text: And it came to pass that in the nineteenth year Giddianhi found that it was expedient that he should go up to battle against the Nephites, for there was no way that they could subsist save it were to plunder and rob and murder.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.6
    scripture: book-of-mormon
    name: 3 Nephi 4:6
    book: 3 Nephi
    chapter: 4
    verse: 6
    ordinal: 5028
    text: And they durst not spread themselves upon the face of the land insomuch that they could raise grain, lest the Nephites should come upon them and slay them; therefore Giddianhi gave commandment unto his armies that in this year they should go up to battle against the Nephites.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.7
    scripture: book-of-mormon
    name: 3 Nephi 4:7
    book: 3 Nephi
    chapter: 4
    verse: 7
    ordinal: 5029
    text: And it came to pass that they did come up to battle; and it was in the sixth month; and behold, great and terrible was the day that they did come up to battle; and they were girded about after the manner of robbers; and they had a lamb-skin about their loins, and they were dyed in blood, and their heads were shorn, and they had head-plates upon them; and great and terrible was the appearance of the armies of Giddianhi, because of their armor, and because of their being dyed in blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.8
    scripture: book-of-mormon
    name: 3 Nephi 4:8
    book: 3 Nephi
    chapter: 4
    verse: 8
    ordinal: 5030
    text: And it came to pass that the armies of the Nephites, when they saw the appearance of the army of Giddianhi, had all fallen to the earth, and did lift their cries to the Lord their God, that he would spare them and deliver them out of the hands of their enemies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.9
    scripture: book-of-mormon
    name: 3 Nephi 4:9
    book: 3 Nephi
    chapter: 4
    verse: 9
    ordinal: 5031
    text: And it came to pass that when the armies of Giddianhi saw this they began to shout with a loud voice, because of their joy, for they had supposed that the Nephites had fallen with fear because of the terror of their armies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.10
    scripture: book-of-mormon
    name: 3 Nephi 4:10
    book: 3 Nephi
    chapter: 4
    verse: 10
    ordinal: 5032
    text: But in this thing they were disappointed, for the Nephites did not fear them; but they did fear their God and did supplicate him for protection; therefore, when the armies of Giddianhi did rush upon them they were prepared to meet them; yea, in the strength of the Lord they did receive them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.11
    scripture: book-of-mormon
    name: 3 Nephi 4:11
    book: 3 Nephi
    chapter: 4
    verse: 11
    ordinal: 5033
    text: And the battle commenced in this the sixth month; and great and terrible was the battle thereof, yea, great and terrible was the slaughter thereof, insomuch that there never was known so great a slaughter among all the people of Lehi since he left Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.12
    scripture: book-of-mormon
    name: 3 Nephi 4:12
    book: 3 Nephi
    chapter: 4
    verse: 12
    ordinal: 5034
    text: And notwithstanding the threatenings and the oaths which Giddianhi had made, behold, the Nephites did beat them, insomuch that they did fall back from before them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.13
    scripture: book-of-mormon
    name: 3 Nephi 4:13
    book: 3 Nephi
    chapter: 4
    verse: 13
    ordinal: 5035
    text: And it came to pass that Gidgiddoni commanded that his armies should pursue them as far as the borders of the wilderness, and that they should not spare any that should fall into their hands by the way; and thus they did pursue them and did slay them, to the borders of the wilderness, even until they had fulfilled the commandment of Gidgiddoni.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.14
    scripture: book-of-mormon
    name: 3 Nephi 4:14
    book: 3 Nephi
    chapter: 4
    verse: 14
    ordinal: 5036
    text: And it came to pass that Giddianhi, who had stood and fought with boldness, was pursued as he fled; and being weary because of his much fighting he was overtaken and slain. And thus was the end of Giddianhi the robber.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.15
    scripture: book-of-mormon
    name: 3 Nephi 4:15
    book: 3 Nephi
    chapter: 4
    verse: 15
    ordinal: 5037
    text: And it came to pass that the armies of the Nephites did return again to their place of security. And it came to pass that this nineteenth year did pass away, and the robbers did not come again to battle; neither did they come again in the twentieth year.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.16
    scripture: book-of-mormon
    name: 3 Nephi 4:16
    book: 3 Nephi
    chapter: 4
    verse: 16
    ordinal: 5038
    text: And in the twenty and first year they did not come up to battle, but they came up on all sides to lay siege round about the people of Nephi; for they did suppose that if they should cut off the people of Nephi from their lands, and should hem them in on every side, and if they should cut them off from all their outward privileges, that they could cause them to yield themselves up according to their wishes.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.17
    scripture: book-of-mormon
    name: 3 Nephi 4:17
    book: 3 Nephi
    chapter: 4
    verse: 17
    ordinal: 5039
    text: Now they had appointed unto themselves another leader, whose name was Zemnarihah; therefore it was Zemnarihah that did cause that this siege should take place.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.18
    scripture: book-of-mormon
    name: 3 Nephi 4:18
    book: 3 Nephi
    chapter: 4
    verse: 18
    ordinal: 5040
    text: But behold, this was an advantage to the Nephites; for it was impossible for the robbers to lay siege sufficiently long to have any effect upon the Nephites, because of their much provision which they had laid up in store,
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.19
    scripture: book-of-mormon
    name: 3 Nephi 4:19
    book: 3 Nephi
    chapter: 4
    verse: 19
    ordinal: 5041
    text: And because of the scantiness of provisions among the robbers; for behold, they had nothing save it were meat for their subsistence, which meat they did obtain in the wilderness;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.20
    scripture: book-of-mormon
    name: 3 Nephi 4:20
    book: 3 Nephi
    chapter: 4
    verse: 20
    ordinal: 5042
    text: And it came to pass that the wild game became scarce in the wilderness insomuch that the robbers were about to perish with hunger.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.21
    scripture: book-of-mormon
    name: 3 Nephi 4:21
    book: 3 Nephi
    chapter: 4
    verse: 21
    ordinal: 5043
    text: And the Nephites were continually marching out by day and by night, and falling upon their armies, and cutting them off by thousands and by tens of thousands.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.22
    scripture: book-of-mormon
    name: 3 Nephi 4:22
    book: 3 Nephi
    chapter: 4
    verse: 22
    ordinal: 5044
    text: And thus it became the desire of the people of Zemnarihah to withdraw from their design, because of the great destruction which came upon them by night and by day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.23
    scripture: book-of-mormon
    name: 3 Nephi 4:23
    book: 3 Nephi
    chapter: 4
    verse: 23
    ordinal: 5045
    text: And it came to pass that Zemnarihah did give command unto his people that they should withdraw themselves from the siege, and march into the furthermost parts of the land northward.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.24
    scripture: book-of-mormon
    name: 3 Nephi 4:24
    book: 3 Nephi
    chapter: 4
    verse: 24
    ordinal: 5046
    text: And now, Gidgiddoni being aware of their design, and knowing of their weakness because of the want of food, and the great slaughter which had been made among them, therefore he did send out his armies in the night-time, and did cut off the way of their retreat, and did place his armies in the way of their retreat.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.25
    scripture: book-of-mormon
    name: 3 Nephi 4:25
    book: 3 Nephi
    chapter: 4
    verse: 25
    ordinal: 5047
    text: And this did they do in the night-time, and got on their march beyond the robbers, so that on the morrow, when the robbers began their march, they were met by the armies of the Nephites both in their front and in their rear.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.26
    scripture: book-of-mormon
    name: 3 Nephi 4:26
    book: 3 Nephi
    chapter: 4
    verse: 26
    ordinal: 5048
    text: And the robbers who were on the south were also cut off in their places of retreat. And all these things were done by command of Gidgiddoni.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.27
    scripture: book-of-mormon
    name: 3 Nephi 4:27
    book: 3 Nephi
    chapter: 4
    verse: 27
    ordinal: 5049
    text: And there were many thousands who did yield themselves up prisoners unto the Nephites, and the remainder of them were slain.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.28
    scripture: book-of-mormon
    name: 3 Nephi 4:28
    book: 3 Nephi
    chapter: 4
    verse: 28
    ordinal: 5050
    text: 'And their leader, Zemnarihah, was taken and hanged upon a tree, yea, even upon the top thereof until he was dead. And when they had hanged him until he was dead they did fell the tree to the earth, and did cry with a loud voice, saying:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.29
    scripture: book-of-mormon
    name: 3 Nephi 4:29
    book: 3 Nephi
    chapter: 4
    verse: 29
    ordinal: 5051
    text: May the Lord preserve his people in righteousness and in holiness of heart, that they may cause to be felled to the earth all who shall seek to slay them because of power and secret combinations, even as this man hath been felled to the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.30
    scripture: book-of-mormon
    name: 3 Nephi 4:30
    book: 3 Nephi
    chapter: 4
    verse: 30
    ordinal: 5052
    text: 'And they did rejoice and cry again with one voice, saying: May the God of Abraham, and the God of Isaac, and the God of Jacob, protect this people in righteousness, so long as they shall call on the name of their God for protection.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.31
    scripture: book-of-mormon
    name: 3 Nephi 4:31
    book: 3 Nephi
    chapter: 4
    verse: 31
    ordinal: 5053
    text: And it came to pass that they did break forth, all as one, in singing, and praising their God for the great thing which he had done for them, in preserving them from falling into the hands of their enemies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.32
    scripture: book-of-mormon
    name: 3 Nephi 4:32
    book: 3 Nephi
    chapter: 4
    verse: 32
    ordinal: 5054
    text: 'Yea, they did cry: Hosanna to the Most High God. And they did cry: Blessed be the name of the Lord God Almighty, the Most High God.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.4.33
    scripture: book-of-mormon
    name: 3 Nephi 4:33
    book: 3 Nephi
    chapter: 4
    verse: 33
    ordinal: 5055
    text: And their hearts were swollen with joy, unto the gushing out of many tears, because of the great goodness of God in delivering them out of the hands of their enemies; and they knew it was because of their repentance and their humility that they had been delivered from an everlasting destruction.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.4
- type: BomVerse
  data:
    ref: 3-nephi.5.1
    scripture: book-of-mormon
    name: 3 Nephi 5:1
    book: 3 Nephi
    chapter: 5
    verse: 1
    ordinal: 5056
    text: And now behold, there was not a living soul among all the people of the Nephites who did doubt in the least the words of all the holy prophets who had spoken; for they knew that it must needs be that they must be fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.2
    scripture: book-of-mormon
    name: 3 Nephi 5:2
    book: 3 Nephi
    chapter: 5
    verse: 2
    ordinal: 5057
    text: And they knew that it must be expedient that Christ had come, because of the many signs which had been given, according to the words of the prophets; and because of the things which had come to pass already they knew that it must needs be that all things should come to pass according to that which had been spoken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.3
    scripture: book-of-mormon
    name: 3 Nephi 5:3
    book: 3 Nephi
    chapter: 5
    verse: 3
    ordinal: 5058
    text: Therefore they did forsake all their sins, and their abominations, and their whoredoms, and did serve God with all diligence day and night.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.4
    scripture: book-of-mormon
    name: 3 Nephi 5:4
    book: 3 Nephi
    chapter: 5
    verse: 4
    ordinal: 5059
    text: And now it came to pass that when they had taken all the robbers prisoners, insomuch that none did escape who were not slain, they did cast their prisoners into prison, and did cause the word of God to be preached unto them; and as many as would repent of their sins and enter into a covenant that they would murder no more were set at liberty.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.5
    scripture: book-of-mormon
    name: 3 Nephi 5:5
    book: 3 Nephi
    chapter: 5
    verse: 5
    ordinal: 5060
    text: But as many as there were who did not enter into a covenant, and who did still continue to have those secret murders in their hearts, yea, as many as were found breathing out threatenings against their brethren were condemned and punished according to the law.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.6
    scripture: book-of-mormon
    name: 3 Nephi 5:6
    book: 3 Nephi
    chapter: 5
    verse: 6
    ordinal: 5061
    text: And thus they did put an end to all those wicked, and secret, and abominable combinations, in the which there was so much wickedness, and so many murders committed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.7
    scripture: book-of-mormon
    name: 3 Nephi 5:7
    book: 3 Nephi
    chapter: 5
    verse: 7
    ordinal: 5062
    text: And thus had the twenty and second year passed away, and the twenty and third year also, and the twenty and fourth, and the twenty and fifth; and thus had twenty and five years passed away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.8
    scripture: book-of-mormon
    name: 3 Nephi 5:8
    book: 3 Nephi
    chapter: 5
    verse: 8
    ordinal: 5063
    text: And there had many things transpired which, in the eyes of some, would be great and marvelous; nevertheless, they cannot all be written in this book; yea, this book cannot contain even a hundredth part of what was done among so many people in the space of twenty and five years;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.9
    scripture: book-of-mormon
    name: 3 Nephi 5:9
    book: 3 Nephi
    chapter: 5
    verse: 9
    ordinal: 5064
    text: But behold there are records which do contain all the proceedings of this people; and a shorter but true account was given by Nephi.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.10
    scripture: book-of-mormon
    name: 3 Nephi 5:10
    book: 3 Nephi
    chapter: 5
    verse: 10
    ordinal: 5065
    text: Therefore I have made my record of these things according to the record of Nephi, which was engraven on the plates which were called the plates of Nephi.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.11
    scripture: book-of-mormon
    name: 3 Nephi 5:11
    book: 3 Nephi
    chapter: 5
    verse: 11
    ordinal: 5066
    text: And behold, I do make the record on plates which I have made with mine own hands.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.12
    scripture: book-of-mormon
    name: 3 Nephi 5:12
    book: 3 Nephi
    chapter: 5
    verse: 12
    ordinal: 5067
    text: And behold, I am called Mormon, being called after the land of Mormon, the land in which Alma did establish the church among the people, yea, the first church which was established among them after their transgression.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.13
    scripture: book-of-mormon
    name: 3 Nephi 5:13
    book: 3 Nephi
    chapter: 5
    verse: 13
    ordinal: 5068
    text: Behold, I am a disciple of Jesus Christ, the Son of God. I have been called of him to declare his word among his people, that they might have everlasting life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.14
    scripture: book-of-mormon
    name: 3 Nephi 5:14
    book: 3 Nephi
    chapter: 5
    verse: 14
    ordinal: 5069
    text: And it hath become expedient that I, according to the will of God, that the prayers of those who have gone hence, who were the holy ones, should be fulfilled according to their faith, should make a record of these things which have been done—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.15
    scripture: book-of-mormon
    name: 3 Nephi 5:15
    book: 3 Nephi
    chapter: 5
    verse: 15
    ordinal: 5070
    text: Yea, a small record of that which hath taken place from the time that Lehi left Jerusalem, even down until the present time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.16
    scripture: book-of-mormon
    name: 3 Nephi 5:16
    book: 3 Nephi
    chapter: 5
    verse: 16
    ordinal: 5071
    text: Therefore I do make my record from the accounts which have been given by those who were before me, until the commencement of my day;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.17
    scripture: book-of-mormon
    name: 3 Nephi 5:17
    book: 3 Nephi
    chapter: 5
    verse: 17
    ordinal: 5072
    text: And then I do make a record of the things which I have seen with mine own eyes.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.18
    scripture: book-of-mormon
    name: 3 Nephi 5:18
    book: 3 Nephi
    chapter: 5
    verse: 18
    ordinal: 5073
    text: And I know the record which I make to be a just and a true record; nevertheless there are many things which, according to our language, we are not able to write.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.19
    scripture: book-of-mormon
    name: 3 Nephi 5:19
    book: 3 Nephi
    chapter: 5
    verse: 19
    ordinal: 5074
    text: And now I make an end of my saying, which is of myself, and proceed to give my account of the things which have been before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.20
    scripture: book-of-mormon
    name: 3 Nephi 5:20
    book: 3 Nephi
    chapter: 5
    verse: 20
    ordinal: 5075
    text: I am Mormon, and a pure descendant of Lehi. I have reason to bless my God and my Savior Jesus Christ, that he brought our fathers out of the land of Jerusalem, (and no one knew it save it were himself and those whom he brought out of that land) and that he hath given me and my people so much knowledge unto the salvation of our souls.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.21
    scripture: book-of-mormon
    name: 3 Nephi 5:21
    book: 3 Nephi
    chapter: 5
    verse: 21
    ordinal: 5076
    text: Surely he hath blessed the house of Jacob, and hath been merciful unto the seed of Joseph.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.22
    scripture: book-of-mormon
    name: 3 Nephi 5:22
    book: 3 Nephi
    chapter: 5
    verse: 22
    ordinal: 5077
    text: And insomuch as the children of Lehi have kept his commandments he hath blessed them and prospered them according to his word.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.23
    scripture: book-of-mormon
    name: 3 Nephi 5:23
    book: 3 Nephi
    chapter: 5
    verse: 23
    ordinal: 5078
    text: Yea, and surely shall he again bring a remnant of the seed of Joseph to the knowledge of the Lord their God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.24
    scripture: book-of-mormon
    name: 3 Nephi 5:24
    book: 3 Nephi
    chapter: 5
    verse: 24
    ordinal: 5079
    text: And as surely as the Lord liveth, will he gather in from the four quarters of the earth all the remnant of the seed of Jacob, who are scattered abroad upon all the face of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.25
    scripture: book-of-mormon
    name: 3 Nephi 5:25
    book: 3 Nephi
    chapter: 5
    verse: 25
    ordinal: 5080
    text: And as he hath covenanted with all the house of Jacob, even so shall the covenant wherewith he hath covenanted with the house of Jacob be fulfilled in his own due time, unto the restoring all the house of Jacob unto the knowledge of the covenant that he hath covenanted with them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.5.26
    scripture: book-of-mormon
    name: 3 Nephi 5:26
    book: 3 Nephi
    chapter: 5
    verse: 26
    ordinal: 5081
    text: And then shall they know their Redeemer, who is Jesus Christ, the Son of God; and then shall they be gathered in from the four quarters of the earth unto their own lands, from whence they have been dispersed; yea, as the Lord liveth so shall it be. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.5
- type: BomVerse
  data:
    ref: 3-nephi.6.1
    scripture: book-of-mormon
    name: 3 Nephi 6:1
    book: 3 Nephi
    chapter: 6
    verse: 1
    ordinal: 5082
    text: And now it came to pass that the people of the Nephites did all return to their own lands in the twenty and sixth year, every man, with his family, his flocks and his herds, his horses and his cattle, and all things whatsoever did belong unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.2
    scripture: book-of-mormon
    name: 3 Nephi 6:2
    book: 3 Nephi
    chapter: 6
    verse: 2
    ordinal: 5083
    text: And it came to pass that they had not eaten up all their provisions; therefore they did take with them all that they had not devoured, of all their grain of every kind, and their gold, and their silver, and all their precious things, and they did return to their own lands and their possessions, both on the north and on the south, both on the land northward and on the land southward.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.3
    scripture: book-of-mormon
    name: 3 Nephi 6:3
    book: 3 Nephi
    chapter: 6
    verse: 3
    ordinal: 5084
    text: And they granted unto those robbers who had entered into a covenant to keep the peace of the land, who were desirous to remain Lamanites, lands, according to their numbers, that they might have, with their labors, wherewith to subsist upon; and thus they did establish peace in all the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.4
    scripture: book-of-mormon
    name: 3 Nephi 6:4
    book: 3 Nephi
    chapter: 6
    verse: 4
    ordinal: 5085
    text: And they began again to prosper and to wax great; and the twenty and sixth and seventh years passed away, and there was great order in the land; and they had formed their laws according to equity and justice.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.5
    scripture: book-of-mormon
    name: 3 Nephi 6:5
    book: 3 Nephi
    chapter: 6
    verse: 5
    ordinal: 5086
    text: And now there was nothing in all the land to hinder the people from prospering continually, except they should fall into transgression.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.6
    scripture: book-of-mormon
    name: 3 Nephi 6:6
    book: 3 Nephi
    chapter: 6
    verse: 6
    ordinal: 5087
    text: And now it was Gidgiddoni, and the judge, Lachoneus, and those who had been appointed leaders, who had established this great peace in the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.7
    scripture: book-of-mormon
    name: 3 Nephi 6:7
    book: 3 Nephi
    chapter: 6
    verse: 7
    ordinal: 5088
    text: And it came to pass that there were many cities built anew, and there were many old cities repaired.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.8
    scripture: book-of-mormon
    name: 3 Nephi 6:8
    book: 3 Nephi
    chapter: 6
    verse: 8
    ordinal: 5089
    text: And there were many highways cast up, and many roads made, which led from city to city, and from land to land, and from place to place.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.9
    scripture: book-of-mormon
    name: 3 Nephi 6:9
    book: 3 Nephi
    chapter: 6
    verse: 9
    ordinal: 5090
    text: And thus passed away the twenty and eighth year, and the people had continual peace.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.10
    scripture: book-of-mormon
    name: 3 Nephi 6:10
    book: 3 Nephi
    chapter: 6
    verse: 10
    ordinal: 5091
    text: But it came to pass in the twenty and ninth year there began to be some disputings among the people; and some were lifted up unto pride and boastings because of their exceedingly great riches, yea, even unto great persecutions;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.11
    scripture: book-of-mormon
    name: 3 Nephi 6:11
    book: 3 Nephi
    chapter: 6
    verse: 11
    ordinal: 5092
    text: For there were many merchants in the land, and also many lawyers, and many officers.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.12
    scripture: book-of-mormon
    name: 3 Nephi 6:12
    book: 3 Nephi
    chapter: 6
    verse: 12
    ordinal: 5093
    text: And the people began to be distinguished by ranks, according to their riches and their chances for learning; yea, some were ignorant because of their poverty, and others did receive great learning because of their riches.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.13
    scripture: book-of-mormon
    name: 3 Nephi 6:13
    book: 3 Nephi
    chapter: 6
    verse: 13
    ordinal: 5094
    text: Some were lifted up in pride, and others were exceedingly humble; some did return railing for railing, while others would receive railing and persecution and all manner of afflictions, and would not turn and revile again, but were humble and penitent before God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.14
    scripture: book-of-mormon
    name: 3 Nephi 6:14
    book: 3 Nephi
    chapter: 6
    verse: 14
    ordinal: 5095
    text: And thus there became a great inequality in all the land, insomuch that the church began to be broken up; yea, insomuch that in the thirtieth year the church was broken up in all the land save it were among a few of the Lamanites who were converted unto the true faith; and they would not depart from it, for they were firm, and steadfast, and immovable, willing with all diligence to keep the commandments of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.15
    scripture: book-of-mormon
    name: 3 Nephi 6:15
    book: 3 Nephi
    chapter: 6
    verse: 15
    ordinal: 5096
    text: Now the cause of this iniquity of the people was this—Satan had great power, unto the stirring up of the people to do all manner of iniquity, and to the puffing them up with pride, tempting them to seek for power, and authority, and riches, and the vain things of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.16
    scripture: book-of-mormon
    name: 3 Nephi 6:16
    book: 3 Nephi
    chapter: 6
    verse: 16
    ordinal: 5097
    text: And thus Satan did lead away the hearts of the people to do all manner of iniquity; therefore they had enjoyed peace but a few years.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.17
    scripture: book-of-mormon
    name: 3 Nephi 6:17
    book: 3 Nephi
    chapter: 6
    verse: 17
    ordinal: 5098
    text: And thus, in the commencement of the thirtieth year—the people having been delivered up for the space of a long time to be carried about by the temptations of the devil whithersoever he desired to carry them, and to do whatsoever iniquity he desired they should—and thus in the commencement of this, the thirtieth year, they were in a state of awful wickedness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.18
    scripture: book-of-mormon
    name: 3 Nephi 6:18
    book: 3 Nephi
    chapter: 6
    verse: 18
    ordinal: 5099
    text: Now they did not sin ignorantly, for they knew the will of God concerning them, for it had been taught unto them; therefore they did wilfully rebel against God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.19
    scripture: book-of-mormon
    name: 3 Nephi 6:19
    book: 3 Nephi
    chapter: 6
    verse: 19
    ordinal: 5100
    text: And now it was in the days of Lachoneus, the son of Lachoneus, for Lachoneus did fill the seat of his father and did govern the people that year.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.20
    scripture: book-of-mormon
    name: 3 Nephi 6:20
    book: 3 Nephi
    chapter: 6
    verse: 20
    ordinal: 5101
    text: And there began to be men inspired from heaven and sent forth, standing among the people in all the land, preaching and testifying boldly of the sins and iniquities of the people, and testifying unto them concerning the redemption which the Lord would make for his people, or in other words, the resurrection of Christ; and they did testify boldly of his death and sufferings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.21
    scripture: book-of-mormon
    name: 3 Nephi 6:21
    book: 3 Nephi
    chapter: 6
    verse: 21
    ordinal: 5102
    text: Now there were many of the people who were exceedingly angry because of those who testified of these things; and those who were angry were chiefly the chief judges, and they who had been high priests and lawyers; yea, all those who were lawyers were angry with those who testified of these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.22
    scripture: book-of-mormon
    name: 3 Nephi 6:22
    book: 3 Nephi
    chapter: 6
    verse: 22
    ordinal: 5103
    text: Now there was no lawyer nor judge nor high priest that could have power to condemn any one to death save their condemnation was signed by the governor of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.23
    scripture: book-of-mormon
    name: 3 Nephi 6:23
    book: 3 Nephi
    chapter: 6
    verse: 23
    ordinal: 5104
    text: Now there were many of those who testified of the things pertaining to Christ who testified boldly, who were taken and put to death secretly by the judges, that the knowledge of their death came not unto the governor of the land until after their death.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.24
    scripture: book-of-mormon
    name: 3 Nephi 6:24
    book: 3 Nephi
    chapter: 6
    verse: 24
    ordinal: 5105
    text: Now behold, this was contrary to the laws of the land, that any man should be put to death except they had power from the governor of the land—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.25
    scripture: book-of-mormon
    name: 3 Nephi 6:25
    book: 3 Nephi
    chapter: 6
    verse: 25
    ordinal: 5106
    text: Therefore a complaint came up unto the land of Zarahemla, to the governor of the land, against these judges who had condemned the prophets of the Lord unto death, not according to the law.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.26
    scripture: book-of-mormon
    name: 3 Nephi 6:26
    book: 3 Nephi
    chapter: 6
    verse: 26
    ordinal: 5107
    text: Now it came to pass that they were taken and brought up before the judge, to be judged of the crime which they had done, according to the law which had been given by the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.27
    scripture: book-of-mormon
    name: 3 Nephi 6:27
    book: 3 Nephi
    chapter: 6
    verse: 27
    ordinal: 5108
    text: Now it came to pass that those judges had many friends and kindreds; and the remainder, yea, even almost all the lawyers and the high priests, did gather themselves together, and unite with the kindreds of those judges who were to be tried according to the law.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.28
    scripture: book-of-mormon
    name: 3 Nephi 6:28
    book: 3 Nephi
    chapter: 6
    verse: 28
    ordinal: 5109
    text: And they did enter into a covenant one with another, yea, even into that covenant which was given by them of old, which covenant was given and administered by the devil, to combine against all righteousness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.29
    scripture: book-of-mormon
    name: 3 Nephi 6:29
    book: 3 Nephi
    chapter: 6
    verse: 29
    ordinal: 5110
    text: Therefore they did combine against the people of the Lord, and enter into a covenant to destroy them, and to deliver those who were guilty of murder from the grasp of justice, which was about to be administered according to the law.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.6.30
    scripture: book-of-mormon
    name: 3 Nephi 6:30
    book: 3 Nephi
    chapter: 6
    verse: 30
    ordinal: 5111
    text: And they did set at defiance the law and the rights of their country; and they did covenant one with another to destroy the governor, and to establish a king over the land, that the land should no more be at liberty but should be subject unto kings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.6
- type: BomVerse
  data:
    ref: 3-nephi.7.1
    scripture: book-of-mormon
    name: 3 Nephi 7:1
    book: 3 Nephi
    chapter: 7
    verse: 1
    ordinal: 5112
    text: Now behold, I will show unto you that they did not establish a king over the land; but in this same year, yea, the thirtieth year, they did destroy upon the judgment-seat, yea, did murder the chief judge of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.2
    scripture: book-of-mormon
    name: 3 Nephi 7:2
    book: 3 Nephi
    chapter: 7
    verse: 2
    ordinal: 5113
    text: And the people were divided one against another; and they did separate one from another into tribes, every man according to his family and his kindred and friends; and thus they did destroy the government of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.3
    scripture: book-of-mormon
    name: 3 Nephi 7:3
    book: 3 Nephi
    chapter: 7
    verse: 3
    ordinal: 5114
    text: And every tribe did appoint a chief or a leader over them; and thus they became tribes and leaders of tribes.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.4
    scripture: book-of-mormon
    name: 3 Nephi 7:4
    book: 3 Nephi
    chapter: 7
    verse: 4
    ordinal: 5115
    text: Now behold, there was no man among them save he had much family and many kindreds and friends; therefore their tribes became exceedingly great.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.5
    scripture: book-of-mormon
    name: 3 Nephi 7:5
    book: 3 Nephi
    chapter: 7
    verse: 5
    ordinal: 5116
    text: Now all this was done, and there were no wars as yet among them; and all this iniquity had come upon the people because they did yield themselves unto the power of Satan.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.6
    scripture: book-of-mormon
    name: 3 Nephi 7:6
    book: 3 Nephi
    chapter: 7
    verse: 6
    ordinal: 5117
    text: And the regulations of the government were destroyed, because of the secret combination of the friends and kindreds of those who murdered the prophets.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.7
    scripture: book-of-mormon
    name: 3 Nephi 7:7
    book: 3 Nephi
    chapter: 7
    verse: 7
    ordinal: 5118
    text: And they did cause a great contention in the land, insomuch that the more righteous part of the people had nearly all become wicked; yea, there were but few righteous men among them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.8
    scripture: book-of-mormon
    name: 3 Nephi 7:8
    book: 3 Nephi
    chapter: 7
    verse: 8
    ordinal: 5119
    text: And thus six years had not passed away since the more part of the people had turned from their righteousness, like the dog to his vomit, or like the sow to her wallowing in the mire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.9
    scripture: book-of-mormon
    name: 3 Nephi 7:9
    book: 3 Nephi
    chapter: 7
    verse: 9
    ordinal: 5120
    text: Now this secret combination, which had brought so great iniquity upon the people, did gather themselves together, and did place at their head a man whom they did call Jacob;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.10
    scripture: book-of-mormon
    name: 3 Nephi 7:10
    book: 3 Nephi
    chapter: 7
    verse: 10
    ordinal: 5121
    text: And they did call him their king; therefore he became a king over this wicked band; and he was one of the chiefest who had given his voice against the prophets who testified of Jesus.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.11
    scripture: book-of-mormon
    name: 3 Nephi 7:11
    book: 3 Nephi
    chapter: 7
    verse: 11
    ordinal: 5122
    text: And it came to pass that they were not so strong in number as the tribes of the people, who were united together save it were their leaders did establish their laws, every one according to his tribe; nevertheless they were enemies; notwithstanding they were not a righteous people, yet they were united in the hatred of those who had entered into a covenant to destroy the government.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.12
    scripture: book-of-mormon
    name: 3 Nephi 7:12
    book: 3 Nephi
    chapter: 7
    verse: 12
    ordinal: 5123
    text: Therefore, Jacob seeing that their enemies were more numerous than they, he being the king of the band, therefore he commanded his people that they should take their flight into the northernmost part of the land, and there build up unto themselves a kingdom, until they were joined by dissenters, (for he flattered them that there would be many dissenters) and they become sufficiently strong to contend with the tribes of the people; and they did so.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.13
    scripture: book-of-mormon
    name: 3 Nephi 7:13
    book: 3 Nephi
    chapter: 7
    verse: 13
    ordinal: 5124
    text: And so speedy was their march that it could not be impeded until they had gone forth out of the reach of the people. And thus ended the thirtieth year; and thus were the affairs of the people of Nephi.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.14
    scripture: book-of-mormon
    name: 3 Nephi 7:14
    book: 3 Nephi
    chapter: 7
    verse: 14
    ordinal: 5125
    text: And it came to pass in the thirty and first year that they were divided into tribes, every man according to his family, kindred and friends; nevertheless they had come to an agreement that they would not go to war one with another; but they were not united as to their laws, and their manner of government, for they were established according to the minds of those who were their chiefs and their leaders. But they did establish very strict laws that one tribe should not trespass against another, insomuch that in some degree they had peace in the land; nevertheless, their hearts were turned from the Lord their God, and they did stone the prophets and did cast them out from among them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.15
    scripture: book-of-mormon
    name: 3 Nephi 7:15
    book: 3 Nephi
    chapter: 7
    verse: 15
    ordinal: 5126
    text: And it came to pass that Nephi—having been visited by angels and also the voice of the Lord, therefore having seen angels, and being eye-witness, and having had power given unto him that he might know concerning the ministry of Christ, and also being eye-witness to their quick return from righteousness unto their wickedness and abominations;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.16
    scripture: book-of-mormon
    name: 3 Nephi 7:16
    book: 3 Nephi
    chapter: 7
    verse: 16
    ordinal: 5127
    text: Therefore, being grieved for the hardness of their hearts and the blindness of their minds—went forth among them in that same year, and began to testify, boldly, repentance and remission of sins through faith on the Lord Jesus Christ.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.17
    scripture: book-of-mormon
    name: 3 Nephi 7:17
    book: 3 Nephi
    chapter: 7
    verse: 17
    ordinal: 5128
    text: And he did minister many things unto them; and all of them cannot be written, and a part of them would not suffice, therefore they are not written in this book. And Nephi did minister with power and with great authority.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.18
    scripture: book-of-mormon
    name: 3 Nephi 7:18
    book: 3 Nephi
    chapter: 7
    verse: 18
    ordinal: 5129
    text: And it came to pass that they were angry with him, even because he had greater power than they, for it were not possible that they could disbelieve his words, for so great was his faith on the Lord Jesus Christ that angels did minister unto him daily.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.19
    scripture: book-of-mormon
    name: 3 Nephi 7:19
    book: 3 Nephi
    chapter: 7
    verse: 19
    ordinal: 5130
    text: And in the name of Jesus did he cast out devils and unclean spirits; and even his brother did he raise from the dead, after he had been stoned and suffered death by the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.20
    scripture: book-of-mormon
    name: 3 Nephi 7:20
    book: 3 Nephi
    chapter: 7
    verse: 20
    ordinal: 5131
    text: And the people saw it, and did witness of it, and were angry with him because of his power; and he did also do many more miracles, in the sight of the people, in the name of Jesus.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.21
    scripture: book-of-mormon
    name: 3 Nephi 7:21
    book: 3 Nephi
    chapter: 7
    verse: 21
    ordinal: 5132
    text: And it came to pass that the thirty and first year did pass away, and there were but few who were converted unto the Lord; but as many as were converted did truly signify unto the people that they had been visited by the power and Spirit of God, which was in Jesus Christ, in whom they believed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.22
    scripture: book-of-mormon
    name: 3 Nephi 7:22
    book: 3 Nephi
    chapter: 7
    verse: 22
    ordinal: 5133
    text: And as many as had devils cast out from them, and were healed of their sicknesses and their infirmities, did truly manifest unto the people that they had been wrought upon by the Spirit of God, and had been healed; and they did show forth signs also and did do some miracles among the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.23
    scripture: book-of-mormon
    name: 3 Nephi 7:23
    book: 3 Nephi
    chapter: 7
    verse: 23
    ordinal: 5134
    text: Thus passed away the thirty and second year also. And Nephi did cry unto the people in the commencement of the thirty and third year; and he did preach unto them repentance and remission of sins.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.24
    scripture: book-of-mormon
    name: 3 Nephi 7:24
    book: 3 Nephi
    chapter: 7
    verse: 24
    ordinal: 5135
    text: Now I would have you to remember also, that there were none who were brought unto repentance who were not baptized with water.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.25
    scripture: book-of-mormon
    name: 3 Nephi 7:25
    book: 3 Nephi
    chapter: 7
    verse: 25
    ordinal: 5136
    text: Therefore, there were ordained of Nephi, men unto this ministry, that all such as should come unto them should be baptized with water, and this as a witness and a testimony before God, and unto the people, that they had repented and received a remission of their sins.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.7.26
    scripture: book-of-mormon
    name: 3 Nephi 7:26
    book: 3 Nephi
    chapter: 7
    verse: 26
    ordinal: 5137
    text: And there were many in the commencement of this year that were baptized unto repentance; and thus the more part of the year did pass away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.7
- type: BomVerse
  data:
    ref: 3-nephi.8.1
    scripture: book-of-mormon
    name: 3 Nephi 8:1
    book: 3 Nephi
    chapter: 8
    verse: 1
    ordinal: 5138
    text: And now it came to pass that according to our record, and we know our record to be true, for behold, it was a just man who did keep the record—for he truly did many miracles in the name of Jesus; and there was not any man who could do a miracle in the name of Jesus save he were cleansed every whit from his iniquity—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.2
    scripture: book-of-mormon
    name: 3 Nephi 8:2
    book: 3 Nephi
    chapter: 8
    verse: 2
    ordinal: 5139
    text: And now it came to pass, if there was no mistake made by this man in the reckoning of our time, the thirty and third year had passed away;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.3
    scripture: book-of-mormon
    name: 3 Nephi 8:3
    book: 3 Nephi
    chapter: 8
    verse: 3
    ordinal: 5140
    text: And the people began to look with great earnestness for the sign which had been given by the prophet Samuel, the Lamanite, yea, for the time that there should be darkness for the space of three days over the face of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.4
    scripture: book-of-mormon
    name: 3 Nephi 8:4
    book: 3 Nephi
    chapter: 8
    verse: 4
    ordinal: 5141
    text: And there began to be great doubtings and disputations among the people, notwithstanding so many signs had been given.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.5
    scripture: book-of-mormon
    name: 3 Nephi 8:5
    book: 3 Nephi
    chapter: 8
    verse: 5
    ordinal: 5142
    text: And it came to pass in the thirty and fourth year, in the first month, on the fourth day of the month, there arose a great storm, such an one as never had been known in all the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.6
    scripture: book-of-mormon
    name: 3 Nephi 8:6
    book: 3 Nephi
    chapter: 8
    verse: 6
    ordinal: 5143
    text: And there was also a great and terrible tempest; and there was terrible thunder, insomuch that it did shake the whole earth as if it was about to divide asunder.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.7
    scripture: book-of-mormon
    name: 3 Nephi 8:7
    book: 3 Nephi
    chapter: 8
    verse: 7
    ordinal: 5144
    text: And there were exceedingly sharp lightnings, such as never had been known in all the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.8
    scripture: book-of-mormon
    name: 3 Nephi 8:8
    book: 3 Nephi
    chapter: 8
    verse: 8
    ordinal: 5145
    text: And the city of Zarahemla did take fire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.9
    scripture: book-of-mormon
    name: 3 Nephi 8:9
    book: 3 Nephi
    chapter: 8
    verse: 9
    ordinal: 5146
    text: And the city of Moroni did sink into the depths of the sea, and the inhabitants thereof were drowned.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.10
    scripture: book-of-mormon
    name: 3 Nephi 8:10
    book: 3 Nephi
    chapter: 8
    verse: 10
    ordinal: 5147
    text: And the earth was carried up upon the city of Moronihah, that in the place of the city there became a great mountain.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.11
    scripture: book-of-mormon
    name: 3 Nephi 8:11
    book: 3 Nephi
    chapter: 8
    verse: 11
    ordinal: 5148
    text: And there was a great and terrible destruction in the land southward.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.12
    scripture: book-of-mormon
    name: 3 Nephi 8:12
    book: 3 Nephi
    chapter: 8
    verse: 12
    ordinal: 5149
    text: But behold, there was a more great and terrible destruction in the land northward; for behold, the whole face of the land was changed, because of the tempest and the whirlwinds, and the thunderings and the lightnings, and the exceedingly great quaking of the whole earth;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.13
    scripture: book-of-mormon
    name: 3 Nephi 8:13
    book: 3 Nephi
    chapter: 8
    verse: 13
    ordinal: 5150
    text: And the highways were broken up, and the level roads were spoiled, and many smooth places became rough.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.14
    scripture: book-of-mormon
    name: 3 Nephi 8:14
    book: 3 Nephi
    chapter: 8
    verse: 14
    ordinal: 5151
    text: And many great and notable cities were sunk, and many were burned, and many were shaken till the buildings thereof had fallen to the earth, and the inhabitants thereof were slain, and the places were left desolate.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.15
    scripture: book-of-mormon
    name: 3 Nephi 8:15
    book: 3 Nephi
    chapter: 8
    verse: 15
    ordinal: 5152
    text: And there were some cities which remained; but the damage thereof was exceedingly great, and there were many in them who were slain.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.16
    scripture: book-of-mormon
    name: 3 Nephi 8:16
    book: 3 Nephi
    chapter: 8
    verse: 16
    ordinal: 5153
    text: And there were some who were carried away in the whirlwind; and whither they went no man knoweth, save they know that they were carried away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.17
    scripture: book-of-mormon
    name: 3 Nephi 8:17
    book: 3 Nephi
    chapter: 8
    verse: 17
    ordinal: 5154
    text: And thus the face of the whole earth became deformed, because of the tempests, and the thunderings, and the lightnings, and the quaking of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.18
    scripture: book-of-mormon
    name: 3 Nephi 8:18
    book: 3 Nephi
    chapter: 8
    verse: 18
    ordinal: 5155
    text: And behold, the rocks were rent in twain; they were broken up upon the face of the whole earth, insomuch that they were found in broken fragments, and in seams and in cracks, upon all the face of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.19
    scripture: book-of-mormon
    name: 3 Nephi 8:19
    book: 3 Nephi
    chapter: 8
    verse: 19
    ordinal: 5156
    text: And it came to pass that when the thunderings, and the lightnings, and the storm, and the tempest, and the quakings of the earth did cease—for behold, they did last for about the space of three hours; and it was said by some that the time was greater; nevertheless, all these great and terrible things were done in about the space of three hours—and then behold, there was darkness upon the face of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.20
    scripture: book-of-mormon
    name: 3 Nephi 8:20
    book: 3 Nephi
    chapter: 8
    verse: 20
    ordinal: 5157
    text: And it came to pass that there was thick darkness upon all the face of the land, insomuch that the inhabitants thereof who had not fallen could feel the vapor of darkness;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.21
    scripture: book-of-mormon
    name: 3 Nephi 8:21
    book: 3 Nephi
    chapter: 8
    verse: 21
    ordinal: 5158
    text: And there could be no light, because of the darkness, neither candles, neither torches; neither could there be fire kindled with their fine and exceedingly dry wood, so that there could not be any light at all;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.22
    scripture: book-of-mormon
    name: 3 Nephi 8:22
    book: 3 Nephi
    chapter: 8
    verse: 22
    ordinal: 5159
    text: And there was not any light seen, neither fire, nor glimmer, neither the sun, nor the moon, nor the stars, for so great were the mists of darkness which were upon the face of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.23
    scripture: book-of-mormon
    name: 3 Nephi 8:23
    book: 3 Nephi
    chapter: 8
    verse: 23
    ordinal: 5160
    text: And it came to pass that it did last for the space of three days that there was no light seen; and there was great mourning and howling and weeping among all the people continually; yea, great were the groanings of the people, because of the darkness and the great destruction which had come upon them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.24
    scripture: book-of-mormon
    name: 3 Nephi 8:24
    book: 3 Nephi
    chapter: 8
    verse: 24
    ordinal: 5161
    text: 'And in one place they were heard to cry, saying: O that we had repented before this great and terrible day, and then would our brethren have been spared, and they would not have been burned in that great city Zarahemla.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.8.25
    scripture: book-of-mormon
    name: 3 Nephi 8:25
    book: 3 Nephi
    chapter: 8
    verse: 25
    ordinal: 5162
    text: 'And in another place they were heard to cry and mourn, saying: O that we had repented before this great and terrible day, and had not killed and stoned the prophets, and cast them out; then would our mothers and our fair daughters, and our children have been spared, and not have been buried up in that great city Moronihah. And thus were the howlings of the people great and terrible.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.8
- type: BomVerse
  data:
    ref: 3-nephi.9.1
    scripture: book-of-mormon
    name: 3 Nephi 9:1
    book: 3 Nephi
    chapter: 9
    verse: 1
    ordinal: 5163
    text: 'And it came to pass that there was a voice heard among all the inhabitants of the earth, upon all the face of this land, crying:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.2
    scripture: book-of-mormon
    name: 3 Nephi 9:2
    book: 3 Nephi
    chapter: 9
    verse: 2
    ordinal: 5164
    text: Wo, wo, wo unto this people; wo unto the inhabitants of the whole earth except they shall repent; for the devil laugheth, and his angels rejoice, because of the slain of the fair sons and daughters of my people; and it is because of their iniquity and abominations that they are fallen!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.3
    scripture: book-of-mormon
    name: 3 Nephi 9:3
    book: 3 Nephi
    chapter: 9
    verse: 3
    ordinal: 5165
    text: Behold, that great city Zarahemla have I burned with fire, and the inhabitants thereof.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.4
    scripture: book-of-mormon
    name: 3 Nephi 9:4
    book: 3 Nephi
    chapter: 9
    verse: 4
    ordinal: 5166
    text: And behold, that great city Moroni have I caused to be sunk in the depths of the sea, and the inhabitants thereof to be drowned.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.5
    scripture: book-of-mormon
    name: 3 Nephi 9:5
    book: 3 Nephi
    chapter: 9
    verse: 5
    ordinal: 5167
    text: And behold, that great city Moronihah have I covered with earth, and the inhabitants thereof, to hide their iniquities and their abominations from before my face, that the blood of the prophets and the saints shall not come any more unto me against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.6
    scripture: book-of-mormon
    name: 3 Nephi 9:6
    book: 3 Nephi
    chapter: 9
    verse: 6
    ordinal: 5168
    text: And behold, the city of Gilgal have I caused to be sunk, and the inhabitants thereof to be buried up in the depths of the earth;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.7
    scripture: book-of-mormon
    name: 3 Nephi 9:7
    book: 3 Nephi
    chapter: 9
    verse: 7
    ordinal: 5169
    text: Yea, and the city of Onihah and the inhabitants thereof, and the city of Mocum and the inhabitants thereof, and the city of Jerusalem and the inhabitants thereof; and waters have I caused to come up in the stead thereof, to hide their wickedness and abominations from before my face, that the blood of the prophets and the saints shall not come up any more unto me against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.8
    scripture: book-of-mormon
    name: 3 Nephi 9:8
    book: 3 Nephi
    chapter: 9
    verse: 8
    ordinal: 5170
    text: And behold, the city of Gadiandi, and the city of Gadiomnah, and the city of Jacob, and the city of Gimgimno, all these have I caused to be sunk, and made hills and valleys in the places thereof; and the inhabitants thereof have I buried up in the depths of the earth, to hide their wickedness and abominations from before my face, that the blood of the prophets and the saints should not come up any more unto me against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.9
    scripture: book-of-mormon
    name: 3 Nephi 9:9
    book: 3 Nephi
    chapter: 9
    verse: 9
    ordinal: 5171
    text: And behold, that great city Jacobugath, which was inhabited by the people of king Jacob, have I caused to be burned with fire because of their sins and their wickedness, which was above all the wickedness of the whole earth, because of their secret murders and combinations; for it was they that did destroy the peace of my people and the government of the land; therefore I did cause them to be burned, to destroy them from before my face, that the blood of the prophets and the saints should not come up unto me any more against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.10
    scripture: book-of-mormon
    name: 3 Nephi 9:10
    book: 3 Nephi
    chapter: 9
    verse: 10
    ordinal: 5172
    text: And behold, the city of Laman, and the city of Josh, and the city of Gad, and the city of Kishkumen, have I caused to be burned with fire, and the inhabitants thereof, because of their wickedness in casting out the prophets, and stoning those whom I did send to declare unto them concerning their wickedness and their abominations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.11
    scripture: book-of-mormon
    name: 3 Nephi 9:11
    book: 3 Nephi
    chapter: 9
    verse: 11
    ordinal: 5173
    text: And because they did cast them all out, that there were none righteous among them, I did send down fire and destroy them, that their wickedness and abominations might be hid from before my face, that the blood of the prophets and the saints whom I sent among them might not cry unto me from the ground against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.12
    scripture: book-of-mormon
    name: 3 Nephi 9:12
    book: 3 Nephi
    chapter: 9
    verse: 12
    ordinal: 5174
    text: And many great destructions have I caused to come upon this land, and upon this people, because of their wickedness and their abominations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.13
    scripture: book-of-mormon
    name: 3 Nephi 9:13
    book: 3 Nephi
    chapter: 9
    verse: 13
    ordinal: 5175
    text: O all ye that are spared because ye were more righteous than they, will ye not now return unto me, and repent of your sins, and be converted, that I may heal you?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.14
    scripture: book-of-mormon
    name: 3 Nephi 9:14
    book: 3 Nephi
    chapter: 9
    verse: 14
    ordinal: 5176
    text: Yea, verily I say unto you, if ye will come unto me ye shall have eternal life. Behold, mine arm of mercy is extended towards you, and whosoever will come, him will I receive; and blessed are those who come unto me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.15
    scripture: book-of-mormon
    name: 3 Nephi 9:15
    book: 3 Nephi
    chapter: 9
    verse: 15
    ordinal: 5177
    text: Behold, I am Jesus Christ the Son of God. I created the heavens and the earth, and all things that in them are. I was with the Father from the beginning. I am in the Father, and the Father in me; and in me hath the Father glorified his name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.16
    scripture: book-of-mormon
    name: 3 Nephi 9:16
    book: 3 Nephi
    chapter: 9
    verse: 16
    ordinal: 5178
    text: I came unto my own, and my own received me not. And the scriptures concerning my coming are fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.17
    scripture: book-of-mormon
    name: 3 Nephi 9:17
    book: 3 Nephi
    chapter: 9
    verse: 17
    ordinal: 5179
    text: And as many as have received me, to them have I given to become the sons of God; and even so will I to as many as shall believe on my name, for behold, by me redemption cometh, and in me is the law of Moses fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.18
    scripture: book-of-mormon
    name: 3 Nephi 9:18
    book: 3 Nephi
    chapter: 9
    verse: 18
    ordinal: 5180
    text: I am the light and the life of the world. I am Alpha and Omega, the beginning and the end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.19
    scripture: book-of-mormon
    name: 3 Nephi 9:19
    book: 3 Nephi
    chapter: 9
    verse: 19
    ordinal: 5181
    text: And ye shall offer up unto me no more the shedding of blood; yea, your sacrifices and your burnt offerings shall be done away, for I will accept none of your sacrifices and your burnt offerings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.20
    scripture: book-of-mormon
    name: 3 Nephi 9:20
    book: 3 Nephi
    chapter: 9
    verse: 20
    ordinal: 5182
    text: And ye shall offer for a sacrifice unto me a broken heart and a contrite spirit. And whoso cometh unto me with a broken heart and a contrite spirit, him will I baptize with fire and with the Holy Ghost, even as the Lamanites, because of their faith in me at the time of their conversion, were baptized with fire and with the Holy Ghost, and they knew it not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.21
    scripture: book-of-mormon
    name: 3 Nephi 9:21
    book: 3 Nephi
    chapter: 9
    verse: 21
    ordinal: 5183
    text: Behold, I have come unto the world to bring redemption unto the world, to save the world from sin.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.9.22
    scripture: book-of-mormon
    name: 3 Nephi 9:22
    book: 3 Nephi
    chapter: 9
    verse: 22
    ordinal: 5184
    text: Therefore, whoso repenteth and cometh unto me as a little child, him will I receive, for of such is the kingdom of God. Behold, for such I have laid down my life, and have taken it up again; therefore repent, and come unto me ye ends of the earth, and be saved.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.9
- type: BomVerse
  data:
    ref: 3-nephi.10.1
    scripture: book-of-mormon
    name: 3 Nephi 10:1
    book: 3 Nephi
    chapter: 10
    verse: 1
    ordinal: 5185
    text: And now behold, it came to pass that all the people of the land did hear these sayings, and did witness of it. And after these sayings there was silence in the land for the space of many hours;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.2
    scripture: book-of-mormon
    name: 3 Nephi 10:2
    book: 3 Nephi
    chapter: 10
    verse: 2
    ordinal: 5186
    text: For so great was the astonishment of the people that they did cease lamenting and howling for the loss of their kindred which had been slain; therefore there was silence in all the land for the space of many hours.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.3
    scripture: book-of-mormon
    name: 3 Nephi 10:3
    book: 3 Nephi
    chapter: 10
    verse: 3
    ordinal: 5187
    text: 'And it came to pass that there came a voice again unto the people, and all the people did hear, and did witness of it, saying:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.4
    scripture: book-of-mormon
    name: 3 Nephi 10:4
    book: 3 Nephi
    chapter: 10
    verse: 4
    ordinal: 5188
    text: O ye people of these great cities which have fallen, who are descendants of Jacob, yea, who are of the house of Israel, how oft have I gathered you as a hen gathereth her chickens under her wings, and have nourished you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.5
    scripture: book-of-mormon
    name: 3 Nephi 10:5
    book: 3 Nephi
    chapter: 10
    verse: 5
    ordinal: 5189
    text: And again, how oft would I have gathered you as a hen gathereth her chickens under her wings, yea, O ye people of the house of Israel, who have fallen; yea, O ye people of the house of Israel, ye that dwell at Jerusalem, as ye that have fallen; yea, how oft would I have gathered you as a hen gathereth her chickens, and ye would not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.6
    scripture: book-of-mormon
    name: 3 Nephi 10:6
    book: 3 Nephi
    chapter: 10
    verse: 6
    ordinal: 5190
    text: O ye house of Israel whom I have spared, how oft will I gather you as a hen gathereth her chickens under her wings, if ye will repent and return unto me with full purpose of heart.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.7
    scripture: book-of-mormon
    name: 3 Nephi 10:7
    book: 3 Nephi
    chapter: 10
    verse: 7
    ordinal: 5191
    text: But if not, O house of Israel, the places of your dwellings shall become desolate until the time of the fulfilling of the covenant to your fathers.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.8
    scripture: book-of-mormon
    name: 3 Nephi 10:8
    book: 3 Nephi
    chapter: 10
    verse: 8
    ordinal: 5192
    text: And now it came to pass that after the people had heard these words, behold, they began to weep and howl again because of the loss of their kindred and friends.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.9
    scripture: book-of-mormon
    name: 3 Nephi 10:9
    book: 3 Nephi
    chapter: 10
    verse: 9
    ordinal: 5193
    text: And it came to pass that thus did the three days pass away. And it was in the morning, and the darkness dispersed from off the face of the land, and the earth did cease to tremble, and the rocks did cease to rend, and the dreadful groanings did cease, and all the tumultuous noises did pass away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.10
    scripture: book-of-mormon
    name: 3 Nephi 10:10
    book: 3 Nephi
    chapter: 10
    verse: 10
    ordinal: 5194
    text: And the earth did cleave together again, that it stood; and the mourning, and the weeping, and the wailing of the people who were spared alive did cease; and their mourning was turned into joy, and their lamentations into the praise and thanksgiving unto the Lord Jesus Christ, their Redeemer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.11
    scripture: book-of-mormon
    name: 3 Nephi 10:11
    book: 3 Nephi
    chapter: 10
    verse: 11
    ordinal: 5195
    text: And thus far were the scriptures fulfilled which had been spoken by the prophets.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.12
    scripture: book-of-mormon
    name: 3 Nephi 10:12
    book: 3 Nephi
    chapter: 10
    verse: 12
    ordinal: 5196
    text: And it was the more righteous part of the people who were saved, and it was they who received the prophets and stoned them not; and it was they who had not shed the blood of the saints, who were spared—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.13
    scripture: book-of-mormon
    name: 3 Nephi 10:13
    book: 3 Nephi
    chapter: 10
    verse: 13
    ordinal: 5197
    text: And they were spared and were not sunk and buried up in the earth; and they were not drowned in the depths of the sea; and they were not burned by fire, neither were they fallen upon and crushed to death; and they were not carried away in the whirlwind; neither were they overpowered by the vapor of smoke and of darkness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.14
    scripture: book-of-mormon
    name: 3 Nephi 10:14
    book: 3 Nephi
    chapter: 10
    verse: 14
    ordinal: 5198
    text: And now, whoso readeth, let him understand; he that hath the scriptures, let him search them, and see and behold if all these deaths and destructions by fire, and by smoke, and by tempests, and by whirlwinds, and by the opening of the earth to receive them, and all these things are not unto the fulfilling of the prophecies of many of the holy prophets.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.15
    scripture: book-of-mormon
    name: 3 Nephi 10:15
    book: 3 Nephi
    chapter: 10
    verse: 15
    ordinal: 5199
    text: Behold, I say unto you, Yea, many have testified of these things at the coming of Christ, and were slain because they testified of these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.16
    scripture: book-of-mormon
    name: 3 Nephi 10:16
    book: 3 Nephi
    chapter: 10
    verse: 16
    ordinal: 5200
    text: Yea, the prophet Zenos did testify of these things, and also Zenock spake concerning these things, because they testified particularly concerning us, who are the remnant of their seed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.17
    scripture: book-of-mormon
    name: 3 Nephi 10:17
    book: 3 Nephi
    chapter: 10
    verse: 17
    ordinal: 5201
    text: Behold, our father Jacob also testified concerning a remnant of the seed of Joseph. And behold, are not we a remnant of the seed of Joseph? And these things which testify of us, are they not written upon the plates of brass which our father Lehi brought out of Jerusalem?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.18
    scripture: book-of-mormon
    name: 3 Nephi 10:18
    book: 3 Nephi
    chapter: 10
    verse: 18
    ordinal: 5202
    text: And it came to pass that in the ending of the thirty and fourth year, behold, I will show unto you that the people of Nephi who were spared, and also those who had been called Lamanites, who had been spared, did have great favors shown unto them, and great blessings poured out upon their heads, insomuch that soon after the ascension of Christ into heaven he did truly manifest himself unto them—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.10.19
    scripture: book-of-mormon
    name: 3 Nephi 10:19
    book: 3 Nephi
    chapter: 10
    verse: 19
    ordinal: 5203
    text: Showing his body unto them, and ministering unto them; and an account of his ministry shall be given hereafter. Therefore for this time I make an end of my sayings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.10
- type: BomVerse
  data:
    ref: 3-nephi.11.1
    scripture: book-of-mormon
    name: 3 Nephi 11:1
    book: 3 Nephi
    chapter: 11
    verse: 1
    ordinal: 5204
    text: And now it came to pass that there were a great multitude gathered together, of the people of Nephi, round about the temple which was in the land Bountiful; and they were marveling and wondering one with another, and were showing one to another the great and marvelous change which had taken place.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.11
- type: BomVerse
  data:
    ref: 3-nephi.11.2
    scripture: book-of-mormon
    name: 3 Nephi 11:2
    book: 3 Nephi
    chapter: 11
    verse: 2
    ordinal: 5205
    text: And they were also conversing about this Jesus Christ, of whom the sign had been given concerning his death.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.11
- type: BomVerse
  data:
    ref: 3-nephi.11.3
    scripture: book-of-mormon
    name: 3 Nephi 11:3
    book: 3 Nephi
    chapter: 11
    verse: 3
    ordinal: 5206
    text: And it came to pass that while they were thus conversing one with another, they heard a voice as if it came out of heaven; and they cast their eyes round about, for they understood not the voice which they heard; and it was not a harsh voice, neither was it a loud voice; nevertheless, and notwithstanding it being a small voice it did pierce them that did hear to the center, insomuch that there was no part of their frame that it did not cause to quake; yea, it did pierce them to the very soul, and did cause their hearts to burn.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.11
- type: BomVerse
  data:
    ref: 3-nephi.11.4
    scripture: book-of-mormon
    name: 3 Nephi 11:4
    book: 3 Nephi
    chapter: 11
    verse: 4
    ordinal: 5207
    text: And it came to pass that again they heard the voice, and they understood it not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.11
- type: BomVerse
  data:
    ref: 3-nephi.11.5
    scripture: book-of-mormon
    name: 3 Nephi 11:5
    book: 3 Nephi
    chapter: 11
    verse: 5
    ordinal: 5208
    text: And again the third time they did hear the voice, and did open their ears to hear it; and their eyes were towards the sound thereof; and they did look steadfastly towards heaven, from whence the sound came.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.11
- type: BomVerse
  data:
    ref: 3-nephi.11.6
    scripture: book-of-mormon
    name: 3 Nephi 11:6
    book: 3 Nephi
    chapter: 11
    verse: 6
    ordinal: 5209
    text: 'And behold, the third time they did understand the voice which they heard; and it said unto them:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.11
- type: BomVerse
  data:
    ref: 3-nephi.11.7
    scripture: book-of-mormon
    name: 3 Nephi 11:7
    book: 3 Nephi
    chapter: 11
    verse: 7
    ordinal: 5210
    text: Behold my Beloved Son, in whom I am well pleased, in whom I have glorified my name—hear ye him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.11
- type: BomVerse
  data:
    ref: 3-nephi.11.8
    scripture: book-of-mormon
    name: 3 Nephi 11:8
    book: 3 Nephi
    chapter: 11
    verse: 8
    ordinal: 5211
    text: And it came to pass, as they understood they cast their eyes up again towards heaven; and behold, they saw a Man descending out of heaven; and he was clothed in a white robe; and he came down and stood in the midst of them; and the eyes of the whole multitude were turned upon him, and they durst not open their mouths, even one to another, and wist not what it meant, for they thought it was an angel that had appeared unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.11
- type: BomVerse
  data:
    ref: 3-nephi.11.9
    scripture: book-of-mormon
    name: 3 Nephi 11:9
    book: 3 Nephi
    chapter: 11
    verse: 9
    ordinal: 5212
    text: 'And it came to pass that he stretched forth his hand and spake unto the people, saying:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.11
- type: BomVerse
  data:
    ref: 3-nephi.11.10
    scripture: book-of-mormon
    name: 3 Nephi 11:10
    book: 3 Nephi
    chapter: 11
    verse: 10
    ordinal: 5213
    text: Behold, I am Jesus Christ, whom the prophets testified shall come into the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.11
- type: BomVerse
  data:
    ref: 3-nephi.11.11
    scripture: book-of-mormon
    name: 3 Nephi 11:11
    book: 3 Nephi
    chapter: 11
    verse: 11
    ordinal: 5214
    text: And behold, I am the light and the life of the world; and I have drunk out of that bitter cup which the Father hath given me, and have glorified the Father in taking upon me the sins of the world, in the which I have suffered the will of the Father in all things from the beginning.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.11
- type: BomVerse
  data:
    ref: 3-nephi.11.12
    scripture: book-of-mormon
    name: 3 Nephi 11:12
    book: 3 Nephi
    chapter: 11
    verse: 12
    ordinal: 5215
    text: And it came to pass that when Jesus had spoken these words the whole multitude fell to the earth; for they remembered that it had been prophesied among them that Christ should show himself unto them after his ascension into heaven.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.11
