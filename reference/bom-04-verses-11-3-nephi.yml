    scripture: book-of-mormon
    name: 3 Nephi 21:13
    book: 3 Nephi
    chapter: 21
    verse: 13
    ordinal: 5556
    text: Their hand shall be lifted up upon their adversaries, and all their enemies shall be cut off.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Micah 5:9
    kjvOsis:
    - Mic.5.9
