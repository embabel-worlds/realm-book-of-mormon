  data:
    ref: 2-nephi.24.19
    scripture: book-of-mormon
    name: 2 Nephi 24:19
    book: 2 Nephi
    chapter: 24
    verse: 19
    ordinal: 1177
    text: But thou art cast out of thy grave like an abominable branch, and the remnant of those that are slain, thrust through with a sword, that go down to the stones of the pit; as a carcass trodden under feet.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:19
    kjvOsis:
    - Isa.14.19
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.24.20
    scripture: book-of-mormon
    name: 2 Nephi 24:20
    book: 2 Nephi
    chapter: 24
    verse: 20
    ordinal: 1178
    text: Thou shalt not be joined with them in burial, because thou hast destroyed thy land and slain thy people; the seed of evil-doers shall never be renowned.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:20
    kjvOsis:
    - Isa.14.20
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.24.21
    scripture: book-of-mormon
    name: 2 Nephi 24:21
    book: 2 Nephi
    chapter: 24
    verse: 21
    ordinal: 1179
    text: Prepare slaughter for his children for the iniquities of their fathers, that they do not rise, nor possess the land, nor fill the face of the world with cities.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:21
    kjvOsis:
    - Isa.14.21
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.24.22
    scripture: book-of-mormon
    name: 2 Nephi 24:22
    book: 2 Nephi
    chapter: 24
    verse: 22
    ordinal: 1180
    text: For I will rise up against them, saith the Lord of Hosts, and cut off from Babylon the name, and remnant, and son, and nephew, saith the Lord.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:22
    kjvOsis:
    - Isa.14.22
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.24.23
    scripture: book-of-mormon
    name: 2 Nephi 24:23
    book: 2 Nephi
    chapter: 24
    verse: 23
    ordinal: 1181
    text: I will also make it a possession for the bittern, and pools of water; and I will sweep it with the besom of destruction, saith the Lord of Hosts.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:23
    kjvOsis:
    - Isa.14.23
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.24.24
    scripture: book-of-mormon
    name: 2 Nephi 24:24
    book: 2 Nephi
    chapter: 24
    verse: 24
    ordinal: 1182
    text: 'The Lord of Hosts hath sworn, saying: Surely as I have thought, so shall it come to pass; and as I have purposed, so shall it stand—'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:24
    kjvOsis:
    - Isa.14.24
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.24.25
    scripture: book-of-mormon
    name: 2 Nephi 24:25
    book: 2 Nephi
    chapter: 24
    verse: 25
    ordinal: 1183
    text: That I will bring the Assyrian in my land, and upon my mountains tread him under foot; then shall his yoke depart from off them, and his burden depart from off their shoulders.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:25
    kjvOsis:
    - Isa.14.25
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.24.26
    scripture: book-of-mormon
    name: 2 Nephi 24:26
    book: 2 Nephi
    chapter: 24
    verse: 26
    ordinal: 1184
    text: This is the purpose that is purposed upon the whole earth; and this is the hand that is stretched out upon all nations.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:26
    kjvOsis:
    - Isa.14.26
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.24.27
    scripture: book-of-mormon
    name: 2 Nephi 24:27
    book: 2 Nephi
    chapter: 24
    verse: 27
    ordinal: 1185
    text: For the Lord of Hosts hath purposed, and who shall disannul? And his hand is stretched out, and who shall turn it back?
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:27
    kjvOsis:
    - Isa.14.27
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.24.28
    scripture: book-of-mormon
    name: 2 Nephi 24:28
    book: 2 Nephi
    chapter: 24
    verse: 28
    ordinal: 1186
    text: In the year that king Ahaz died was this burden.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:28
    kjvOsis:
    - Isa.14.28
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.24.29
    scripture: book-of-mormon
    name: 2 Nephi 24:29
    book: 2 Nephi
    chapter: 24
    verse: 29
    ordinal: 1187
    text: Rejoice not thou, whole Palestina, because the rod of him that smote thee is broken; for out of the serpent's root shall come forth a cockatrice, and his fruit shall be a fiery flying serpent.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:29
    kjvOsis:
    - Isa.14.29
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.24.30
    scripture: book-of-mormon
    name: 2 Nephi 24:30
    book: 2 Nephi
    chapter: 24
    verse: 30
    ordinal: 1188
    text: And the firstborn of the poor shall feed, and the needy shall lie down in safety; and I will kill thy root with famine, and he shall slay thy remnant.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:30
    kjvOsis:
    - Isa.14.30
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.24.31
    scripture: book-of-mormon
    name: 2 Nephi 24:31
    book: 2 Nephi
    chapter: 24
    verse: 31
    ordinal: 1189
    text: Howl, O gate; cry, O city; thou, whole Palestina, art dissolved; for there shall come from the north a smoke, and none shall be alone in his appointed times.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:31
    kjvOsis:
    - Isa.14.31
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.24.32
    scripture: book-of-mormon
    name: 2 Nephi 24:32
    book: 2 Nephi
    chapter: 24
    verse: 32
    ordinal: 1190
    text: What shall then answer the messengers of the nations? That the Lord hath founded Zion, and the poor of his people shall trust in it.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 14:32
    kjvOsis:
    - Isa.14.32
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.24
- type: BomVerse
  data:
    ref: 2-nephi.25.1
    scripture: book-of-mormon
    name: 2 Nephi 25:1
    book: 2 Nephi
    chapter: 25
    verse: 1
    ordinal: 1191
    text: Now I, Nephi, do speak somewhat concerning the words which I have written, which have been spoken by the mouth of Isaiah. For behold, Isaiah spake many things which were hard for many of my people to understand; for they know not concerning the manner of prophesying among the Jews.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.2
    scripture: book-of-mormon
    name: 2 Nephi 25:2
    book: 2 Nephi
    chapter: 25
    verse: 2
    ordinal: 1192
    text: For I, Nephi, have not taught them many things concerning the manner of the Jews; for their works were works of darkness, and their doings were doings of abominations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.3
    scripture: book-of-mormon
    name: 2 Nephi 25:3
    book: 2 Nephi
    chapter: 25
    verse: 3
    ordinal: 1193
    text: Wherefore, I write unto my people, unto all those that shall receive hereafter these things which I write, that they may know the judgments of God, that they come upon all nations, according to the word which he hath spoken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.4
    scripture: book-of-mormon
    name: 2 Nephi 25:4
    book: 2 Nephi
    chapter: 25
    verse: 4
    ordinal: 1194
    text: Wherefore, hearken, O my people, which are of the house of Israel, and give ear unto my words; for because the words of Isaiah are not plain unto you, nevertheless they are plain unto all those that are filled with the spirit of prophecy. But I give unto you a prophecy, according to the spirit which is in me; wherefore I shall prophesy according to the plainness which hath been with me from the time that I came out from Jerusalem with my father; for behold, my soul delighteth in plainness unto my people, that they may learn.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.5
    scripture: book-of-mormon
    name: 2 Nephi 25:5
    book: 2 Nephi
    chapter: 25
    verse: 5
    ordinal: 1195
    text: Yea, and my soul delighteth in the words of Isaiah, for I came out from Jerusalem, and mine eyes hath beheld the things of the Jews, and I know that the Jews do understand the things of the prophets, and there is none other people that understand the things which were spoken unto the Jews like unto them, save it be that they are taught after the manner of the things of the Jews.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.6
    scripture: book-of-mormon
    name: 2 Nephi 25:6
    book: 2 Nephi
    chapter: 25
    verse: 6
    ordinal: 1196
    text: But behold, I, Nephi, have not taught my children after the manner of the Jews; but behold, I, of myself, have dwelt at Jerusalem, wherefore I know concerning the regions round about; and I have made mention unto my children concerning the judgments of God, which hath come to pass among the Jews, unto my children, according to all that which Isaiah hath spoken, and I do not write them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.7
    scripture: book-of-mormon
    name: 2 Nephi 25:7
    book: 2 Nephi
    chapter: 25
    verse: 7
    ordinal: 1197
    text: But behold, I proceed with mine own prophecy, according to my plainness; in the which I know that no man can err; nevertheless, in the days that the prophecies of Isaiah shall be fulfilled men shall know of a surety, at the times when they shall come to pass.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.8
    scripture: book-of-mormon
    name: 2 Nephi 25:8
    book: 2 Nephi
    chapter: 25
    verse: 8
    ordinal: 1198
    text: Wherefore, they are of worth unto the children of men, and he that supposeth that they are not, unto them will I speak particularly, and confine the words unto mine own people; for I know that they shall be of great worth unto them in the last days; for in that day shall they understand them; wherefore, for their good have I written them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.9
    scripture: book-of-mormon
    name: 2 Nephi 25:9
    book: 2 Nephi
    chapter: 25
    verse: 9
    ordinal: 1199
    text: And as one generation hath been destroyed among the Jews because of iniquity, even so have they been destroyed from generation to generation according to their iniquities; and never hath any of them been destroyed save it were foretold them by the prophets of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.10
    scripture: book-of-mormon
    name: 2 Nephi 25:10
    book: 2 Nephi
    chapter: 25
    verse: 10
    ordinal: 1200
    text: Wherefore, it hath been told them concerning the destruction which should come upon them, immediately after my father left Jerusalem; nevertheless, they hardened their hearts; and according to my prophecy they have been destroyed, save it be those which are carried away captive into Babylon.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.11
    scripture: book-of-mormon
    name: 2 Nephi 25:11
    book: 2 Nephi
    chapter: 25
    verse: 11
    ordinal: 1201
    text: And now this I speak because of the spirit which is in me. And notwithstanding they have been carried away they shall return again, and possess the land of Jerusalem; wherefore, they shall be restored again to the land of their inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.12
    scripture: book-of-mormon
    name: 2 Nephi 25:12
    book: 2 Nephi
    chapter: 25
    verse: 12
    ordinal: 1202
    text: But, behold, they shall have wars, and rumors of wars; and when the day cometh that the Only Begotten of the Father, yea, even the Father of heaven and of earth, shall manifest himself unto them in the flesh, behold, they will reject him, because of their iniquities, and the hardness of their hearts, and the stiffness of their necks.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.13
    scripture: book-of-mormon
    name: 2 Nephi 25:13
    book: 2 Nephi
    chapter: 25
    verse: 13
    ordinal: 1203
    text: Behold, they will crucify him; and after he is laid in a sepulchre for the space of three days he shall rise from the dead, with healing in his wings; and all those who shall believe on his name shall be saved in the kingdom of God. Wherefore, my soul delighteth to prophesy concerning him, for I have seen his day, and my heart doth magnify his holy name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.14
    scripture: book-of-mormon
    name: 2 Nephi 25:14
    book: 2 Nephi
    chapter: 25
    verse: 14
    ordinal: 1204
    text: And behold it shall come to pass that after the Messiah hath risen from the dead, and hath manifested himself unto his people, unto as many as will believe on his name, behold, Jerusalem shall be destroyed again; for wo unto them that fight against God and the people of his church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.15
    scripture: book-of-mormon
    name: 2 Nephi 25:15
    book: 2 Nephi
    chapter: 25
    verse: 15
    ordinal: 1205
    text: Wherefore, the Jews shall be scattered among all nations; yea, and also Babylon shall be destroyed; wherefore, the Jews shall be scattered by other nations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.16
    scripture: book-of-mormon
    name: 2 Nephi 25:16
    book: 2 Nephi
    chapter: 25
    verse: 16
    ordinal: 1206
    text: And after they have been scattered, and the Lord God hath scourged them by other nations for the space of many generations, yea, even down from generation to generation until they shall be persuaded to believe in Christ, the Son of God, and the atonement, which is infinite for all mankind—and when that day shall come that they shall believe in Christ, and worship the Father in his name, with pure hearts and clean hands, and look not forward any more for another Messiah, then, at that time, the day will come that it must needs be expedient that they should believe these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.17
    scripture: book-of-mormon
    name: 2 Nephi 25:17
    book: 2 Nephi
    chapter: 25
    verse: 17
    ordinal: 1207
    text: And the Lord will set his hand again the second time to restore his people from their lost and fallen state. Wherefore, he will proceed to do a marvelous work and a wonder among the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.18
    scripture: book-of-mormon
    name: 2 Nephi 25:18
    book: 2 Nephi
    chapter: 25
    verse: 18
    ordinal: 1208
    text: Wherefore, he shall bring forth his words unto them, which words shall judge them at the last day, for they shall be given them for the purpose of convincing them of the true Messiah, who was rejected by them; and unto the convincing of them that they need not look forward any more for a Messiah to come, for there should not any come, save it should be a false Messiah which should deceive the people; for there is save one Messiah spoken of by the prophets, and that Messiah is he who should be rejected of the Jews.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.19
    scripture: book-of-mormon
    name: 2 Nephi 25:19
    book: 2 Nephi
    chapter: 25
    verse: 19
    ordinal: 1209
    text: For according to the words of the prophets, the Messiah cometh in six hundred years from the time that my father left Jerusalem; and according to the words of the prophets, and also the word of the angel of God, his name shall be Jesus Christ, the Son of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.20
    scripture: book-of-mormon
    name: 2 Nephi 25:20
    book: 2 Nephi
    chapter: 25
    verse: 20
    ordinal: 1210
    text: And now, my brethren, I have spoken plainly that ye cannot err. And as the Lord God liveth that brought Israel up out of the land of Egypt, and gave unto Moses power that he should heal the nations after they had been bitten by the poisonous serpents, if they would cast their eyes unto the serpent which he did raise up before them, and also gave him power that he should smite the rock and the water should come forth; yea, behold I say unto you, that as these things are true, and as the Lord God liveth, there is none other name given under heaven save it be this Jesus Christ, of which I have spoken, whereby man can be saved.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.21
    scripture: book-of-mormon
    name: 2 Nephi 25:21
    book: 2 Nephi
    chapter: 25
    verse: 21
    ordinal: 1211
    text: Wherefore, for this cause hath the Lord God promised unto me that these things which I write shall be kept and preserved, and handed down unto my seed, from generation to generation, that the promise may be fulfilled unto Joseph, that his seed should never perish as long as the earth should stand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.22
    scripture: book-of-mormon
    name: 2 Nephi 25:22
    book: 2 Nephi
    chapter: 25
    verse: 22
    ordinal: 1212
    text: Wherefore, these things shall go from generation to generation as long as the earth shall stand; and they shall go according to the will and pleasure of God; and the nations who shall possess them shall be judged of them according to the words which are written.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.23
    scripture: book-of-mormon
    name: 2 Nephi 25:23
    book: 2 Nephi
    chapter: 25
    verse: 23
    ordinal: 1213
    text: For we labor diligently to write, to persuade our children, and also our brethren, to believe in Christ, and to be reconciled to God; for we know that it is by grace that we are saved, after all we can do.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.24
    scripture: book-of-mormon
    name: 2 Nephi 25:24
    book: 2 Nephi
    chapter: 25
    verse: 24
    ordinal: 1214
    text: And, notwithstanding we believe in Christ, we keep the law of Moses, and look forward with steadfastness unto Christ, until the law shall be fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.25
    scripture: book-of-mormon
    name: 2 Nephi 25:25
    book: 2 Nephi
    chapter: 25
    verse: 25
    ordinal: 1215
    text: For, for this end was the law given; wherefore the law hath become dead unto us, and we are made alive in Christ because of our faith; yet we keep the law because of the commandments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.26
    scripture: book-of-mormon
    name: 2 Nephi 25:26
    book: 2 Nephi
    chapter: 25
    verse: 26
    ordinal: 1216
    text: And we talk of Christ, we rejoice in Christ, we preach of Christ, we prophesy of Christ, and we write according to our prophecies, that our children may know to what source they may look for a remission of their sins.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.27
    scripture: book-of-mormon
    name: 2 Nephi 25:27
    book: 2 Nephi
    chapter: 25
    verse: 27
    ordinal: 1217
    text: Wherefore, we speak concerning the law that our children may know the deadness of the law; and they, by knowing the deadness of the law, may look forward unto that life which is in Christ, and know for what end the law was given. And after the law is fulfilled in Christ, that they need not harden their hearts against him when the law ought to be done away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.28
    scripture: book-of-mormon
    name: 2 Nephi 25:28
    book: 2 Nephi
    chapter: 25
    verse: 28
    ordinal: 1218
    text: And now behold, my people, ye are a stiffnecked people; wherefore, I have spoken plainly unto you, that ye cannot misunderstand. And the words which I have spoken shall stand as a testimony against you; for they are sufficient to teach any man the right way; for the right way is to believe in Christ and deny him not; for by denying him ye also deny the prophets and the law.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.29
    scripture: book-of-mormon
    name: 2 Nephi 25:29
    book: 2 Nephi
    chapter: 25
    verse: 29
    ordinal: 1219
    text: And now behold, I say unto you that the right way is to believe in Christ, and deny him not; and Christ is the Holy One of Israel; wherefore ye must bow down before him, and worship him with all your might, mind, and strength, and your whole soul; and if ye do this ye shall in nowise be cast out.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.25.30
    scripture: book-of-mormon
    name: 2 Nephi 25:30
    book: 2 Nephi
    chapter: 25
    verse: 30
    ordinal: 1220
    text: And, inasmuch as it shall be expedient, ye must keep the performances and ordinances of God until the law shall be fulfilled which was given unto Moses.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.25
- type: BomVerse
  data:
    ref: 2-nephi.26.1
    scripture: book-of-mormon
    name: 2 Nephi 26:1
    book: 2 Nephi
    chapter: 26
    verse: 1
    ordinal: 1221
    text: And after Christ shall have risen from the dead he shall show himself unto you, my children, and my beloved brethren; and the words which he shall speak unto you shall be the law which ye shall do.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.2
    scripture: book-of-mormon
    name: 2 Nephi 26:2
    book: 2 Nephi
    chapter: 26
    verse: 2
    ordinal: 1222
    text: For behold, I say unto you that I have beheld that many generations shall pass away, and there shall be great wars and contentions among my people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.3
    scripture: book-of-mormon
    name: 2 Nephi 26:3
    book: 2 Nephi
    chapter: 26
    verse: 3
    ordinal: 1223
    text: And after the Messiah shall come there shall be signs given unto my people of his birth, and also of his death and resurrection; and great and terrible shall that day be unto the wicked, for they shall perish; and they perish because they cast out the prophets, and the saints, and stone them, and slay them; wherefore the cry of the blood of the saints shall ascend up to God from the ground against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.4
    scripture: book-of-mormon
    name: 2 Nephi 26:4
    book: 2 Nephi
    chapter: 26
    verse: 4
    ordinal: 1224
    text: Wherefore, all those who are proud, and that do wickedly, the day that cometh shall burn them up, saith the Lord of Hosts, for they shall be as stubble.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.5
    scripture: book-of-mormon
    name: 2 Nephi 26:5
    book: 2 Nephi
    chapter: 26
    verse: 5
    ordinal: 1225
    text: And they that kill the prophets, and the saints, the depths of the earth shall swallow them up, saith the Lord of Hosts; and mountains shall cover them, and whirlwinds shall carry them away, and buildings shall fall upon them and crush them to pieces and grind them to powder.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.6
    scripture: book-of-mormon
    name: 2 Nephi 26:6
    book: 2 Nephi
    chapter: 26
    verse: 6
    ordinal: 1226
    text: And they shall be visited with thunderings, and lightnings, and earthquakes, and all manner of destructions, for the fire of the anger of the Lord shall be kindled against them, and they shall be as stubble, and the day that cometh shall consume them, saith the Lord of Hosts.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.7
    scripture: book-of-mormon
    name: 2 Nephi 26:7
    book: 2 Nephi
    chapter: 26
    verse: 7
    ordinal: 1227
    text: 'O the pain, and the anguish of my soul for the loss of the slain of my people! For I, Nephi, have seen it, and it well nigh consumeth me before the presence of the Lord; but I must cry unto my God: Thy ways are just.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.8
    scripture: book-of-mormon
    name: 2 Nephi 26:8
    book: 2 Nephi
    chapter: 26
    verse: 8
    ordinal: 1228
    text: But behold, the righteous that hearken unto the words of the prophets, and destroy them not, but look forward unto Christ with steadfastness for the signs which are given, notwithstanding all persecution—behold, they are they which shall not perish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.9
    scripture: book-of-mormon
    name: 2 Nephi 26:9
    book: 2 Nephi
    chapter: 26
    verse: 9
    ordinal: 1229
    text: But the Son of Righteousness shall appear unto them; and he shall heal them, and they shall have peace with him, until three generations shall have passed away, and many of the fourth generation shall have passed away in righteousness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.10
    scripture: book-of-mormon
    name: 2 Nephi 26:10
    book: 2 Nephi
    chapter: 26
    verse: 10
    ordinal: 1230
    text: And when these things have passed away a speedy destruction cometh unto my people; for, notwithstanding the pains of my soul, I have seen it; wherefore, I know that it shall come to pass; and they sell themselves for naught; for, for the reward of their pride and their foolishness they shall reap destruction; for because they yield unto the devil and choose works of darkness rather than light, therefore they must go down to hell.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.11
    scripture: book-of-mormon
    name: 2 Nephi 26:11
    book: 2 Nephi
    chapter: 26
    verse: 11
    ordinal: 1231
    text: For the Spirit of the Lord will not always strive with man. And when the Spirit ceaseth to strive with man then cometh speedy destruction, and this grieveth my soul.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.12
    scripture: book-of-mormon
    name: 2 Nephi 26:12
    book: 2 Nephi
    chapter: 26
    verse: 12
    ordinal: 1232
    text: And as I spake concerning the convincing of the Jews, that Jesus is the very Christ, it must needs be that the Gentiles be convinced also that Jesus is the Christ, the Eternal God;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.13
    scripture: book-of-mormon
    name: 2 Nephi 26:13
    book: 2 Nephi
    chapter: 26
    verse: 13
    ordinal: 1233
    text: And that he manifesteth himself unto all those who believe in him, by the power of the Holy Ghost; yea, unto every nation, kindred, tongue, and people, working mighty miracles, signs, and wonders, among the children of men according to their faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.14
    scripture: book-of-mormon
    name: 2 Nephi 26:14
    book: 2 Nephi
    chapter: 26
    verse: 14
    ordinal: 1234
    text: But behold, I prophesy unto you concerning the last days; concerning the days when the Lord God shall bring these things forth unto the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.15
    scripture: book-of-mormon
    name: 2 Nephi 26:15
    book: 2 Nephi
    chapter: 26
    verse: 15
    ordinal: 1235
    text: After my seed and the seed of my brethren shall have dwindled in unbelief, and shall have been smitten by the Gentiles; yea, after the Lord God shall have camped against them round about, and shall have laid siege against them with a mount, and raised forts against them; and after they shall have been brought down low in the dust, even that they are not, yet the words of the righteous shall be written, and the prayers of the faithful shall be heard, and all those who have dwindled in unbelief shall not be forgotten.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.16
    scripture: book-of-mormon
    name: 2 Nephi 26:16
    book: 2 Nephi
    chapter: 26
    verse: 16
    ordinal: 1236
    text: For those who shall be destroyed shall speak unto them out of the ground, and their speech shall be low out of the dust, and their voice shall be as one that hath a familiar spirit; for the Lord God will give unto him power, that he may whisper concerning them, even as it were out of the ground; and their speech shall whisper out of the dust.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:4
    kjvOsis:
    - Isa.29.4
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.17
    scripture: book-of-mormon
    name: 2 Nephi 26:17
    book: 2 Nephi
    chapter: 26
    verse: 17
    ordinal: 1237
    text: 'For thus saith the Lord God: They shall write the things which shall be done among them, and they shall be written and sealed up in a book, and those who have dwindled in unbelief shall not have them, for they seek to destroy the things of God.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.18
    scripture: book-of-mormon
    name: 2 Nephi 26:18
    book: 2 Nephi
    chapter: 26
    verse: 18
    ordinal: 1238
    text: 'Wherefore, as those who have been destroyed have been destroyed speedily; and the multitude of their terrible ones shall be as chaff that passeth away—yea, thus saith the Lord God: It shall be at an instant, suddenly—'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:5
    kjvOsis:
    - Isa.29.5
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.19
    scripture: book-of-mormon
    name: 2 Nephi 26:19
    book: 2 Nephi
    chapter: 26
    verse: 19
    ordinal: 1239
    text: And it shall come to pass, that those who have dwindled in unbelief shall be smitten by the hand of the Gentiles.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.20
    scripture: book-of-mormon
    name: 2 Nephi 26:20
    book: 2 Nephi
    chapter: 26
    verse: 20
    ordinal: 1240
    text: And the Gentiles are lifted up in the pride of their eyes, and have stumbled, because of the greatness of their stumbling block, that they have built up many churches; nevertheless, they put down the power and miracles of God, and preach up unto themselves their own wisdom and their own learning, that they may get gain and grind upon the face of the poor.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.21
    scripture: book-of-mormon
    name: 2 Nephi 26:21
    book: 2 Nephi
    chapter: 26
    verse: 21
    ordinal: 1241
    text: And there are many churches built up which cause envyings, and strifes, and malice.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.22
    scripture: book-of-mormon
    name: 2 Nephi 26:22
    book: 2 Nephi
    chapter: 26
    verse: 22
    ordinal: 1242
    text: And there are also secret combinations, even as in times of old, according to the combinations of the devil, for he is the founder of all these things; yea, the founder of murder, and works of darkness; yea, and he leadeth them by the neck with a flaxen cord, until he bindeth them with his strong cords forever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.23
    scripture: book-of-mormon
    name: 2 Nephi 26:23
    book: 2 Nephi
    chapter: 26
    verse: 23
    ordinal: 1243
    text: For behold, my beloved brethren, I say unto you that the Lord God worketh not in darkness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.24
    scripture: book-of-mormon
    name: 2 Nephi 26:24
    book: 2 Nephi
    chapter: 26
    verse: 24
    ordinal: 1244
    text: He doeth not anything save it be for the benefit of the world; for he loveth the world, even that he layeth down his own life that he may draw all men unto him. Wherefore, he commandeth none that they shall not partake of his salvation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.25
    scripture: book-of-mormon
    name: 2 Nephi 26:25
    book: 2 Nephi
    chapter: 26
    verse: 25
    ordinal: 1245
    text: 'Behold, doth he cry unto any, saying: Depart from me? Behold, I say unto you, Nay; but he saith: Come unto me all ye ends of the earth, buy milk and honey, without money and without price.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.26
    scripture: book-of-mormon
    name: 2 Nephi 26:26
    book: 2 Nephi
    chapter: 26
    verse: 26
    ordinal: 1246
    text: Behold, hath he commanded any that they should depart out of the synagogues, or out of the houses of worship? Behold, I say unto you, Nay.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.27
    scripture: book-of-mormon
    name: 2 Nephi 26:27
    book: 2 Nephi
    chapter: 26
    verse: 27
    ordinal: 1247
    text: Hath he commanded any that they should not partake of his salvation? Behold I say unto you, Nay; but he hath given it free for all men; and he hath commanded his people that they should persuade all men to repentance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.28
    scripture: book-of-mormon
    name: 2 Nephi 26:28
    book: 2 Nephi
    chapter: 26
    verse: 28
    ordinal: 1248
    text: Behold, hath the Lord commanded any that they should not partake of his goodness? Behold I say unto you, Nay; but all men are privileged the one like unto the other, and none are forbidden.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.29
    scripture: book-of-mormon
    name: 2 Nephi 26:29
    book: 2 Nephi
    chapter: 26
    verse: 29
    ordinal: 1249
    text: He commandeth that there shall be no priestcrafts; for, behold, priestcrafts are that men preach and set themselves up for a light unto the world, that they may get gain and praise of the world; but they seek not the welfare of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.30
    scripture: book-of-mormon
    name: 2 Nephi 26:30
    book: 2 Nephi
    chapter: 26
    verse: 30
    ordinal: 1250
    text: Behold, the Lord hath forbidden this thing; wherefore, the Lord God hath given a commandment that all men should have charity, which charity is love. And except they should have charity they were nothing. Wherefore, if they should have charity they would not suffer the laborer in Zion to perish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.31
    scripture: book-of-mormon
    name: 2 Nephi 26:31
    book: 2 Nephi
    chapter: 26
    verse: 31
    ordinal: 1251
    text: But the laborer in Zion shall labor for Zion; for if they labor for money they shall perish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.32
    scripture: book-of-mormon
    name: 2 Nephi 26:32
    book: 2 Nephi
    chapter: 26
    verse: 32
    ordinal: 1252
    text: And again, the Lord God hath commanded that men should not murder; that they should not lie; that they should not steal; that they should not take the name of the Lord their God in vain; that they should not envy; that they should not have malice; that they should not contend one with another; that they should not commit whoredoms; and that they should do none of these things; for whoso doeth them shall perish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.26.33
    scripture: book-of-mormon
    name: 2 Nephi 26:33
    book: 2 Nephi
    chapter: 26
    verse: 33
    ordinal: 1253
    text: For none of these iniquities come of the Lord; for he doeth that which is good among the children of men; and he doeth nothing save it be plain unto the children of men; and he inviteth them all to come unto him and partake of his goodness; and he denieth none that come unto him, black and white, bond and free, male and female; and he remembereth the heathen; and all are alike unto God, both Jew and Gentile.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.26
- type: BomVerse
  data:
    ref: 2-nephi.27.1
    scripture: book-of-mormon
    name: 2 Nephi 27:1
    book: 2 Nephi
    chapter: 27
    verse: 1
    ordinal: 1254
    text: But, behold, in the last days, or in the days of the Gentiles—yea, behold all the nations of the Gentiles and also the Jews, both those who shall come upon this land and those who shall be upon other lands, yea, even upon all the lands of the earth, behold, they will be drunken with iniquity and all manner of abominations—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.2
    scripture: book-of-mormon
    name: 2 Nephi 27:2
    book: 2 Nephi
    chapter: 27
    verse: 2
    ordinal: 1255
    text: And when that day shall come they shall be visited of the Lord of Hosts, with thunder and with earthquake, and with a great noise, and with storm, and with tempest, and with the flame of devouring fire.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:6
    kjvOsis:
    - Isa.29.6
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.3
    scripture: book-of-mormon
    name: 2 Nephi 27:3
    book: 2 Nephi
    chapter: 27
    verse: 3
    ordinal: 1256
    text: And all the nations that fight against Zion, and that distress her, shall be as a dream of a night vision; yea, it shall be unto them, even as unto a hungry man which dreameth, and behold he eateth but he awaketh and his soul is empty; or like unto a thirsty man which dreameth, and behold he drinketh but he awaketh and behold he is faint, and his soul hath appetite; yea, even so shall the multitude of all the nations be that fight against Mount Zion.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:8
    kjvOsis:
    - Isa.29.8
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.4
    scripture: book-of-mormon
    name: 2 Nephi 27:4
    book: 2 Nephi
    chapter: 27
    verse: 4
    ordinal: 1257
    text: For behold, all ye that doeth iniquity, stay yourselves and wonder, for ye shall cry out, and cry; yea, ye shall be drunken but not with wine, ye shall stagger but not with strong drink.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:9
    kjvOsis:
    - Isa.29.9
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.5
    scripture: book-of-mormon
    name: 2 Nephi 27:5
    book: 2 Nephi
    chapter: 27
    verse: 5
    ordinal: 1258
    text: For behold, the Lord hath poured out upon you the spirit of deep sleep. For behold, ye have closed your eyes, and ye have rejected the prophets; and your rulers, and the seers hath he covered because of your iniquity.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:10
    kjvOsis:
    - Isa.29.10
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.6
    scripture: book-of-mormon
    name: 2 Nephi 27:6
    book: 2 Nephi
    chapter: 27
    verse: 6
    ordinal: 1259
    text: And it shall come to pass that the Lord God shall bring forth unto you the words of a book, and they shall be the words of them which have slumbered.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.7
    scripture: book-of-mormon
    name: 2 Nephi 27:7
    book: 2 Nephi
    chapter: 27
    verse: 7
    ordinal: 1260
    text: And behold the book shall be sealed; and in the book shall be a revelation from God, from the beginning of the world to the ending thereof.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.8
    scripture: book-of-mormon
    name: 2 Nephi 27:8
    book: 2 Nephi
    chapter: 27
    verse: 8
    ordinal: 1261
    text: Wherefore, because of the things which are sealed up, the things which are sealed shall not be delivered in the day of the wickedness and abominations of the people. Wherefore the book shall be kept from them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.9
    scripture: book-of-mormon
    name: 2 Nephi 27:9
    book: 2 Nephi
    chapter: 27
    verse: 9
    ordinal: 1262
    text: But the book shall be delivered unto a man, and he shall deliver the words of the book, which are the words of those who have slumbered in the dust, and he shall deliver these words unto another;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.10
    scripture: book-of-mormon
    name: 2 Nephi 27:10
    book: 2 Nephi
    chapter: 27
    verse: 10
    ordinal: 1263
    text: But the words which are sealed he shall not deliver, neither shall he deliver the book. For the book shall be sealed by the power of God, and the revelation which was sealed shall be kept in the book until the own due time of the Lord, that they may come forth; for behold, they reveal all things from the foundation of the world unto the end thereof.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.11
    scripture: book-of-mormon
    name: 2 Nephi 27:11
    book: 2 Nephi
    chapter: 27
    verse: 11
    ordinal: 1264
    text: And the day cometh that the words of the book which were sealed shall be read upon the house tops; and they shall be read by the power of Christ; and all things shall be revealed unto the children of men which ever have been among the children of men, and which ever will be even unto the end of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.12
    scripture: book-of-mormon
    name: 2 Nephi 27:12
    book: 2 Nephi
    chapter: 27
    verse: 12
    ordinal: 1265
    text: Wherefore, at that day when the book shall be delivered unto the man of whom I have spoken, the book shall be hid from the eyes of the world, that the eyes of none shall behold it save it be that three witnesses shall behold it, by the power of God, besides him to whom the book shall be delivered; and they shall testify to the truth of the book and the things therein.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.13
    scripture: book-of-mormon
    name: 2 Nephi 27:13
    book: 2 Nephi
    chapter: 27
    verse: 13
    ordinal: 1266
    text: And there is none other which shall view it, save it be a few according to the will of God, to bear testimony of his word unto the children of men; for the Lord God hath said that the words of the faithful should speak as if it were from the dead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.14
    scripture: book-of-mormon
    name: 2 Nephi 27:14
    book: 2 Nephi
    chapter: 27
    verse: 14
    ordinal: 1267
    text: Wherefore, the Lord God will proceed to bring forth the words of the book; and in the mouth of as many witnesses as seemeth him good will he establish his word; and wo be unto him that rejecteth the word of God!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.15
    scripture: book-of-mormon
    name: 2 Nephi 27:15
    book: 2 Nephi
    chapter: 27
    verse: 15
    ordinal: 1268
    text: 'But behold, it shall come to pass that the Lord God shall say unto him to whom he shall deliver the book: Take these words which are not sealed and deliver them to another, that he may show them unto the learned, saying: Read this, I pray thee. And the learned shall say: Bring hither the book, and I will read them.'
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Isaiah 29:11
    kjvAllusionOsis:
    - Isa.29.11
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.16
    scripture: book-of-mormon
    name: 2 Nephi 27:16
    book: 2 Nephi
    chapter: 27
    verse: 16
    ordinal: 1269
    text: And now, because of the glory of the world and to get gain will they say this, and not for the glory of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.17
    scripture: book-of-mormon
    name: 2 Nephi 27:17
    book: 2 Nephi
    chapter: 27
    verse: 17
    ordinal: 1270
    text: 'And the man shall say: I cannot bring the book, for it is sealed.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.18
    scripture: book-of-mormon
    name: 2 Nephi 27:18
    book: 2 Nephi
    chapter: 27
    verse: 18
    ordinal: 1271
    text: 'Then shall the learned say: I cannot read it.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.19
    scripture: book-of-mormon
    name: 2 Nephi 27:19
    book: 2 Nephi
    chapter: 27
    verse: 19
    ordinal: 1272
    text: 'Wherefore it shall come to pass, that the Lord God will deliver again the book and the words thereof to him that is not learned; and the man that is not learned shall say: I am not learned.'
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Isaiah 29:12
    kjvAllusionOsis:
    - Isa.29.12
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.20
    scripture: book-of-mormon
    name: 2 Nephi 27:20
    book: 2 Nephi
    chapter: 27
    verse: 20
    ordinal: 1273
    text: 'Then shall the Lord God say unto him: The learned shall not read them, for they have rejected them, and I am able to do mine own work; wherefore thou shalt read the words which I shall give unto thee.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.21
    scripture: book-of-mormon
    name: 2 Nephi 27:21
    book: 2 Nephi
    chapter: 27
    verse: 21
    ordinal: 1274
    text: Touch not the things which are sealed, for I will bring them forth in mine own due time; for I will show unto the children of men that I am able to do mine own work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.22
    scripture: book-of-mormon
    name: 2 Nephi 27:22
    book: 2 Nephi
    chapter: 27
    verse: 22
    ordinal: 1275
    text: Wherefore, when thou hast read the words which I have commanded thee, and obtained the witnesses which I have promised unto thee, then shalt thou seal up the book again, and hide it up unto me, that I may preserve the words which thou hast not read, until I shall see fit in mine own wisdom to reveal all things unto the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.23
    scripture: book-of-mormon
    name: 2 Nephi 27:23
    book: 2 Nephi
    chapter: 27
    verse: 23
    ordinal: 1276
    text: For behold, I am God; and I am a God of miracles; and I will show unto the world that I am the same yesterday, today, and forever; and I work not among the children of men save it be according to their faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.24
    scripture: book-of-mormon
    name: 2 Nephi 27:24
    book: 2 Nephi
    chapter: 27
    verse: 24
    ordinal: 1277
    text: 'And again it shall come to pass that the Lord shall say unto him that shall read the words that shall be delivered him:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.25
    scripture: book-of-mormon
    name: 2 Nephi 27:25
    book: 2 Nephi
    chapter: 27
    verse: 25
    ordinal: 1278
    text: Forasmuch as this people draw near unto me with their mouth, and with their lips do honor me, but have removed their hearts far from me, and their fear towards me is taught by the precepts of men—
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:13
    kjvOsis:
    - Isa.29.13
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.26
    scripture: book-of-mormon
    name: 2 Nephi 27:26
    book: 2 Nephi
    chapter: 27
    verse: 26
    ordinal: 1279
    text: Therefore, I will proceed to do a marvelous work among this people, yea, a marvelous work and a wonder, for the wisdom of their wise and learned shall perish, and the understanding of their prudent shall be hid.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:14
    kjvOsis:
    - Isa.29.14
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.27
    scripture: book-of-mormon
    name: 2 Nephi 27:27
    book: 2 Nephi
    chapter: 27
    verse: 27
    ordinal: 1280
    text: 'And wo unto them that seek deep to hide their counsel from the Lord! And their works are in the dark; and they say: Who seeth us, and who knoweth us? And they also say: Surely, your turning of things upside down shall be esteemed as the potter''s clay. But behold, I will show unto them, saith the Lord of Hosts, that I know all their works. For shall the work say of him that made it, he made me not? Or shall the thing framed say of him that framed it, he had no understanding?'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:16
    kjvOsis:
    - Isa.29.16
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.28
    scripture: book-of-mormon
    name: 2 Nephi 27:28
    book: 2 Nephi
    chapter: 27
    verse: 28
    ordinal: 1281
    text: 'But behold, saith the Lord of Hosts: I will show unto the children of men that it is yet a very little while and Lebanon shall be turned into a fruitful field; and the fruitful field shall be esteemed as a forest.'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:17
    kjvOsis:
    - Isa.29.17
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.29
    scripture: book-of-mormon
    name: 2 Nephi 27:29
    book: 2 Nephi
    chapter: 27
    verse: 29
    ordinal: 1282
    text: And in that day shall the deaf hear the words of the book, and the eyes of the blind shall see out of obscurity and out of darkness.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:18
    kjvOsis:
    - Isa.29.18
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.30
    scripture: book-of-mormon
    name: 2 Nephi 27:30
    book: 2 Nephi
    chapter: 27
    verse: 30
    ordinal: 1283
    text: And the meek also shall increase, and their joy shall be in the Lord, and the poor among men shall rejoice in the Holy One of Israel.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:19
    kjvOsis:
    - Isa.29.19
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.31
    scripture: book-of-mormon
    name: 2 Nephi 27:31
    book: 2 Nephi
    chapter: 27
    verse: 31
    ordinal: 1284
    text: For assuredly as the Lord liveth they shall see that the terrible one is brought to naught, and the scorner is consumed, and all that watch for iniquity are cut off;
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:20
    kjvOsis:
    - Isa.29.20
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.32
    scripture: book-of-mormon
    name: 2 Nephi 27:32
    book: 2 Nephi
    chapter: 27
    verse: 32
    ordinal: 1285
    text: And they that make a man an offender for a word, and lay a snare for him that reproveth in the gate, and turn aside the just for a thing of naught.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:21
    kjvOsis:
    - Isa.29.21
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.33
    scripture: book-of-mormon
    name: 2 Nephi 27:33
    book: 2 Nephi
    chapter: 27
    verse: 33
    ordinal: 1286
    text: 'Therefore, thus saith the Lord, who redeemed Abraham, concerning the house of Jacob: Jacob shall not now be ashamed, neither shall his face now wax pale.'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:22
    kjvOsis:
    - Isa.29.22
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.34
    scripture: book-of-mormon
    name: 2 Nephi 27:34
    book: 2 Nephi
    chapter: 27
    verse: 34
    ordinal: 1287
    text: But when he seeth his children, the work of my hands, in the midst of him, they shall sanctify my name, and sanctify the Holy One of Jacob, and shall fear the God of Israel.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:23
    kjvOsis:
    - Isa.29.23
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.27.35
    scripture: book-of-mormon
    name: 2 Nephi 27:35
    book: 2 Nephi
    chapter: 27
    verse: 35
    ordinal: 1288
    text: They also that erred in spirit shall come to understanding, and they that murmured shall learn doctrine.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 29:24
    kjvOsis:
    - Isa.29.24
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.27
- type: BomVerse
  data:
    ref: 2-nephi.28.1
    scripture: book-of-mormon
    name: 2 Nephi 28:1
    book: 2 Nephi
    chapter: 28
    verse: 1
    ordinal: 1289
    text: And now, behold, my brethren, I have spoken unto you, according as the Spirit hath constrained me; wherefore, I know that they must surely come to pass.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.2
    scripture: book-of-mormon
    name: 2 Nephi 28:2
    book: 2 Nephi
    chapter: 28
    verse: 2
    ordinal: 1290
    text: And the things which shall be written out of the book shall be of great worth unto the children of men, and especially unto our seed, which is a remnant of the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.3
    scripture: book-of-mormon
    name: 2 Nephi 28:3
    book: 2 Nephi
    chapter: 28
    verse: 3
    ordinal: 1291
    text: 'For it shall come to pass in that day that the churches which are built up, and not unto the Lord, when the one shall say unto the other: Behold, I, I am the Lord''s; and the others shall say: I, I am the Lord''s; and thus shall every one say that hath built up churches, and not unto the Lord—'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.4
    scripture: book-of-mormon
    name: 2 Nephi 28:4
    book: 2 Nephi
    chapter: 28
    verse: 4
    ordinal: 1292
    text: And they shall contend one with another; and their priests shall contend one with another, and they shall teach with their learning, and deny the Holy Ghost, which giveth utterance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.5
    scripture: book-of-mormon
    name: 2 Nephi 28:5
    book: 2 Nephi
    chapter: 28
    verse: 5
    ordinal: 1293
    text: 'And they deny the power of God, the Holy One of Israel; and they say unto the people: Hearken unto us, and hear ye our precept; for behold there is no God today, for the Lord and the Redeemer hath done his work, and he hath given his power unto men;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.6
    scripture: book-of-mormon
    name: 2 Nephi 28:6
    book: 2 Nephi
    chapter: 28
    verse: 6
    ordinal: 1294
    text: Behold, hearken ye unto my precept; if they shall say there is a miracle wrought by the hand of the Lord, believe it not; for this day he is not a God of miracles; he hath done his work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.7
    scripture: book-of-mormon
    name: 2 Nephi 28:7
    book: 2 Nephi
    chapter: 28
    verse: 7
    ordinal: 1295
    text: 'Yea, and there shall be many which shall say: Eat, drink, and be merry, for tomorrow we die; and it shall be well with us.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.8
    scripture: book-of-mormon
    name: 2 Nephi 28:8
    book: 2 Nephi
    chapter: 28
    verse: 8
    ordinal: 1296
    text: 'And there shall also be many which shall say: Eat, drink, and be merry; nevertheless, fear God—he will justify in committing a little sin; yea, lie a little, take the advantage of one because of his words, dig a pit for thy neighbor; there is no harm in this; and do all these things, for tomorrow we die; and if it so be that we are guilty, God will beat us with a few stripes, and at last we shall be saved in the kingdom of God.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.9
    scripture: book-of-mormon
    name: 2 Nephi 28:9
    book: 2 Nephi
    chapter: 28
    verse: 9
    ordinal: 1297
    text: Yea, and there shall be many which shall teach after this manner, false and vain and foolish doctrines, and shall be puffed up in their hearts, and shall seek deep to hide their counsels from the Lord; and their works shall be in the dark.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.10
    scripture: book-of-mormon
    name: 2 Nephi 28:10
    book: 2 Nephi
    chapter: 28
    verse: 10
    ordinal: 1298
    text: And the blood of the saints shall cry from the ground against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.11
    scripture: book-of-mormon
    name: 2 Nephi 28:11
    book: 2 Nephi
    chapter: 28
    verse: 11
    ordinal: 1299
    text: Yea, they have all gone out of the way; they have become corrupted.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.12
    scripture: book-of-mormon
    name: 2 Nephi 28:12
    book: 2 Nephi
    chapter: 28
    verse: 12
    ordinal: 1300
    text: Because of pride, and because of false teachers, and false doctrine, their churches have become corrupted, and their churches are lifted up; because of pride they are puffed up.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.13
    scripture: book-of-mormon
    name: 2 Nephi 28:13
    book: 2 Nephi
    chapter: 28
    verse: 13
    ordinal: 1301
    text: They rob the poor because of their fine sanctuaries; they rob the poor because of their fine clothing; and they persecute the meek and the poor in heart, because in their pride they are puffed up.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.14
    scripture: book-of-mormon
    name: 2 Nephi 28:14
    book: 2 Nephi
    chapter: 28
    verse: 14
    ordinal: 1302
    text: They wear stiff necks and high heads; yea, and because of pride, and wickedness, and abominations, and whoredoms, they have all gone astray save it be a few, who are the humble followers of Christ; nevertheless, they are led, that in many instances they do err because they are taught by the precepts of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.15
    scripture: book-of-mormon
    name: 2 Nephi 28:15
    book: 2 Nephi
    chapter: 28
    verse: 15
    ordinal: 1303
    text: O the wise, and the learned, and the rich, that are puffed up in the pride of their hearts, and all those who preach false doctrines, and all those who commit whoredoms, and pervert the right way of the Lord, wo, wo, wo be unto them, saith the Lord God Almighty, for they shall be thrust down to hell!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.16
    scripture: book-of-mormon
    name: 2 Nephi 28:16
    book: 2 Nephi
    chapter: 28
    verse: 16
    ordinal: 1304
    text: Wo unto them that turn aside the just for a thing of naught and revile against that which is good, and say that it is of no worth! For the day shall come that the Lord God will speedily visit the inhabitants of the earth; and in that day that they are fully ripe in iniquity they shall perish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.17
    scripture: book-of-mormon
    name: 2 Nephi 28:17
    book: 2 Nephi
    chapter: 28
    verse: 17
    ordinal: 1305
    text: But behold, if the inhabitants of the earth shall repent of their wickedness and abominations they shall not be destroyed, saith the Lord of Hosts.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.18
    scripture: book-of-mormon
    name: 2 Nephi 28:18
    book: 2 Nephi
    chapter: 28
    verse: 18
    ordinal: 1306
    text: But behold, that great and abominable church, the whore of all the earth, must tumble to the earth, and great must be the fall thereof.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.19
    scripture: book-of-mormon
    name: 2 Nephi 28:19
    book: 2 Nephi
    chapter: 28
    verse: 19
    ordinal: 1307
    text: For the kingdom of the devil must shake, and they which belong to it must needs be stirred up unto repentance, or the devil will grasp them with his everlasting chains, and they be stirred up to anger, and perish;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.20
    scripture: book-of-mormon
    name: 2 Nephi 28:20
    book: 2 Nephi
    chapter: 28
    verse: 20
    ordinal: 1308
    text: For behold, at that day shall he rage in the hearts of the children of men, and stir them up to anger against that which is good.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.21
    scripture: book-of-mormon
    name: 2 Nephi 28:21
    book: 2 Nephi
    chapter: 28
    verse: 21
    ordinal: 1309
    text: 'And others will he pacify, and lull them away into carnal security, that they will say: All is well in Zion; yea, Zion prospereth, all is well—and thus the devil cheateth their souls, and leadeth them away carefully down to hell.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.22
    scripture: book-of-mormon
    name: 2 Nephi 28:22
    book: 2 Nephi
    chapter: 28
    verse: 22
    ordinal: 1310
    text: 'And behold, others he flattereth away, and telleth them there is no hell; and he saith unto them: I am no devil, for there is none—and thus he whispereth in their ears, until he grasps them with his awful chains, from whence there is no deliverance.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.23
    scripture: book-of-mormon
    name: 2 Nephi 28:23
    book: 2 Nephi
    chapter: 28
    verse: 23
    ordinal: 1311
    text: Yea, they are grasped with death, and hell; and death, and hell, and the devil, and all that have been seized therewith must stand before the throne of God, and be judged according to their works, from whence they must go into the place prepared for them, even a lake of fire and brimstone, which is endless torment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.24
    scripture: book-of-mormon
    name: 2 Nephi 28:24
    book: 2 Nephi
    chapter: 28
    verse: 24
    ordinal: 1312
    text: Therefore, wo be unto him that is at ease in Zion!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.25
    scripture: book-of-mormon
    name: 2 Nephi 28:25
    book: 2 Nephi
    chapter: 28
    verse: 25
    ordinal: 1313
    text: 'Wo be unto him that crieth: All is well!'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.26
    scripture: book-of-mormon
    name: 2 Nephi 28:26
    book: 2 Nephi
    chapter: 28
    verse: 26
    ordinal: 1314
    text: Yea, wo be unto him that hearkeneth unto the precepts of men, and denieth the power of God, and the gift of the Holy Ghost!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.27
    scripture: book-of-mormon
    name: 2 Nephi 28:27
    book: 2 Nephi
    chapter: 28
    verse: 27
    ordinal: 1315
    text: 'Yea, wo be unto him that saith: We have received, and we need no more!'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.28
    scripture: book-of-mormon
    name: 2 Nephi 28:28
    book: 2 Nephi
    chapter: 28
    verse: 28
    ordinal: 1316
    text: And in fine, wo unto all those who tremble, and are angry because of the truth of God! For behold, he that is built upon the rock receiveth it with gladness; and he that is built upon a sandy foundation trembleth lest he shall fall.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.29
    scripture: book-of-mormon
    name: 2 Nephi 28:29
    book: 2 Nephi
    chapter: 28
    verse: 29
    ordinal: 1317
    text: 'Wo be unto him that shall say: We have received the word of God, and we need no more of the word of God, for we have enough!'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.30
    scripture: book-of-mormon
    name: 2 Nephi 28:30
    book: 2 Nephi
    chapter: 28
    verse: 30
    ordinal: 1318
    text: 'For behold, thus saith the Lord God: I will give unto the children of men line upon line, precept upon precept, here a little and there a little; and blessed are those who hearken unto my precepts, and lend an ear unto my counsel, for they shall learn wisdom; for unto him that receiveth I will give more; and from them that shall say, We have enough, from them shall be taken away even that which they have.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.31
    scripture: book-of-mormon
    name: 2 Nephi 28:31
    book: 2 Nephi
    chapter: 28
    verse: 31
    ordinal: 1319
    text: Cursed is he that putteth his trust in man, or maketh flesh his arm, or shall hearken unto the precepts of men, save their precepts shall be given by the power of the Holy Ghost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.28.32
    scripture: book-of-mormon
    name: 2 Nephi 28:32
    book: 2 Nephi
    chapter: 28
    verse: 32
    ordinal: 1320
    text: Wo be unto the Gentiles, saith the Lord God of Hosts! For notwithstanding I shall lengthen out mine arm unto them from day to day, they will deny me; nevertheless, I will be merciful unto them, saith the Lord God, if they will repent and come unto me; for mine arm is lengthened out all the day long, saith the Lord God of Hosts.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.28
- type: BomVerse
  data:
    ref: 2-nephi.29.1
    scripture: book-of-mormon
    name: 2 Nephi 29:1
    book: 2 Nephi
    chapter: 29
    verse: 1
    ordinal: 1321
    text: But behold, there shall be many—at that day when I shall proceed to do a marvelous work among them, that I may remember my covenants which I have made unto the children of men, that I may set my hand again the second time to recover my people, which are of the house of Israel;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.29.2
    scripture: book-of-mormon
    name: 2 Nephi 29:2
    book: 2 Nephi
    chapter: 29
    verse: 2
    ordinal: 1322
    text: And also, that I may remember the promises which I have made unto thee, Nephi, and also unto thy father, that I would remember your seed; and that the words of your seed should proceed forth out of my mouth unto your seed; and my words shall hiss forth unto the ends of the earth, for a standard unto my people, which are of the house of Israel;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.29.3
    scripture: book-of-mormon
    name: 2 Nephi 29:3
    book: 2 Nephi
    chapter: 29
    verse: 3
    ordinal: 1323
    text: 'And because my words shall hiss forth—many of the Gentiles shall say: A Bible! A Bible! We have got a Bible, and there cannot be any more Bible.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.29.4
    scripture: book-of-mormon
    name: 2 Nephi 29:4
    book: 2 Nephi
    chapter: 29
    verse: 4
    ordinal: 1324
    text: 'But thus saith the Lord God: O fools, they shall have a Bible; and it shall proceed forth from the Jews, mine ancient covenant people. And what thank they the Jews for the Bible which they receive from them? Yea, what do the Gentiles mean? Do they remember the travails, and the labors, and the pains of the Jews, and their diligence unto me, in bringing forth salvation unto the Gentiles?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.29.5
    scripture: book-of-mormon
    name: 2 Nephi 29:5
    book: 2 Nephi
    chapter: 29
    verse: 5
    ordinal: 1325
    text: O ye Gentiles, have ye remembered the Jews, mine ancient covenant people? Nay; but ye have cursed them, and have hated them, and have not sought to recover them. But behold, I will return all these things upon your own heads; for I the Lord have not forgotten my people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.29.6
    scripture: book-of-mormon
    name: 2 Nephi 29:6
    book: 2 Nephi
    chapter: 29
    verse: 6
    ordinal: 1326
    text: 'Thou fool, that shall say: A Bible, we have got a Bible, and we need no more Bible. Have ye obtained a Bible save it were by the Jews?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.29.7
    scripture: book-of-mormon
    name: 2 Nephi 29:7
    book: 2 Nephi
    chapter: 29
    verse: 7
    ordinal: 1327
    text: Know ye not that there are more nations than one? Know ye not that I, the Lord your God, have created all men, and that I remember those who are upon the isles of the sea; and that I rule in the heavens above and in the earth beneath; and I bring forth my word unto the children of men, yea, even upon all the nations of the earth?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.29.8
    scripture: book-of-mormon
    name: 2 Nephi 29:8
    book: 2 Nephi
    chapter: 29
    verse: 8
    ordinal: 1328
    text: Wherefore murmur ye, because that ye shall receive more of my word? Know ye not that the testimony of two nations is a witness unto you that I am God, that I remember one nation like unto another? Wherefore, I speak the same words unto one nation like unto another. And when the two nations shall run together the testimony of the two nations shall run together also.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.29.9
    scripture: book-of-mormon
    name: 2 Nephi 29:9
    book: 2 Nephi
    chapter: 29
    verse: 9
    ordinal: 1329
    text: And I do this that I may prove unto many that I am the same yesterday, today, and forever; and that I speak forth my words according to mine own pleasure. And because that I have spoken one word ye need not suppose that I cannot speak another; for my work is not yet finished; neither shall it be until the end of man, neither from that time henceforth and forever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.29.10
    scripture: book-of-mormon
    name: 2 Nephi 29:10
    book: 2 Nephi
    chapter: 29
    verse: 10
    ordinal: 1330
    text: Wherefore, because that ye have a Bible ye need not suppose that it contains all my words; neither need ye suppose that I have not caused more to be written.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.29.11
    scripture: book-of-mormon
    name: 2 Nephi 29:11
    book: 2 Nephi
    chapter: 29
    verse: 11
    ordinal: 1331
    text: For I command all men, both in the east and in the west, and in the north, and in the south, and in the islands of the sea, that they shall write the words which I speak unto them; for out of the books which shall be written I will judge the world, every man according to their works, according to that which is written.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.29.12
    scripture: book-of-mormon
    name: 2 Nephi 29:12
    book: 2 Nephi
    chapter: 29
    verse: 12
    ordinal: 1332
    text: For behold, I shall speak unto the Jews and they shall write it; and I shall also speak unto the Nephites and they shall write it; and I shall also speak unto the other tribes of the house of Israel, which I have led away, and they shall write it; and I shall also speak unto all nations of the earth and they shall write it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.29.13
    scripture: book-of-mormon
    name: 2 Nephi 29:13
    book: 2 Nephi
    chapter: 29
    verse: 13
    ordinal: 1333
    text: And it shall come to pass that the Jews shall have the words of the Nephites, and the Nephites shall have the words of the Jews; and the Nephites and the Jews shall have the words of the lost tribes of Israel; and the lost tribes of Israel shall have the words of the Nephites and the Jews.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.29.14
    scripture: book-of-mormon
    name: 2 Nephi 29:14
    book: 2 Nephi
    chapter: 29
    verse: 14
    ordinal: 1334
    text: And it shall come to pass that my people, which are of the house of Israel, shall be gathered home unto the lands of their possessions; and my word also shall be gathered in one. And I will show unto them that fight against my word and against my people, who are of the house of Israel, that I am God, and that I covenanted with Abraham that I would remember his seed forever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.29
- type: BomVerse
  data:
    ref: 2-nephi.30.1
    scripture: book-of-mormon
    name: 2 Nephi 30:1
    book: 2 Nephi
    chapter: 30
    verse: 1
    ordinal: 1335
    text: And now behold, my beloved brethren, I would speak unto you; for I, Nephi, would not suffer that ye should suppose that ye are more righteous than the Gentiles shall be. For behold, except ye shall keep the commandments of God ye shall all likewise perish; and because of the words which have been spoken ye need not suppose that the Gentiles are utterly destroyed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.2
    scripture: book-of-mormon
    name: 2 Nephi 30:2
    book: 2 Nephi
    chapter: 30
    verse: 2
    ordinal: 1336
    text: For behold, I say unto you that as many of the Gentiles as will repent are the covenant people of the Lord; and as many of the Jews as will not repent shall be cast off; for the Lord covenanteth with none save it be with them that repent and believe in his Son, who is the Holy One of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.3
    scripture: book-of-mormon
    name: 2 Nephi 30:3
    book: 2 Nephi
    chapter: 30
    verse: 3
    ordinal: 1337
    text: And now, I would prophesy somewhat more concerning the Jews and the Gentiles. For after the book of which I have spoken shall come forth, and be written unto the Gentiles, and sealed up again unto the Lord, there shall be many which shall believe the words which are written; and they shall carry them forth unto the remnant of our seed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.4
    scripture: book-of-mormon
    name: 2 Nephi 30:4
    book: 2 Nephi
    chapter: 30
    verse: 4
    ordinal: 1338
    text: And then shall the remnant of our seed know concerning us, how that we came out from Jerusalem, and that they are descendants of the Jews.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.5
    scripture: book-of-mormon
    name: 2 Nephi 30:5
    book: 2 Nephi
    chapter: 30
    verse: 5
    ordinal: 1339
    text: And the gospel of Jesus Christ shall be declared among them; wherefore, they shall be restored unto the knowledge of their fathers, and also to the knowledge of Jesus Christ, which was had among their fathers.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.6
    scripture: book-of-mormon
    name: 2 Nephi 30:6
    book: 2 Nephi
    chapter: 30
    verse: 6
    ordinal: 1340
    text: And then shall they rejoice; for they shall know that it is a blessing unto them from the hand of God; and their scales of darkness shall begin to fall from their eyes; and many generations shall not pass away among them, save they shall be a pure and a delightsome people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.7
    scripture: book-of-mormon
    name: 2 Nephi 30:7
    book: 2 Nephi
    chapter: 30
    verse: 7
    ordinal: 1341
    text: And it shall come to pass that the Jews which are scattered also shall begin to believe in Christ; and they shall begin to gather in upon the face of the land; and as many as shall believe in Christ shall also become a delightsome people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.8
    scripture: book-of-mormon
    name: 2 Nephi 30:8
    book: 2 Nephi
    chapter: 30
    verse: 8
    ordinal: 1342
    text: And it shall come to pass that the Lord God shall commence his work among all nations, kindreds, tongues, and people, to bring about the restoration of his people upon the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.9
    scripture: book-of-mormon
    name: 2 Nephi 30:9
    book: 2 Nephi
    chapter: 30
    verse: 9
    ordinal: 1343
    text: And with righteousness shall the Lord God judge the poor, and reprove with equity for the meek of the earth. And he shall smite the earth with the rod of his mouth; and with the breath of his lips shall he slay the wicked.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 11:4
    kjvOsis:
    - Isa.11.4
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.10
    scripture: book-of-mormon
    name: 2 Nephi 30:10
    book: 2 Nephi
    chapter: 30
    verse: 10
    ordinal: 1344
    text: For the time speedily cometh that the Lord God shall cause a great division among the people, and the wicked will he destroy; and he will spare his people, yea, even if it so be that he must destroy the wicked by fire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.11
    scripture: book-of-mormon
    name: 2 Nephi 30:11
    book: 2 Nephi
    chapter: 30
    verse: 11
    ordinal: 1345
    text: And righteousness shall be the girdle of his loins, and faithfulness the girdle of his reins.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 11:5
    kjvOsis:
    - Isa.11.5
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.12
    scripture: book-of-mormon
    name: 2 Nephi 30:12
    book: 2 Nephi
    chapter: 30
    verse: 12
    ordinal: 1346
    text: And then shall the wolf dwell with the lamb; and the leopard shall lie down with the kid, and the calf, and the young lion, and the fatling, together; and a little child shall lead them.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 11:6
    kjvOsis:
    - Isa.11.6
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.13
    scripture: book-of-mormon
    name: 2 Nephi 30:13
    book: 2 Nephi
    chapter: 30
    verse: 13
    ordinal: 1347
    text: And the cow and the bear shall feed; their young ones shall lie down together; and the lion shall eat straw like the ox.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 11:7
    kjvOsis:
    - Isa.11.7
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.14
    scripture: book-of-mormon
    name: 2 Nephi 30:14
    book: 2 Nephi
    chapter: 30
    verse: 14
    ordinal: 1348
    text: And the sucking child shall play on the hole of the asp, and the weaned child shall put his hand on the cockatrice's den.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 11:8
    kjvOsis:
    - Isa.11.8
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.15
    scripture: book-of-mormon
    name: 2 Nephi 30:15
    book: 2 Nephi
    chapter: 30
    verse: 15
    ordinal: 1349
    text: They shall not hurt nor destroy in all my holy mountain; for the earth shall be full of the knowledge of the Lord as the waters cover the sea.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 11:9
    kjvOsis:
    - Isa.11.9
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.16
    scripture: book-of-mormon
    name: 2 Nephi 30:16
    book: 2 Nephi
    chapter: 30
    verse: 16
    ordinal: 1350
    text: Wherefore, the things of all nations shall be made known; yea, all things shall be made known unto the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.17
    scripture: book-of-mormon
    name: 2 Nephi 30:17
    book: 2 Nephi
    chapter: 30
    verse: 17
    ordinal: 1351
    text: There is nothing which is secret save it shall be revealed; there is no work of darkness save it shall be made manifest in the light; and there is nothing which is sealed upon the earth save it shall be loosed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.30.18
    scripture: book-of-mormon
    name: 2 Nephi 30:18
    book: 2 Nephi
    chapter: 30
    verse: 18
    ordinal: 1352
    text: Wherefore, all things which have been revealed unto the children of men shall at that day be revealed; and Satan shall have power over the hearts of the children of men no more, for a long time. And now, my beloved brethren, I make an end of my sayings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.30
- type: BomVerse
  data:
    ref: 2-nephi.31.1
    scripture: book-of-mormon
    name: 2 Nephi 31:1
    book: 2 Nephi
    chapter: 31
    verse: 1
    ordinal: 1353
    text: And now I, Nephi, make an end of my prophesying unto you, my beloved brethren. And I cannot write but a few things, which I know must surely come to pass; neither can I write but a few of the words of my brother Jacob.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.2
    scripture: book-of-mormon
    name: 2 Nephi 31:2
    book: 2 Nephi
    chapter: 31
    verse: 2
    ordinal: 1354
    text: Wherefore, the things which I have written sufficeth me, save it be a few words which I must speak concerning the doctrine of Christ; wherefore, I shall speak unto you plainly, according to the plainness of my prophesying.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.3
    scripture: book-of-mormon
    name: 2 Nephi 31:3
    book: 2 Nephi
    chapter: 31
    verse: 3
    ordinal: 1355
    text: For my soul delighteth in plainness; for after this manner doth the Lord God work among the children of men. For the Lord God giveth light unto the understanding; for he speaketh unto men according to their language, unto their understanding.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.4
    scripture: book-of-mormon
    name: 2 Nephi 31:4
    book: 2 Nephi
    chapter: 31
    verse: 4
    ordinal: 1356
    text: Wherefore, I would that ye should remember that I have spoken unto you concerning that prophet which the Lord showed unto me, that should baptize the Lamb of God, which should take away the sins of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.5
    scripture: book-of-mormon
    name: 2 Nephi 31:5
    book: 2 Nephi
    chapter: 31
    verse: 5
    ordinal: 1357
    text: And now, if the Lamb of God, he being holy, should have need to be baptized by water, to fulfil all righteousness, O then, how much more need have we, being unholy, to be baptized, yea, even by water!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.6
    scripture: book-of-mormon
    name: 2 Nephi 31:6
    book: 2 Nephi
    chapter: 31
    verse: 6
    ordinal: 1358
    text: And now, I would ask of you, my beloved brethren, wherein the Lamb of God did fulfil all righteousness in being baptized by water?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.7
    scripture: book-of-mormon
    name: 2 Nephi 31:7
    book: 2 Nephi
    chapter: 31
    verse: 7
    ordinal: 1359
    text: Know ye not that he was holy? But notwithstanding he being holy, he showeth unto the children of men that, according to the flesh he humbleth himself before the Father, and witnesseth unto the Father that he would be obedient unto him in keeping his commandments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.8
    scripture: book-of-mormon
    name: 2 Nephi 31:8
    book: 2 Nephi
    chapter: 31
    verse: 8
    ordinal: 1360
    text: Wherefore, after he was baptized with water the Holy Ghost descended upon him in the form of a dove.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.9
    scripture: book-of-mormon
    name: 2 Nephi 31:9
    book: 2 Nephi
    chapter: 31
    verse: 9
    ordinal: 1361
    text: And again, it showeth unto the children of men the straitness of the path, and the narrowness of the gate, by which they should enter, he having set the example before them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.10
    scripture: book-of-mormon
    name: 2 Nephi 31:10
    book: 2 Nephi
    chapter: 31
    verse: 10
    ordinal: 1362
    text: 'And he said unto the children of men: Follow thou me. Wherefore, my beloved brethren, can we follow Jesus save we shall be willing to keep the commandments of the Father?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.11
    scripture: book-of-mormon
    name: 2 Nephi 31:11
    book: 2 Nephi
    chapter: 31
    verse: 11
    ordinal: 1363
    text: 'And the Father said: Repent ye, repent ye, and be baptized in the name of my Beloved Son.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.12
    scripture: book-of-mormon
    name: 2 Nephi 31:12
    book: 2 Nephi
    chapter: 31
    verse: 12
    ordinal: 1364
    text: 'And also, the voice of the Son came unto me, saying: He that is baptized in my name, to him will the Father give the Holy Ghost, like unto me; wherefore, follow me, and do the things which ye have seen me do.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.13
    scripture: book-of-mormon
    name: 2 Nephi 31:13
    book: 2 Nephi
    chapter: 31
    verse: 13
    ordinal: 1365
    text: Wherefore, my beloved brethren, I know that if ye shall follow the Son, with full purpose of heart, acting no hypocrisy and no deception before God, but with real intent, repenting of your sins, witnessing unto the Father that ye are willing to take upon you the name of Christ, by baptism—yea, by following your Lord and your Savior down into the water, according to his word, behold, then shall ye receive the Holy Ghost; yea, then cometh the baptism of fire and of the Holy Ghost; and then can ye speak with the tongue of angels, and shout praises unto the Holy One of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.14
    scripture: book-of-mormon
    name: 2 Nephi 31:14
    book: 2 Nephi
    chapter: 31
    verse: 14
    ordinal: 1366
    text: 'But, behold, my beloved brethren, thus came the voice of the Son unto me, saying: After ye have repented of your sins, and witnessed unto the Father that ye are willing to keep my commandments, by the baptism of water, and have received the baptism of fire and of the Holy Ghost, and can speak with a new tongue, yea, even with the tongue of angels, and after this should deny me, it would have been better for you that ye had not known me.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.15
    scripture: book-of-mormon
    name: 2 Nephi 31:15
    book: 2 Nephi
    chapter: 31
    verse: 15
    ordinal: 1367
    text: 'And I heard a voice from the Father, saying: Yea, the words of my Beloved are true and faithful. He that endureth to the end, the same shall be saved.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.16
    scripture: book-of-mormon
    name: 2 Nephi 31:16
    book: 2 Nephi
    chapter: 31
    verse: 16
    ordinal: 1368
    text: And now, my beloved brethren, I know by this that unless a man shall endure to the end, in following the example of the Son of the living God, he cannot be saved.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.17
    scripture: book-of-mormon
    name: 2 Nephi 31:17
    book: 2 Nephi
    chapter: 31
    verse: 17
    ordinal: 1369
    text: Wherefore, do the things which I have told you I have seen that your Lord and your Redeemer should do; for, for this cause have they been shown unto me, that ye might know the gate by which ye should enter. For the gate by which ye should enter is repentance and baptism by water; and then cometh a remission of your sins by fire and by the Holy Ghost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.18
    scripture: book-of-mormon
    name: 2 Nephi 31:18
    book: 2 Nephi
    chapter: 31
    verse: 18
    ordinal: 1370
    text: And then are ye in this strait and narrow path which leads to eternal life; yea, ye have entered in by the gate; ye have done according to the commandments of the Father and the Son; and ye have received the Holy Ghost, which witnesses of the Father and the Son, unto the fulfilling of the promise which he hath made, that if ye entered in by the way ye should receive.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.19
    scripture: book-of-mormon
    name: 2 Nephi 31:19
    book: 2 Nephi
    chapter: 31
    verse: 19
    ordinal: 1371
    text: And now, my beloved brethren, after ye have gotten into this strait and narrow path, I would ask if all is done? Behold, I say unto you, Nay; for ye have not come thus far save it were by the word of Christ with unshaken faith in him, relying wholly upon the merits of him who is mighty to save.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.20
    scripture: book-of-mormon
    name: 2 Nephi 31:20
    book: 2 Nephi
    chapter: 31
    verse: 20
    ordinal: 1372
    text: 'Wherefore, ye must press forward with a steadfastness in Christ, having a perfect brightness of hope, and a love of God and of all men. Wherefore, if ye shall press forward, feasting upon the word of Christ, and endure to the end, behold, thus saith the Father: Ye shall have eternal life.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.31.21
    scripture: book-of-mormon
    name: 2 Nephi 31:21
    book: 2 Nephi
    chapter: 31
    verse: 21
    ordinal: 1373
    text: And now, behold, my beloved brethren, this is the way; and there is none other way nor name given under heaven whereby man can be saved in the kingdom of God. And now, behold, this is the doctrine of Christ, and the only and true doctrine of the Father, and of the Son, and of the Holy Ghost, which is one God, without end. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.31
- type: BomVerse
  data:
    ref: 2-nephi.32.1
    scripture: book-of-mormon
    name: 2 Nephi 32:1
    book: 2 Nephi
    chapter: 32
    verse: 1
    ordinal: 1374
    text: And now, behold, my beloved brethren, I suppose that ye ponder somewhat in your hearts concerning that which ye should do after ye have entered in by the way. But, behold, why do ye ponder these things in your hearts?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.32
- type: BomVerse
  data:
    ref: 2-nephi.32.2
    scripture: book-of-mormon
    name: 2 Nephi 32:2
    book: 2 Nephi
    chapter: 32
    verse: 2
    ordinal: 1375
    text: Do ye not remember that I said unto you that after ye had received the Holy Ghost ye could speak with the tongue of angels? And now, how could ye speak with the tongue of angels save it were by the Holy Ghost?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.32
- type: BomVerse
  data:
    ref: 2-nephi.32.3
    scripture: book-of-mormon
    name: 2 Nephi 32:3
    book: 2 Nephi
    chapter: 32
    verse: 3
    ordinal: 1376
    text: Angels speak by the power of the Holy Ghost; wherefore, they speak the words of Christ. Wherefore, I said unto you, feast upon the words of Christ; for behold, the words of Christ will tell you all things what ye should do.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.32
- type: BomVerse
  data:
    ref: 2-nephi.32.4
    scripture: book-of-mormon
    name: 2 Nephi 32:4
    book: 2 Nephi
    chapter: 32
    verse: 4
    ordinal: 1377
    text: Wherefore, now after I have spoken these words, if ye cannot understand them it will be because ye ask not, neither do ye knock; wherefore, ye are not brought into the light, but must perish in the dark.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.32
- type: BomVerse
  data:
    ref: 2-nephi.32.5
    scripture: book-of-mormon
    name: 2 Nephi 32:5
    book: 2 Nephi
    chapter: 32
    verse: 5
    ordinal: 1378
    text: For behold, again I say unto you that if ye will enter in by the way, and receive the Holy Ghost, it will show unto you all things what ye should do.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.32
- type: BomVerse
  data:
    ref: 2-nephi.32.6
    scripture: book-of-mormon
    name: 2 Nephi 32:6
    book: 2 Nephi
    chapter: 32
    verse: 6
    ordinal: 1379
    text: Behold, this is the doctrine of Christ, and there will be no more doctrine given until after he shall manifest himself unto you in the flesh. And when he shall manifest himself unto you in the flesh, the things which he shall say unto you shall ye observe to do.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.32
- type: BomVerse
  data:
    ref: 2-nephi.32.7
    scripture: book-of-mormon
    name: 2 Nephi 32:7
    book: 2 Nephi
    chapter: 32
    verse: 7
    ordinal: 1380
    text: And now I, Nephi, cannot say more; the Spirit stoppeth mine utterance, and I am left to mourn because of the unbelief, and the wickedness, and the ignorance, and the stiffneckedness of men; for they will not search knowledge, nor understand great knowledge, when it is given unto them in plainness, even as plain as word can be.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.32
- type: BomVerse
  data:
    ref: 2-nephi.32.8
    scripture: book-of-mormon
    name: 2 Nephi 32:8
    book: 2 Nephi
    chapter: 32
    verse: 8
    ordinal: 1381
    text: And now, my beloved brethren, I perceive that ye ponder still in your hearts; and it grieveth me that I must speak concerning this thing. For if ye would hearken unto the Spirit which teacheth a man to pray, ye would know that ye must pray; for the evil spirit teacheth not a man to pray, but teacheth him that he must not pray.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.32
- type: BomVerse
  data:
    ref: 2-nephi.32.9
    scripture: book-of-mormon
    name: 2 Nephi 32:9
    book: 2 Nephi
    chapter: 32
    verse: 9
    ordinal: 1382
    text: But behold, I say unto you that ye must pray always, and not faint; that ye must not perform any thing unto the Lord save in the first place ye shall pray unto the Father in the name of Christ, that he will consecrate thy performance unto thee, that thy performance may be for the welfare of thy soul.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.32
- type: BomVerse
  data:
    ref: 2-nephi.33.1
    scripture: book-of-mormon
    name: 2 Nephi 33:1
    book: 2 Nephi
    chapter: 33
    verse: 1
    ordinal: 1383
    text: And now I, Nephi, cannot write all the things which were taught among my people; neither am I mighty in writing, like unto speaking; for when a man speaketh by the power of the Holy Ghost the power of the Holy Ghost carrieth it unto the hearts of the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.2
    scripture: book-of-mormon
    name: 2 Nephi 33:2
    book: 2 Nephi
    chapter: 33
    verse: 2
    ordinal: 1384
    text: But behold, there are many that harden their hearts against the Holy Spirit, that it hath no place in them; wherefore, they cast many things away which are written and esteem them as things of naught.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.3
    scripture: book-of-mormon
    name: 2 Nephi 33:3
    book: 2 Nephi
    chapter: 33
    verse: 3
    ordinal: 1385
    text: But I, Nephi, have written what I have written, and I esteem it as of great worth, and especially unto my people. For I pray continually for them by day, and mine eyes water my pillow by night, because of them; and I cry unto my God in faith, and I know that he will hear my cry.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.4
    scripture: book-of-mormon
    name: 2 Nephi 33:4
    book: 2 Nephi
    chapter: 33
    verse: 4
    ordinal: 1386
    text: And I know that the Lord God will consecrate my prayers for the gain of my people. And the words which I have written in weakness will be made strong unto them; for it persuadeth them to do good; it maketh known unto them of their fathers; and it speaketh of Jesus, and persuadeth them to believe in him, and to endure to the end, which is life eternal.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.5
    scripture: book-of-mormon
    name: 2 Nephi 33:5
    book: 2 Nephi
    chapter: 33
    verse: 5
    ordinal: 1387
    text: And it speaketh harshly against sin, according to the plainness of the truth; wherefore, no man will be angry at the words which I have written save he shall be of the spirit of the devil.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.6
    scripture: book-of-mormon
    name: 2 Nephi 33:6
    book: 2 Nephi
    chapter: 33
    verse: 6
    ordinal: 1388
    text: I glory in plainness; I glory in truth; I glory in my Jesus, for he hath redeemed my soul from hell.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.7
    scripture: book-of-mormon
    name: 2 Nephi 33:7
    book: 2 Nephi
    chapter: 33
    verse: 7
    ordinal: 1389
    text: I have charity for my people, and great faith in Christ that I shall meet many souls spotless at his judgment-seat.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.8
    scripture: book-of-mormon
    name: 2 Nephi 33:8
    book: 2 Nephi
    chapter: 33
    verse: 8
    ordinal: 1390
    text: I have charity for the Jew—I say Jew, because I mean them from whence I came.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.9
    scripture: book-of-mormon
    name: 2 Nephi 33:9
    book: 2 Nephi
    chapter: 33
    verse: 9
    ordinal: 1391
    text: I also have charity for the Gentiles. But behold, for none of these can I hope except they shall be reconciled unto Christ, and enter into the narrow gate, and walk in the strait path which leads to life, and continue in the path until the end of the day of probation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.10
    scripture: book-of-mormon
    name: 2 Nephi 33:10
    book: 2 Nephi
    chapter: 33
    verse: 10
    ordinal: 1392
    text: And now, my beloved brethren, and also Jew, and all ye ends of the earth, hearken unto these words and believe in Christ; and if ye believe not in these words believe in Christ. And if ye shall believe in Christ ye will believe in these words, for they are the words of Christ, and he hath given them unto me; and they teach all men that they should do good.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.11
    scripture: book-of-mormon
    name: 2 Nephi 33:11
    book: 2 Nephi
    chapter: 33
    verse: 11
    ordinal: 1393
    text: And if they are not the words of Christ, judge ye—for Christ will show unto you, with power and great glory, that they are his words, at the last day; and you and I shall stand face to face before his bar; and ye shall know that I have been commanded of him to write these things, notwithstanding my weakness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.12
    scripture: book-of-mormon
    name: 2 Nephi 33:12
    book: 2 Nephi
    chapter: 33
    verse: 12
    ordinal: 1394
    text: And I pray the Father in the name of Christ that many of us, if not all, may be saved in his kingdom at that great and last day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.13
    scripture: book-of-mormon
    name: 2 Nephi 33:13
    book: 2 Nephi
    chapter: 33
    verse: 13
    ordinal: 1395
    text: 'And now, my beloved brethren, all those who are of the house of Israel, and all ye ends of the earth, I speak unto you as the voice of one crying from the dust: Farewell until that great day shall come.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.14
    scripture: book-of-mormon
    name: 2 Nephi 33:14
    book: 2 Nephi
    chapter: 33
    verse: 14
    ordinal: 1396
    text: And you that will not partake of the goodness of God, and respect the words of the Jews, and also my words, and the words which shall proceed forth out of the mouth of the Lamb of God, behold, I bid you an everlasting farewell, for these words shall condemn you at the last day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
- type: BomVerse
  data:
    ref: 2-nephi.33.15
    scripture: book-of-mormon
    name: 2 Nephi 33:15
    book: 2 Nephi
    chapter: 33
    verse: 15
    ordinal: 1397
    text: For what I seal on earth, shall be brought against you at the judgment bar; for thus hath the Lord commanded me, and I must obey. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.33
