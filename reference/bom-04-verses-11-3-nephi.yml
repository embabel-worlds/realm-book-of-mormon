    scripture: book-of-mormon
    name: 3 Nephi 22:9
    book: 3 Nephi
    chapter: 22
    verse: 9
    ordinal: 5581
    text: For this, the waters of Noah unto me, for as I have sworn that the waters of Noah should no more go over the earth, so have I sworn that I would not be wroth with thee.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 54:9
    kjvOsis:
    - Isa.54.9
  relations:
  - predicate: IN
    to:
