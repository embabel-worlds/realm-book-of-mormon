- type: BomVerse
  data:
    ref: ether.1.42
    scripture: book-of-mormon
    name: Ether 1:42
    book: Ether
    chapter: 1
    verse: 42
    ordinal: 6050
    text: And when thou hast done this thou shalt go at the head of them down into the valley which is northward. And there will I meet thee, and I will go before thee into a land which is choice above all the lands of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.1
- type: BomVerse
  data:
    ref: ether.1.43
    scripture: book-of-mormon
    name: Ether 1:43
    book: Ether
    chapter: 1
    verse: 43
    ordinal: 6051
    text: And there will I bless thee and thy seed, and raise up unto me of thy seed, and of the seed of thy brother, and they who shall go with thee, a great nation. And there shall be none greater than the nation which I will raise up unto me of thy seed, upon all the face of the earth. And thus I will do unto thee because this long time ye have cried unto me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.1
- type: BomVerse
  data:
    ref: ether.2.1
    scripture: book-of-mormon
    name: Ether 2:1
    book: Ether
    chapter: 2
    verse: 1
    ordinal: 6052
    text: And it came to pass that Jared and his brother, and their families, and also the friends of Jared and his brother and their families, went down into the valley which was northward, (and the name of the valley was Nimrod, being called after the mighty hunter) with their flocks which they had gathered together, male and female, of every kind.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.2
    scripture: book-of-mormon
    name: Ether 2:2
    book: Ether
    chapter: 2
    verse: 2
    ordinal: 6053
    text: And they did also lay snares and catch fowls of the air; and they did also prepare a vessel, in which they did carry with them the fish of the waters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.3
    scripture: book-of-mormon
    name: Ether 2:3
    book: Ether
    chapter: 2
    verse: 3
    ordinal: 6054
    text: And they did also carry with them deseret, which, by interpretation, is a honey bee; and thus they did carry with them swarms of bees, and all manner of that which was upon the face of the land, seeds of every kind.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.4
    scripture: book-of-mormon
    name: Ether 2:4
    book: Ether
    chapter: 2
    verse: 4
    ordinal: 6055
    text: And it came to pass that when they had come down into the valley of Nimrod the Lord came down and talked with the brother of Jared; and he was in a cloud, and the brother of Jared saw him not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.5
    scripture: book-of-mormon
    name: Ether 2:5
    book: Ether
    chapter: 2
    verse: 5
    ordinal: 6056
    text: And it came to pass that the Lord commanded them that they should go forth into the wilderness, yea, into that quarter where there never had man been. And it came to pass that the Lord did go before them, and did talk with them as he stood in a cloud, and gave directions whither they should travel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.6
    scripture: book-of-mormon
    name: Ether 2:6
    book: Ether
    chapter: 2
    verse: 6
    ordinal: 6057
    text: And it came to pass that they did travel in the wilderness, and did build barges, in which they did cross many waters, being directed continually by the hand of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.7
    scripture: book-of-mormon
    name: Ether 2:7
    book: Ether
    chapter: 2
    verse: 7
    ordinal: 6058
    text: And the Lord would not suffer that they should stop beyond the sea in the wilderness, but he would that they should come forth even unto the land of promise, which was choice above all other lands, which the Lord God had preserved for a righteous people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.8
    scripture: book-of-mormon
    name: Ether 2:8
    book: Ether
    chapter: 2
    verse: 8
    ordinal: 6059
    text: And he had sworn in his wrath unto the brother of Jared, that whoso should possess this land of promise, from that time henceforth and forever, should serve him, the true and only God, or they should be swept off when the fulness of his wrath should come upon them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.9
    scripture: book-of-mormon
    name: Ether 2:9
    book: Ether
    chapter: 2
    verse: 9
    ordinal: 6060
    text: And now, we can behold the decrees of God concerning this land, that it is a land of promise; and whatsoever nation shall possess it shall serve God, or they shall be swept off when the fulness of his wrath shall come upon them. And the fulness of his wrath cometh upon them when they are ripened in iniquity.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.10
    scripture: book-of-mormon
    name: Ether 2:10
    book: Ether
    chapter: 2
    verse: 10
    ordinal: 6061
    text: For behold, this is a land which is choice above all other lands; wherefore he that doth possess it shall serve God or shall be swept off; for it is the everlasting decree of God. And it is not until the fulness of iniquity among the children of the land, that they are swept off.
    translation: 2013 edition
    original: ''
