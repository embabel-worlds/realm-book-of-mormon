    verse: 6
    ordinal: 834
    text: For as death hath passed upon all men, to fulfil the merciful plan of the great Creator, there must needs be a power of resurrection, and the resurrection must needs come unto man by reason of the fall; and the fall came by reason of transgression; and because man became fallen they were cut off from the presence of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.7
    scripture: book-of-mormon
    name: 2 Nephi 9:7
    book: 2 Nephi
    chapter: 9
    verse: 7
    ordinal: 835
    text: Wherefore, it must needs be an infinite atonement—save it should be an infinite atonement this corruption could not put on incorruption. Wherefore, the first judgment which came upon man must needs have remained to an endless duration. And if so, this flesh must have laid down to rot and to crumble to its mother earth, to rise no more.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.8
    scripture: book-of-mormon
    name: 2 Nephi 9:8
    book: 2 Nephi
    chapter: 9
    verse: 8
    ordinal: 836
    text: O the wisdom of God, his mercy and grace! For behold, if the flesh should rise no more our spirits must become subject to that angel who fell from before the presence of the Eternal God, and became the devil, to rise no more.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.9
    scripture: book-of-mormon
    name: 2 Nephi 9:9
    book: 2 Nephi
    chapter: 9
    verse: 9
    ordinal: 837
    text: And our spirits must have become like unto him, and we become devils, angels to a devil, to be shut out from the presence of our God, and to remain with the father of lies, in misery, like unto himself; yea, to that being who beguiled our first parents, who transformeth himself nigh unto an angel of light, and stirreth up the children of men unto secret combinations of murder and all manner of secret works of darkness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.10
    scripture: book-of-mormon
    name: 2 Nephi 9:10
    book: 2 Nephi
    chapter: 9
    verse: 10
    ordinal: 838
    text: O how great the goodness of our God, who prepareth a way for our escape from the grasp of this awful monster; yea, that monster, death and hell, which I call the death of the body, and also the death of the spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.11
    scripture: book-of-mormon
    name: 2 Nephi 9:11
    book: 2 Nephi
    chapter: 9
    verse: 11
    ordinal: 839
    text: And because of the way of deliverance of our God, the Holy One of Israel, this death, of which I have spoken, which is the temporal, shall deliver up its dead; which death is the grave.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.12
    scripture: book-of-mormon
    name: 2 Nephi 9:12
    book: 2 Nephi
    chapter: 9
    verse: 12
    ordinal: 840
    text: And this death of which I have spoken, which is the spiritual death, shall deliver up its dead; which spiritual death is hell; wherefore, death and hell must deliver up their dead, and hell must deliver up its captive spirits, and the grave must deliver up its captive bodies, and the bodies and the spirits of men will be restored one to the other; and it is by the power of the resurrection of the Holy One of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.13
    scripture: book-of-mormon
    name: 2 Nephi 9:13
    book: 2 Nephi
    chapter: 9
    verse: 13
    ordinal: 841
    text: O how great the plan of our God! For on the other hand, the paradise of God must deliver up the spirits of the righteous, and the grave deliver up the body of the righteous; and the spirit and the body is restored to itself again, and all men become incorruptible, and immortal, and they are living souls, having a perfect knowledge like unto us in the flesh, save it be that our knowledge shall be perfect.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.14
    scripture: book-of-mormon
    name: 2 Nephi 9:14
    book: 2 Nephi
    chapter: 9
    verse: 14
    ordinal: 842
    text: Wherefore, we shall have a perfect knowledge of all our guilt, and our uncleanness, and our nakedness; and the righteous shall have a perfect knowledge of their enjoyment, and their righteousness, being clothed with purity, yea, even with the robe of righteousness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.15
    scripture: book-of-mormon
    name: 2 Nephi 9:15
    book: 2 Nephi
    chapter: 9
    verse: 15
    ordinal: 843
    text: And it shall come to pass that when all men shall have passed from this first death unto life, insomuch as they have become immortal, they must appear before the judgment-seat of the Holy One of Israel; and then cometh the judgment, and then must they be judged according to the holy judgment of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.16
    scripture: book-of-mormon
    name: 2 Nephi 9:16
    book: 2 Nephi
    chapter: 9
    verse: 16
    ordinal: 844
    text: And assuredly, as the Lord liveth, for the Lord God hath spoken it, and it is his eternal word, which cannot pass away, that they who are righteous shall be righteous still, and they who are filthy shall be filthy still; wherefore, they who are filthy are the devil and his angels; and they shall go away into everlasting fire, prepared for them; and their torment is as a lake of fire and brimstone, whose flame ascendeth up forever and ever and has no end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.17
    scripture: book-of-mormon
    name: 2 Nephi 9:17
    book: 2 Nephi
    chapter: 9
    verse: 17
    ordinal: 845
    text: O the greatness and the justice of our God! For he executeth all his words, and they have gone forth out of his mouth, and his law must be fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.18
    scripture: book-of-mormon
    name: 2 Nephi 9:18
    book: 2 Nephi
    chapter: 9
    verse: 18
    ordinal: 846
    text: But, behold, the righteous, the saints of the Holy One of Israel, they who have believed in the Holy One of Israel, they who have endured the crosses of the world, and despised the shame of it, they shall inherit the kingdom of God, which was prepared for them from the foundation of the world, and their joy shall be full forever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.19
    scripture: book-of-mormon
    name: 2 Nephi 9:19
    book: 2 Nephi
    chapter: 9
    verse: 19
    ordinal: 847
    text: O the greatness of the mercy of our God, the Holy One of Israel! For he delivereth his saints from that awful monster the devil, and death, and hell, and that lake of fire and brimstone, which is endless torment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.20
    scripture: book-of-mormon
    name: 2 Nephi 9:20
    book: 2 Nephi
    chapter: 9
    verse: 20
    ordinal: 848
    text: O how great the holiness of our God! For he knoweth all things, and there is not anything save he knows it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.21
    scripture: book-of-mormon
    name: 2 Nephi 9:21
    book: 2 Nephi
    chapter: 9
    verse: 21
    ordinal: 849
    text: And he cometh into the world that he may save all men if they will hearken unto his voice; for behold, he suffereth the pains of all men, yea, the pains of every living creature, both men, women, and children, who belong to the family of Adam.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.22
    scripture: book-of-mormon
    name: 2 Nephi 9:22
    book: 2 Nephi
    chapter: 9
    verse: 22
    ordinal: 850
    text: And he suffereth this that the resurrection might pass upon all men, that all might stand before him at the great and judgment day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.23
    scripture: book-of-mormon
    name: 2 Nephi 9:23
    book: 2 Nephi
    chapter: 9
    verse: 23
    ordinal: 851
    text: And he commandeth all men that they must repent, and be baptized in his name, having perfect faith in the Holy One of Israel, or they cannot be saved in the kingdom of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.24
    scripture: book-of-mormon
    name: 2 Nephi 9:24
    book: 2 Nephi
    chapter: 9
    verse: 24
    ordinal: 852
    text: And if they will not repent and believe in his name, and be baptized in his name, and endure to the end, they must be damned; for the Lord God, the Holy One of Israel, has spoken it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.25
    scripture: book-of-mormon
    name: 2 Nephi 9:25
    book: 2 Nephi
    chapter: 9
    verse: 25
    ordinal: 853
    text: Wherefore, he has given a law; and where there is no law given there is no punishment; and where there is no punishment there is no condemnation; and where there is no condemnation the mercies of the Holy One of Israel have claim upon them, because of the atonement; for they are delivered by the power of him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.26
    scripture: book-of-mormon
    name: 2 Nephi 9:26
    book: 2 Nephi
    chapter: 9
    verse: 26
    ordinal: 854
    text: For the atonement satisfieth the demands of his justice upon all those who have not the law given to them, that they are delivered from that awful monster, death and hell, and the devil, and the lake of fire and brimstone, which is endless torment; and they are restored to that God who gave them breath, which is the Holy One of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.27
    scripture: book-of-mormon
    name: 2 Nephi 9:27
    book: 2 Nephi
    chapter: 9
    verse: 27
    ordinal: 855
    text: But wo unto him that has the law given, yea, that has all the commandments of God, like unto us, and that transgresseth them, and that wasteth the days of his probation, for awful is his state!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.28
    scripture: book-of-mormon
    name: 2 Nephi 9:28
    book: 2 Nephi
    chapter: 9
    verse: 28
    ordinal: 856
    text: O that cunning plan of the evil one! O the vainness, and the frailties, and the foolishness of men! When they are learned they think they are wise, and they hearken not unto the counsel of God, for they set it aside, supposing they know of themselves, wherefore, their wisdom is foolishness and it profiteth them not. And they shall perish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.29
    scripture: book-of-mormon
    name: 2 Nephi 9:29
    book: 2 Nephi
    chapter: 9
    verse: 29
    ordinal: 857
    text: But to be learned is good if they hearken unto the counsels of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.30
    scripture: book-of-mormon
    name: 2 Nephi 9:30
    book: 2 Nephi
    chapter: 9
    verse: 30
    ordinal: 858
    text: But wo unto the rich, who are rich as to the things of the world. For because they are rich they despise the poor, and they persecute the meek, and their hearts are upon their treasures; wherefore, their treasure is their god. And behold, their treasure shall perish with them also.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.31
    scripture: book-of-mormon
    name: 2 Nephi 9:31
    book: 2 Nephi
    chapter: 9
    verse: 31
    ordinal: 859
    text: And wo unto the deaf that will not hear; for they shall perish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.32
    scripture: book-of-mormon
    name: 2 Nephi 9:32
    book: 2 Nephi
    chapter: 9
    verse: 32
    ordinal: 860
    text: Wo unto the blind that will not see; for they shall perish also.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.33
    scripture: book-of-mormon
    name: 2 Nephi 9:33
    book: 2 Nephi
    chapter: 9
    verse: 33
    ordinal: 861
    text: Wo unto the uncircumcised of heart, for a knowledge of their iniquities shall smite them at the last day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.34
    scripture: book-of-mormon
    name: 2 Nephi 9:34
    book: 2 Nephi
    chapter: 9
    verse: 34
    ordinal: 862
    text: Wo unto the liar, for he shall be thrust down to hell.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.35
    scripture: book-of-mormon
    name: 2 Nephi 9:35
    book: 2 Nephi
    chapter: 9
    verse: 35
    ordinal: 863
    text: Wo unto the murderer who deliberately killeth, for he shall die.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.36
    scripture: book-of-mormon
    name: 2 Nephi 9:36
    book: 2 Nephi
    chapter: 9
    verse: 36
    ordinal: 864
    text: Wo unto them who commit whoredoms, for they shall be thrust down to hell.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.37
    scripture: book-of-mormon
    name: 2 Nephi 9:37
    book: 2 Nephi
    chapter: 9
    verse: 37
    ordinal: 865
    text: Yea, wo unto those that worship idols, for the devil of all devils delighteth in them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.38
    scripture: book-of-mormon
    name: 2 Nephi 9:38
    book: 2 Nephi
    chapter: 9
    verse: 38
    ordinal: 866
    text: And, in fine, wo unto all those who die in their sins; for they shall return to God, and behold his face, and remain in their sins.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.39
    scripture: book-of-mormon
    name: 2 Nephi 9:39
    book: 2 Nephi
    chapter: 9
    verse: 39
    ordinal: 867
    text: O, my beloved brethren, remember the awfulness in transgressing against that Holy God, and also the awfulness of yielding to the enticings of that cunning one. Remember, to be carnally-minded is death, and to be spiritually-minded is life eternal.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.40
    scripture: book-of-mormon
    name: 2 Nephi 9:40
    book: 2 Nephi
    chapter: 9
    verse: 40
    ordinal: 868
    text: O, my beloved brethren, give ear to my words. Remember the greatness of the Holy One of Israel. Do not say that I have spoken hard things against you; for if ye do, ye will revile against the truth; for I have spoken the words of your Maker. I know that the words of truth are hard against all uncleanness; but the righteous fear them not, for they love the truth and are not shaken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.41
    scripture: book-of-mormon
    name: 2 Nephi 9:41
    book: 2 Nephi
    chapter: 9
    verse: 41
    ordinal: 869
    text: O then, my beloved brethren, come unto the Lord, the Holy One. Remember that his paths are righteous. Behold, the way for man is narrow, but it lieth in a straight course before him, and the keeper of the gate is the Holy One of Israel; and he employeth no servant there; and there is none other way save it be by the gate; for he cannot be deceived, for the Lord God is his name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.42
    scripture: book-of-mormon
    name: 2 Nephi 9:42
    book: 2 Nephi
    chapter: 9
    verse: 42
    ordinal: 870
    text: And whoso knocketh, to him will he open; and the wise, and the learned, and they that are rich, who are puffed up because of their learning, and their wisdom, and their riches—yea, they are they whom he despiseth; and save they shall cast these things away, and consider themselves fools before God, and come down in the depths of humility, he will not open unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.43
    scripture: book-of-mormon
    name: 2 Nephi 9:43
    book: 2 Nephi
    chapter: 9
    verse: 43
    ordinal: 871
    text: But the things of the wise and the prudent shall be hid from them forever—yea, that happiness which is prepared for the saints.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.44
    scripture: book-of-mormon
    name: 2 Nephi 9:44
    book: 2 Nephi
    chapter: 9
    verse: 44
    ordinal: 872
    text: O, my beloved brethren, remember my words. Behold, I take off my garments, and I shake them before you; I pray the God of my salvation that he view me with his all-searching eye; wherefore, ye shall know at the last day, when all men shall be judged of their works, that the God of Israel did witness that I shook your iniquities from my soul, and that I stand with brightness before him, and am rid of your blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.45
    scripture: book-of-mormon
    name: 2 Nephi 9:45
    book: 2 Nephi
    chapter: 9
    verse: 45
    ordinal: 873
    text: O, my beloved brethren, turn away from your sins; shake off the chains of him that would bind you fast; come unto that God who is the rock of your salvation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.46
    scripture: book-of-mormon
    name: 2 Nephi 9:46
    book: 2 Nephi
    chapter: 9
    verse: 46
    ordinal: 874
    text: 'Prepare your souls for that glorious day when justice shall be administered unto the righteous, even the day of judgment, that ye may not shrink with awful fear; that ye may not remember your awful guilt in perfectness, and be constrained to exclaim: Holy, holy are thy judgments, O Lord God Almighty—but I know my guilt; I transgressed thy law, and my transgressions are mine; and the devil hath obtained me, that I am a prey to his awful misery.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.47
    scripture: book-of-mormon
    name: 2 Nephi 9:47
    book: 2 Nephi
    chapter: 9
    verse: 47
    ordinal: 875
    text: But behold, my brethren, is it expedient that I should awake you to an awful reality of these things? Would I harrow up your souls if your minds were pure? Would I be plain unto you according to the plainness of the truth if ye were freed from sin?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.48
    scripture: book-of-mormon
    name: 2 Nephi 9:48
    book: 2 Nephi
    chapter: 9
    verse: 48
    ordinal: 876
    text: Behold, if ye were holy I would speak unto you of holiness; but as ye are not holy, and ye look upon me as a teacher, it must needs be expedient that I teach you the consequences of sin.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.49
    scripture: book-of-mormon
    name: 2 Nephi 9:49
    book: 2 Nephi
    chapter: 9
    verse: 49
    ordinal: 877
    text: Behold, my soul abhorreth sin, and my heart delighteth in righteousness; and I will praise the holy name of my God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.50
    scripture: book-of-mormon
    name: 2 Nephi 9:50
    book: 2 Nephi
    chapter: 9
    verse: 50
    ordinal: 878
    text: Come, my brethren, every one that thirsteth, come ye to the waters; and he that hath no money, come buy and eat; yea, come buy wine and milk without money and without price.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.51
    scripture: book-of-mormon
    name: 2 Nephi 9:51
    book: 2 Nephi
    chapter: 9
    verse: 51
    ordinal: 879
    text: Wherefore, do not spend money for that which is of no worth, nor your labor for that which cannot satisfy. Hearken diligently unto me, and remember the words which I have spoken; and come unto the Holy One of Israel, and feast upon that which perisheth not, neither can be corrupted, and let your soul delight in fatness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.52
    scripture: book-of-mormon
    name: 2 Nephi 9:52
    book: 2 Nephi
    chapter: 9
    verse: 52
    ordinal: 880
    text: Behold, my beloved brethren, remember the words of your God; pray unto him continually by day, and give thanks unto his holy name by night. Let your hearts rejoice.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.53
    scripture: book-of-mormon
    name: 2 Nephi 9:53
    book: 2 Nephi
    chapter: 9
    verse: 53
    ordinal: 881
    text: And behold how great the covenants of the Lord, and how great his condescensions unto the children of men; and because of his greatness, and his grace and mercy, he has promised unto us that our seed shall not utterly be destroyed, according to the flesh, but that he would preserve them; and in future generations they shall become a righteous branch unto the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.9.54
    scripture: book-of-mormon
    name: 2 Nephi 9:54
    book: 2 Nephi
    chapter: 9
    verse: 54
    ordinal: 882
    text: And now, my brethren, I would speak unto you more; but on the morrow I will declare unto you the remainder of my words. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.9
- type: BomVerse
  data:
    ref: 2-nephi.10.1
    scripture: book-of-mormon
    name: 2 Nephi 10:1
    book: 2 Nephi
    chapter: 10
    verse: 1
    ordinal: 883
    text: And now I, Jacob, speak unto you again, my beloved brethren, concerning this righteous branch of which I have spoken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.2
    scripture: book-of-mormon
    name: 2 Nephi 10:2
    book: 2 Nephi
    chapter: 10
    verse: 2
    ordinal: 884
    text: For behold, the promises which we have obtained are promises unto us according to the flesh; wherefore, as it has been shown unto me that many of our children shall perish in the flesh because of unbelief, nevertheless, God will be merciful unto many; and our children shall be restored, that they may come to that which will give them the true knowledge of their Redeemer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.3
    scripture: book-of-mormon
    name: 2 Nephi 10:3
    book: 2 Nephi
    chapter: 10
    verse: 3
    ordinal: 885
    text: Wherefore, as I said unto you, it must needs be expedient that Christ—for in the last night the angel spake unto me that this should be his name—should come among the Jews, among those who are the more wicked part of the world; and they shall crucify him—for thus it behooveth our God, and there is none other nation on earth that would crucify their God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.4
    scripture: book-of-mormon
    name: 2 Nephi 10:4
    book: 2 Nephi
    chapter: 10
    verse: 4
    ordinal: 886
    text: For should the mighty miracles be wrought among other nations they would repent, and know that he be their God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.5
    scripture: book-of-mormon
    name: 2 Nephi 10:5
    book: 2 Nephi
    chapter: 10
    verse: 5
    ordinal: 887
    text: But because of priestcrafts and iniquities, they at Jerusalem will stiffen their necks against him, that he be crucified.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.6
    scripture: book-of-mormon
    name: 2 Nephi 10:6
    book: 2 Nephi
    chapter: 10
    verse: 6
    ordinal: 888
    text: Wherefore, because of their iniquities, destructions, famines, pestilences, and bloodshed shall come upon them; and they who shall not be destroyed shall be scattered among all nations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.7
    scripture: book-of-mormon
    name: 2 Nephi 10:7
    book: 2 Nephi
    chapter: 10
    verse: 7
    ordinal: 889
    text: 'But behold, thus saith the Lord God: When the day cometh that they shall believe in me, that I am Christ, then have I covenanted with their fathers that they shall be restored in the flesh, upon the earth, unto the lands of their inheritance.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.8
    scripture: book-of-mormon
    name: 2 Nephi 10:8
    book: 2 Nephi
    chapter: 10
    verse: 8
    ordinal: 890
    text: And it shall come to pass that they shall be gathered in from their long dispersion, from the isles of the sea, and from the four parts of the earth; and the nations of the Gentiles shall be great in the eyes of me, saith God, in carrying them forth to the lands of their inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.9
    scripture: book-of-mormon
    name: 2 Nephi 10:9
    book: 2 Nephi
    chapter: 10
    verse: 9
    ordinal: 891
    text: Yea, the kings of the Gentiles shall be nursing fathers unto them, and their queens shall become nursing mothers; wherefore, the promises of the Lord are great unto the Gentiles, for he hath spoken it, and who can dispute?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.10
    scripture: book-of-mormon
    name: 2 Nephi 10:10
    book: 2 Nephi
    chapter: 10
    verse: 10
    ordinal: 892
    text: But behold, this land, said God, shall be a land of thine inheritance, and the Gentiles shall be blessed upon the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.11
    scripture: book-of-mormon
    name: 2 Nephi 10:11
    book: 2 Nephi
    chapter: 10
    verse: 11
    ordinal: 893
    text: And this land shall be a land of liberty unto the Gentiles, and there shall be no kings upon the land, who shall raise up unto the Gentiles.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.12
    scripture: book-of-mormon
    name: 2 Nephi 10:12
    book: 2 Nephi
    chapter: 10
    verse: 12
    ordinal: 894
    text: And I will fortify this land against all other nations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.13
    scripture: book-of-mormon
    name: 2 Nephi 10:13
    book: 2 Nephi
    chapter: 10
    verse: 13
    ordinal: 895
    text: And he that fighteth against Zion shall perish, saith God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.14
    scripture: book-of-mormon
    name: 2 Nephi 10:14
    book: 2 Nephi
    chapter: 10
    verse: 14
    ordinal: 896
    text: For he that raiseth up a king against me shall perish, for I, the Lord, the king of heaven, will be their king, and I will be a light unto them forever, that hear my words.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.15
    scripture: book-of-mormon
    name: 2 Nephi 10:15
    book: 2 Nephi
    chapter: 10
    verse: 15
    ordinal: 897
    text: Wherefore, for this cause, that my covenants may be fulfilled which I have made unto the children of men, that I will do unto them while they are in the flesh, I must needs destroy the secret works of darkness, and of murders, and of abominations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.16
    scripture: book-of-mormon
    name: 2 Nephi 10:16
    book: 2 Nephi
    chapter: 10
    verse: 16
    ordinal: 898
    text: Wherefore, he that fighteth against Zion, both Jew and Gentile, both bond and free, both male and female, shall perish; for they are they who are the whore of all the earth; for they who are not for me are against me, saith our God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.17
    scripture: book-of-mormon
    name: 2 Nephi 10:17
    book: 2 Nephi
    chapter: 10
    verse: 17
    ordinal: 899
    text: For I will fulfil my promises which I have made unto the children of men, that I will do unto them while they are in the flesh—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.18
    scripture: book-of-mormon
    name: 2 Nephi 10:18
    book: 2 Nephi
    chapter: 10
    verse: 18
    ordinal: 900
    text: 'Wherefore, my beloved brethren, thus saith our God: I will afflict thy seed by the hand of the Gentiles; nevertheless, I will soften the hearts of the Gentiles, that they shall be like unto a father to them; wherefore, the Gentiles shall be blessed and numbered among the house of Israel.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.19
    scripture: book-of-mormon
    name: 2 Nephi 10:19
    book: 2 Nephi
    chapter: 10
    verse: 19
    ordinal: 901
    text: Wherefore, I will consecrate this land unto thy seed, and them who shall be numbered among thy seed, forever, for the land of their inheritance; for it is a choice land, saith God unto me, above all other lands, wherefore I will have all men that dwell thereon that they shall worship me, saith God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.20
    scripture: book-of-mormon
    name: 2 Nephi 10:20
    book: 2 Nephi
    chapter: 10
    verse: 20
    ordinal: 902
    text: And now, my beloved brethren, seeing that our merciful God has given us so great knowledge concerning these things, let us remember him, and lay aside our sins, and not hang down our heads, for we are not cast off; nevertheless, we have been driven out of the land of our inheritance; but we have been led to a better land, for the Lord has made the sea our path, and we are upon an isle of the sea.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.21
    scripture: book-of-mormon
    name: 2 Nephi 10:21
    book: 2 Nephi
    chapter: 10
    verse: 21
    ordinal: 903
    text: But great are the promises of the Lord unto them who are upon the isles of the sea; wherefore as it says isles, there must needs be more than this, and they are inhabited also by our brethren.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.22
    scripture: book-of-mormon
    name: 2 Nephi 10:22
    book: 2 Nephi
    chapter: 10
    verse: 22
    ordinal: 904
    text: For behold, the Lord God has led away from time to time from the house of Israel, according to his will and pleasure. And now behold, the Lord remembereth all them who have been broken off, wherefore he remembereth us also.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.23
    scripture: book-of-mormon
    name: 2 Nephi 10:23
    book: 2 Nephi
    chapter: 10
    verse: 23
    ordinal: 905
    text: Therefore, cheer up your hearts, and remember that ye are free to act for yourselves—to choose the way of everlasting death or the way of eternal life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.24
    scripture: book-of-mormon
    name: 2 Nephi 10:24
    book: 2 Nephi
    chapter: 10
    verse: 24
    ordinal: 906
    text: Wherefore, my beloved brethren, reconcile yourselves to the will of God, and not to the will of the devil and the flesh; and remember, after ye are reconciled unto God, that it is only in and through the grace of God that ye are saved.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.10.25
    scripture: book-of-mormon
    name: 2 Nephi 10:25
    book: 2 Nephi
    chapter: 10
    verse: 25
    ordinal: 907
    text: Wherefore, may God raise you from death by the power of the resurrection, and also from everlasting death by the power of the atonement, that ye may be received into the eternal kingdom of God, that ye may praise him through grace divine. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.10
- type: BomVerse
  data:
    ref: 2-nephi.11.1
    scripture: book-of-mormon
    name: 2 Nephi 11:1
    book: 2 Nephi
    chapter: 11
    verse: 1
    ordinal: 908
    text: And now, Jacob spake many more things to my people at that time; nevertheless only these things have I caused to be written, for the things which I have written sufficeth me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.11
- type: BomVerse
  data:
    ref: 2-nephi.11.2
    scripture: book-of-mormon
    name: 2 Nephi 11:2
    book: 2 Nephi
    chapter: 11
    verse: 2
    ordinal: 909
    text: And now I, Nephi, write more of the words of Isaiah, for my soul delighteth in his words. For I will liken his words unto my people, and I will send them forth unto all my children, for he verily saw my Redeemer, even as I have seen him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.11
- type: BomVerse
  data:
    ref: 2-nephi.11.3
    scripture: book-of-mormon
    name: 2 Nephi 11:3
    book: 2 Nephi
    chapter: 11
    verse: 3
    ordinal: 910
    text: And my brother, Jacob, also has seen him as I have seen him; wherefore, I will send their words forth unto my children to prove unto them that my words are true. Wherefore, by the words of three, God hath said, I will establish my word. Nevertheless, God sendeth more witnesses, and he proveth all his words.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.11
- type: BomVerse
  data:
    ref: 2-nephi.11.4
    scripture: book-of-mormon
    name: 2 Nephi 11:4
    book: 2 Nephi
    chapter: 11
    verse: 4
    ordinal: 911
    text: Behold, my soul delighteth in proving unto my people the truth of the coming of Christ; for, for this end hath the law of Moses been given; and all things which have been given of God from the beginning of the world, unto man, are the typifying of him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.11
- type: BomVerse
  data:
    ref: 2-nephi.11.5
    scripture: book-of-mormon
    name: 2 Nephi 11:5
    book: 2 Nephi
    chapter: 11
    verse: 5
    ordinal: 912
    text: And also my soul delighteth in the covenants of the Lord which he hath made to our fathers; yea, my soul delighteth in his grace, and in his justice, and power, and mercy in the great and eternal plan of deliverance from death.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.11
- type: BomVerse
  data:
    ref: 2-nephi.11.6
    scripture: book-of-mormon
    name: 2 Nephi 11:6
    book: 2 Nephi
    chapter: 11
    verse: 6
    ordinal: 913
    text: And my soul delighteth in proving unto my people that save Christ should come all men must perish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.11
- type: BomVerse
  data:
    ref: 2-nephi.11.7
    scripture: book-of-mormon
    name: 2 Nephi 11:7
    book: 2 Nephi
    chapter: 11
    verse: 7
    ordinal: 914
    text: For if there be no Christ there be no God; and if there be no God we are not, for there could have been no creation. But there is a God, and he is Christ, and he cometh in the fulness of his own time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.11
- type: BomVerse
  data:
    ref: 2-nephi.11.8
    scripture: book-of-mormon
    name: 2 Nephi 11:8
    book: 2 Nephi
    chapter: 11
    verse: 8
    ordinal: 915
    text: And now I write some of the words of Isaiah, that whoso of my people shall see these words may lift up their hearts and rejoice for all men. Now these are the words, and ye may liken them unto you and unto all men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.11
- type: BomVerse
  data:
    ref: 2-nephi.12.1
    scripture: book-of-mormon
    name: 2 Nephi 12:1
    book: 2 Nephi
    chapter: 12
    verse: 1
    ordinal: 916
    text: 'The word that Isaiah, the son of Amoz, saw concerning Judah and Jerusalem:'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 2:1
    kjvOsis:
    - Isa.2.1
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.12
- type: BomVerse
  data:
    ref: 2-nephi.12.2
    scripture: book-of-mormon
    name: 2 Nephi 12:2
    book: 2 Nephi
    chapter: 12
    verse: 2
    ordinal: 917
    text: And it shall come to pass in the last days, when the mountain of the Lord's house shall be established in the top of the mountains, and shall be exalted above the hills, and all nations shall flow unto it.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 2:2
    kjvOsis:
    - Isa.2.2
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.12
- type: BomVerse
  data:
    ref: 2-nephi.12.3
    scripture: book-of-mormon
    name: 2 Nephi 12:3
    book: 2 Nephi
    chapter: 12
    verse: 3
    ordinal: 918
    text: And many people shall go and say, Come ye, and let us go up to the mountain of the Lord, to the house of the God of Jacob; and he will teach us of his ways, and we will walk in his paths; for out of Zion shall go forth the law, and the word of the Lord from Jerusalem.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 2:3
    kjvOsis:
    - Isa.2.3
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.12
- type: BomVerse
  data:
    ref: 2-nephi.12.4
    scripture: book-of-mormon
    name: 2 Nephi 12:4
    book: 2 Nephi
    chapter: 12
    verse: 4
    ordinal: 919
    text: 'And he shall judge among the nations, and shall rebuke many people: and they shall beat their swords into plow-shares, and their spears into pruning-hooks—nation shall not lift up sword against nation, neither shall they learn war any more.'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 2:4
    kjvOsis:
    - Isa.2.4
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.12
- type: BomVerse
  data:
    ref: 2-nephi.12.5
    scripture: book-of-mormon
    name: 2 Nephi 12:5
    book: 2 Nephi
    chapter: 12
    verse: 5
    ordinal: 920
    text: O house of Jacob, come ye and let us walk in the light of the Lord; yea, come, for ye have all gone astray, every one to his wicked ways.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 2:5
    kjvOsis:
    - Isa.2.5
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.12
- type: BomVerse
  data:
    ref: 2-nephi.12.6
    scripture: book-of-mormon
    name: 2 Nephi 12:6
    book: 2 Nephi
    chapter: 12
    verse: 6
    ordinal: 921
    text: Therefore, O Lord, thou hast forsaken thy people, the house of Jacob, because they be replenished from the east, and hearken unto soothsayers like the Philistines, and they please themselves in the children of strangers.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 2:6
    kjvOsis:
    - Isa.2.6
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.12
- type: BomVerse
  data:
    ref: 2-nephi.12.7
    scripture: book-of-mormon
    name: 2 Nephi 12:7
    book: 2 Nephi
    chapter: 12
    verse: 7
    ordinal: 922
    text: Their land also is full of silver and gold, neither is there any end of their treasures; their land is also full of horses, neither is there any end of their chariots.
    translation: 2013 edition
