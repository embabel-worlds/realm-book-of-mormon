    scripture: book-of-mormon
    name: 3 Nephi 22:7
    book: 3 Nephi
    chapter: 22
    verse: 7
    ordinal: 5579
    text: For a small moment have I forsaken thee, but with great mercies will I gather thee.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 54:7
    kjvOsis:
    - Isa.54.7
  relations:
  - predicate: IN
    to:
