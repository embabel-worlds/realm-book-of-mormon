  data:
    ref: 3-nephi.21.19
    scripture: book-of-mormon
    name: 3 Nephi 21:19
    book: 3 Nephi
    chapter: 21
    verse: 19
    ordinal: 5562
    text: And it shall come to pass that all lyings, and deceivings, and envyings, and strifes, and priestcrafts, and whoredoms, shall be done away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.20
    scripture: book-of-mormon
    name: 3 Nephi 21:20
    book: 3 Nephi
    chapter: 21
    verse: 20
    ordinal: 5563
    text: For it shall come to pass, saith the Father, that at that day whosoever will not repent and come unto my Beloved Son, them will I cut off from among my people, O house of Israel;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Micah 5:10
    kjvAllusionOsis:
    - Mic.5.10
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.21
    scripture: book-of-mormon
    name: 3 Nephi 21:21
    book: 3 Nephi
    chapter: 21
    verse: 21
    ordinal: 5564
    text: And I will execute vengeance and fury upon them, even as upon the heathen, such as they have not heard.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Micah 5:15
    kjvOsis:
    - Mic.5.15
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.22
    scripture: book-of-mormon
    name: 3 Nephi 21:22
    book: 3 Nephi
    chapter: 21
    verse: 22
    ordinal: 5565
    text: But if they will repent and hearken unto my words, and harden not their hearts, I will establish my church among them, and they shall come in unto the covenant and be numbered among this the remnant of Jacob, unto whom I have given this land for their inheritance;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.23
    scripture: book-of-mormon
    name: 3 Nephi 21:23
    book: 3 Nephi
    chapter: 21
    verse: 23
    ordinal: 5566
    text: And they shall assist my people, the remnant of Jacob, and also as many of the house of Israel as shall come, that they may build a city, which shall be called the New Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.24
    scripture: book-of-mormon
    name: 3 Nephi 21:24
    book: 3 Nephi
    chapter: 21
    verse: 24
    ordinal: 5567
