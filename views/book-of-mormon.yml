# The realm's answer surface.
#
# References are as a reader writes them — `1 Nephi 3:7`, matched against `name`. Views that cross
# scriptures are not here: they read only the vocabulary's parent labels, so they live in
# realm-scripture-vocabulary and answer from whatever is installed. The two that read the King James
# beside the Book of Mormon are here, because only this realm knows which verse quotes which.

- name: ReadBomVerse
  description: >-
    One Book of Mormon verse by reference, with the King James it draws on. Only the
    one verse, matched exactly; the King James verses are named, not quoted — BomBesideKingJames
    gives their text.
  params:
    ref:
      type: string
      default: "1 Nephi 3:7"
      description: "The verse, exactly as printed, e.g. `1 Nephi 3:7`, `Moroni 10:4`."
  cypher: |
    MATCH (v:BomVerse {name: $ref})
    RETURN v.name AS reference, v.text AS text, v.kjvRefs AS quotes, v.kjvAllusions AS alludesTo

- name: ReadBomChapter
  description: >-
    A whole Book of Mormon chapter, verse by verse, with its printed heading. Also names the King
    James chapters it quotes. One chapter only, named exactly; no modern chapter summaries, which
    are not part of the public-domain text.
  params:
    chapter:
      type: string
      default: "1 Nephi 1"
      description: "The chapter, exactly as printed, e.g. `1 Nephi 1`, `Alma 32`, `3 Nephi 11`."
  cypher: |
    MATCH (c:BomChapter {name: $chapter})<-[:IN]-(v:BomVerse)
    RETURN c.heading AS heading, c.quotes AS quotesChapters, v.verse AS verse, v.text AS text, v.kjvRefs AS quotes
    ORDER BY verse

- name: BomBooks
  description: >-
    The Book of Mormon's fifteen books, with titles, sizes and printed headings. One row per
    book, 1 Nephi to Moroni, in printed order; the front matter (title page, witnesses) is not
    included.
  cypher: |
    MATCH (b:BomBook)
    RETURN b.bookOrder AS order, b.name AS book, b.fullTitle AS fullTitle,
           b.chapterCount AS chapters, b.verseCount AS verses, b.heading AS heading
    ORDER BY order

- name: SearchBookOfMormon
  description: >-
    Book of Mormon verses containing a word or phrase, in reading order. Partial and
    case-insensitive: it matches inside words, so `faith` also finds `faithful`. At most `limit`
    verses; every scripture at once is SearchScriptures.
  params:
    term:
      type: string
      default: "faith"
      description: "The word or phrase to find. A partial match, ignoring case: any verse whose text contains it."
    limit:
      type: int
      default: 100
      description: "At most this many verses, in reading order."
  cypher: |
    MATCH (v:BomVerse)
    WHERE toLower(v.text) CONTAINS toLower($term)
    RETURN v.name AS reference, v.text AS text
    ORDER BY v.ordinal
    LIMIT $limit

- name: BooksMentioning
  description: >-
    How often each Book of Mormon book uses a word, ranked per thousand verses. Counts verses
    containing it, not occurrences, and the rate so a short book and Alma compare fairly. A book
    that never uses it is left out.
  params:
    term:
      type: string
      default: "repent"
      description: "The word or phrase to count. A partial match, ignoring case: `repent` also counts `repentance`."
  cypher: |
    MATCH (b:BomBook)<-[:IN]-(:BomChapter)<-[:IN]-(v:BomVerse)
    WITH b, count(v) AS total, sum(CASE WHEN toLower(v.text) CONTAINS toLower($term) THEN 1 ELSE 0 END) AS hits
    WHERE hits > 0
    RETURN b.name AS book, hits AS verses, total AS ofVerses, round(1000.0 * hits / total, 1) AS perThousand
    ORDER BY perThousand DESC

- name: QuotedChapters
  description: >-
    Every Book of Mormon chapter that quotes the King James, in reading order. With the chapters it
    quotes and how many of its verses do — Isaiah in 1 and 2 Nephi and Mosiah, the Sermon on the
    Mount in 3 Nephi, Malachi. Quotation only; a chapter that only alludes is not listed.
  cypher: |
    MATCH (c:BomChapter)<-[:IN]-(v:BomVerse)
    WHERE c.quotes IS NOT NULL
    WITH c, count(v) AS verses, sum(CASE WHEN v.kjvRefs IS NULL THEN 0 ELSE 1 END) AS quoting
    MATCH (c)<-[:IN]-(first:BomVerse {verse: 1})
    RETURN c.name AS chapter, c.quotes AS quotes, quoting, verses
    ORDER BY first.ordinal

- name: BomBesideKingJames
  description: >-
    A Book of Mormon chapter beside the King James verses it quotes, verse by verse. Through
    CORRESPONDS_TO, with both texts, so where the Book of Mormon adds to or departs from its source
    the two show it. One chapter only. Needs realm-bible: without it the King James columns are
    empty.
  params:
    chapter:
      type: string
      default: "2 Nephi 12"
      description: "A chapter that quotes the Bible, named exactly, e.g. `2 Nephi 12` (Isaiah 2), `3 Nephi 13` (Matthew 6). QuotedChapters lists them."
  cypher: |
    MATCH (c:BomChapter {name: $chapter})<-[:IN]-(m:BomVerse)
    OPTIONAL MATCH (m)-[r:CORRESPONDS_TO]->(k:BibleVerse)
    RETURN m.verse AS verse, m.text AS bookOfMormon, k.name AS kingJames, k.text AS kjv, r.kind AS kind
    ORDER BY verse
