  data:
    ref: 3-nephi.20.46
    scripture: book-of-mormon
    name: 3 Nephi 20:46
    book: 3 Nephi
    chapter: 20
    verse: 46
    ordinal: 5543
    text: Verily, verily, I say unto you, all these things shall surely come, even as the Father hath commanded me. Then shall this covenant which the Father hath covenanted with his people be fulfilled; and then shall Jerusalem be inhabited again with my people, and it shall be the land of their inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.21.1
    scripture: book-of-mormon
    name: 3 Nephi 21:1
    book: 3 Nephi
    chapter: 21
    verse: 1
    ordinal: 5544
    text: And verily I say unto you, I give unto you a sign, that ye may know the time when these things shall be about to take place—that I shall gather in, from their long dispersion, my people, O house of Israel, and shall establish again among them my Zion;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.2
    scripture: book-of-mormon
    name: 3 Nephi 21:2
    book: 3 Nephi
    chapter: 21
    verse: 2
    ordinal: 5545
    text: And behold, this is the thing which I will give unto you for a sign—for verily I say unto you that when these things which I declare unto you, and which I shall declare unto you hereafter of myself, and by the power of the Holy Ghost which shall be given unto you of the Father, shall be made known unto the Gentiles that they may know concerning this people who are a remnant of the house of Jacob, and concerning this my people who shall be scattered by them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.3
    scripture: book-of-mormon
    name: 3 Nephi 21:3
    book: 3 Nephi
    chapter: 21
    verse: 3
    ordinal: 5546
    text: Verily, verily, I say unto you, when these things shall be made known unto them of the Father, and shall come forth of the Father, from them unto you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.4
    scripture: book-of-mormon
    name: 3 Nephi 21:4
    book: 3 Nephi
    chapter: 21
    verse: 4
    ordinal: 5547
    text: For it is wisdom in the Father that they should be established in this land, and be set up as a free people by the power of the Father, that these things might come forth from them unto a remnant of your seed, that the covenant of the Father may be fulfilled which he hath covenanted with his people, O house of Israel;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.5
    scripture: book-of-mormon
    name: 3 Nephi 21:5
    book: 3 Nephi
    chapter: 21
    verse: 5
    ordinal: 5548
    text: Therefore, when these works and the works which shall be wrought among you hereafter shall come forth from the Gentiles, unto your seed which shall dwindle in unbelief because of iniquity;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.6
    scripture: book-of-mormon
    name: 3 Nephi 21:6
    book: 3 Nephi
    chapter: 21
    verse: 6
    ordinal: 5549
    text: For thus it behooveth the Father that it should come forth from the Gentiles, that he may show forth his power unto the Gentiles, for this cause that the Gentiles, if they will not harden their hearts, that they may repent and come unto me and be baptized in my name and know of the true points of my doctrine, that they may be numbered among my people, O house of Israel;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
