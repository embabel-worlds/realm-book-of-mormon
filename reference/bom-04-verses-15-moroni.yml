    scripture: book-of-mormon
    name: Moroni 1:3
    book: Moroni
    chapter: 1
    verse: 3
    ordinal: 6444
    text: And I, Moroni, will not deny the Christ; wherefore, I wander whithersoever I can for the safety of mine own life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: moroni.1
- type: BomVerse
  data:
    ref: moroni.1.4
    scripture: book-of-mormon
    name: Moroni 1:4
    book: Moroni
    chapter: 1
    verse: 4
    ordinal: 6445
    text: Wherefore, I write a few more things, contrary to that which I had supposed; for I had supposed not to have written any more; but I write a few more things, that perhaps they may be of worth unto my brethren, the Lamanites, in some future day, according to the will of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: moroni.1
- type: BomVerse
  data:
