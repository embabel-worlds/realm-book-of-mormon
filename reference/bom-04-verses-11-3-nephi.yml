  data:
    ref: 3-nephi.22.14
    scripture: book-of-mormon
    name: 3 Nephi 22:14
    book: 3 Nephi
    chapter: 22
    verse: 14
    ordinal: 5586
    text: In righteousness shalt thou be established; thou shalt be far from oppression for thou shalt not fear, and from terror for it shall not come near thee.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 54:14
    kjvOsis:
    - Isa.54.14
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.22
- type: BomVerse
  data:
    ref: 3-nephi.22.15
    scripture: book-of-mormon
    name: 3 Nephi 22:15
    book: 3 Nephi
    chapter: 22
    verse: 15
    ordinal: 5587
    text: Behold, they shall surely gather together against thee, not by me; whosoever shall gather together against thee shall fall for thy sake.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 54:15
    kjvOsis:
    - Isa.54.15
