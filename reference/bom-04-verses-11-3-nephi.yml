    scripture: book-of-mormon
    name: 3 Nephi 21:17
    book: 3 Nephi
    chapter: 21
    verse: 17
    ordinal: 5560
    text: Thy graven images I will also cut off, and thy standing images out of the midst of thee, and thou shalt no more worship the works of thy hands;
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Micah 5:13
    kjvOsis:
    - Mic.5.13
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
