    scripture: book-of-mormon
    name: Moroni 1:2
    book: Moroni
    chapter: 1
    verse: 2
    ordinal: 6443
    text: For behold, their wars are exceedingly fierce among themselves; and because of their hatred they put to death every Nephite that will not deny the Christ.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: moroni.1
