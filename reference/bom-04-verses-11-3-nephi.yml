    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 52:8
    kjvOsis:
    - Isa.52.8
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.33
    scripture: book-of-mormon
    name: 3 Nephi 20:33
    book: 3 Nephi
    chapter: 20
    verse: 33
    ordinal: 5530
    text: Then will the Father gather them together again, and give unto them Jerusalem for the land of their inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.34
    scripture: book-of-mormon
    name: 3 Nephi 20:34
    book: 3 Nephi
    chapter: 20
    verse: 34
    ordinal: 5531
