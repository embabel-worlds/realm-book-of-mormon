    scripture: book-of-mormon
    name: 3 Nephi 20:25
    book: 3 Nephi
    chapter: 20
    verse: 25
    ordinal: 5522
    text: 'And behold, ye are the children of the prophets; and ye are of the house of Israel; and ye are of the covenant which the Father made with your fathers, saying unto Abraham: And in thy seed shall all the kindreds of the earth be blessed.'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Acts 3:25
    kjvOsis:
    - Acts.3.25
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.26
    scripture: book-of-mormon
    name: 3 Nephi 20:26
    book: 3 Nephi
    chapter: 20
    verse: 26
    ordinal: 5523
    text: The Father having raised me up unto you first, and sent me to bless you in turning away every one of you from his iniquities; and this because ye are the children of the covenant—
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Acts 3:26
    kjvOsis:
    - Acts.3.26
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.27
    scripture: book-of-mormon
    name: 3 Nephi 20:27
    book: 3 Nephi
    chapter: 20
    verse: 27
    ordinal: 5524
    text: 'And after that ye were blessed then fulfilleth the Father the covenant which he made with Abraham, saying: In thy seed shall all the kindreds of the earth be blessed—unto the pouring out of the Holy Ghost through me upon the Gentiles, which blessing upon the Gentiles shall make them mighty above all, unto the scattering of my people, O house of Israel.'
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Acts 3:25
    kjvAllusionOsis:
    - Acts.3.25
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.28
    scripture: book-of-mormon
    name: 3 Nephi 20:28
    book: 3 Nephi
    chapter: 20
    verse: 28
    ordinal: 5525
    text: And they shall be a scourge unto the people of this land. Nevertheless, when they shall have received the fulness of my gospel, then if they shall harden their hearts against me I will return their iniquities upon their own heads, saith the Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.29
    scripture: book-of-mormon
    name: 3 Nephi 20:29
    book: 3 Nephi
    chapter: 20
    verse: 29
    ordinal: 5526
    text: And I will remember the covenant which I have made with my people; and I have covenanted with them that I would gather them together in mine own due time, that I would give unto them again the land of their fathers for their inheritance, which is the land of Jerusalem, which is the promised land unto them forever, saith the Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.30
    scripture: book-of-mormon
    name: 3 Nephi 20:30
    book: 3 Nephi
    chapter: 20
    verse: 30
    ordinal: 5527
    text: And it shall come to pass that the time cometh, when the fulness of my gospel shall be preached unto them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.31
    scripture: book-of-mormon
    name: 3 Nephi 20:31
    book: 3 Nephi
    chapter: 20
    verse: 31
    ordinal: 5528
    text: And they shall believe in me, that I am Jesus Christ, the Son of God, and shall pray unto the Father in my name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
    ref: 3-nephi.20.32
    scripture: book-of-mormon
    name: 3 Nephi 20:32
    book: 3 Nephi
    chapter: 20
    verse: 32
    ordinal: 5529
