    name: Moroni 2:2
    book: Moroni
    chapter: 2
    verse: 2
    ordinal: 6447
    text: 'And he called them by name, saying: Ye shall call on the Father in my name, in mighty prayer; and after ye have done this ye shall have power that to him upon whom ye shall lay your hands, ye shall give the Holy Ghost; and in my name shall ye give it, for thus do mine apostles.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: moroni.2
