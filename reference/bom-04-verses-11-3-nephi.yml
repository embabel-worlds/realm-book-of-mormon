    ref: 3-nephi.22.16
    scripture: book-of-mormon
    name: 3 Nephi 22:16
    book: 3 Nephi
    chapter: 22
    verse: 16
    ordinal: 5588
    text: Behold, I have created the smith that bloweth the coals in the fire, and that bringeth forth an instrument for his work; and I have created the waster to destroy.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 54:16
    kjvOsis:
    - Isa.54.16
  relations:
