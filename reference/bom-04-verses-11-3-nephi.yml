    scripture: book-of-mormon
    name: 3 Nephi 22:11
    book: 3 Nephi
    chapter: 22
    verse: 11
    ordinal: 5583
    text: O thou afflicted, tossed with tempest, and not comforted! Behold, I will lay thy stones with fair colors, and lay thy foundations with sapphires.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 54:11
    kjvOsis:
    - Isa.54.11
  relations:
  - predicate: IN
    to:
