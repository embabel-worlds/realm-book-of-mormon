    book: 1 Nephi
    chapter: 21
    verse: 24
    ordinal: 585
    text: For shall the prey be taken from the mighty, or the lawful captives delivered?
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 49:24
    kjvOsis:
    - Isa.49.24
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.21
- type: BomVerse
  data:
    ref: 1-nephi.21.25
    scripture: book-of-mormon
    name: 1 Nephi 21:25
    book: 1 Nephi
    chapter: 21
    verse: 25
    ordinal: 586
    text: But thus saith the Lord, even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered; for I will contend with him that contendeth with thee, and I will save thy children.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 49:25
    kjvOsis:
    - Isa.49.25
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.21
- type: BomVerse
  data:
    ref: 1-nephi.21.26
    scripture: book-of-mormon
    name: 1 Nephi 21:26
    book: 1 Nephi
    chapter: 21
    verse: 26
    ordinal: 587
    text: And I will feed them that oppress thee with their own flesh; they shall be drunken with their own blood as with sweet wine; and all flesh shall know that I, the Lord, am thy Savior and thy Redeemer, the Mighty One of Jacob.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 49:26
    kjvOsis:
    - Isa.49.26
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.21
- type: BomVerse
  data:
    ref: 1-nephi.22.1
    scripture: book-of-mormon
    name: 1 Nephi 22:1
    book: 1 Nephi
    chapter: 22
    verse: 1
    ordinal: 588
    text: 'And now it came to pass that after I, Nephi, had read these things which were engraven upon the plates of brass, my brethren came unto me and said unto me: What meaneth these things which ye have read? Behold, are they to be understood according to things which are spiritual, which shall come to pass according to the spirit and not the flesh?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.2
    scripture: book-of-mormon
    name: 1 Nephi 22:2
    book: 1 Nephi
    chapter: 22
    verse: 2
    ordinal: 589
    text: 'And I, Nephi, said unto them: Behold they were manifest unto the prophet by the voice of the Spirit; for by the Spirit are all things made known unto the prophets, which shall come upon the children of men according to the flesh.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.3
    scripture: book-of-mormon
    name: 1 Nephi 22:3
    book: 1 Nephi
    chapter: 22
    verse: 3
    ordinal: 590
    text: Wherefore, the things of which I have read are things pertaining to things both temporal and spiritual; for it appears that the house of Israel, sooner or later, will be scattered upon all the face of the earth, and also among all nations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.4
    scripture: book-of-mormon
    name: 1 Nephi 22:4
    book: 1 Nephi
    chapter: 22
    verse: 4
    ordinal: 591
    text: And behold, there are many who are already lost from the knowledge of those who are at Jerusalem. Yea, the more part of all the tribes have been led away; and they are scattered to and fro upon the isles of the sea; and whither they are none of us knoweth, save that we know that they have been led away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.5
    scripture: book-of-mormon
    name: 1 Nephi 22:5
    book: 1 Nephi
    chapter: 22
    verse: 5
    ordinal: 592
    text: And since they have been led away, these things have been prophesied concerning them, and also concerning all those who shall hereafter be scattered and be confounded, because of the Holy One of Israel; for against him will they harden their hearts; wherefore, they shall be scattered among all nations and shall be hated of all men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.6
    scripture: book-of-mormon
    name: 1 Nephi 22:6
    book: 1 Nephi
    chapter: 22
    verse: 6
    ordinal: 593
    text: Nevertheless, after they shall be nursed by the Gentiles, and the Lord has lifted up his hand upon the Gentiles and set them up for a standard, and their children have been carried in their arms, and their daughters have been carried upon their shoulders, behold these things of which are spoken are temporal; for thus are the covenants of the Lord with our fathers; and it meaneth us in the days to come, and also all our brethren who are of the house of Israel.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Isaiah 49:22
    kjvAllusionOsis:
    - Isa.49.22
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.7
    scripture: book-of-mormon
    name: 1 Nephi 22:7
    book: 1 Nephi
    chapter: 22
    verse: 7
    ordinal: 594
    text: And it meaneth that the time cometh that after all the house of Israel have been scattered and confounded, that the Lord God will raise up a mighty nation among the Gentiles, yea, even upon the face of this land; and by them shall our seed be scattered.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.8
    scripture: book-of-mormon
    name: 1 Nephi 22:8
    book: 1 Nephi
    chapter: 22
    verse: 8
    ordinal: 595
    text: And after our seed is scattered the Lord God will proceed to do a marvelous work among the Gentiles, which shall be of great worth unto our seed; wherefore, it is likened unto their being nourished by the Gentiles and being carried in their arms and upon their shoulders.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.9
    scripture: book-of-mormon
    name: 1 Nephi 22:9
    book: 1 Nephi
    chapter: 22
    verse: 9
    ordinal: 596
    text: 'And it shall also be of worth unto the Gentiles; and not only unto the Gentiles but unto all the house of Israel, unto the making known of the covenants of the Father of heaven unto Abraham, saying: In thy seed shall all the kindreds of the earth be blessed.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.10
    scripture: book-of-mormon
    name: 1 Nephi 22:10
    book: 1 Nephi
    chapter: 22
    verse: 10
    ordinal: 597
    text: And I would, my brethren, that ye should know that all the kindreds of the earth cannot be blessed unless he shall make bare his arm in the eyes of the nations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.11
    scripture: book-of-mormon
    name: 1 Nephi 22:11
    book: 1 Nephi
    chapter: 22
    verse: 11
    ordinal: 598
    text: Wherefore, the Lord God will proceed to make bare his arm in the eyes of all the nations, in bringing about his covenants and his gospel unto those who are of the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.12
    scripture: book-of-mormon
    name: 1 Nephi 22:12
    book: 1 Nephi
    chapter: 22
    verse: 12
    ordinal: 599
    text: Wherefore, he will bring them again out of captivity, and they shall be gathered together to the lands of their inheritance; and they shall be brought out of obscurity and out of darkness; and they shall know that the Lord is their Savior and their Redeemer, the Mighty One of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.13
    scripture: book-of-mormon
    name: 1 Nephi 22:13
    book: 1 Nephi
    chapter: 22
    verse: 13
    ordinal: 600
    text: And the blood of that great and abominable church, which is the whore of all the earth, shall turn upon their own heads; for they shall war among themselves, and the sword of their own hands shall fall upon their own heads, and they shall be drunken with their own blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.14
    scripture: book-of-mormon
    name: 1 Nephi 22:14
    book: 1 Nephi
    chapter: 22
    verse: 14
    ordinal: 601
    text: And every nation which shall war against thee, O house of Israel, shall be turned one against another, and they shall fall into the pit which they digged to ensnare the people of the Lord. And all that fight against Zion shall be destroyed, and that great whore, who hath perverted the right ways of the Lord, yea, that great and abominable church, shall tumble to the dust and great shall be the fall of it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.15
    scripture: book-of-mormon
    name: 1 Nephi 22:15
    book: 1 Nephi
    chapter: 22
    verse: 15
    ordinal: 602
    text: For behold, saith the prophet, the time cometh speedily that Satan shall have no more power over the hearts of the children of men; for the day soon cometh that all the proud and they who do wickedly shall be as stubble; and the day cometh that they must be burned.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.16
    scripture: book-of-mormon
    name: 1 Nephi 22:16
    book: 1 Nephi
    chapter: 22
    verse: 16
    ordinal: 603
    text: For the time soon cometh that the fulness of the wrath of God shall be poured out upon all the children of men; for he will not suffer that the wicked shall destroy the righteous.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.17
    scripture: book-of-mormon
    name: 1 Nephi 22:17
    book: 1 Nephi
    chapter: 22
    verse: 17
    ordinal: 604
    text: Wherefore, he will preserve the righteous by his power, even if it so be that the fulness of his wrath must come, and the righteous be preserved, even unto the destruction of their enemies by fire. Wherefore, the righteous need not fear; for thus saith the prophet, they shall be saved, even if it so be as by fire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.18
    scripture: book-of-mormon
    name: 1 Nephi 22:18
    book: 1 Nephi
    chapter: 22
    verse: 18
    ordinal: 605
    text: Behold, my brethren, I say unto you, that these things must shortly come; yea, even blood, and fire, and vapor of smoke must come; and it must needs be upon the face of this earth; and it cometh unto men according to the flesh if it so be that they will harden their hearts against the Holy One of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.19
    scripture: book-of-mormon
    name: 1 Nephi 22:19
    book: 1 Nephi
    chapter: 22
    verse: 19
    ordinal: 606
    text: For behold, the righteous shall not perish; for the time surely must come that all they who fight against Zion shall be cut off.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.20
    scripture: book-of-mormon
    name: 1 Nephi 22:20
    book: 1 Nephi
    chapter: 22
    verse: 20
    ordinal: 607
    text: 'And the Lord will surely prepare a way for his people, unto the fulfilling of the words of Moses, which he spake, saying: A prophet shall the Lord your God raise up unto you, like unto me; him shall ye hear in all things whatsoever he shall say unto you. And it shall come to pass that all those who will not hear that prophet shall be cut off from among the people.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.21
    scripture: book-of-mormon
    name: 1 Nephi 22:21
    book: 1 Nephi
    chapter: 22
    verse: 21
    ordinal: 608
    text: And now I, Nephi, declare unto you, that this prophet of whom Moses spake was the Holy One of Israel; wherefore, he shall execute judgment in righteousness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.22
    scripture: book-of-mormon
    name: 1 Nephi 22:22
    book: 1 Nephi
    chapter: 22
    verse: 22
    ordinal: 609
    text: And the righteous need not fear, for they are those who shall not be confounded. But it is the kingdom of the devil, which shall be built up among the children of men, which kingdom is established among them which are in the flesh—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.23
    scripture: book-of-mormon
    name: 1 Nephi 22:23
    book: 1 Nephi
    chapter: 22
    verse: 23
    ordinal: 610
    text: For the time speedily shall come that all churches which are built up to get gain, and all those who are built up to get power over the flesh, and those who are built up to become popular in the eyes of the world, and those who seek the lusts of the flesh and the things of the world, and to do all manner of iniquity; yea, in fine, all those who belong to the kingdom of the devil are they who need fear, and tremble, and quake; they are those who must be brought low in the dust; they are those who must be consumed as stubble; and this is according to the words of the prophet.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.24
    scripture: book-of-mormon
    name: 1 Nephi 22:24
    book: 1 Nephi
    chapter: 22
    verse: 24
    ordinal: 611
    text: And the time cometh speedily that the righteous must be led up as calves of the stall, and the Holy One of Israel must reign in dominion, and might, and power, and great glory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.25
    scripture: book-of-mormon
    name: 1 Nephi 22:25
    book: 1 Nephi
    chapter: 22
    verse: 25
    ordinal: 612
    text: And he gathereth his children from the four quarters of the earth; and he numbereth his sheep, and they know him; and there shall be one fold and one shepherd; and he shall feed his sheep, and in him they shall find pasture.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.26
    scripture: book-of-mormon
    name: 1 Nephi 22:26
    book: 1 Nephi
    chapter: 22
    verse: 26
    ordinal: 613
    text: And because of the righteousness of his people, Satan has no power; wherefore, he cannot be loosed for the space of many years; for he hath no power over the hearts of the people, for they dwell in righteousness, and the Holy One of Israel reigneth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.27
    scripture: book-of-mormon
    name: 1 Nephi 22:27
    book: 1 Nephi
    chapter: 22
    verse: 27
    ordinal: 614
    text: And now behold, I, Nephi, say unto you that all these things must come according to the flesh.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.28
    scripture: book-of-mormon
    name: 1 Nephi 22:28
    book: 1 Nephi
    chapter: 22
    verse: 28
    ordinal: 615
    text: But, behold, all nations, kindreds, tongues, and people shall dwell safely in the Holy One of Israel if it so be that they will repent.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.29
    scripture: book-of-mormon
    name: 1 Nephi 22:29
    book: 1 Nephi
    chapter: 22
    verse: 29
    ordinal: 616
    text: And now I, Nephi, make an end; for I durst not speak further as yet concerning these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.30
    scripture: book-of-mormon
    name: 1 Nephi 22:30
    book: 1 Nephi
    chapter: 22
    verse: 30
    ordinal: 617
    text: Wherefore, my brethren, I would that ye should consider that the things which have been written upon the plates of brass are true; and they testify that a man must be obedient to the commandments of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
- type: BomVerse
  data:
    ref: 1-nephi.22.31
    scripture: book-of-mormon
    name: 1 Nephi 22:31
    book: 1 Nephi
    chapter: 22
    verse: 31
    ordinal: 618
    text: Wherefore, ye need not suppose that I and my father are the only ones that have testified, and also taught them. Wherefore, if ye shall be obedient to the commandments, and endure to the end, ye shall be saved at the last day. And thus it is. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.22
