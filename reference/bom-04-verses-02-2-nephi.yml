    verse: 11
    ordinal: 661
    text: For it must needs be, that there is an opposition in all things. If not so, my firstborn in the wilderness, righteousness could not be brought to pass, neither wickedness, neither holiness nor misery, neither good nor bad. Wherefore, all things must needs be a compound in one; wherefore, if it should be one body it must needs remain as dead, having no life neither death, nor corruption nor incorruption, happiness nor misery, neither sense nor insensibility.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.12
    scripture: book-of-mormon
    name: 2 Nephi 2:12
    book: 2 Nephi
    chapter: 2
    verse: 12
    ordinal: 662
    text: Wherefore, it must needs have been created for a thing of naught; wherefore there would have been no purpose in the end of its creation. Wherefore, this thing must needs destroy the wisdom of God and his eternal purposes, and also the power, and the mercy, and the justice of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.13
    scripture: book-of-mormon
    name: 2 Nephi 2:13
    book: 2 Nephi
    chapter: 2
    verse: 13
    ordinal: 663
    text: And if ye shall say there is no law, ye shall also say there is no sin. If ye shall say there is no sin, ye shall also say there is no righteousness. And if there be no righteousness there be no happiness. And if there be no righteousness nor happiness there be no punishment nor misery. And if these things are not there is no God. And if there is no God we are not, neither the earth; for there could have been no creation of things, neither to act nor to be acted upon; wherefore, all things must have vanished away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.14
    scripture: book-of-mormon
    name: 2 Nephi 2:14
    book: 2 Nephi
    chapter: 2
    verse: 14
    ordinal: 664
    text: And now, my sons, I speak unto you these things for your profit and learning; for there is a God, and he hath created all things, both the heavens and the earth, and all things that in them are, both things to act and things to be acted upon.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.15
    scripture: book-of-mormon
    name: 2 Nephi 2:15
    book: 2 Nephi
    chapter: 2
    verse: 15
    ordinal: 665
    text: And to bring about his eternal purposes in the end of man, after he had created our first parents, and the beasts of the field and the fowls of the air, and in fine, all things which are created, it must needs be that there was an opposition; even the forbidden fruit in opposition to the tree of life; the one being sweet and the other bitter.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.16
    scripture: book-of-mormon
    name: 2 Nephi 2:16
    book: 2 Nephi
    chapter: 2
    verse: 16
    ordinal: 666
    text: Wherefore, the Lord God gave unto man that he should act for himself. Wherefore, man could not act for himself save it should be that he was enticed by the one or the other.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.17
    scripture: book-of-mormon
    name: 2 Nephi 2:17
    book: 2 Nephi
    chapter: 2
    verse: 17
    ordinal: 667
    text: And I, Lehi, according to the things which I have read, must needs suppose that an angel of God, according to that which is written, had fallen from heaven; wherefore, he became a devil, having sought that which was evil before God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.18
    scripture: book-of-mormon
    name: 2 Nephi 2:18
    book: 2 Nephi
    chapter: 2
    verse: 18
    ordinal: 668
    text: 'And because he had fallen from heaven, and had become miserable forever, he sought also the misery of all mankind. Wherefore, he said unto Eve, yea, even that old serpent, who is the devil, who is the father of all lies, wherefore he said: Partake of the forbidden fruit, and ye shall not die, but ye shall be as God, knowing good and evil.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.19
    scripture: book-of-mormon
    name: 2 Nephi 2:19
    book: 2 Nephi
    chapter: 2
    verse: 19
    ordinal: 669
    text: And after Adam and Eve had partaken of the forbidden fruit they were driven out of the garden of Eden, to till the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.20
    scripture: book-of-mormon
    name: 2 Nephi 2:20
    book: 2 Nephi
    chapter: 2
    verse: 20
    ordinal: 670
    text: And they have brought forth children; yea, even the family of all the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.21
    scripture: book-of-mormon
    name: 2 Nephi 2:21
    book: 2 Nephi
    chapter: 2
    verse: 21
    ordinal: 671
    text: And the days of the children of men were prolonged, according to the will of God, that they might repent while in the flesh; wherefore, their state became a state of probation, and their time was lengthened, according to the commandments which the Lord God gave unto the children of men. For he gave commandment that all men must repent; for he showed unto all men that they were lost, because of the transgression of their parents.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.22
    scripture: book-of-mormon
    name: 2 Nephi 2:22
    book: 2 Nephi
    chapter: 2
    verse: 22
    ordinal: 672
    text: And now, behold, if Adam had not transgressed he would not have fallen, but he would have remained in the garden of Eden. And all things which were created must have remained in the same state in which they were after they were created; and they must have remained forever, and had no end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.23
    scripture: book-of-mormon
    name: 2 Nephi 2:23
    book: 2 Nephi
    chapter: 2
    verse: 23
    ordinal: 673
    text: And they would have had no children; wherefore they would have remained in a state of innocence, having no joy, for they knew no misery; doing no good, for they knew no sin.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.24
    scripture: book-of-mormon
    name: 2 Nephi 2:24
    book: 2 Nephi
    chapter: 2
    verse: 24
    ordinal: 674
    text: But behold, all things have been done in the wisdom of him who knoweth all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.25
    scripture: book-of-mormon
    name: 2 Nephi 2:25
    book: 2 Nephi
    chapter: 2
    verse: 25
    ordinal: 675
    text: Adam fell that men might be; and men are, that they might have joy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.26
    scripture: book-of-mormon
    name: 2 Nephi 2:26
    book: 2 Nephi
    chapter: 2
    verse: 26
    ordinal: 676
    text: And the Messiah cometh in the fulness of time, that he may redeem the children of men from the fall. And because that they are redeemed from the fall they have become free forever, knowing good from evil; to act for themselves and not to be acted upon, save it be by the punishment of the law at the great and last day, according to the commandments which God hath given.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.27
    scripture: book-of-mormon
    name: 2 Nephi 2:27
    book: 2 Nephi
    chapter: 2
    verse: 27
    ordinal: 677
    text: Wherefore, men are free according to the flesh; and all things are given them which are expedient unto man. And they are free to choose liberty and eternal life, through the great Mediator of all men, or to choose captivity and death, according to the captivity and power of the devil; for he seeketh that all men might be miserable like unto himself.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.28
    scripture: book-of-mormon
    name: 2 Nephi 2:28
    book: 2 Nephi
    chapter: 2
    verse: 28
    ordinal: 678
    text: And now, my sons, I would that ye should look to the great Mediator, and hearken unto his great commandments; and be faithful unto his words, and choose eternal life, according to the will of his Holy Spirit;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.29
    scripture: book-of-mormon
    name: 2 Nephi 2:29
    book: 2 Nephi
    chapter: 2
    verse: 29
    ordinal: 679
    text: And not choose eternal death, according to the will of the flesh and the evil which is therein, which giveth the spirit of the devil power to captivate, to bring you down to hell, that he may reign over you in his own kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.2.30
    scripture: book-of-mormon
    name: 2 Nephi 2:30
    book: 2 Nephi
    chapter: 2
    verse: 30
    ordinal: 680
    text: I have spoken these few words unto you all, my sons, in the last days of my probation; and I have chosen the good part, according to the words of the prophet. And I have none other object save it be the everlasting welfare of your souls. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.2
- type: BomVerse
  data:
    ref: 2-nephi.3.1
    scripture: book-of-mormon
    name: 2 Nephi 3:1
    book: 2 Nephi
    chapter: 3
    verse: 1
    ordinal: 681
    text: And now I speak unto you, Joseph, my last-born. Thou wast born in the wilderness of mine afflictions; yea, in the days of my greatest sorrow did thy mother bear thee.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.2
    scripture: book-of-mormon
    name: 2 Nephi 3:2
    book: 2 Nephi
    chapter: 3
    verse: 2
    ordinal: 682
    text: And may the Lord consecrate also unto thee this land, which is a most precious land, for thine inheritance and the inheritance of thy seed with thy brethren, for thy security forever, if it so be that ye shall keep the commandments of the Holy One of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.3
    scripture: book-of-mormon
    name: 2 Nephi 3:3
    book: 2 Nephi
    chapter: 3
    verse: 3
    ordinal: 683
    text: And now, Joseph, my last-born, whom I have brought out of the wilderness of mine afflictions, may the Lord bless thee forever, for thy seed shall not utterly be destroyed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.4
    scripture: book-of-mormon
    name: 2 Nephi 3:4
    book: 2 Nephi
    chapter: 3
    verse: 4
    ordinal: 684
    text: For behold, thou art the fruit of my loins; and I am a descendant of Joseph who was carried captive into Egypt. And great were the covenants of the Lord which he made unto Joseph.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.5
    scripture: book-of-mormon
    name: 2 Nephi 3:5
    book: 2 Nephi
    chapter: 3
    verse: 5
    ordinal: 685
    text: Wherefore, Joseph truly saw our day. And he obtained a promise of the Lord, that out of the fruit of his loins the Lord God would raise up a righteous branch unto the house of Israel; not the Messiah, but a branch which was to be broken off, nevertheless, to be remembered in the covenants of the Lord that the Messiah should be made manifest unto them in the latter days, in the spirit of power, unto the bringing of them out of darkness unto light—yea, out of hidden darkness and out of captivity unto freedom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.6
    scripture: book-of-mormon
    name: 2 Nephi 3:6
    book: 2 Nephi
    chapter: 3
    verse: 6
    ordinal: 686
    text: 'For Joseph truly testified, saying: A seer shall the Lord my God raise up, who shall be a choice seer unto the fruit of my loins.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.7
    scripture: book-of-mormon
    name: 2 Nephi 3:7
    book: 2 Nephi
    chapter: 3
    verse: 7
    ordinal: 687
    text: 'Yea, Joseph truly said: Thus saith the Lord unto me: A choice seer will I raise up out of the fruit of thy loins; and he shall be esteemed highly among the fruit of thy loins. And unto him will I give commandment that he shall do a work for the fruit of thy loins, his brethren, which shall be of great worth unto them, even to the bringing of them to the knowledge of the covenants which I have made with thy fathers.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.8
    scripture: book-of-mormon
    name: 2 Nephi 3:8
    book: 2 Nephi
    chapter: 3
    verse: 8
    ordinal: 688
    text: And I will give unto him a commandment that he shall do none other work, save the work which I shall command him. And I will make him great in mine eyes; for he shall do my work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.9
    scripture: book-of-mormon
    name: 2 Nephi 3:9
    book: 2 Nephi
    chapter: 3
    verse: 9
    ordinal: 689
    text: And he shall be great like unto Moses, whom I have said I would raise up unto you, to deliver my people, O house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.10
    scripture: book-of-mormon
    name: 2 Nephi 3:10
    book: 2 Nephi
    chapter: 3
    verse: 10
    ordinal: 690
    text: And Moses will I raise up, to deliver thy people out of the land of Egypt.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.11
    scripture: book-of-mormon
    name: 2 Nephi 3:11
    book: 2 Nephi
    chapter: 3
    verse: 11
    ordinal: 691
    text: But a seer will I raise up out of the fruit of thy loins; and unto him will I give power to bring forth my word unto the seed of thy loins—and not to the bringing forth my word only, saith the Lord, but to the convincing them of my word, which shall have already gone forth among them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.12
    scripture: book-of-mormon
    name: 2 Nephi 3:12
    book: 2 Nephi
    chapter: 3
    verse: 12
    ordinal: 692
    text: Wherefore, the fruit of thy loins shall write; and the fruit of the loins of Judah shall write; and that which shall be written by the fruit of thy loins, and also that which shall be written by the fruit of the loins of Judah, shall grow together, unto the confounding of false doctrines and laying down of contentions, and establishing peace among the fruit of thy loins, and bringing them to the knowledge of their fathers in the latter days, and also to the knowledge of my covenants, saith the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.13
    scripture: book-of-mormon
    name: 2 Nephi 3:13
    book: 2 Nephi
    chapter: 3
    verse: 13
    ordinal: 693
    text: And out of weakness he shall be made strong, in that day when my work shall commence among all my people, unto the restoring thee, O house of Israel, saith the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.14
    scripture: book-of-mormon
    name: 2 Nephi 3:14
    book: 2 Nephi
    chapter: 3
    verse: 14
    ordinal: 694
    text: 'And thus prophesied Joseph, saying: Behold, that seer will the Lord bless; and they that seek to destroy him shall be confounded; for this promise, which I have obtained of the Lord, of the fruit of my loins, shall be fulfilled. Behold, I am sure of the fulfilling of this promise;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.15
    scripture: book-of-mormon
    name: 2 Nephi 3:15
    book: 2 Nephi
    chapter: 3
    verse: 15
    ordinal: 695
    text: And his name shall be called after me; and it shall be after the name of his father. And he shall be like unto me; for the thing, which the Lord shall bring forth by his hand, by the power of the Lord shall bring my people unto salvation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.16
    scripture: book-of-mormon
    name: 2 Nephi 3:16
    book: 2 Nephi
    chapter: 3
    verse: 16
    ordinal: 696
    text: 'Yea, thus prophesied Joseph: I am sure of this thing, even as I am sure of the promise of Moses; for the Lord hath said unto me, I will preserve thy seed forever.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.17
    scripture: book-of-mormon
    name: 2 Nephi 3:17
    book: 2 Nephi
    chapter: 3
    verse: 17
    ordinal: 697
    text: 'And the Lord hath said: I will raise up a Moses; and I will give power unto him in a rod; and I will give judgment unto him in writing. Yet I will not loose his tongue, that he shall speak much, for I will not make him mighty in speaking. But I will write unto him my law, by the finger of mine own hand; and I will make a spokesman for him.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.18
    scripture: book-of-mormon
    name: 2 Nephi 3:18
    book: 2 Nephi
    chapter: 3
    verse: 18
    ordinal: 698
    text: 'And the Lord said unto me also: I will raise up unto the fruit of thy loins; and I will make for him a spokesman. And I, behold, I will give unto him that he shall write the writing of the fruit of thy loins, unto the fruit of thy loins; and the spokesman of thy loins shall declare it.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.19
    scripture: book-of-mormon
    name: 2 Nephi 3:19
    book: 2 Nephi
    chapter: 3
    verse: 19
    ordinal: 699
    text: And the words which he shall write shall be the words which are expedient in my wisdom should go forth unto the fruit of thy loins. And it shall be as if the fruit of thy loins had cried unto them from the dust; for I know their faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.20
    scripture: book-of-mormon
    name: 2 Nephi 3:20
    book: 2 Nephi
    chapter: 3
    verse: 20
    ordinal: 700
    text: And they shall cry from the dust; yea, even repentance unto their brethren, even after many generations have gone by them. And it shall come to pass that their cry shall go, even according to the simpleness of their words.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.21
    scripture: book-of-mormon
    name: 2 Nephi 3:21
    book: 2 Nephi
    chapter: 3
    verse: 21
    ordinal: 701
    text: Because of their faith their words shall proceed forth out of my mouth unto their brethren who are the fruit of thy loins; and the weakness of their words will I make strong in their faith, unto the remembering of my covenant which I made unto thy fathers.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.22
    scripture: book-of-mormon
    name: 2 Nephi 3:22
    book: 2 Nephi
    chapter: 3
    verse: 22
    ordinal: 702
    text: And now, behold, my son Joseph, after this manner did my father of old prophesy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.23
    scripture: book-of-mormon
    name: 2 Nephi 3:23
    book: 2 Nephi
    chapter: 3
    verse: 23
    ordinal: 703
    text: Wherefore, because of this covenant thou art blessed; for thy seed shall not be destroyed, for they shall hearken unto the words of the book.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.24
    scripture: book-of-mormon
    name: 2 Nephi 3:24
    book: 2 Nephi
    chapter: 3
    verse: 24
    ordinal: 704
    text: And there shall rise up one mighty among them, who shall do much good, both in word and in deed, being an instrument in the hands of God, with exceeding faith, to work mighty wonders, and do that thing which is great in the sight of God, unto the bringing to pass much restoration unto the house of Israel, and unto the seed of thy brethren.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.3.25
    scripture: book-of-mormon
    name: 2 Nephi 3:25
    book: 2 Nephi
    chapter: 3
    verse: 25
    ordinal: 705
    text: And now, blessed art thou, Joseph. Behold, thou art little; wherefore hearken unto the words of thy brother, Nephi, and it shall be done unto thee even according to the words which I have spoken. Remember the words of thy dying father. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.3
- type: BomVerse
  data:
    ref: 2-nephi.4.1
    scripture: book-of-mormon
    name: 2 Nephi 4:1
    book: 2 Nephi
    chapter: 4
    verse: 1
    ordinal: 706
    text: And now, I, Nephi, speak concerning the prophecies of which my father hath spoken, concerning Joseph, who was carried into Egypt.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.2
    scripture: book-of-mormon
    name: 2 Nephi 4:2
    book: 2 Nephi
    chapter: 4
    verse: 2
    ordinal: 707
    text: For behold, he truly prophesied concerning all his seed. And the prophecies which he wrote, there are not many greater. And he prophesied concerning us, and our future generations; and they are written upon the plates of brass.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.3
    scripture: book-of-mormon
    name: 2 Nephi 4:3
    book: 2 Nephi
    chapter: 4
    verse: 3
    ordinal: 708
    text: 'Wherefore, after my father had made an end of speaking concerning the prophecies of Joseph, he called the children of Laman, his sons, and his daughters, and said unto them: Behold, my sons, and my daughters, who are the sons and the daughters of my firstborn, I would that ye should give ear unto my words.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.4
    scripture: book-of-mormon
    name: 2 Nephi 4:4
    book: 2 Nephi
    chapter: 4
    verse: 4
    ordinal: 709
    text: 'For the Lord God hath said that: Inasmuch as ye shall keep my commandments ye shall prosper in the land; and inasmuch as ye will not keep my commandments ye shall be cut off from my presence.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.5
    scripture: book-of-mormon
    name: 2 Nephi 4:5
    book: 2 Nephi
    chapter: 4
    verse: 5
    ordinal: 710
    text: But behold, my sons and my daughters, I cannot go down to my grave save I should leave a blessing upon you; for behold, I know that if ye are brought up in the way ye should go ye will not depart from it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.6
    scripture: book-of-mormon
    name: 2 Nephi 4:6
    book: 2 Nephi
    chapter: 4
    verse: 6
    ordinal: 711
    text: Wherefore, if ye are cursed, behold, I leave my blessing upon you, that the cursing may be taken from you and be answered upon the heads of your parents.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.7
    scripture: book-of-mormon
    name: 2 Nephi 4:7
    book: 2 Nephi
    chapter: 4
    verse: 7
    ordinal: 712
    text: Wherefore, because of my blessing the Lord God will not suffer that ye shall perish; wherefore, he will be merciful unto you and unto your seed forever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.8
    scripture: book-of-mormon
    name: 2 Nephi 4:8
    book: 2 Nephi
    chapter: 4
    verse: 8
    ordinal: 713
    text: And it came to pass that after my father had made an end of speaking to the sons and daughters of Laman, he caused the sons and daughters of Lemuel to be brought before him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.9
    scripture: book-of-mormon
    name: 2 Nephi 4:9
    book: 2 Nephi
    chapter: 4
    verse: 9
    ordinal: 714
    text: 'And he spake unto them, saying: Behold, my sons and my daughters, who are the sons and the daughters of my second son; behold I leave unto you the same blessing which I left unto the sons and daughters of Laman; wherefore, thou shalt not utterly be destroyed; but in the end thy seed shall be blessed.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.10
    scripture: book-of-mormon
    name: 2 Nephi 4:10
    book: 2 Nephi
    chapter: 4
    verse: 10
    ordinal: 715
    text: And it came to pass that when my father had made an end of speaking unto them, behold, he spake unto the sons of Ishmael, yea, and even all his household.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.11
    scripture: book-of-mormon
    name: 2 Nephi 4:11
    book: 2 Nephi
    chapter: 4
    verse: 11
    ordinal: 716
    text: 'And after he had made an end of speaking unto them, he spake unto Sam, saying: Blessed art thou, and thy seed; for thou shalt inherit the land like unto thy brother Nephi. And thy seed shall be numbered with his seed; and thou shalt be even like unto thy brother, and thy seed like unto his seed; and thou shalt be blessed in all thy days.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.12
    scripture: book-of-mormon
    name: 2 Nephi 4:12
    book: 2 Nephi
    chapter: 4
    verse: 12
    ordinal: 717
    text: And it came to pass after my father, Lehi, had spoken unto all his household, according to the feelings of his heart and the Spirit of the Lord which was in him, he waxed old. And it came to pass that he died, and was buried.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.13
    scripture: book-of-mormon
    name: 2 Nephi 4:13
    book: 2 Nephi
    chapter: 4
    verse: 13
    ordinal: 718
    text: And it came to pass that not many days after his death, Laman and Lemuel and the sons of Ishmael were angry with me because of the admonitions of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.14
    scripture: book-of-mormon
    name: 2 Nephi 4:14
    book: 2 Nephi
    chapter: 4
    verse: 14
    ordinal: 719
    text: For I, Nephi, was constrained to speak unto them, according to his word; for I had spoken many things unto them, and also my father, before his death; many of which sayings are written upon mine other plates; for a more history part are written upon mine other plates.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.15
    scripture: book-of-mormon
    name: 2 Nephi 4:15
    book: 2 Nephi
    chapter: 4
    verse: 15
    ordinal: 720
    text: And upon these I write the things of my soul, and many of the scriptures which are engraven upon the plates of brass. For my soul delighteth in the scriptures, and my heart pondereth them, and writeth them for the learning and the profit of my children.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.16
    scripture: book-of-mormon
    name: 2 Nephi 4:16
    book: 2 Nephi
    chapter: 4
    verse: 16
    ordinal: 721
    text: Behold, my soul delighteth in the things of the Lord; and my heart pondereth continually upon the things which I have seen and heard.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.17
    scripture: book-of-mormon
    name: 2 Nephi 4:17
    book: 2 Nephi
    chapter: 4
    verse: 17
    ordinal: 722
    text: 'Nevertheless, notwithstanding the great goodness of the Lord, in showing me his great and marvelous works, my heart exclaimeth: O wretched man that I am! Yea, my heart sorroweth because of my flesh; my soul grieveth because of mine iniquities.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.18
    scripture: book-of-mormon
    name: 2 Nephi 4:18
    book: 2 Nephi
    chapter: 4
    verse: 18
    ordinal: 723
    text: I am encompassed about, because of the temptations and the sins which do so easily beset me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.19
    scripture: book-of-mormon
    name: 2 Nephi 4:19
    book: 2 Nephi
    chapter: 4
    verse: 19
    ordinal: 724
    text: And when I desire to rejoice, my heart groaneth because of my sins; nevertheless, I know in whom I have trusted.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.20
    scripture: book-of-mormon
    name: 2 Nephi 4:20
    book: 2 Nephi
    chapter: 4
    verse: 20
    ordinal: 725
    text: My God hath been my support; he hath led me through mine afflictions in the wilderness; and he hath preserved me upon the waters of the great deep.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.21
    scripture: book-of-mormon
    name: 2 Nephi 4:21
    book: 2 Nephi
    chapter: 4
    verse: 21
    ordinal: 726
    text: He hath filled me with his love, even unto the consuming of my flesh.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.22
    scripture: book-of-mormon
    name: 2 Nephi 4:22
    book: 2 Nephi
    chapter: 4
    verse: 22
    ordinal: 727
    text: He hath confounded mine enemies, unto the causing of them to quake before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.23
    scripture: book-of-mormon
    name: 2 Nephi 4:23
    book: 2 Nephi
    chapter: 4
    verse: 23
    ordinal: 728
    text: Behold, he hath heard my cry by day, and he hath given me knowledge by visions in the night-time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.24
    scripture: book-of-mormon
    name: 2 Nephi 4:24
    book: 2 Nephi
    chapter: 4
    verse: 24
    ordinal: 729
    text: And by day have I waxed bold in mighty prayer before him; yea, my voice have I sent up on high; and angels came down and ministered unto me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.25
    scripture: book-of-mormon
    name: 2 Nephi 4:25
    book: 2 Nephi
    chapter: 4
    verse: 25
    ordinal: 730
    text: And upon the wings of his Spirit hath my body been carried away upon exceedingly high mountains. And mine eyes have beheld great things, yea, even too great for man; therefore I was bidden that I should not write them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.26
    scripture: book-of-mormon
    name: 2 Nephi 4:26
    book: 2 Nephi
    chapter: 4
    verse: 26
    ordinal: 731
    text: O then, if I have seen so great things, if the Lord in his condescension unto the children of men hath visited men in so much mercy, why should my heart weep and my soul linger in the valley of sorrow, and my flesh waste away, and my strength slacken, because of mine afflictions?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.27
    scripture: book-of-mormon
    name: 2 Nephi 4:27
    book: 2 Nephi
    chapter: 4
    verse: 27
    ordinal: 732
    text: And why should I yield to sin, because of my flesh? Yea, why should I give way to temptations, that the evil one have place in my heart to destroy my peace and afflict my soul? Why am I angry because of mine enemy?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.28
    scripture: book-of-mormon
    name: 2 Nephi 4:28
    book: 2 Nephi
    chapter: 4
    verse: 28
    ordinal: 733
    text: Awake, my soul! No longer droop in sin. Rejoice, O my heart, and give place no more for the enemy of my soul.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.29
    scripture: book-of-mormon
    name: 2 Nephi 4:29
    book: 2 Nephi
    chapter: 4
    verse: 29
    ordinal: 734
    text: Do not anger again because of mine enemies. Do not slacken my strength because of mine afflictions.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.30
    scripture: book-of-mormon
    name: 2 Nephi 4:30
    book: 2 Nephi
    chapter: 4
    verse: 30
    ordinal: 735
    text: 'Rejoice, O my heart, and cry unto the Lord, and say: O Lord, I will praise thee forever; yea, my soul will rejoice in thee, my God, and the rock of my salvation.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.31
    scripture: book-of-mormon
    name: 2 Nephi 4:31
    book: 2 Nephi
    chapter: 4
    verse: 31
    ordinal: 736
    text: O Lord, wilt thou redeem my soul? Wilt thou deliver me out of the hands of mine enemies? Wilt thou make me that I may shake at the appearance of sin?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.32
    scripture: book-of-mormon
    name: 2 Nephi 4:32
    book: 2 Nephi
    chapter: 4
    verse: 32
    ordinal: 737
    text: May the gates of hell be shut continually before me, because that my heart is broken and my spirit is contrite! O Lord, wilt thou not shut the gates of thy righteousness before me, that I may walk in the path of the low valley, that I may be strict in the plain road!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.33
    scripture: book-of-mormon
    name: 2 Nephi 4:33
    book: 2 Nephi
    chapter: 4
    verse: 33
    ordinal: 738
    text: O Lord, wilt thou encircle me around in the robe of thy righteousness! O Lord, wilt thou make a way for mine escape before mine enemies! Wilt thou make my path straight before me! Wilt thou not place a stumbling block in my way—but that thou wouldst clear my way before me, and hedge not up my way, but the ways of mine enemy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.34
    scripture: book-of-mormon
    name: 2 Nephi 4:34
    book: 2 Nephi
    chapter: 4
    verse: 34
    ordinal: 739
    text: O Lord, I have trusted in thee, and I will trust in thee forever. I will not put my trust in the arm of flesh; for I know that cursed is he that putteth his trust in the arm of flesh. Yea, cursed is he that putteth his trust in man or maketh flesh his arm.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.4.35
    scripture: book-of-mormon
    name: 2 Nephi 4:35
    book: 2 Nephi
    chapter: 4
    verse: 35
    ordinal: 740
    text: Yea, I know that God will give liberally to him that asketh. Yea, my God will give me, if I ask not amiss; therefore I will lift up my voice unto thee; yea, I will cry unto thee, my God, the rock of my righteousness. Behold, my voice shall forever ascend up unto thee, my rock and mine everlasting God. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.4
- type: BomVerse
  data:
    ref: 2-nephi.5.1
    scripture: book-of-mormon
    name: 2 Nephi 5:1
    book: 2 Nephi
    chapter: 5
    verse: 1
    ordinal: 741
    text: Behold, it came to pass that I, Nephi, did cry much unto the Lord my God, because of the anger of my brethren.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.2
    scripture: book-of-mormon
    name: 2 Nephi 5:2
    book: 2 Nephi
    chapter: 5
    verse: 2
    ordinal: 742
    text: But behold, their anger did increase against me, insomuch that they did seek to take away my life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.3
    scripture: book-of-mormon
    name: 2 Nephi 5:3
    book: 2 Nephi
    chapter: 5
    verse: 3
    ordinal: 743
    text: 'Yea, they did murmur against me, saying: Our younger brother thinks to rule over us; and we have had much trial because of him; wherefore, now let us slay him, that we may not be afflicted more because of his words. For behold, we will not have him to be our ruler; for it belongs unto us, who are the elder brethren, to rule over this people.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.4
    scripture: book-of-mormon
    name: 2 Nephi 5:4
    book: 2 Nephi
    chapter: 5
    verse: 4
    ordinal: 744
    text: Now I do not write upon these plates all the words which they murmured against me. But it sufficeth me to say, that they did seek to take away my life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.5
    scripture: book-of-mormon
    name: 2 Nephi 5:5
    book: 2 Nephi
    chapter: 5
    verse: 5
    ordinal: 745
    text: And it came to pass that the Lord did warn me, that I, Nephi, should depart from them and flee into the wilderness, and all those who would go with me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.6
    scripture: book-of-mormon
    name: 2 Nephi 5:6
    book: 2 Nephi
    chapter: 5
    verse: 6
    ordinal: 746
    text: Wherefore, it came to pass that I, Nephi, did take my family, and also Zoram and his family, and Sam, mine elder brother and his family, and Jacob and Joseph, my younger brethren, and also my sisters, and all those who would go with me. And all those who would go with me were those who believed in the warnings and the revelations of God; wherefore, they did hearken unto my words.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.7
    scripture: book-of-mormon
    name: 2 Nephi 5:7
    book: 2 Nephi
    chapter: 5
    verse: 7
    ordinal: 747
    text: And we did take our tents and whatsoever things were possible for us, and did journey in the wilderness for the space of many days. And after we had journeyed for the space of many days we did pitch our tents.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.8
    scripture: book-of-mormon
    name: 2 Nephi 5:8
    book: 2 Nephi
    chapter: 5
    verse: 8
    ordinal: 748
    text: And my people would that we should call the name of the place Nephi; wherefore, we did call it Nephi.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.9
    scripture: book-of-mormon
    name: 2 Nephi 5:9
    book: 2 Nephi
    chapter: 5
    verse: 9
    ordinal: 749
    text: And all those who were with me did take upon them to call themselves the people of Nephi.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.10
    scripture: book-of-mormon
    name: 2 Nephi 5:10
    book: 2 Nephi
    chapter: 5
    verse: 10
    ordinal: 750
    text: And we did observe to keep the judgments, and the statutes, and the commandments of the Lord in all things, according to the law of Moses.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.11
    scripture: book-of-mormon
    name: 2 Nephi 5:11
    book: 2 Nephi
    chapter: 5
    verse: 11
    ordinal: 751
    text: And the Lord was with us; and we did prosper exceedingly; for we did sow seed, and we did reap again in abundance. And we began to raise flocks, and herds, and animals of every kind.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.12
    scripture: book-of-mormon
    name: 2 Nephi 5:12
    book: 2 Nephi
    chapter: 5
    verse: 12
    ordinal: 752
    text: And I, Nephi, had also brought the records which were engraven upon the plates of brass; and also the ball, or compass, which was prepared for my father by the hand of the Lord, according to that which is written.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.13
    scripture: book-of-mormon
    name: 2 Nephi 5:13
    book: 2 Nephi
    chapter: 5
    verse: 13
    ordinal: 753
    text: And it came to pass that we began to prosper exceedingly, and to multiply in the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.14
    scripture: book-of-mormon
    name: 2 Nephi 5:14
    book: 2 Nephi
    chapter: 5
    verse: 14
    ordinal: 754
    text: And I, Nephi, did take the sword of Laban, and after the manner of it did make many swords, lest by any means the people who were now called Lamanites should come upon us and destroy us; for I knew their hatred towards me and my children and those who were called my people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.15
    scripture: book-of-mormon
    name: 2 Nephi 5:15
    book: 2 Nephi
    chapter: 5
    verse: 15
    ordinal: 755
    text: And I did teach my people to build buildings, and to work in all manner of wood, and of iron, and of copper, and of brass, and of steel, and of gold, and of silver, and of precious ores, which were in great abundance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.16
    scripture: book-of-mormon
    name: 2 Nephi 5:16
    book: 2 Nephi
    chapter: 5
    verse: 16
    ordinal: 756
    text: And I, Nephi, did build a temple; and I did construct it after the manner of the temple of Solomon save it were not built of so many precious things; for they were not to be found upon the land, wherefore, it could not be built like unto Solomon's temple. But the manner of the construction was like unto the temple of Solomon; and the workmanship thereof was exceedingly fine.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.17
    scripture: book-of-mormon
    name: 2 Nephi 5:17
    book: 2 Nephi
    chapter: 5
    verse: 17
    ordinal: 757
    text: And it came to pass that I, Nephi, did cause my people to be industrious, and to labor with their hands.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.18
    scripture: book-of-mormon
    name: 2 Nephi 5:18
    book: 2 Nephi
    chapter: 5
    verse: 18
    ordinal: 758
    text: And it came to pass that they would that I should be their king. But I, Nephi, was desirous that they should have no king; nevertheless, I did for them according to that which was in my power.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.19
    scripture: book-of-mormon
    name: 2 Nephi 5:19
    book: 2 Nephi
    chapter: 5
    verse: 19
    ordinal: 759
    text: And behold, the words of the Lord had been fulfilled unto my brethren, which he spake concerning them, that I should be their ruler and their teacher. Wherefore, I had been their ruler and their teacher, according to the commandments of the Lord, until the time they sought to take away my life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.20
    scripture: book-of-mormon
    name: 2 Nephi 5:20
    book: 2 Nephi
    chapter: 5
    verse: 20
    ordinal: 760
    text: 'Wherefore, the word of the Lord was fulfilled which he spake unto me, saying that: Inasmuch as they will not hearken unto thy words they shall be cut off from the presence of the Lord. And behold, they were cut off from his presence.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.21
    scripture: book-of-mormon
    name: 2 Nephi 5:21
    book: 2 Nephi
    chapter: 5
    verse: 21
    ordinal: 761
    text: And he had caused the cursing to come upon them, yea, even a sore cursing, because of their iniquity. For behold, they had hardened their hearts against him, that they had become like unto a flint; wherefore, as they were white, and exceedingly fair and delightsome, that they might not be enticing unto my people the Lord God did cause a skin of blackness to come upon them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.22
    scripture: book-of-mormon
    name: 2 Nephi 5:22
    book: 2 Nephi
    chapter: 5
    verse: 22
    ordinal: 762
    text: 'And thus saith the Lord God: I will cause that they shall be loathsome unto thy people, save they shall repent of their iniquities.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.23
    scripture: book-of-mormon
    name: 2 Nephi 5:23
    book: 2 Nephi
    chapter: 5
    verse: 23
    ordinal: 763
    text: And cursed shall be the seed of him that mixeth with their seed; for they shall be cursed even with the same cursing. And the Lord spake it, and it was done.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.24
    scripture: book-of-mormon
    name: 2 Nephi 5:24
    book: 2 Nephi
    chapter: 5
    verse: 24
    ordinal: 764
    text: And because of their cursing which was upon them they did become an idle people, full of mischief and subtlety, and did seek in the wilderness for beasts of prey.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.25
    scripture: book-of-mormon
    name: 2 Nephi 5:25
    book: 2 Nephi
    chapter: 5
    verse: 25
    ordinal: 765
    text: 'And the Lord God said unto me: They shall be a scourge unto thy seed, to stir them up in remembrance of me; and inasmuch as they will not remember me, and hearken unto my words, they shall scourge them even unto destruction.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.26
    scripture: book-of-mormon
    name: 2 Nephi 5:26
    book: 2 Nephi
    chapter: 5
    verse: 26
    ordinal: 766
    text: And it came to pass that I, Nephi, did consecrate Jacob and Joseph, that they should be priests and teachers over the land of my people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.27
    scripture: book-of-mormon
    name: 2 Nephi 5:27
    book: 2 Nephi
    chapter: 5
    verse: 27
    ordinal: 767
    text: And it came to pass that we lived after the manner of happiness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.28
    scripture: book-of-mormon
    name: 2 Nephi 5:28
    book: 2 Nephi
    chapter: 5
    verse: 28
    ordinal: 768
    text: And thirty years had passed away from the time we left Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.29
    scripture: book-of-mormon
    name: 2 Nephi 5:29
    book: 2 Nephi
    chapter: 5
    verse: 29
    ordinal: 769
    text: And I, Nephi, had kept the records upon my plates, which I had made, of my people thus far.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.30
    scripture: book-of-mormon
    name: 2 Nephi 5:30
    book: 2 Nephi
    chapter: 5
    verse: 30
    ordinal: 770
    text: 'And it came to pass that the Lord God said unto me: Make other plates; and thou shalt engraven many things upon them which are good in my sight, for the profit of thy people.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.31
    scripture: book-of-mormon
    name: 2 Nephi 5:31
    book: 2 Nephi
    chapter: 5
    verse: 31
    ordinal: 771
    text: Wherefore, I, Nephi, to be obedient to the commandments of the Lord, went and made these plates upon which I have engraven these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.32
    scripture: book-of-mormon
    name: 2 Nephi 5:32
    book: 2 Nephi
    chapter: 5
    verse: 32
    ordinal: 772
    text: And I engraved that which is pleasing unto God. And if my people are pleased with the things of God they will be pleased with mine engravings which are upon these plates.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.33
    scripture: book-of-mormon
    name: 2 Nephi 5:33
    book: 2 Nephi
    chapter: 5
    verse: 33
    ordinal: 773
    text: And if my people desire to know the more particular part of the history of my people they must search mine other plates.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.5.34
    scripture: book-of-mormon
    name: 2 Nephi 5:34
    book: 2 Nephi
    chapter: 5
    verse: 34
    ordinal: 774
    text: And it sufficeth me to say that forty years had passed away, and we had already had wars and contentions with our brethren.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.5
- type: BomVerse
  data:
    ref: 2-nephi.6.1
    scripture: book-of-mormon
    name: 2 Nephi 6:1
    book: 2 Nephi
    chapter: 6
    verse: 1
    ordinal: 775
    text: 'The words of Jacob, the brother of Nephi, which he spake unto the people of Nephi:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.2
    scripture: book-of-mormon
    name: 2 Nephi 6:2
    book: 2 Nephi
    chapter: 6
    verse: 2
    ordinal: 776
    text: Behold, my beloved brethren, I, Jacob, having been called of God, and ordained after the manner of his holy order, and having been consecrated by my brother Nephi, unto whom ye look as a king or a protector, and on whom ye depend for safety, behold ye know that I have spoken unto you exceedingly many things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.3
    scripture: book-of-mormon
    name: 2 Nephi 6:3
    book: 2 Nephi
    chapter: 6
    verse: 3
    ordinal: 777
    text: Nevertheless, I speak unto you again; for I am desirous for the welfare of your souls. Yea, mine anxiety is great for you; and ye yourselves know that it ever has been. For I have exhorted you with all diligence; and I have taught you the words of my father; and I have spoken unto you concerning all things which are written, from the creation of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.4
    scripture: book-of-mormon
    name: 2 Nephi 6:4
    book: 2 Nephi
    chapter: 6
    verse: 4
    ordinal: 778
    text: And now, behold, I would speak unto you concerning things which are, and which are to come; wherefore, I will read you the words of Isaiah. And they are the words which my brother has desired that I should speak unto you. And I speak unto you for your sakes, that ye may learn and glorify the name of your God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.5
    scripture: book-of-mormon
    name: 2 Nephi 6:5
    book: 2 Nephi
    chapter: 6
    verse: 5
    ordinal: 779
    text: And now, the words which I shall read are they which Isaiah spake concerning all the house of Israel; wherefore, they may be likened unto you, for ye are of the house of Israel. And there are many things which have been spoken by Isaiah which may be likened unto you, because ye are of the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.6
    scripture: book-of-mormon
    name: 2 Nephi 6:6
    book: 2 Nephi
    chapter: 6
    verse: 6
    ordinal: 780
    text: 'And now, these are the words: Thus saith the Lord God: Behold, I will lift up mine hand to the Gentiles, and set up my standard to the people; and they shall bring thy sons in their arms, and thy daughters shall be carried upon their shoulders.'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 49:22
    kjvOsis:
    - Isa.49.22
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.7
    scripture: book-of-mormon
    name: 2 Nephi 6:7
    book: 2 Nephi
    chapter: 6
    verse: 7
    ordinal: 781
    text: And kings shall be thy nursing fathers, and their queens thy nursing mothers; they shall bow down to thee with their faces towards the earth, and lick up the dust of thy feet; and thou shalt know that I am the Lord; for they shall not be ashamed that wait for me.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 49:23
    kjvOsis:
    - Isa.49.23
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.8
    scripture: book-of-mormon
    name: 2 Nephi 6:8
    book: 2 Nephi
    chapter: 6
    verse: 8
    ordinal: 782
    text: And now I, Jacob, would speak somewhat concerning these words. For behold, the Lord has shown me that those who were at Jerusalem, from whence we came, have been slain and carried away captive.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.9
    scripture: book-of-mormon
    name: 2 Nephi 6:9
    book: 2 Nephi
    chapter: 6
    verse: 9
    ordinal: 783
    text: Nevertheless, the Lord has shown unto me that they should return again. And he also has shown unto me that the Lord God, the Holy One of Israel, should manifest himself unto them in the flesh; and after he should manifest himself they should scourge him and crucify him, according to the words of the angel who spake it unto me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.10
    scripture: book-of-mormon
    name: 2 Nephi 6:10
    book: 2 Nephi
    chapter: 6
    verse: 10
    ordinal: 784
    text: And after they have hardened their hearts and stiffened their necks against the Holy One of Israel, behold, the judgments of the Holy One of Israel shall come upon them. And the day cometh that they shall be smitten and afflicted.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.11
    scripture: book-of-mormon
    name: 2 Nephi 6:11
    book: 2 Nephi
    chapter: 6
    verse: 11
    ordinal: 785
    text: Wherefore, after they are driven to and fro, for thus saith the angel, many shall be afflicted in the flesh, and shall not be suffered to perish, because of the prayers of the faithful; they shall be scattered, and smitten, and hated; nevertheless, the Lord will be merciful unto them, that when they shall come to the knowledge of their Redeemer, they shall be gathered together again to the lands of their inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.12
    scripture: book-of-mormon
    name: 2 Nephi 6:12
    book: 2 Nephi
    chapter: 6
    verse: 12
    ordinal: 786
    text: And blessed are the Gentiles, they of whom the prophet has written; for behold, if it so be that they shall repent and fight not against Zion, and do not unite themselves to that great and abominable church, they shall be saved; for the Lord God will fulfil his covenants which he has made unto his children; and for this cause the prophet has written these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.13
    scripture: book-of-mormon
    name: 2 Nephi 6:13
    book: 2 Nephi
    chapter: 6
    verse: 13
    ordinal: 787
    text: Wherefore, they that fight against Zion and the covenant people of the Lord shall lick up the dust of their feet; and the people of the Lord shall not be ashamed. For the people of the Lord are they who wait for him; for they still wait for the coming of the Messiah.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Isaiah 49:23
    kjvAllusionOsis:
    - Isa.49.23
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.14
    scripture: book-of-mormon
    name: 2 Nephi 6:14
    book: 2 Nephi
    chapter: 6
    verse: 14
    ordinal: 788
    text: And behold, according to the words of the prophet, the Messiah will set himself again the second time to recover them; wherefore, he will manifest himself unto them in power and great glory, unto the destruction of their enemies, when that day cometh when they shall believe in him; and none will he destroy that believe in him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.15
    scripture: book-of-mormon
    name: 2 Nephi 6:15
    book: 2 Nephi
    chapter: 6
    verse: 15
    ordinal: 789
    text: And they that believe not in him shall be destroyed, both by fire, and by tempest, and by earthquakes, and by bloodsheds, and by pestilence, and by famine. And they shall know that the Lord is God, the Holy One of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.16
    scripture: book-of-mormon
    name: 2 Nephi 6:16
    book: 2 Nephi
    chapter: 6
    verse: 16
    ordinal: 790
    text: For shall the prey be taken from the mighty, or the lawful captive delivered?
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 49:24
    kjvOsis:
    - Isa.49.24
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.17
    scripture: book-of-mormon
    name: 2 Nephi 6:17
    book: 2 Nephi
    chapter: 6
    verse: 17
    ordinal: 791
    text: 'But thus saith the Lord: Even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered; for the Mighty God shall deliver his covenant people. For thus saith the Lord: I will contend with them that contendeth with thee—'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 49:25
    kjvOsis:
    - Isa.49.25
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.6.18
    scripture: book-of-mormon
    name: 2 Nephi 6:18
    book: 2 Nephi
    chapter: 6
    verse: 18
    ordinal: 792
    text: And I will feed them that oppress thee, with their own flesh; and they shall be drunken with their own blood as with sweet wine; and all flesh shall know that I the Lord am thy Savior and thy Redeemer, the Mighty One of Jacob.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 49:26
    kjvOsis:
    - Isa.49.26
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.6
- type: BomVerse
  data:
    ref: 2-nephi.7.1
    scripture: book-of-mormon
    name: 2 Nephi 7:1
    book: 2 Nephi
    chapter: 7
    verse: 1
    ordinal: 793
    text: 'Yea, for thus saith the Lord: Have I put thee away, or have I cast thee off forever? For thus saith the Lord: Where is the bill of your mother''s divorcement? To whom have I put thee away, or to which of my creditors have I sold you? Yea, to whom have I sold you? Behold, for your iniquities have ye sold yourselves, and for your transgressions is your mother put away.'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 50:1
    kjvOsis:
    - Isa.50.1
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 2-nephi.7
- type: BomVerse
  data:
    ref: 2-nephi.7.2
