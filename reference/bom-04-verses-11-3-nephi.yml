    scripture: book-of-mormon
    name: 3 Nephi 20:24
    book: 3 Nephi
    chapter: 20
    verse: 24
    ordinal: 5521
    text: Verily I say unto you, yea, and all the prophets from Samuel and those that follow after, as many as have spoken, have testified of me.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Acts 3:24
    kjvOsis:
    - Acts.3.24
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.20
- type: BomVerse
  data:
