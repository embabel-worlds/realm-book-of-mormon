    name: 3 Nephi 22:6
    book: 3 Nephi
    chapter: 22
    verse: 6
    ordinal: 5578
    text: For the Lord hath called thee as a woman forsaken and grieved in spirit, and a wife of youth, when thou wast refused, saith thy God.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 54:6
    kjvOsis:
    - Isa.54.6
  relations:
  - predicate: IN
    to:
