- type: BomVerse
  data:
    ref: 3-nephi.14.21
    scripture: book-of-mormon
    name: 3 Nephi 14:21
    book: 3 Nephi
    chapter: 14
    verse: 21
    ordinal: 5347
    text: Not every one that saith unto me, Lord, Lord, shall enter into the kingdom of heaven; but he that doeth the will of my Father who is in heaven.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Matthew 7:21
    kjvOsis:
    - Matt.7.21
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.14
- type: BomVerse
  data:
    ref: 3-nephi.14.22
    scripture: book-of-mormon
    name: 3 Nephi 14:22
    book: 3 Nephi
    chapter: 14
    verse: 22
    ordinal: 5348
    text: 'Many will say to me in that day: Lord, Lord, have we not prophesied in thy name, and in thy name have cast out devils, and in thy name done many wonderful works?'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Matthew 7:22
    kjvOsis:
    - Matt.7.22
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.14
- type: BomVerse
  data:
    ref: 3-nephi.14.23
    scripture: book-of-mormon
    name: 3 Nephi 14:23
    book: 3 Nephi
    chapter: 14
    verse: 23
    ordinal: 5349
    text: 'And then will I profess unto them: I never knew you; depart from me, ye that work iniquity.'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Matthew 7:23
    kjvOsis:
    - Matt.7.23
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.14
- type: BomVerse
  data:
    ref: 3-nephi.14.24
    scripture: book-of-mormon
    name: 3 Nephi 14:24
    book: 3 Nephi
    chapter: 14
    verse: 24
    ordinal: 5350
    text: Therefore, whoso heareth these sayings of mine and doeth them, I will liken him unto a wise man, who built his house upon a rock—
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Matthew 7:24
    kjvOsis:
    - Matt.7.24
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.14
- type: BomVerse
  data:
    ref: 3-nephi.14.25
    scripture: book-of-mormon
    name: 3 Nephi 14:25
    book: 3 Nephi
    chapter: 14
    verse: 25
    ordinal: 5351
    text: And the rain descended, and the floods came, and the winds blew, and beat upon that house; and it fell not, for it was founded upon a rock.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Matthew 7:25
    kjvOsis:
    - Matt.7.25
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.14
- type: BomVerse
  data:
    ref: 3-nephi.14.26
    scripture: book-of-mormon
    name: 3 Nephi 14:26
    book: 3 Nephi
    chapter: 14
    verse: 26
    ordinal: 5352
    text: And every one that heareth these sayings of mine and doeth them not shall be likened unto a foolish man, who built his house upon the sand—
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Matthew 7:26
    kjvOsis:
    - Matt.7.26
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.14
- type: BomVerse
  data:
    ref: 3-nephi.14.27
    scripture: book-of-mormon
    name: 3 Nephi 14:27
    book: 3 Nephi
    chapter: 14
    verse: 27
    ordinal: 5353
    text: And the rain descended, and the floods came, and the winds blew, and beat upon that house; and it fell, and great was the fall of it.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Matthew 7:27
    kjvOsis:
    - Matt.7.27
  relations:
  - predicate: IN
    to:
      type: BomChapter
