    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.27
    scripture: book-of-mormon
    name: 3 Nephi 21:27
    book: 3 Nephi
    chapter: 21
    verse: 27
    ordinal: 5570
    text: Yea, the work shall commence among all the dispersed of my people, with the Father to prepare the way whereby they may come unto me, that they may call on the Father in my name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.28
    scripture: book-of-mormon
    name: 3 Nephi 21:28
    book: 3 Nephi
    chapter: 21
    verse: 28
    ordinal: 5571
    text: Yea, and then shall the work commence, with the Father among all nations in preparing the way whereby his people may be gathered home to the land of their inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.29
    scripture: book-of-mormon
    name: 3 Nephi 21:29
    book: 3 Nephi
    chapter: 21
    verse: 29
    ordinal: 5572
    text: And they shall go out from all nations; and they shall not go out in haste, nor go by flight, for I will go before them, saith the Father, and I will be their rearward.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 52:12
    kjvOsis:
    - Isa.52.12
  relations:
