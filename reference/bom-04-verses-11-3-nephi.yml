    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.25
    scripture: book-of-mormon
    name: 3 Nephi 21:25
    book: 3 Nephi
    chapter: 21
    verse: 25
    ordinal: 5568
