- type: BomVerse
  data:
    ref: 3-nephi.23.1
    scripture: book-of-mormon
    name: 3 Nephi 23:1
    book: 3 Nephi
    chapter: 23
    verse: 1
    ordinal: 5590
    text: And now, behold, I say unto you, that ye ought to search these things. Yea, a commandment I give unto you that ye search these things diligently; for great are the words of Isaiah.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.23.2
    scripture: book-of-mormon
    name: 3 Nephi 23:2
    book: 3 Nephi
    chapter: 23
    verse: 2
    ordinal: 5591
    text: For surely he spake as touching all things concerning my people which are of the house of Israel; therefore it must needs be that he must speak also to the Gentiles.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.23.3
    scripture: book-of-mormon
    name: 3 Nephi 23:3
    book: 3 Nephi
    chapter: 23
    verse: 3
    ordinal: 5592
    text: And all things that he spake have been and shall be, even according to the words which he spake.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.23.4
    scripture: book-of-mormon
    name: 3 Nephi 23:4
    book: 3 Nephi
    chapter: 23
    verse: 4
    ordinal: 5593
    text: Therefore give heed to my words; write the things which I have told you; and according to the time and the will of the Father they shall go forth unto the Gentiles.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.23.5
    scripture: book-of-mormon
    name: 3 Nephi 23:5
    book: 3 Nephi
    chapter: 23
    verse: 5
    ordinal: 5594
    text: And whosoever will hearken unto my words and repenteth and is baptized, the same shall be saved. Search the prophets, for many there be that testify of these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.23.6
    scripture: book-of-mormon
    name: 3 Nephi 23:6
    book: 3 Nephi
    chapter: 23
    verse: 6
    ordinal: 5595
    text: 'And now it came to pass that when Jesus had said these words he said unto them again, after he had expounded all the scriptures unto them which they had received, he said unto them: Behold, other scriptures I would that ye should write, that ye have not.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.23.7
    scripture: book-of-mormon
    name: 3 Nephi 23:7
    book: 3 Nephi
    chapter: 23
    verse: 7
    ordinal: 5596
    text: 'And it came to pass that he said unto Nephi: Bring forth the record which ye have kept.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.23.8
    scripture: book-of-mormon
    name: 3 Nephi 23:8
    book: 3 Nephi
    chapter: 23
    verse: 8
    ordinal: 5597
    text: 'And when Nephi had brought forth the records, and laid them before him, he cast his eyes upon them and said:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.23.9
    scripture: book-of-mormon
    name: 3 Nephi 23:9
    book: 3 Nephi
    chapter: 23
    verse: 9
    ordinal: 5598
    text: 'Verily I say unto you, I commanded my servant Samuel, the Lamanite, that he should testify unto this people, that at the day that the Father should glorify his name in me that there were many saints who should arise from the dead, and should appear unto many, and should minister unto them. And he said unto them: Was it not so?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.23.10
    scripture: book-of-mormon
    name: 3 Nephi 23:10
    book: 3 Nephi
    chapter: 23
    verse: 10
    ordinal: 5599
    text: 'And his disciples answered him and said: Yea, Lord, Samuel did prophesy according to thy words, and they were all fulfilled.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.23.11
    scripture: book-of-mormon
    name: 3 Nephi 23:11
    book: 3 Nephi
    chapter: 23
    verse: 11
    ordinal: 5600
    text: 'And Jesus said unto them: How be it that ye have not written this thing, that many saints did arise and appear unto many and did minister unto them?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.23.12
    scripture: book-of-mormon
    name: 3 Nephi 23:12
    book: 3 Nephi
    chapter: 23
    verse: 12
    ordinal: 5601
    text: And it came to pass that Nephi remembered that this thing had not been written.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.23.13
    scripture: book-of-mormon
    name: 3 Nephi 23:13
    book: 3 Nephi
    chapter: 23
    verse: 13
    ordinal: 5602
    text: And it came to pass that Jesus commanded that it should be written; therefore it was written according as he commanded.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.23.14
    scripture: book-of-mormon
    name: 3 Nephi 23:14
    book: 3 Nephi
    chapter: 23
    verse: 14
    ordinal: 5603
    text: And now it came to pass that when Jesus had expounded all the scriptures in one, which they had written, he commanded them that they should teach the things which he had expounded unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.23
- type: BomVerse
  data:
    ref: 3-nephi.24.1
    scripture: book-of-mormon
    name: 3 Nephi 24:1
    book: 3 Nephi
    chapter: 24
    verse: 1
    ordinal: 5604
    text: 'And it came to pass that he commanded them that they should write the words which the Father had given unto Malachi, which he should tell unto them. And it came to pass that after they were written he expounded them. And these are the words which he did tell unto them, saying: Thus said the Father unto Malachi—Behold, I will send my messenger, and he shall prepare the way before me, and the Lord whom ye seek shall suddenly come to his temple, even the messenger of the covenant, whom ye delight in; behold, he shall come, saith the Lord of Hosts.'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:1
    kjvOsis:
    - Mal.3.1
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.2
    scripture: book-of-mormon
    name: 3 Nephi 24:2
    book: 3 Nephi
    chapter: 24
    verse: 2
    ordinal: 5605
    text: But who may abide the day of his coming, and who shall stand when he appeareth? For he is like a refiner's fire, and like fuller's soap.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:2
    kjvOsis:
    - Mal.3.2
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.3
    scripture: book-of-mormon
    name: 3 Nephi 24:3
    book: 3 Nephi
    chapter: 24
    verse: 3
    ordinal: 5606
    text: And he shall sit as a refiner and purifier of silver; and he shall purify the sons of Levi, and purge them as gold and silver, that they may offer unto the Lord an offering in righteousness.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:3
    kjvOsis:
    - Mal.3.3
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.4
    scripture: book-of-mormon
    name: 3 Nephi 24:4
    book: 3 Nephi
    chapter: 24
    verse: 4
    ordinal: 5607
    text: Then shall the offering of Judah and Jerusalem be pleasant unto the Lord, as in the days of old, and as in former years.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:4
    kjvOsis:
    - Mal.3.4
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.5
    scripture: book-of-mormon
    name: 3 Nephi 24:5
    book: 3 Nephi
    chapter: 24
    verse: 5
    ordinal: 5608
    text: And I will come near to you to judgment; and I will be a swift witness against the sorcerers, and against the adulterers, and against false swearers, and against those that oppress the hireling in his wages, the widow and the fatherless, and that turn aside the stranger, and fear not me, saith the Lord of Hosts.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:5
    kjvOsis:
    - Mal.3.5
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.6
    scripture: book-of-mormon
    name: 3 Nephi 24:6
    book: 3 Nephi
    chapter: 24
    verse: 6
    ordinal: 5609
    text: For I am the Lord, I change not; therefore ye sons of Jacob are not consumed.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:6
    kjvOsis:
    - Mal.3.6
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.7
    scripture: book-of-mormon
    name: 3 Nephi 24:7
    book: 3 Nephi
    chapter: 24
    verse: 7
    ordinal: 5610
    text: 'Even from the days of your fathers ye are gone away from mine ordinances, and have not kept them. Return unto me and I will return unto you, saith the Lord of Hosts. But ye say: Wherein shall we return?'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:7
    kjvOsis:
    - Mal.3.7
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.8
    scripture: book-of-mormon
    name: 3 Nephi 24:8
    book: 3 Nephi
    chapter: 24
    verse: 8
    ordinal: 5611
    text: 'Will a man rob God? Yet ye have robbed me. But ye say: Wherein have we robbed thee? In tithes and offerings.'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:8
    kjvOsis:
    - Mal.3.8
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.9
    scripture: book-of-mormon
    name: 3 Nephi 24:9
    book: 3 Nephi
    chapter: 24
    verse: 9
    ordinal: 5612
    text: Ye are cursed with a curse, for ye have robbed me, even this whole nation.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:9
    kjvOsis:
    - Mal.3.9
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.10
    scripture: book-of-mormon
    name: 3 Nephi 24:10
    book: 3 Nephi
    chapter: 24
    verse: 10
    ordinal: 5613
    text: Bring ye all the tithes into the storehouse, that there may be meat in my house; and prove me now herewith, saith the Lord of Hosts, if I will not open you the windows of heaven, and pour you out a blessing that there shall not be room enough to receive it.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:10
    kjvOsis:
    - Mal.3.10
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.11
    scripture: book-of-mormon
    name: 3 Nephi 24:11
    book: 3 Nephi
    chapter: 24
    verse: 11
    ordinal: 5614
    text: And I will rebuke the devourer for your sakes, and he shall not destroy the fruits of your ground; neither shall your vine cast her fruit before the time in the fields, saith the Lord of Hosts.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:11
    kjvOsis:
    - Mal.3.11
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.12
    scripture: book-of-mormon
    name: 3 Nephi 24:12
    book: 3 Nephi
    chapter: 24
    verse: 12
    ordinal: 5615
    text: And all nations shall call you blessed, for ye shall be a delightsome land, saith the Lord of Hosts.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:12
    kjvOsis:
    - Mal.3.12
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.13
    scripture: book-of-mormon
    name: 3 Nephi 24:13
    book: 3 Nephi
    chapter: 24
    verse: 13
    ordinal: 5616
    text: 'Your words have been stout against me, saith the Lord. Yet ye say: What have we spoken against thee?'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:13
    kjvOsis:
    - Mal.3.13
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.14
    scripture: book-of-mormon
    name: 3 Nephi 24:14
    book: 3 Nephi
    chapter: 24
    verse: 14
    ordinal: 5617
    text: 'Ye have said: It is vain to serve God, and what doth it profit that we have kept his ordinances and that we have walked mournfully before the Lord of Hosts?'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:14
    kjvOsis:
    - Mal.3.14
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.15
    scripture: book-of-mormon
    name: 3 Nephi 24:15
    book: 3 Nephi
    chapter: 24
    verse: 15
    ordinal: 5618
    text: And now we call the proud happy; yea, they that work wickedness are set up; yea, they that tempt God are even delivered.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:15
    kjvOsis:
    - Mal.3.15
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.16
    scripture: book-of-mormon
    name: 3 Nephi 24:16
    book: 3 Nephi
    chapter: 24
    verse: 16
    ordinal: 5619
    text: Then they that feared the Lord spake often one to another, and the Lord hearkened and heard; and a book of remembrance was written before him for them that feared the Lord, and that thought upon his name.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:16
    kjvOsis:
    - Mal.3.16
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.17
    scripture: book-of-mormon
    name: 3 Nephi 24:17
    book: 3 Nephi
    chapter: 24
    verse: 17
    ordinal: 5620
    text: And they shall be mine, saith the Lord of Hosts, in that day when I make up my jewels; and I will spare them as a man spareth his own son that serveth him.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:17
    kjvOsis:
    - Mal.3.17
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.24.18
    scripture: book-of-mormon
    name: 3 Nephi 24:18
    book: 3 Nephi
    chapter: 24
    verse: 18
    ordinal: 5621
    text: Then shall ye return and discern between the righteous and the wicked, between him that serveth God and him that serveth him not.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 3:18
    kjvOsis:
    - Mal.3.18
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.24
- type: BomVerse
  data:
    ref: 3-nephi.25.1
    scripture: book-of-mormon
    name: 3 Nephi 25:1
    book: 3 Nephi
    chapter: 25
    verse: 1
    ordinal: 5622
    text: For behold, the day cometh that shall burn as an oven; and all the proud, yea, and all that do wickedly, shall be stubble; and the day that cometh shall burn them up, saith the Lord of Hosts, that it shall leave them neither root nor branch.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 4:1
    kjvOsis:
    - Mal.4.1
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.25
- type: BomVerse
  data:
    ref: 3-nephi.25.2
    scripture: book-of-mormon
    name: 3 Nephi 25:2
    book: 3 Nephi
    chapter: 25
    verse: 2
    ordinal: 5623
    text: But unto you that fear my name, shall the Son of Righteousness arise with healing in his wings; and ye shall go forth and grow up as calves in the stall.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 4:2
    kjvOsis:
    - Mal.4.2
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.25
- type: BomVerse
  data:
    ref: 3-nephi.25.3
    scripture: book-of-mormon
    name: 3 Nephi 25:3
    book: 3 Nephi
    chapter: 25
    verse: 3
    ordinal: 5624
    text: And ye shall tread down the wicked; for they shall be ashes under the soles of your feet in the day that I shall do this, saith the Lord of Hosts.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 4:3
    kjvOsis:
    - Mal.4.3
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.25
- type: BomVerse
  data:
    ref: 3-nephi.25.4
    scripture: book-of-mormon
    name: 3 Nephi 25:4
    book: 3 Nephi
    chapter: 25
    verse: 4
    ordinal: 5625
    text: Remember ye the law of Moses, my servant, which I commanded unto him in Horeb for all Israel, with the statutes and judgments.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 4:4
    kjvOsis:
    - Mal.4.4
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.25
- type: BomVerse
  data:
    ref: 3-nephi.25.5
    scripture: book-of-mormon
    name: 3 Nephi 25:5
    book: 3 Nephi
    chapter: 25
    verse: 5
    ordinal: 5626
    text: Behold, I will send you Elijah the prophet before the coming of the great and dreadful day of the Lord;
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 4:5
    kjvOsis:
    - Mal.4.5
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.25
- type: BomVerse
  data:
    ref: 3-nephi.25.6
    scripture: book-of-mormon
    name: 3 Nephi 25:6
    book: 3 Nephi
    chapter: 25
    verse: 6
    ordinal: 5627
    text: And he shall turn the heart of the fathers to the children, and the heart of the children to their fathers, lest I come and smite the earth with a curse.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Malachi 4:6
    kjvOsis:
    - Mal.4.6
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.25
- type: BomVerse
  data:
    ref: 3-nephi.26.1
    scripture: book-of-mormon
    name: 3 Nephi 26:1
    book: 3 Nephi
    chapter: 26
    verse: 1
    ordinal: 5628
    text: And now it came to pass that when Jesus had told these things he expounded them unto the multitude; and he did expound all things unto them, both great and small.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.2
    scripture: book-of-mormon
    name: 3 Nephi 26:2
    book: 3 Nephi
    chapter: 26
    verse: 2
    ordinal: 5629
    text: 'And he saith: These scriptures, which ye had not with you, the Father commanded that I should give unto you; for it was wisdom in him that they should be given unto future generations.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.3
    scripture: book-of-mormon
    name: 3 Nephi 26:3
    book: 3 Nephi
    chapter: 26
    verse: 3
    ordinal: 5630
    text: And he did expound all things, even from the beginning until the time that he should come in his glory—yea, even all things which should come upon the face of the earth, even until the elements should melt with fervent heat, and the earth should be wrapt together as a scroll, and the heavens and the earth should pass away;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.4
    scripture: book-of-mormon
    name: 3 Nephi 26:4
    book: 3 Nephi
    chapter: 26
    verse: 4
    ordinal: 5631
    text: And even unto the great and last day, when all people, and all kindreds, and all nations and tongues shall stand before God, to be judged of their works, whether they be good or whether they be evil—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.5
    scripture: book-of-mormon
    name: 3 Nephi 26:5
    book: 3 Nephi
    chapter: 26
    verse: 5
    ordinal: 5632
    text: If they be good, to the resurrection of everlasting life; and if they be evil, to the resurrection of damnation; being on a parallel, the one on the one hand and the other on the other hand, according to the mercy, and the justice, and the holiness which is in Christ, who was before the world began.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.6
    scripture: book-of-mormon
    name: 3 Nephi 26:6
    book: 3 Nephi
    chapter: 26
    verse: 6
    ordinal: 5633
    text: And now there cannot be written in this book even a hundredth part of the things which Jesus did truly teach unto the people;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.7
    scripture: book-of-mormon
    name: 3 Nephi 26:7
    book: 3 Nephi
    chapter: 26
    verse: 7
    ordinal: 5634
    text: But behold the plates of Nephi do contain the more part of the things which he taught the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.8
    scripture: book-of-mormon
    name: 3 Nephi 26:8
    book: 3 Nephi
    chapter: 26
    verse: 8
    ordinal: 5635
    text: And these things have I written, which are a lesser part of the things which he taught the people; and I have written them to the intent that they may be brought again unto this people, from the Gentiles, according to the words which Jesus hath spoken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.9
    scripture: book-of-mormon
    name: 3 Nephi 26:9
    book: 3 Nephi
    chapter: 26
    verse: 9
    ordinal: 5636
    text: And when they shall have received this, which is expedient that they should have first, to try their faith, and if it shall so be that they shall believe these things then shall the greater things be made manifest unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.10
    scripture: book-of-mormon
    name: 3 Nephi 26:10
    book: 3 Nephi
    chapter: 26
    verse: 10
    ordinal: 5637
    text: And if it so be that they will not believe these things, then shall the greater things be withheld from them, unto their condemnation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.11
    scripture: book-of-mormon
    name: 3 Nephi 26:11
    book: 3 Nephi
    chapter: 26
    verse: 11
    ordinal: 5638
    text: 'Behold, I was about to write them, all which were engraven upon the plates of Nephi, but the Lord forbade it, saying: I will try the faith of my people.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.12
    scripture: book-of-mormon
    name: 3 Nephi 26:12
    book: 3 Nephi
    chapter: 26
    verse: 12
    ordinal: 5639
    text: Therefore I, Mormon, do write the things which have been commanded me of the Lord. And now I, Mormon, make an end of my sayings, and proceed to write the things which have been commanded me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.13
    scripture: book-of-mormon
    name: 3 Nephi 26:13
    book: 3 Nephi
    chapter: 26
    verse: 13
    ordinal: 5640
    text: Therefore, I would that ye should behold that the Lord truly did teach the people, for the space of three days; and after that he did show himself unto them oft, and did break bread oft, and bless it, and give it unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.14
    scripture: book-of-mormon
    name: 3 Nephi 26:14
    book: 3 Nephi
    chapter: 26
    verse: 14
    ordinal: 5641
    text: And it came to pass that he did teach and minister unto the children of the multitude of whom hath been spoken, and he did loose their tongues, and they did speak unto their fathers great and marvelous things, even greater than he had revealed unto the people; and he loosed their tongues that they could utter.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.15
    scripture: book-of-mormon
    name: 3 Nephi 26:15
    book: 3 Nephi
    chapter: 26
    verse: 15
    ordinal: 5642
    text: And it came to pass that after he had ascended into heaven—the second time that he showed himself unto them, and had gone unto the Father, after having healed all their sick, and their lame, and opened the eyes of their blind and unstopped the ears of the deaf, and even had done all manner of cures among them, and raised a man from the dead, and had shown forth his power unto them, and had ascended unto the Father—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.16
    scripture: book-of-mormon
    name: 3 Nephi 26:16
    book: 3 Nephi
    chapter: 26
    verse: 16
    ordinal: 5643
    text: Behold, it came to pass on the morrow that the multitude gathered themselves together, and they both saw and heard these children; yea, even babes did open their mouths and utter marvelous things; and the things which they did utter were forbidden that there should not any man write them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.17
    scripture: book-of-mormon
    name: 3 Nephi 26:17
    book: 3 Nephi
    chapter: 26
    verse: 17
    ordinal: 5644
    text: And it came to pass that the disciples whom Jesus had chosen began from that time forth to baptize and to teach as many as did come unto them; and as many as were baptized in the name of Jesus were filled with the Holy Ghost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.18
    scripture: book-of-mormon
    name: 3 Nephi 26:18
    book: 3 Nephi
    chapter: 26
    verse: 18
    ordinal: 5645
    text: And many of them saw and heard unspeakable things, which are not lawful to be written.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.19
    scripture: book-of-mormon
    name: 3 Nephi 26:19
    book: 3 Nephi
    chapter: 26
    verse: 19
    ordinal: 5646
    text: And they taught, and did minister one to another; and they had all things common among them, every man dealing justly, one with another.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.20
    scripture: book-of-mormon
    name: 3 Nephi 26:20
    book: 3 Nephi
    chapter: 26
    verse: 20
    ordinal: 5647
    text: And it came to pass that they did do all things even as Jesus had commanded them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.26.21
    scripture: book-of-mormon
    name: 3 Nephi 26:21
    book: 3 Nephi
    chapter: 26
    verse: 21
    ordinal: 5648
    text: And they who were baptized in the name of Jesus were called the church of Christ.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.26
- type: BomVerse
  data:
    ref: 3-nephi.27.1
    scripture: book-of-mormon
    name: 3 Nephi 27:1
    book: 3 Nephi
    chapter: 27
    verse: 1
    ordinal: 5649
    text: And it came to pass that as the disciples of Jesus were journeying and were preaching the things which they had both heard and seen, and were baptizing in the name of Jesus, it came to pass that the disciples were gathered together and were united in mighty prayer and fasting.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.2
    scripture: book-of-mormon
    name: 3 Nephi 27:2
    book: 3 Nephi
    chapter: 27
    verse: 2
    ordinal: 5650
    text: 'And Jesus again showed himself unto them, for they were praying unto the Father in his name; and Jesus came and stood in the midst of them, and said unto them: What will ye that I shall give unto you?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.3
    scripture: book-of-mormon
    name: 3 Nephi 27:3
    book: 3 Nephi
    chapter: 27
    verse: 3
    ordinal: 5651
    text: 'And they said unto him: Lord, we will that thou wouldst tell us the name whereby we shall call this church; for there are disputations among the people concerning this matter.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.4
    scripture: book-of-mormon
    name: 3 Nephi 27:4
    book: 3 Nephi
    chapter: 27
    verse: 4
    ordinal: 5652
    text: 'And the Lord said unto them: Verily, verily, I say unto you, why is it that the people should murmur and dispute because of this thing?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.5
    scripture: book-of-mormon
    name: 3 Nephi 27:5
    book: 3 Nephi
    chapter: 27
    verse: 5
    ordinal: 5653
    text: Have they not read the scriptures, which say ye must take upon you the name of Christ, which is my name? For by this name shall ye be called at the last day;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.6
    scripture: book-of-mormon
    name: 3 Nephi 27:6
    book: 3 Nephi
    chapter: 27
    verse: 6
    ordinal: 5654
    text: And whoso taketh upon him my name, and endureth to the end, the same shall be saved at the last day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.7
    scripture: book-of-mormon
    name: 3 Nephi 27:7
    book: 3 Nephi
    chapter: 27
    verse: 7
    ordinal: 5655
    text: Therefore, whatsoever ye shall do, ye shall do it in my name; therefore ye shall call the church in my name; and ye shall call upon the Father in my name that he will bless the church for my sake.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.8
    scripture: book-of-mormon
    name: 3 Nephi 27:8
    book: 3 Nephi
    chapter: 27
    verse: 8
    ordinal: 5656
    text: And how be it my church save it be called in my name? For if a church be called in Moses' name then it be Moses' church; or if it be called in the name of a man then it be the church of a man; but if it be called in my name then it is my church, if it so be that they are built upon my gospel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.9
    scripture: book-of-mormon
    name: 3 Nephi 27:9
    book: 3 Nephi
    chapter: 27
    verse: 9
    ordinal: 5657
    text: Verily I say unto you, that ye are built upon my gospel; therefore ye shall call whatsoever things ye do call, in my name; therefore if ye call upon the Father, for the church, if it be in my name the Father will hear you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.10
    scripture: book-of-mormon
    name: 3 Nephi 27:10
    book: 3 Nephi
    chapter: 27
    verse: 10
    ordinal: 5658
    text: And if it so be that the church is built upon my gospel then will the Father show forth his own works in it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.11
    scripture: book-of-mormon
    name: 3 Nephi 27:11
    book: 3 Nephi
    chapter: 27
    verse: 11
    ordinal: 5659
    text: But if it be not built upon my gospel, and is built upon the works of men, or upon the works of the devil, verily I say unto you they have joy in their works for a season, and by and by the end cometh, and they are hewn down and cast into the fire, from whence there is no return.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.12
    scripture: book-of-mormon
    name: 3 Nephi 27:12
    book: 3 Nephi
    chapter: 27
    verse: 12
    ordinal: 5660
    text: For their works do follow them, for it is because of their works that they are hewn down; therefore remember the things that I have told you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.13
    scripture: book-of-mormon
    name: 3 Nephi 27:13
    book: 3 Nephi
    chapter: 27
    verse: 13
    ordinal: 5661
    text: Behold I have given unto you my gospel, and this is the gospel which I have given unto you—that I came into the world to do the will of my Father, because my Father sent me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.14
    scripture: book-of-mormon
    name: 3 Nephi 27:14
    book: 3 Nephi
    chapter: 27
    verse: 14
    ordinal: 5662
    text: And my Father sent me that I might be lifted up upon the cross; and after that I had been lifted up upon the cross, that I might draw all men unto me, that as I have been lifted up by men even so should men be lifted up by the Father, to stand before me, to be judged of their works, whether they be good or whether they be evil—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.15
    scripture: book-of-mormon
    name: 3 Nephi 27:15
    book: 3 Nephi
    chapter: 27
    verse: 15
    ordinal: 5663
    text: And for this cause have I been lifted up; therefore, according to the power of the Father I will draw all men unto me, that they may be judged according to their works.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.16
    scripture: book-of-mormon
    name: 3 Nephi 27:16
    book: 3 Nephi
    chapter: 27
    verse: 16
    ordinal: 5664
    text: And it shall come to pass, that whoso repenteth and is baptized in my name shall be filled; and if he endureth to the end, behold, him will I hold guiltless before my Father at that day when I shall stand to judge the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.17
    scripture: book-of-mormon
    name: 3 Nephi 27:17
    book: 3 Nephi
    chapter: 27
    verse: 17
    ordinal: 5665
    text: And he that endureth not unto the end, the same is he that is also hewn down and cast into the fire, from whence they can no more return, because of the justice of the Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.18
    scripture: book-of-mormon
    name: 3 Nephi 27:18
    book: 3 Nephi
    chapter: 27
    verse: 18
    ordinal: 5666
    text: And this is the word which he hath given unto the children of men. And for this cause he fulfilleth the words which he hath given, and he lieth not, but fulfilleth all his words.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.19
    scripture: book-of-mormon
    name: 3 Nephi 27:19
    book: 3 Nephi
    chapter: 27
    verse: 19
    ordinal: 5667
    text: And no unclean thing can enter into his kingdom; therefore nothing entereth into his rest save it be those who have washed their garments in my blood, because of their faith, and the repentance of all their sins, and their faithfulness unto the end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.20
    scripture: book-of-mormon
    name: 3 Nephi 27:20
    book: 3 Nephi
    chapter: 27
    verse: 20
    ordinal: 5668
    text: 'Now this is the commandment: Repent, all ye ends of the earth, and come unto me and be baptized in my name, that ye may be sanctified by the reception of the Holy Ghost, that ye may stand spotless before me at the last day.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.21
    scripture: book-of-mormon
    name: 3 Nephi 27:21
    book: 3 Nephi
    chapter: 27
    verse: 21
    ordinal: 5669
    text: Verily, verily, I say unto you, this is my gospel; and ye know the things that ye must do in my church; for the works which ye have seen me do that shall ye also do; for that which ye have seen me do even that shall ye do;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.22
    scripture: book-of-mormon
    name: 3 Nephi 27:22
    book: 3 Nephi
    chapter: 27
    verse: 22
    ordinal: 5670
    text: Therefore, if ye do these things blessed are ye, for ye shall be lifted up at the last day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.23
    scripture: book-of-mormon
    name: 3 Nephi 27:23
    book: 3 Nephi
    chapter: 27
    verse: 23
    ordinal: 5671
    text: Write the things which ye have seen and heard, save it be those which are forbidden.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.24
    scripture: book-of-mormon
    name: 3 Nephi 27:24
    book: 3 Nephi
    chapter: 27
    verse: 24
    ordinal: 5672
    text: Write the works of this people, which shall be, even as hath been written, of that which hath been.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.25
    scripture: book-of-mormon
    name: 3 Nephi 27:25
    book: 3 Nephi
    chapter: 27
    verse: 25
    ordinal: 5673
    text: For behold, out of the books which have been written, and which shall be written, shall this people be judged, for by them shall their works be known unto men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.26
    scripture: book-of-mormon
    name: 3 Nephi 27:26
    book: 3 Nephi
    chapter: 27
    verse: 26
    ordinal: 5674
    text: And behold, all things are written by the Father; therefore out of the books which shall be written shall the world be judged.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.27
    scripture: book-of-mormon
    name: 3 Nephi 27:27
    book: 3 Nephi
    chapter: 27
    verse: 27
    ordinal: 5675
    text: And know ye that ye shall be judges of this people, according to the judgment which I shall give unto you, which shall be just. Therefore, what manner of men ought ye to be? Verily I say unto you, even as I am.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.28
    scripture: book-of-mormon
    name: 3 Nephi 27:28
    book: 3 Nephi
    chapter: 27
    verse: 28
    ordinal: 5676
    text: And now I go unto the Father. And verily I say unto you, whatsoever things ye shall ask the Father in my name shall be given unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.29
    scripture: book-of-mormon
    name: 3 Nephi 27:29
    book: 3 Nephi
    chapter: 27
    verse: 29
    ordinal: 5677
    text: Therefore, ask, and ye shall receive; knock, and it shall be opened unto you; for he that asketh, receiveth; and unto him that knocketh, it shall be opened.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.30
    scripture: book-of-mormon
    name: 3 Nephi 27:30
    book: 3 Nephi
    chapter: 27
    verse: 30
    ordinal: 5678
    text: And now, behold, my joy is great, even unto fulness, because of you, and also this generation; yea, and even the Father rejoiceth, and also all the holy angels, because of you and this generation; for none of them are lost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.31
    scripture: book-of-mormon
    name: 3 Nephi 27:31
    book: 3 Nephi
    chapter: 27
    verse: 31
    ordinal: 5679
    text: Behold, I would that ye should understand; for I mean them who are now alive of this generation; and none of them are lost; and in them I have fulness of joy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.32
    scripture: book-of-mormon
    name: 3 Nephi 27:32
    book: 3 Nephi
    chapter: 27
    verse: 32
    ordinal: 5680
    text: But behold, it sorroweth me because of the fourth generation from this generation, for they are led away captive by him even as was the son of perdition; for they will sell me for silver and for gold, and for that which moth doth corrupt and which thieves can break through and steal. And in that day will I visit them, even in turning their works upon their own heads.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.27.33
    scripture: book-of-mormon
    name: 3 Nephi 27:33
    book: 3 Nephi
    chapter: 27
    verse: 33
    ordinal: 5681
    text: 'And it came to pass that when Jesus had ended these sayings he said unto his disciples: Enter ye in at the strait gate; for strait is the gate, and narrow is the way that leads to life, and few there be that find it; but wide is the gate, and broad the way which leads to death, and many there be that travel therein, until the night cometh, wherein no man can work.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.27
- type: BomVerse
  data:
    ref: 3-nephi.28.1
    scripture: book-of-mormon
    name: 3 Nephi 28:1
    book: 3 Nephi
    chapter: 28
    verse: 1
    ordinal: 5682
    text: 'And it came to pass when Jesus had said these words, he spake unto his disciples, one by one, saying unto them: What is it that ye desire of me, after that I am gone to the Father?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.2
    scripture: book-of-mormon
    name: 3 Nephi 28:2
    book: 3 Nephi
    chapter: 28
    verse: 2
    ordinal: 5683
    text: 'And they all spake, save it were three, saying: We desire that after we have lived unto the age of man, that our ministry, wherein thou hast called us, may have an end, that we may speedily come unto thee in thy kingdom.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.3
    scripture: book-of-mormon
    name: 3 Nephi 28:3
    book: 3 Nephi
    chapter: 28
    verse: 3
    ordinal: 5684
    text: 'And he said unto them: Blessed are ye because ye desired this thing of me; therefore, after that ye are seventy and two years old ye shall come unto me in my kingdom; and with me ye shall find rest.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.4
    scripture: book-of-mormon
    name: 3 Nephi 28:4
    book: 3 Nephi
    chapter: 28
    verse: 4
    ordinal: 5685
    text: 'And when he had spoken unto them, he turned himself unto the three, and said unto them: What will ye that I should do unto you, when I am gone unto the Father?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.5
    scripture: book-of-mormon
    name: 3 Nephi 28:5
    book: 3 Nephi
    chapter: 28
    verse: 5
    ordinal: 5686
    text: And they sorrowed in their hearts, for they durst not speak unto him the thing which they desired.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.6
    scripture: book-of-mormon
    name: 3 Nephi 28:6
    book: 3 Nephi
    chapter: 28
    verse: 6
    ordinal: 5687
    text: 'And he said unto them: Behold, I know your thoughts, and ye have desired the thing which John, my beloved, who was with me in my ministry, before that I was lifted up by the Jews, desired of me.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.7
    scripture: book-of-mormon
    name: 3 Nephi 28:7
    book: 3 Nephi
    chapter: 28
    verse: 7
    ordinal: 5688
    text: Therefore, more blessed are ye, for ye shall never taste of death; but ye shall live to behold all the doings of the Father unto the children of men, even until all things shall be fulfilled according to the will of the Father, when I shall come in my glory with the powers of heaven.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.8
    scripture: book-of-mormon
    name: 3 Nephi 28:8
    book: 3 Nephi
    chapter: 28
    verse: 8
    ordinal: 5689
    text: And ye shall never endure the pains of death; but when I shall come in my glory ye shall be changed in the twinkling of an eye from mortality to immortality; and then shall ye be blessed in the kingdom of my Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.9
    scripture: book-of-mormon
    name: 3 Nephi 28:9
    book: 3 Nephi
    chapter: 28
    verse: 9
    ordinal: 5690
    text: And again, ye shall not have pain while ye shall dwell in the flesh, neither sorrow save it be for the sins of the world; and all this will I do because of the thing which ye have desired of me, for ye have desired that ye might bring the souls of men unto me, while the world shall stand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.10
    scripture: book-of-mormon
    name: 3 Nephi 28:10
    book: 3 Nephi
    chapter: 28
    verse: 10
    ordinal: 5691
    text: And for this cause ye shall have fulness of joy; and ye shall sit down in the kingdom of my Father; yea, your joy shall be full, even as the Father hath given me fulness of joy; and ye shall be even as I am, and I am even as the Father; and the Father and I are one;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.11
    scripture: book-of-mormon
    name: 3 Nephi 28:11
    book: 3 Nephi
    chapter: 28
    verse: 11
    ordinal: 5692
    text: And the Holy Ghost beareth record of the Father and me; and the Father giveth the Holy Ghost unto the children of men, because of me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.12
    scripture: book-of-mormon
    name: 3 Nephi 28:12
    book: 3 Nephi
    chapter: 28
    verse: 12
    ordinal: 5693
    text: And it came to pass that when Jesus had spoken these words, he touched every one of them with his finger save it were the three who were to tarry, and then he departed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.13
    scripture: book-of-mormon
    name: 3 Nephi 28:13
    book: 3 Nephi
    chapter: 28
    verse: 13
    ordinal: 5694
    text: And behold, the heavens were opened, and they were caught up into heaven, and saw and heard unspeakable things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.14
    scripture: book-of-mormon
    name: 3 Nephi 28:14
    book: 3 Nephi
    chapter: 28
    verse: 14
    ordinal: 5695
    text: And it was forbidden them that they should utter; neither was it given unto them power that they could utter the things which they saw and heard;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.15
    scripture: book-of-mormon
    name: 3 Nephi 28:15
    book: 3 Nephi
    chapter: 28
    verse: 15
    ordinal: 5696
    text: And whether they were in the body or out of the body, they could not tell; for it did seem unto them like a transfiguration of them, that they were changed from this body of flesh into an immortal state, that they could behold the things of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.16
    scripture: book-of-mormon
    name: 3 Nephi 28:16
    book: 3 Nephi
    chapter: 28
    verse: 16
    ordinal: 5697
    text: But it came to pass that they did again minister upon the face of the earth; nevertheless they did not minister of the things which they had heard and seen, because of the commandment which was given them in heaven.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.17
    scripture: book-of-mormon
    name: 3 Nephi 28:17
    book: 3 Nephi
    chapter: 28
    verse: 17
    ordinal: 5698
    text: And now, whether they were mortal or immortal, from the day of their transfiguration, I know not;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.18
    scripture: book-of-mormon
    name: 3 Nephi 28:18
    book: 3 Nephi
    chapter: 28
    verse: 18
    ordinal: 5699
    text: But this much I know, according to the record which hath been given—they did go forth upon the face of the land, and did minister unto all the people, uniting as many to the church as would believe in their preaching; baptizing them, and as many as were baptized did receive the Holy Ghost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.19
    scripture: book-of-mormon
    name: 3 Nephi 28:19
    book: 3 Nephi
    chapter: 28
    verse: 19
    ordinal: 5700
    text: And they were cast into prison by them who did not belong to the church. And the prisons could not hold them, for they were rent in twain.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.20
    scripture: book-of-mormon
    name: 3 Nephi 28:20
    book: 3 Nephi
    chapter: 28
    verse: 20
    ordinal: 5701
    text: And they were cast down into the earth; but they did smite the earth with the word of God, insomuch that by his power they were delivered out of the depths of the earth; and therefore they could not dig pits sufficient to hold them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.21
    scripture: book-of-mormon
    name: 3 Nephi 28:21
    book: 3 Nephi
    chapter: 28
    verse: 21
    ordinal: 5702
    text: And thrice they were cast into a furnace and received no harm.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.22
    scripture: book-of-mormon
    name: 3 Nephi 28:22
    book: 3 Nephi
    chapter: 28
    verse: 22
    ordinal: 5703
    text: And twice were they cast into a den of wild beasts; and behold they did play with the beasts as a child with a suckling lamb, and received no harm.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.23
    scripture: book-of-mormon
    name: 3 Nephi 28:23
    book: 3 Nephi
    chapter: 28
    verse: 23
    ordinal: 5704
    text: And it came to pass that thus they did go forth among all the people of Nephi, and did preach the gospel of Christ unto all people upon the face of the land; and they were converted unto the Lord, and were united unto the church of Christ, and thus the people of that generation were blessed, according to the word of Jesus.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.24
    scripture: book-of-mormon
    name: 3 Nephi 28:24
    book: 3 Nephi
    chapter: 28
    verse: 24
    ordinal: 5705
    text: And now I, Mormon, make an end of speaking concerning these things for a time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.25
    scripture: book-of-mormon
    name: 3 Nephi 28:25
    book: 3 Nephi
    chapter: 28
    verse: 25
    ordinal: 5706
    text: Behold, I was about to write the names of those who were never to taste of death, but the Lord forbade; therefore I write them not, for they are hid from the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.26
    scripture: book-of-mormon
    name: 3 Nephi 28:26
    book: 3 Nephi
    chapter: 28
    verse: 26
    ordinal: 5707
    text: But behold, I have seen them, and they have ministered unto me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.27
    scripture: book-of-mormon
    name: 3 Nephi 28:27
    book: 3 Nephi
    chapter: 28
    verse: 27
    ordinal: 5708
    text: And behold they will be among the Gentiles, and the Gentiles shall know them not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.28
    scripture: book-of-mormon
    name: 3 Nephi 28:28
    book: 3 Nephi
    chapter: 28
    verse: 28
    ordinal: 5709
    text: They will also be among the Jews, and the Jews shall know them not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.29
    scripture: book-of-mormon
    name: 3 Nephi 28:29
    book: 3 Nephi
    chapter: 28
    verse: 29
    ordinal: 5710
    text: And it shall come to pass, when the Lord seeth fit in his wisdom that they shall minister unto all the scattered tribes of Israel, and unto all nations, kindreds, tongues and people, and shall bring out of them unto Jesus many souls, that their desire may be fulfilled, and also because of the convincing power of God which is in them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.30
    scripture: book-of-mormon
    name: 3 Nephi 28:30
    book: 3 Nephi
    chapter: 28
    verse: 30
    ordinal: 5711
    text: And they are as the angels of God, and if they shall pray unto the Father in the name of Jesus they can show themselves unto whatsoever man it seemeth them good.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.31
    scripture: book-of-mormon
    name: 3 Nephi 28:31
    book: 3 Nephi
    chapter: 28
    verse: 31
    ordinal: 5712
    text: Therefore, great and marvelous works shall be wrought by them, before the great and coming day when all people must surely stand before the judgment-seat of Christ;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.32
    scripture: book-of-mormon
    name: 3 Nephi 28:32
    book: 3 Nephi
    chapter: 28
    verse: 32
    ordinal: 5713
    text: Yea even among the Gentiles shall there be a great and marvelous work wrought by them, before that judgment day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.33
    scripture: book-of-mormon
    name: 3 Nephi 28:33
    book: 3 Nephi
    chapter: 28
    verse: 33
    ordinal: 5714
    text: And if ye had all the scriptures which give an account of all the marvelous works of Christ, ye would, according to the words of Christ, know that these things must surely come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.34
    scripture: book-of-mormon
    name: 3 Nephi 28:34
    book: 3 Nephi
    chapter: 28
    verse: 34
    ordinal: 5715
    text: And wo be unto him that will not hearken unto the words of Jesus, and also to them whom he hath chosen and sent among them; for whoso receiveth not the words of Jesus and the words of those whom he hath sent receiveth not him; and therefore he will not receive them at the last day;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.35
    scripture: book-of-mormon
    name: 3 Nephi 28:35
    book: 3 Nephi
    chapter: 28
    verse: 35
    ordinal: 5716
    text: And it would be better for them if they had not been born. For do ye suppose that ye can get rid of the justice of an offended God, who hath been trampled under feet of men, that thereby salvation might come?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.36
    scripture: book-of-mormon
    name: 3 Nephi 28:36
    book: 3 Nephi
    chapter: 28
    verse: 36
    ordinal: 5717
    text: And now behold, as I spake concerning those whom the Lord hath chosen, yea, even three who were caught up into the heavens, that I knew not whether they were cleansed from mortality to immortality—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.37
    scripture: book-of-mormon
    name: 3 Nephi 28:37
    book: 3 Nephi
    chapter: 28
    verse: 37
    ordinal: 5718
    text: But behold, since I wrote, I have inquired of the Lord, and he hath made it manifest unto me that there must needs be a change wrought upon their bodies, or else it needs be that they must taste of death;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.38
    scripture: book-of-mormon
    name: 3 Nephi 28:38
    book: 3 Nephi
    chapter: 28
    verse: 38
    ordinal: 5719
    text: Therefore, that they might not taste of death there was a change wrought upon their bodies, that they might not suffer pain nor sorrow save it were for the sins of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.39
    scripture: book-of-mormon
    name: 3 Nephi 28:39
    book: 3 Nephi
    chapter: 28
    verse: 39
    ordinal: 5720
    text: Now this change was not equal to that which shall take place at the last day; but there was a change wrought upon them, insomuch that Satan could have no power over them, that he could not tempt them; and they were sanctified in the flesh, that they were holy, and that the powers of the earth could not hold them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.28.40
    scripture: book-of-mormon
    name: 3 Nephi 28:40
    book: 3 Nephi
    chapter: 28
    verse: 40
    ordinal: 5721
    text: And in this state they were to remain until the judgment day of Christ; and at that day they were to receive a greater change, and to be received into the kingdom of the Father to go no more out, but to dwell with God eternally in the heavens.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.28
- type: BomVerse
  data:
    ref: 3-nephi.29.1
    scripture: book-of-mormon
    name: 3 Nephi 29:1
    book: 3 Nephi
    chapter: 29
    verse: 1
    ordinal: 5722
    text: And now behold, I say unto you that when the Lord shall see fit, in his wisdom, that these sayings shall come unto the Gentiles according to his word, then ye may know that the covenant which the Father hath made with the children of Israel, concerning their restoration to the lands of their inheritance, is already beginning to be fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.29
- type: BomVerse
  data:
    ref: 3-nephi.29.2
    scripture: book-of-mormon
    name: 3 Nephi 29:2
    book: 3 Nephi
    chapter: 29
    verse: 2
    ordinal: 5723
    text: And ye may know that the words of the Lord, which have been spoken by the holy prophets, shall all be fulfilled; and ye need not say that the Lord delays his coming unto the children of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.29
- type: BomVerse
  data:
    ref: 3-nephi.29.3
    scripture: book-of-mormon
    name: 3 Nephi 29:3
    book: 3 Nephi
    chapter: 29
    verse: 3
    ordinal: 5724
    text: And ye need not imagine in your hearts that the words which have been spoken are vain, for behold, the Lord will remember his covenant which he hath made unto his people of the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.29
- type: BomVerse
  data:
    ref: 3-nephi.29.4
    scripture: book-of-mormon
    name: 3 Nephi 29:4
    book: 3 Nephi
    chapter: 29
    verse: 4
    ordinal: 5725
    text: And when ye shall see these sayings coming forth among you, then ye need not any longer spurn at the doings of the Lord, for the sword of his justice is in his right hand; and behold, at that day, if ye shall spurn at his doings he will cause that it shall soon overtake you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.29
- type: BomVerse
  data:
    ref: 3-nephi.29.5
    scripture: book-of-mormon
    name: 3 Nephi 29:5
    book: 3 Nephi
    chapter: 29
    verse: 5
    ordinal: 5726
    text: Wo unto him that spurneth at the doings of the Lord; yea, wo unto him that shall deny the Christ and his works!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.29
- type: BomVerse
  data:
    ref: 3-nephi.29.6
    scripture: book-of-mormon
    name: 3 Nephi 29:6
    book: 3 Nephi
    chapter: 29
    verse: 6
    ordinal: 5727
    text: Yea, wo unto him that shall deny the revelations of the Lord, and that shall say the Lord no longer worketh by revelation, or by prophecy, or by gifts, or by tongues, or by healings, or by the power of the Holy Ghost!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.29
- type: BomVerse
  data:
    ref: 3-nephi.29.7
    scripture: book-of-mormon
    name: 3 Nephi 29:7
    book: 3 Nephi
    chapter: 29
    verse: 7
    ordinal: 5728
    text: Yea, and wo unto him that shall say at that day, to get gain, that there can be no miracle wrought by Jesus Christ; for he that doeth this shall become like unto the son of perdition, for whom there was no mercy, according to the word of Christ!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.29
- type: BomVerse
  data:
    ref: 3-nephi.29.8
    scripture: book-of-mormon
    name: 3 Nephi 29:8
    book: 3 Nephi
    chapter: 29
    verse: 8
    ordinal: 5729
    text: Yea, and ye need not any longer hiss, nor spurn, nor make game of the Jews, nor any of the remnant of the house of Israel; for behold, the Lord remembereth his covenant unto them, and he will do unto them according to that which he hath sworn.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.29
- type: BomVerse
  data:
    ref: 3-nephi.29.9
    scripture: book-of-mormon
    name: 3 Nephi 29:9
    book: 3 Nephi
    chapter: 29
    verse: 9
    ordinal: 5730
    text: Therefore ye need not suppose that ye can turn the right hand of the Lord unto the left, that he may not execute judgment unto the fulfilling of the covenant which he hath made unto the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.29
- type: BomVerse
  data:
    ref: 3-nephi.30.1
    scripture: book-of-mormon
    name: 3 Nephi 30:1
    book: 3 Nephi
    chapter: 30
    verse: 1
    ordinal: 5731
    text: 'Hearken, O ye Gentiles, and hear the words of Jesus Christ, the Son of the living God, which he hath commanded me that I should speak concerning you, for, behold he commandeth me that I should write, saying:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.30
- type: BomVerse
  data:
    ref: 3-nephi.30.2
    scripture: book-of-mormon
    name: 3 Nephi 30:2
    book: 3 Nephi
    chapter: 30
    verse: 2
    ordinal: 5732
    text: Turn, all ye Gentiles, from your wicked ways; and repent of your evil doings, of your lyings and deceivings, and of your whoredoms, and of your secret abominations, and your idolatries, and of your murders, and your priestcrafts, and your envyings, and your strifes, and from all your wickedness and abominations, and come unto me, and be baptized in my name, that ye may receive a remission of your sins, and be filled with the Holy Ghost, that ye may be numbered with my people who are of the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.30
