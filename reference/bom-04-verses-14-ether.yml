    book: Ether
    chapter: 2
    verse: 11
    ordinal: 6062
    text: And this cometh unto you, O ye Gentiles, that ye may know the decrees of God—that ye may repent, and not continue in your iniquities until the fulness come, that ye may not bring down the fulness of the wrath of God upon you as the inhabitants of the land have hitherto done.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.12
    scripture: book-of-mormon
    name: Ether 2:12
    book: Ether
    chapter: 2
    verse: 12
    ordinal: 6063
    text: Behold, this is a choice land, and whatsoever nation shall possess it shall be free from bondage, and from captivity, and from all other nations under heaven, if they will but serve the God of the land, who is Jesus Christ, who hath been manifested by the things which we have written.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.13
    scripture: book-of-mormon
    name: Ether 2:13
    book: Ether
    chapter: 2
    verse: 13
    ordinal: 6064
    text: And now I proceed with my record; for behold, it came to pass that the Lord did bring Jared and his brethren forth even to that great sea which divideth the lands. And as they came to the sea they pitched their tents; and they called the name of the place Moriancumer; and they dwelt in tents, and dwelt in tents upon the seashore for the space of four years.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.14
    scripture: book-of-mormon
    name: Ether 2:14
    book: Ether
    chapter: 2
    verse: 14
    ordinal: 6065
    text: And it came to pass at the end of four years that the Lord came again unto the brother of Jared, and stood in a cloud and talked with him. And for the space of three hours did the Lord talk with the brother of Jared, and chastened him because he remembered not to call upon the name of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.15
    scripture: book-of-mormon
    name: Ether 2:15
    book: Ether
    chapter: 2
    verse: 15
    ordinal: 6066
    text: 'And the brother of Jared repented of the evil which he had done, and did call upon the name of the Lord for his brethren who were with him. And the Lord said unto him: I will forgive thee and thy brethren of their sins; but thou shalt not sin any more, for ye shall remember that my Spirit will not always strive with man; wherefore, if ye will sin until ye are fully ripe ye shall be cut off from the presence of the Lord. And these are my thoughts upon the land which I shall give you for your inheritance; for it shall be a land choice above all other lands.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.16
    scripture: book-of-mormon
    name: Ether 2:16
    book: Ether
    chapter: 2
    verse: 16
    ordinal: 6067
    text: 'And the Lord said: Go to work and build, after the manner of barges which ye have hitherto built. And it came to pass that the brother of Jared did go to work, and also his brethren, and built barges after the manner which they had built, according to the instructions of the Lord. And they were small, and they were light upon the water, even like unto the lightness of a fowl upon the water.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.17
    scripture: book-of-mormon
    name: Ether 2:17
    book: Ether
    chapter: 2
    verse: 17
    ordinal: 6068
    text: And they were built after a manner that they were exceedingly tight, even that they would hold water like unto a dish; and the bottom thereof was tight like unto a dish; and the sides thereof were tight like unto a dish; and the ends thereof were peaked; and the top thereof was tight like unto a dish; and the length thereof was the length of a tree; and the door thereof, when it was shut, was tight like unto a dish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.18
    scripture: book-of-mormon
    name: Ether 2:18
    book: Ether
    chapter: 2
    verse: 18
    ordinal: 6069
    text: 'And it came to pass that the brother of Jared cried unto the Lord, saying: O Lord, I have performed the work which thou hast commanded me, and I have made the barges according as thou hast directed me.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.19
    scripture: book-of-mormon
    name: Ether 2:19
    book: Ether
    chapter: 2
    verse: 19
    ordinal: 6070
    text: And behold, O Lord, in them there is no light; whither shall we steer? And also we shall perish, for in them we cannot breathe, save it is the air which is in them; therefore we shall perish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.20
    scripture: book-of-mormon
    name: Ether 2:20
    book: Ether
    chapter: 2
    verse: 20
    ordinal: 6071
    text: 'And the Lord said unto the brother of Jared: Behold, thou shalt make a hole in the top, and also in the bottom; and when thou shalt suffer for air thou shalt unstop the hole and receive air. And if it be so that the water come in upon thee, behold, ye shall stop the hole, that ye may not perish in the flood.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.21
    scripture: book-of-mormon
    name: Ether 2:21
    book: Ether
    chapter: 2
    verse: 21
    ordinal: 6072
    text: And it came to pass that the brother of Jared did so, according as the Lord had commanded.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.22
    scripture: book-of-mormon
    name: Ether 2:22
    book: Ether
    chapter: 2
    verse: 22
    ordinal: 6073
    text: 'And he cried again unto the Lord saying: O Lord, behold I have done even as thou hast commanded me; and I have prepared the vessels for my people, and behold there is no light in them. Behold, O Lord, wilt thou suffer that we shall cross this great water in darkness?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.23
    scripture: book-of-mormon
    name: Ether 2:23
    book: Ether
    chapter: 2
    verse: 23
    ordinal: 6074
    text: 'And the Lord said unto the brother of Jared: What will ye that I should do that ye may have light in your vessels? For behold, ye cannot have windows, for they will be dashed in pieces; neither shall ye take fire with you, for ye shall not go by the light of fire.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.24
    scripture: book-of-mormon
    name: Ether 2:24
    book: Ether
    chapter: 2
    verse: 24
    ordinal: 6075
    text: For behold, ye shall be as a whale in the midst of the sea; for the mountain waves shall dash upon you. Nevertheless, I will bring you up again out of the depths of the sea; for the winds have gone forth out of my mouth, and also the rains and the floods have I sent forth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.2.25
    scripture: book-of-mormon
    name: Ether 2:25
    book: Ether
    chapter: 2
    verse: 25
    ordinal: 6076
    text: And behold, I prepare you against these things; for ye cannot cross this great deep save I prepare you against the waves of the sea, and the winds which have gone forth, and the floods which shall come. Therefore what will ye that I should prepare for you that ye may have light when ye are swallowed up in the depths of the sea?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.2
- type: BomVerse
  data:
    ref: ether.3.1
    scripture: book-of-mormon
    name: Ether 3:1
    book: Ether
    chapter: 3
    verse: 1
    ordinal: 6077
    text: 'And it came to pass that the brother of Jared, (now the number of the vessels which had been prepared was eight) went forth unto the mount, which they called the mount Shelem, because of its exceeding height, and did molten out of a rock sixteen small stones; and they were white and clear, even as transparent glass; and he did carry them in his hands upon the top of the mount, and cried again unto the Lord, saying:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.2
    scripture: book-of-mormon
    name: Ether 3:2
    book: Ether
    chapter: 3
    verse: 2
    ordinal: 6078
    text: O Lord, thou hast said that we must be encompassed about by the floods. Now behold, O Lord, and do not be angry with thy servant because of his weakness before thee; for we know that thou art holy and dwellest in the heavens, and that we are unworthy before thee; because of the fall our natures have become evil continually; nevertheless, O Lord, thou hast given us a commandment that we must call upon thee, that from thee we may receive according to our desires.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.3
    scripture: book-of-mormon
    name: Ether 3:3
    book: Ether
    chapter: 3
    verse: 3
    ordinal: 6079
    text: Behold, O Lord, thou hast smitten us because of our iniquity, and hast driven us forth, and for these many years we have been in the wilderness; nevertheless, thou hast been merciful unto us. O Lord, look upon me in pity, and turn away thine anger from this thy people, and suffer not that they shall go forth across this raging deep in darkness; but behold these things which I have molten out of the rock.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.4
    scripture: book-of-mormon
    name: Ether 3:4
    book: Ether
    chapter: 3
    verse: 4
    ordinal: 6080
    text: And I know, O Lord, that thou hast all power, and can do whatsoever thou wilt for the benefit of man; therefore touch these stones, O Lord, with thy finger, and prepare them that they may shine forth in darkness; and they shall shine forth unto us in the vessels which we have prepared, that we may have light while we shall cross the sea.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.5
    scripture: book-of-mormon
    name: Ether 3:5
    book: Ether
    chapter: 3
    verse: 5
    ordinal: 6081
    text: Behold, O Lord, thou canst do this. We know that thou art able to show forth great power, which looks small unto the understanding of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.6
    scripture: book-of-mormon
    name: Ether 3:6
    book: Ether
    chapter: 3
    verse: 6
    ordinal: 6082
    text: And it came to pass that when the brother of Jared had said these words, behold, the Lord stretched forth his hand and touched the stones one by one with his finger. And the veil was taken from off the eyes of the brother of Jared, and he saw the finger of the Lord; and it was as the finger of a man, like unto flesh and blood; and the brother of Jared fell down before the Lord, for he was struck with fear.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.7
    scripture: book-of-mormon
    name: Ether 3:7
    book: Ether
    chapter: 3
    verse: 7
    ordinal: 6083
    text: 'And the Lord saw that the brother of Jared had fallen to the earth; and the Lord said unto him: Arise, why hast thou fallen?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.8
    scripture: book-of-mormon
    name: Ether 3:8
    book: Ether
    chapter: 3
    verse: 8
    ordinal: 6084
    text: 'And he saith unto the Lord: I saw the finger of the Lord, and I feared lest he should smite me; for I knew not that the Lord had flesh and blood.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.9
    scripture: book-of-mormon
    name: Ether 3:9
    book: Ether
    chapter: 3
    verse: 9
    ordinal: 6085
    text: 'And the Lord said unto him: Because of thy faith thou hast seen that I shall take upon me flesh and blood; and never has man come before me with such exceeding faith as thou hast; for were it not so ye could not have seen my finger. Sawest thou more than this?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.10
    scripture: book-of-mormon
    name: Ether 3:10
    book: Ether
    chapter: 3
    verse: 10
    ordinal: 6086
    text: 'And he answered: Nay; Lord, show thyself unto me.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.11
    scripture: book-of-mormon
    name: Ether 3:11
    book: Ether
    chapter: 3
    verse: 11
    ordinal: 6087
    text: 'And the Lord said unto him: Believest thou the words which I shall speak?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.12
    scripture: book-of-mormon
    name: Ether 3:12
    book: Ether
    chapter: 3
    verse: 12
    ordinal: 6088
    text: 'And he answered: Yea, Lord, I know that thou speakest the truth, for thou art a God of truth, and canst not lie.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.13
    scripture: book-of-mormon
    name: Ether 3:13
    book: Ether
    chapter: 3
    verse: 13
    ordinal: 6089
    text: 'And when he had said these words, behold, the Lord showed himself unto him, and said: Because thou knowest these things ye are redeemed from the fall; therefore ye are brought back into my presence; therefore I show myself unto you.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.14
    scripture: book-of-mormon
    name: Ether 3:14
    book: Ether
    chapter: 3
    verse: 14
    ordinal: 6090
    text: Behold, I am he who was prepared from the foundation of the world to redeem my people. Behold, I am Jesus Christ. I am the Father and the Son. In me shall all mankind have life, and that eternally, even they who shall believe on my name; and they shall become my sons and my daughters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.15
    scripture: book-of-mormon
    name: Ether 3:15
    book: Ether
    chapter: 3
    verse: 15
    ordinal: 6091
    text: And never have I showed myself unto man whom I have created, for never has man believed in me as thou hast. Seest thou that ye are created after mine own image? Yea, even all men were created in the beginning after mine own image.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.16
    scripture: book-of-mormon
    name: Ether 3:16
    book: Ether
    chapter: 3
    verse: 16
    ordinal: 6092
    text: Behold, this body, which ye now behold, is the body of my spirit; and man have I created after the body of my spirit; and even as I appear unto thee to be in the spirit will I appear unto my people in the flesh.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.17
    scripture: book-of-mormon
    name: Ether 3:17
    book: Ether
    chapter: 3
    verse: 17
    ordinal: 6093
    text: And now, as I, Moroni, said I could not make a full account of these things which are written, therefore it sufficeth me to say that Jesus showed himself unto this man in the spirit, even after the manner and in the likeness of the same body even as he showed himself unto the Nephites.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.18
    scripture: book-of-mormon
    name: Ether 3:18
    book: Ether
    chapter: 3
    verse: 18
    ordinal: 6094
    text: And he ministered unto him even as he ministered unto the Nephites; and all this, that this man might know that he was God, because of the many great works which the Lord had showed unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.19
    scripture: book-of-mormon
    name: Ether 3:19
    book: Ether
    chapter: 3
    verse: 19
    ordinal: 6095
    text: And because of the knowledge of this man he could not be kept from beholding within the veil; and he saw the finger of Jesus, which, when he saw, he fell with fear; for he knew that it was the finger of the Lord; and he had faith no longer, for he knew, nothing doubting.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.20
    scripture: book-of-mormon
    name: Ether 3:20
    book: Ether
    chapter: 3
    verse: 20
    ordinal: 6096
    text: Wherefore, having this perfect knowledge of God, he could not be kept from within the veil; therefore he saw Jesus; and he did minister unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.21
    scripture: book-of-mormon
    name: Ether 3:21
    book: Ether
    chapter: 3
    verse: 21
    ordinal: 6097
    text: 'And it came to pass that the Lord said unto the brother of Jared: Behold, thou shalt not suffer these things which ye have seen and heard to go forth unto the world, until the time cometh that I shall glorify my name in the flesh; wherefore, ye shall treasure up the things which ye have seen and heard, and show it to no man.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.22
    scripture: book-of-mormon
    name: Ether 3:22
    book: Ether
    chapter: 3
    verse: 22
    ordinal: 6098
    text: And behold, when ye shall come unto me, ye shall write them and shall seal them up, that no one can interpret them; for ye shall write them in a language that they cannot be read.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.23
    scripture: book-of-mormon
    name: Ether 3:23
    book: Ether
    chapter: 3
    verse: 23
    ordinal: 6099
    text: And behold, these two stones will I give unto thee, and ye shall seal them up also with the things which ye shall write.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.24
    scripture: book-of-mormon
    name: Ether 3:24
    book: Ether
    chapter: 3
    verse: 24
    ordinal: 6100
    text: For behold, the language which ye shall write I have confounded; wherefore I will cause in my own due time that these stones shall magnify to the eyes of men these things which ye shall write.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.25
    scripture: book-of-mormon
    name: Ether 3:25
    book: Ether
    chapter: 3
    verse: 25
    ordinal: 6101
    text: And when the Lord had said these words, he showed unto the brother of Jared all the inhabitants of the earth which had been, and also all that would be; and he withheld them not from his sight, even unto the ends of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.26
    scripture: book-of-mormon
    name: Ether 3:26
    book: Ether
    chapter: 3
    verse: 26
    ordinal: 6102
    text: For he had said unto him in times before, that if he would believe in him that he could show unto him all things—it should be shown unto him; therefore the Lord could not withhold anything from him, for he knew that the Lord could show him all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.27
    scripture: book-of-mormon
    name: Ether 3:27
    book: Ether
    chapter: 3
    verse: 27
    ordinal: 6103
    text: 'And the Lord said unto him: Write these things and seal them up; and I will show them in mine own due time unto the children of men.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.3.28
    scripture: book-of-mormon
    name: Ether 3:28
    book: Ether
    chapter: 3
    verse: 28
    ordinal: 6104
    text: And it came to pass that the Lord commanded him that he should seal up the two stones which he had received, and show them not, until the Lord should show them unto the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.3
- type: BomVerse
  data:
    ref: ether.4.1
    scripture: book-of-mormon
    name: Ether 4:1
    book: Ether
    chapter: 4
    verse: 1
    ordinal: 6105
    text: And the Lord commanded the brother of Jared to go down out of the mount from the presence of the Lord, and write the things which he had seen; and they were forbidden to come unto the children of men until after that he should be lifted up upon the cross; and for this cause did king Mosiah keep them, that they should not come unto the world until after Christ should show himself unto his people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.2
    scripture: book-of-mormon
    name: Ether 4:2
    book: Ether
    chapter: 4
    verse: 2
    ordinal: 6106
    text: And after Christ truly had showed himself unto his people he commanded that they should be made manifest.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.3
    scripture: book-of-mormon
    name: Ether 4:3
    book: Ether
    chapter: 4
    verse: 3
    ordinal: 6107
    text: And now, after that, they have all dwindled in unbelief; and there is none save it be the Lamanites, and they have rejected the gospel of Christ; therefore I am commanded that I should hide them up again in the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.4
    scripture: book-of-mormon
    name: Ether 4:4
    book: Ether
    chapter: 4
    verse: 4
    ordinal: 6108
    text: Behold, I have written upon these plates the very things which the brother of Jared saw; and there never were greater things made manifest than those which were made manifest unto the brother of Jared.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.5
    scripture: book-of-mormon
    name: Ether 4:5
    book: Ether
    chapter: 4
    verse: 5
    ordinal: 6109
    text: Wherefore the Lord hath commanded me to write them; and I have written them. And he commanded me that I should seal them up; and he also hath commanded that I should seal up the interpretation thereof; wherefore I have sealed up the interpreters, according to the commandment of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.6
    scripture: book-of-mormon
    name: Ether 4:6
    book: Ether
    chapter: 4
    verse: 6
    ordinal: 6110
    text: 'For the Lord said unto me: They shall not go forth unto the Gentiles until the day that they shall repent of their iniquity, and become clean before the Lord.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.7
    scripture: book-of-mormon
    name: Ether 4:7
    book: Ether
    chapter: 4
    verse: 7
    ordinal: 6111
    text: And in that day that they shall exercise faith in me, saith the Lord, even as the brother of Jared did, that they may become sanctified in me, then will I manifest unto them the things which the brother of Jared saw, even to the unfolding unto them all my revelations, saith Jesus Christ, the Son of God, the Father of the heavens and of the earth, and all things that in them are.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.8
    scripture: book-of-mormon
    name: Ether 4:8
    book: Ether
    chapter: 4
    verse: 8
    ordinal: 6112
    text: And he that will contend against the word of the Lord, let him be accursed; and he that shall deny these things, let him be accursed; for unto them will I show no greater things, saith Jesus Christ; for I am he who speaketh.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.9
    scripture: book-of-mormon
    name: Ether 4:9
    book: Ether
    chapter: 4
    verse: 9
    ordinal: 6113
    text: And at my command the heavens are opened and are shut; and at my word the earth shall shake; and at my command the inhabitants thereof shall pass away, even so as by fire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.10
    scripture: book-of-mormon
    name: Ether 4:10
    book: Ether
    chapter: 4
    verse: 10
    ordinal: 6114
    text: And he that believeth not my words believeth not my disciples; and if it so be that I do not speak, judge ye; for ye shall know that it is I that speaketh, at the last day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.11
    scripture: book-of-mormon
    name: Ether 4:11
    book: Ether
    chapter: 4
    verse: 11
    ordinal: 6115
    text: But he that believeth these things which I have spoken, him will I visit with the manifestations of my Spirit, and he shall know and bear record. For because of my Spirit he shall know that these things are true; for it persuadeth men to do good.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.12
    scripture: book-of-mormon
    name: Ether 4:12
    book: Ether
    chapter: 4
    verse: 12
    ordinal: 6116
    text: And whatsoever thing persuadeth men to do good is of me; for good cometh of none save it be of me. I am the same that leadeth men to all good; he that will not believe my words will not believe me—that I am; and he that will not believe me will not believe the Father who sent me. For behold, I am the Father, I am the light, and the life, and the truth of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.13
    scripture: book-of-mormon
    name: Ether 4:13
    book: Ether
    chapter: 4
    verse: 13
    ordinal: 6117
    text: Come unto me, O ye Gentiles, and I will show unto you the greater things, the knowledge which is hid up because of unbelief.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.14
    scripture: book-of-mormon
    name: Ether 4:14
    book: Ether
    chapter: 4
    verse: 14
    ordinal: 6118
    text: Come unto me, O ye house of Israel, and it shall be made manifest unto you how great things the Father hath laid up for you, from the foundation of the world; and it hath not come unto you, because of unbelief.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.15
    scripture: book-of-mormon
    name: Ether 4:15
    book: Ether
    chapter: 4
    verse: 15
    ordinal: 6119
    text: Behold, when ye shall rend that veil of unbelief which doth cause you to remain in your awful state of wickedness, and hardness of heart, and blindness of mind, then shall the great and marvelous things which have been hid up from the foundation of the world from you—yea, when ye shall call upon the Father in my name, with a broken heart and a contrite spirit, then shall ye know that the Father hath remembered the covenant which he made unto your fathers, O house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.16
    scripture: book-of-mormon
    name: Ether 4:16
    book: Ether
    chapter: 4
    verse: 16
    ordinal: 6120
    text: And then shall my revelations which I have caused to be written by my servant John be unfolded in the eyes of all the people. Remember, when ye see these things, ye shall know that the time is at hand that they shall be made manifest in very deed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.17
    scripture: book-of-mormon
    name: Ether 4:17
    book: Ether
    chapter: 4
    verse: 17
    ordinal: 6121
    text: Therefore, when ye shall receive this record ye may know that the work of the Father has commenced upon all the face of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.18
    scripture: book-of-mormon
    name: Ether 4:18
    book: Ether
    chapter: 4
    verse: 18
    ordinal: 6122
    text: Therefore, repent all ye ends of the earth, and come unto me, and believe in my gospel, and be baptized in my name; for he that believeth and is baptized shall be saved; but he that believeth not shall be damned; and signs shall follow them that believe in my name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.4.19
    scripture: book-of-mormon
    name: Ether 4:19
    book: Ether
    chapter: 4
    verse: 19
    ordinal: 6123
    text: And blessed is he that is found faithful unto my name at the last day, for he shall be lifted up to dwell in the kingdom prepared for him from the foundation of the world. And behold it is I that hath spoken it. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.4
- type: BomVerse
  data:
    ref: ether.5.1
    scripture: book-of-mormon
    name: Ether 5:1
    book: Ether
    chapter: 5
    verse: 1
    ordinal: 6124
    text: And now I, Moroni, have written the words which were commanded me, according to my memory; and I have told you the things which I have sealed up; therefore touch them not in order that ye may translate; for that thing is forbidden you, except by and by it shall be wisdom in God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.5
- type: BomVerse
  data:
    ref: ether.5.2
    scripture: book-of-mormon
    name: Ether 5:2
    book: Ether
    chapter: 5
    verse: 2
    ordinal: 6125
    text: And behold, ye may be privileged that ye may show the plates unto those who shall assist to bring forth this work;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.5
- type: BomVerse
  data:
    ref: ether.5.3
    scripture: book-of-mormon
    name: Ether 5:3
    book: Ether
    chapter: 5
    verse: 3
    ordinal: 6126
    text: And unto three shall they be shown by the power of God; wherefore they shall know of a surety that these things are true.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.5
- type: BomVerse
  data:
    ref: ether.5.4
    scripture: book-of-mormon
    name: Ether 5:4
    book: Ether
    chapter: 5
    verse: 4
    ordinal: 6127
    text: And in the mouth of three witnesses shall these things be established; and the testimony of three, and this work, in the which shall be shown forth the power of God and also his word, of which the Father, and the Son, and the Holy Ghost bear record—and all this shall stand as a testimony against the world at the last day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.5
- type: BomVerse
  data:
    ref: ether.5.5
    scripture: book-of-mormon
    name: Ether 5:5
    book: Ether
    chapter: 5
    verse: 5
    ordinal: 6128
    text: And if it so be that they repent and come unto the Father in the name of Jesus, they shall be received into the kingdom of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.5
- type: BomVerse
  data:
    ref: ether.5.6
    scripture: book-of-mormon
    name: Ether 5:6
    book: Ether
    chapter: 5
    verse: 6
    ordinal: 6129
    text: And now, if I have no authority for these things, judge ye; for ye shall know that I have authority when ye shall see me, and we shall stand before God at the last day. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.5
- type: BomVerse
  data:
    ref: ether.6.1
    scripture: book-of-mormon
    name: Ether 6:1
    book: Ether
    chapter: 6
    verse: 1
    ordinal: 6130
    text: And now I, Moroni, proceed to give the record of Jared and his brother.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.2
    scripture: book-of-mormon
    name: Ether 6:2
    book: Ether
    chapter: 6
    verse: 2
    ordinal: 6131
    text: For it came to pass after the Lord had prepared the stones which the brother of Jared had carried up into the mount, the brother of Jared came down out of the mount, and he did put forth the stones into the vessels which were prepared, one in each end thereof; and behold, they did give light unto the vessels.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.3
    scripture: book-of-mormon
    name: Ether 6:3
    book: Ether
    chapter: 6
    verse: 3
    ordinal: 6132
    text: And thus the Lord caused stones to shine in darkness, to give light unto men, women, and children, that they might not cross the great waters in darkness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.4
    scripture: book-of-mormon
    name: Ether 6:4
    book: Ether
    chapter: 6
    verse: 4
    ordinal: 6133
    text: And it came to pass that when they had prepared all manner of food, that thereby they might subsist upon the water, and also food for their flocks and herds, and whatsoever beast or animal or fowl that they should carry with them—and it came to pass that when they had done all these things they got aboard of their vessels or barges, and set forth into the sea, commending themselves unto the Lord their God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.5
    scripture: book-of-mormon
    name: Ether 6:5
    book: Ether
    chapter: 6
    verse: 5
    ordinal: 6134
    text: And it came to pass that the Lord God caused that there should be a furious wind blow upon the face of the waters, towards the promised land; and thus they were tossed upon the waves of the sea before the wind.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.6
    scripture: book-of-mormon
    name: Ether 6:6
    book: Ether
    chapter: 6
    verse: 6
    ordinal: 6135
    text: And it came to pass that they were many times buried in the depths of the sea, because of the mountain waves which broke upon them, and also the great and terrible tempests which were caused by the fierceness of the wind.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.7
    scripture: book-of-mormon
    name: Ether 6:7
    book: Ether
    chapter: 6
    verse: 7
    ordinal: 6136
    text: And it came to pass that when they were buried in the deep there was no water that could hurt them, their vessels being tight like unto a dish, and also they were tight like unto the ark of Noah; therefore when they were encompassed about by many waters they did cry unto the Lord, and he did bring them forth again upon the top of the waters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.8
    scripture: book-of-mormon
    name: Ether 6:8
    book: Ether
    chapter: 6
    verse: 8
    ordinal: 6137
    text: And it came to pass that the wind did never cease to blow towards the promised land while they were upon the waters; and thus they were driven forth before the wind.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.9
    scripture: book-of-mormon
    name: Ether 6:9
    book: Ether
    chapter: 6
    verse: 9
    ordinal: 6138
    text: And they did sing praises unto the Lord; yea, the brother of Jared did sing praises unto the Lord, and he did thank and praise the Lord all the day long; and when the night came, they did not cease to praise the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.10
    scripture: book-of-mormon
    name: Ether 6:10
    book: Ether
    chapter: 6
    verse: 10
    ordinal: 6139
    text: And thus they were driven forth; and no monster of the sea could break them, neither whale that could mar them; and they did have light continually, whether it was above the water or under the water.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.11
    scripture: book-of-mormon
    name: Ether 6:11
    book: Ether
    chapter: 6
    verse: 11
    ordinal: 6140
    text: And thus they were driven forth, three hundred and forty and four days upon the water.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.12
    scripture: book-of-mormon
    name: Ether 6:12
    book: Ether
    chapter: 6
    verse: 12
    ordinal: 6141
    text: And they did land upon the shore of the promised land. And when they had set their feet upon the shores of the promised land they bowed themselves down upon the face of the land, and did humble themselves before the Lord, and did shed tears of joy before the Lord, because of the multitude of his tender mercies over them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.13
    scripture: book-of-mormon
    name: Ether 6:13
    book: Ether
    chapter: 6
    verse: 13
    ordinal: 6142
    text: And it came to pass that they went forth upon the face of the land, and began to till the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.14
    scripture: book-of-mormon
    name: Ether 6:14
    book: Ether
    chapter: 6
    verse: 14
    ordinal: 6143
    text: And Jared had four sons; and they were called Jacom, and Gilgah, and Mahah, and Orihah.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.15
    scripture: book-of-mormon
    name: Ether 6:15
    book: Ether
    chapter: 6
    verse: 15
    ordinal: 6144
    text: And the brother of Jared also begat sons and daughters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.16
    scripture: book-of-mormon
    name: Ether 6:16
    book: Ether
    chapter: 6
    verse: 16
    ordinal: 6145
    text: And the friends of Jared and his brother were in number about twenty and two souls; and they also begat sons and daughters before they came to the promised land; and therefore they began to be many.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.17
    scripture: book-of-mormon
    name: Ether 6:17
    book: Ether
    chapter: 6
    verse: 17
    ordinal: 6146
    text: And they were taught to walk humbly before the Lord; and they were also taught from on high.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.18
    scripture: book-of-mormon
    name: Ether 6:18
    book: Ether
    chapter: 6
    verse: 18
    ordinal: 6147
    text: And it came to pass that they began to spread upon the face of the land, and to multiply and to till the earth; and they did wax strong in the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.19
    scripture: book-of-mormon
    name: Ether 6:19
    book: Ether
    chapter: 6
    verse: 19
    ordinal: 6148
    text: 'And the brother of Jared began to be old, and saw that he must soon go down to the grave; wherefore he said unto Jared: Let us gather together our people that we may number them, that we may know of them what they will desire of us before we go down to our graves.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.20
    scripture: book-of-mormon
    name: Ether 6:20
    book: Ether
    chapter: 6
    verse: 20
    ordinal: 6149
    text: And accordingly the people were gathered together. Now the number of the sons and the daughters of the brother of Jared were twenty and two souls; and the number of sons and daughters of Jared were twelve, he having four sons.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.21
    scripture: book-of-mormon
    name: Ether 6:21
    book: Ether
    chapter: 6
    verse: 21
    ordinal: 6150
    text: And it came to pass that they did number their people; and after that they had numbered them, they did desire of them the things which they would that they should do before they went down to their graves.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.22
    scripture: book-of-mormon
    name: Ether 6:22
    book: Ether
    chapter: 6
    verse: 22
    ordinal: 6151
    text: And it came to pass that the people desired of them that they should anoint one of their sons to be a king over them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.23
    scripture: book-of-mormon
    name: Ether 6:23
    book: Ether
    chapter: 6
    verse: 23
    ordinal: 6152
    text: 'And now behold, this was grievous unto them. And the brother of Jared said unto them: Surely this thing leadeth into captivity.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.24
    scripture: book-of-mormon
    name: Ether 6:24
    book: Ether
    chapter: 6
    verse: 24
    ordinal: 6153
    text: 'But Jared said unto his brother: Suffer them that they may have a king. And therefore he said unto them: Choose ye out from among our sons a king, even whom ye will.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.25
    scripture: book-of-mormon
    name: Ether 6:25
    book: Ether
    chapter: 6
    verse: 25
    ordinal: 6154
    text: And it came to pass that they chose even the firstborn of the brother of Jared; and his name was Pagag. And it came to pass that he refused and would not be their king. And the people would that his father should constrain him, but his father would not; and he commanded them that they should constrain no man to be their king.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.26
    scripture: book-of-mormon
    name: Ether 6:26
    book: Ether
    chapter: 6
    verse: 26
    ordinal: 6155
    text: And it came to pass that they chose all the brothers of Pagag, and they would not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.27
    scripture: book-of-mormon
    name: Ether 6:27
    book: Ether
    chapter: 6
    verse: 27
    ordinal: 6156
    text: And it came to pass that neither would the sons of Jared, even all save it were one; and Orihah was anointed to be king over the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.28
    scripture: book-of-mormon
    name: Ether 6:28
    book: Ether
    chapter: 6
    verse: 28
    ordinal: 6157
    text: And he began to reign, and the people began to prosper; and they became exceedingly rich.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.29
    scripture: book-of-mormon
    name: Ether 6:29
    book: Ether
    chapter: 6
    verse: 29
    ordinal: 6158
    text: And it came to pass that Jared died, and his brother also.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.6.30
    scripture: book-of-mormon
    name: Ether 6:30
    book: Ether
    chapter: 6
    verse: 30
    ordinal: 6159
    text: And it came to pass that Orihah did walk humbly before the Lord, and did remember how great things the Lord had done for his father, and also taught his people how great things the Lord had done for their fathers.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.6
- type: BomVerse
  data:
    ref: ether.7.1
    scripture: book-of-mormon
    name: Ether 7:1
    book: Ether
    chapter: 7
    verse: 1
    ordinal: 6160
    text: And it came to pass that Orihah did execute judgment upon the land in righteousness all his days, whose days were exceedingly many.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.2
    scripture: book-of-mormon
    name: Ether 7:2
    book: Ether
    chapter: 7
    verse: 2
    ordinal: 6161
    text: And he begat sons and daughters; yea, he begat thirty and one, among whom were twenty and three sons.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.3
    scripture: book-of-mormon
    name: Ether 7:3
    book: Ether
    chapter: 7
    verse: 3
    ordinal: 6162
    text: And it came to pass that he also begat Kib in his old age. And it came to pass that Kib reigned in his stead; and Kib begat Corihor.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.4
    scripture: book-of-mormon
    name: Ether 7:4
    book: Ether
    chapter: 7
    verse: 4
    ordinal: 6163
    text: And when Corihor was thirty and two years old he rebelled against his father, and went over and dwelt in the land of Nehor; and he begat sons and daughters, and they became exceedingly fair; wherefore Corihor drew away many people after him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.5
    scripture: book-of-mormon
    name: Ether 7:5
    book: Ether
    chapter: 7
    verse: 5
    ordinal: 6164
    text: And when he had gathered together an army he came up unto the land of Moron where the king dwelt, and took him captive, which brought to pass the saying of the brother of Jared that they would be brought into captivity.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.6
    scripture: book-of-mormon
    name: Ether 7:6
    book: Ether
    chapter: 7
    verse: 6
    ordinal: 6165
    text: Now the land of Moron, where the king dwelt, was near the land which is called Desolation by the Nephites.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.7
    scripture: book-of-mormon
    name: Ether 7:7
    book: Ether
    chapter: 7
    verse: 7
    ordinal: 6166
    text: And it came to pass that Kib dwelt in captivity, and his people under Corihor his son, until he became exceedingly old; nevertheless Kib begat Shule in his old age, while he was yet in captivity.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.8
    scripture: book-of-mormon
    name: Ether 7:8
    book: Ether
    chapter: 7
    verse: 8
    ordinal: 6167
    text: And it came to pass that Shule was angry with his brother; and Shule waxed strong, and became mighty as to the strength of a man; and he was also mighty in judgment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.9
    scripture: book-of-mormon
    name: Ether 7:9
    book: Ether
    chapter: 7
    verse: 9
    ordinal: 6168
    text: Wherefore, he came to the hill Ephraim, and he did molten out of the hill, and made swords out of steel for those whom he had drawn away with him; and after he had armed them with swords he returned to the city Nehor, and gave battle unto his brother Corihor, by which means he obtained the kingdom and restored it unto his father Kib.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.10
    scripture: book-of-mormon
    name: Ether 7:10
    book: Ether
    chapter: 7
    verse: 10
    ordinal: 6169
    text: And now because of the thing which Shule had done, his father bestowed upon him the kingdom; therefore he began to reign in the stead of his father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.11
    scripture: book-of-mormon
    name: Ether 7:11
    book: Ether
    chapter: 7
    verse: 11
    ordinal: 6170
    text: And it came to pass that he did execute judgment in righteousness; and he did spread his kingdom upon all the face of the land, for the people had become exceedingly numerous.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.12
    scripture: book-of-mormon
    name: Ether 7:12
    book: Ether
    chapter: 7
    verse: 12
    ordinal: 6171
    text: And it came to pass that Shule also begat many sons and daughters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.13
    scripture: book-of-mormon
    name: Ether 7:13
    book: Ether
    chapter: 7
    verse: 13
    ordinal: 6172
    text: And Corihor repented of the many evils which he had done; wherefore Shule gave him power in his kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.14
    scripture: book-of-mormon
    name: Ether 7:14
    book: Ether
    chapter: 7
    verse: 14
    ordinal: 6173
    text: And it came to pass that Corihor had many sons and daughters. And among the sons of Corihor there was one whose name was Noah.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.15
    scripture: book-of-mormon
    name: Ether 7:15
    book: Ether
    chapter: 7
    verse: 15
    ordinal: 6174
    text: And it came to pass that Noah rebelled against Shule, the king, and also his father Corihor, and drew away Cohor his brother, and also all his brethren and many of the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.16
    scripture: book-of-mormon
    name: Ether 7:16
    book: Ether
    chapter: 7
    verse: 16
    ordinal: 6175
    text: And he gave battle unto Shule, the king, in which he did obtain the land of their first inheritance; and he became a king over that part of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.17
    scripture: book-of-mormon
    name: Ether 7:17
    book: Ether
    chapter: 7
    verse: 17
    ordinal: 6176
    text: And it came to pass that he gave battle again unto Shule, the king; and he took Shule, the king, and carried him away captive into Moron.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.18
    scripture: book-of-mormon
    name: Ether 7:18
    book: Ether
    chapter: 7
    verse: 18
    ordinal: 6177
    text: And it came to pass as he was about to put him to death, the sons of Shule crept into the house of Noah by night and slew him, and broke down the door of the prison and brought out their father, and placed him upon his throne in his own kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.19
    scripture: book-of-mormon
    name: Ether 7:19
    book: Ether
    chapter: 7
    verse: 19
    ordinal: 6178
    text: Wherefore, the son of Noah did build up his kingdom in his stead; nevertheless they did not gain power any more over Shule the king, and the people who were under the reign of Shule the king did prosper exceedingly and wax great.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.20
    scripture: book-of-mormon
    name: Ether 7:20
    book: Ether
    chapter: 7
    verse: 20
    ordinal: 6179
    text: And the country was divided; and there were two kingdoms, the kingdom of Shule, and the kingdom of Cohor, the son of Noah.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.21
    scripture: book-of-mormon
    name: Ether 7:21
    book: Ether
    chapter: 7
    verse: 21
    ordinal: 6180
    text: And Cohor, the son of Noah, caused that his people should give battle unto Shule, in which Shule did beat them and did slay Cohor.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.22
    scripture: book-of-mormon
    name: Ether 7:22
    book: Ether
    chapter: 7
    verse: 22
    ordinal: 6181
    text: And now Cohor had a son who was called Nimrod; and Nimrod gave up the kingdom of Cohor unto Shule, and he did gain favor in the eyes of Shule; wherefore Shule did bestow great favors upon him, and he did do in the kingdom of Shule according to his desires.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.23
    scripture: book-of-mormon
    name: Ether 7:23
    book: Ether
    chapter: 7
    verse: 23
    ordinal: 6182
    text: And also in the reign of Shule there came prophets among the people, who were sent from the Lord, prophesying that the wickedness and idolatry of the people was bringing a curse upon the land, and they should be destroyed if they did not repent.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.24
    scripture: book-of-mormon
    name: Ether 7:24
    book: Ether
    chapter: 7
    verse: 24
    ordinal: 6183
    text: And it came to pass that the people did revile against the prophets, and did mock them. And it came to pass that king Shule did execute judgment against all those who did revile against the prophets.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.25
    scripture: book-of-mormon
    name: Ether 7:25
    book: Ether
    chapter: 7
    verse: 25
    ordinal: 6184
    text: And he did execute a law throughout all the land, which gave power unto the prophets that they should go whithersoever they would; and by this cause the people were brought unto repentance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.26
    scripture: book-of-mormon
    name: Ether 7:26
    book: Ether
    chapter: 7
    verse: 26
    ordinal: 6185
    text: And because the people did repent of their iniquities and idolatries the Lord did spare them, and they began to prosper again in the land. And it came to pass that Shule begat sons and daughters in his old age.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.7.27
    scripture: book-of-mormon
    name: Ether 7:27
    book: Ether
    chapter: 7
    verse: 27
    ordinal: 6186
    text: And there were no more wars in the days of Shule; and he remembered the great things that the Lord had done for his fathers in bringing them across the great deep into the promised land; wherefore he did execute judgment in righteousness all his days.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.7
- type: BomVerse
  data:
    ref: ether.8.1
    scripture: book-of-mormon
    name: Ether 8:1
    book: Ether
    chapter: 8
    verse: 1
    ordinal: 6187
    text: And it came to pass that he begat Omer, and Omer reigned in his stead. And Omer begat Jared; and Jared begat sons and daughters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.2
    scripture: book-of-mormon
    name: Ether 8:2
    book: Ether
    chapter: 8
    verse: 2
    ordinal: 6188
    text: And Jared rebelled against his father, and came and dwelt in the land of Heth. And it came to pass that he did flatter many people, because of his cunning words, until he had gained the half of the kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.3
    scripture: book-of-mormon
    name: Ether 8:3
    book: Ether
    chapter: 8
    verse: 3
    ordinal: 6189
    text: And when he had gained the half of the kingdom he gave battle unto his father, and he did carry away his father into captivity, and did make him serve in captivity;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.4
    scripture: book-of-mormon
    name: Ether 8:4
    book: Ether
    chapter: 8
    verse: 4
    ordinal: 6190
    text: And now, in the days of the reign of Omer he was in captivity the half of his days. And it came to pass that he begat sons and daughters, among whom were Esrom and Coriantumr;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.5
    scripture: book-of-mormon
    name: Ether 8:5
    book: Ether
    chapter: 8
    verse: 5
    ordinal: 6191
    text: And they were exceedingly angry because of the doings of Jared their brother, insomuch that they did raise an army and gave battle unto Jared. And it came to pass that they did give battle unto him by night.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.6
    scripture: book-of-mormon
    name: Ether 8:6
    book: Ether
    chapter: 8
    verse: 6
    ordinal: 6192
    text: And it came to pass that when they had slain the army of Jared they were about to slay him also; and he pled with them that they would not slay him, and he would give up the kingdom unto his father. And it came to pass that they did grant unto him his life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.7
    scripture: book-of-mormon
    name: Ether 8:7
    book: Ether
    chapter: 8
    verse: 7
    ordinal: 6193
    text: And now Jared became exceedingly sorrowful because of the loss of the kingdom, for he had set his heart upon the kingdom and upon the glory of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.8
    scripture: book-of-mormon
    name: Ether 8:8
    book: Ether
    chapter: 8
    verse: 8
    ordinal: 6194
    text: Now the daughter of Jared being exceedingly expert, and seeing the sorrows of her father, thought to devise a plan whereby she could redeem the kingdom unto her father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.9
    scripture: book-of-mormon
    name: Ether 8:9
    book: Ether
    chapter: 8
    verse: 9
    ordinal: 6195
    text: 'Now the daughter of Jared was exceedingly fair. And it came to pass that she did talk with her father, and said unto him: Whereby hath my father so much sorrow? Hath he not read the record which our fathers brought across the great deep? Behold, is there not an account concerning them of old, that they by their secret plans did obtain kingdoms and great glory?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.10
    scripture: book-of-mormon
    name: Ether 8:10
    book: Ether
    chapter: 8
    verse: 10
    ordinal: 6196
    text: 'And now, therefore, let my father send for Akish, the son of Kimnor; and behold, I am fair, and I will dance before him, and I will please him, that he will desire me to wife; wherefore if he shall desire of thee that ye shall give unto him me to wife, then shall ye say: I will give her if ye will bring unto me the head of my father, the king.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.11
    scripture: book-of-mormon
    name: Ether 8:11
    book: Ether
    chapter: 8
    verse: 11
    ordinal: 6197
    text: 'And now Omer was a friend to Akish; wherefore, when Jared had sent for Akish, the daughter of Jared danced before him that she pleased him, insomuch that he desired her to wife. And it came to pass that he said unto Jared: Give her unto me to wife.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.12
    scripture: book-of-mormon
    name: Ether 8:12
    book: Ether
    chapter: 8
    verse: 12
    ordinal: 6198
    text: 'And Jared said unto him: I will give her unto you, if ye will bring unto me the head of my father, the king.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.13
    scripture: book-of-mormon
    name: Ether 8:13
    book: Ether
    chapter: 8
    verse: 13
    ordinal: 6199
    text: 'And it came to pass that Akish gathered in unto the house of Jared all his kinsfolk, and said unto them: Will ye swear unto me that ye will be faithful unto me in the thing which I shall desire of you?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.14
    scripture: book-of-mormon
    name: Ether 8:14
    book: Ether
    chapter: 8
    verse: 14
    ordinal: 6200
    text: And it came to pass that they all sware unto him, by the God of heaven, and also by the heavens, and also by the earth, and by their heads, that whoso should vary from the assistance which Akish desired should lose his head; and whoso should divulge whatsoever thing Akish made known unto them, the same should lose his life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.15
    scripture: book-of-mormon
    name: Ether 8:15
    book: Ether
    chapter: 8
    verse: 15
    ordinal: 6201
    text: And it came to pass that thus they did agree with Akish. And Akish did administer unto them the oaths which were given by them of old who also sought power, which had been handed down even from Cain, who was a murderer from the beginning.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.16
    scripture: book-of-mormon
    name: Ether 8:16
    book: Ether
    chapter: 8
    verse: 16
    ordinal: 6202
    text: And they were kept up by the power of the devil to administer these oaths unto the people, to keep them in darkness, to help such as sought power to gain power, and to murder, and to plunder, and to lie, and to commit all manner of wickedness and whoredoms.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.17
    scripture: book-of-mormon
    name: Ether 8:17
    book: Ether
    chapter: 8
    verse: 17
    ordinal: 6203
    text: And it was the daughter of Jared who put it into his heart to search up these things of old; and Jared put it into the heart of Akish; wherefore, Akish administered it unto his kindred and friends, leading them away by fair promises to do whatsoever thing he desired.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.18
    scripture: book-of-mormon
    name: Ether 8:18
    book: Ether
    chapter: 8
    verse: 18
    ordinal: 6204
    text: And it came to pass that they formed a secret combination, even as they of old; which combination is most abominable and wicked above all, in the sight of God;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.19
    scripture: book-of-mormon
    name: Ether 8:19
    book: Ether
    chapter: 8
    verse: 19
    ordinal: 6205
    text: For the Lord worketh not in secret combinations, neither doth he will that man should shed blood, but in all things hath forbidden it, from the beginning of man.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.20
    scripture: book-of-mormon
    name: Ether 8:20
    book: Ether
    chapter: 8
    verse: 20
    ordinal: 6206
    text: And now I, Moroni, do not write the manner of their oaths and combinations, for it hath been made known unto me that they are had among all people, and they are had among the Lamanites.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.21
    scripture: book-of-mormon
    name: Ether 8:21
    book: Ether
    chapter: 8
    verse: 21
    ordinal: 6207
    text: And they have caused the destruction of this people of whom I am now speaking, and also the destruction of the people of Nephi.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.22
    scripture: book-of-mormon
    name: Ether 8:22
    book: Ether
    chapter: 8
    verse: 22
    ordinal: 6208
    text: And whatsoever nation shall uphold such secret combinations, to get power and gain, until they shall spread over the nation, behold, they shall be destroyed; for the Lord will not suffer that the blood of his saints, which shall be shed by them, shall always cry unto him from the ground for vengeance upon them and yet he avenge them not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.23
    scripture: book-of-mormon
    name: Ether 8:23
    book: Ether
    chapter: 8
    verse: 23
    ordinal: 6209
    text: Wherefore, O ye Gentiles, it is wisdom in God that these things should be shown unto you, that thereby ye may repent of your sins, and suffer not that these murderous combinations shall get above you, which are built up to get power and gain—and the work, yea, even the work of destruction come upon you, yea, even the sword of the justice of the Eternal God shall fall upon you, to your overthrow and destruction if ye shall suffer these things to be.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.24
    scripture: book-of-mormon
    name: Ether 8:24
    book: Ether
    chapter: 8
    verse: 24
    ordinal: 6210
    text: Wherefore, the Lord commandeth you, when ye shall see these things come among you that ye shall awake to a sense of your awful situation, because of this secret combination which shall be among you; or wo be unto it, because of the blood of them who have been slain; for they cry from the dust for vengeance upon it, and also upon those who built it up.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.25
    scripture: book-of-mormon
    name: Ether 8:25
    book: Ether
    chapter: 8
    verse: 25
    ordinal: 6211
    text: For it cometh to pass that whoso buildeth it up seeketh to overthrow the freedom of all lands, nations, and countries; and it bringeth to pass the destruction of all people, for it is built up by the devil, who is the father of all lies; even that same liar who beguiled our first parents, yea, even that same liar who hath caused man to commit murder from the beginning; who hath hardened the hearts of men that they have murdered the prophets, and stoned them, and cast them out from the beginning.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.8.26
    scripture: book-of-mormon
    name: Ether 8:26
    book: Ether
    chapter: 8
    verse: 26
    ordinal: 6212
    text: Wherefore, I, Moroni, am commanded to write these things that evil may be done away, and that the time may come that Satan may have no power upon the hearts of the children of men, but that they may be persuaded to do good continually, that they may come unto the fountain of all righteousness and be saved.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.8
- type: BomVerse
  data:
    ref: ether.9.1
    scripture: book-of-mormon
    name: Ether 9:1
    book: Ether
    chapter: 9
    verse: 1
    ordinal: 6213
    text: And now I, Moroni, proceed with my record. Therefore, behold, it came to pass that because of the secret combinations of Akish and his friends, behold, they did overthrow the kingdom of Omer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.2
    scripture: book-of-mormon
    name: Ether 9:2
    book: Ether
    chapter: 9
    verse: 2
    ordinal: 6214
    text: Nevertheless, the Lord was merciful unto Omer, and also to his sons and to his daughters who did not seek his destruction.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.3
    scripture: book-of-mormon
    name: Ether 9:3
    book: Ether
    chapter: 9
    verse: 3
    ordinal: 6215
    text: And the Lord warned Omer in a dream that he should depart out of the land; wherefore Omer departed out of the land with his family, and traveled many days, and came over and passed by the hill of Shim, and came over by the place where the Nephites were destroyed, and from thence eastward, and came to a place which was called Ablom, by the seashore, and there he pitched his tent, and also his sons and his daughters, and all his household, save it were Jared and his family.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.4
    scripture: book-of-mormon
    name: Ether 9:4
    book: Ether
    chapter: 9
    verse: 4
    ordinal: 6216
    text: And it came to pass that Jared was anointed king over the people, by the hand of wickedness; and he gave unto Akish his daughter to wife.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.5
    scripture: book-of-mormon
    name: Ether 9:5
    book: Ether
    chapter: 9
    verse: 5
    ordinal: 6217
    text: And it came to pass that Akish sought the life of his father-in-law; and he applied unto those whom he had sworn by the oath of the ancients, and they obtained the head of his father-in-law, as he sat upon his throne, giving audience to his people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.6
    scripture: book-of-mormon
    name: Ether 9:6
    book: Ether
    chapter: 9
    verse: 6
    ordinal: 6218
    text: For so great had been the spreading of this wicked and secret society that it had corrupted the hearts of all the people; therefore Jared was murdered upon his throne, and Akish reigned in his stead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.7
    scripture: book-of-mormon
    name: Ether 9:7
    book: Ether
    chapter: 9
    verse: 7
    ordinal: 6219
    text: And it came to pass that Akish began to be jealous of his son, therefore he shut him up in prison, and kept him upon little or no food until he had suffered death.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.8
    scripture: book-of-mormon
    name: Ether 9:8
    book: Ether
    chapter: 9
    verse: 8
    ordinal: 6220
    text: And now the brother of him that suffered death, (and his name was Nimrah) was angry with his father because of that which his father had done unto his brother.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.9
    scripture: book-of-mormon
    name: Ether 9:9
    book: Ether
    chapter: 9
    verse: 9
    ordinal: 6221
    text: And it came to pass that Nimrah gathered together a small number of men, and fled out of the land, and came over and dwelt with Omer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.10
    scripture: book-of-mormon
    name: Ether 9:10
    book: Ether
    chapter: 9
    verse: 10
    ordinal: 6222
    text: And it came to pass that Akish begat other sons, and they won the hearts of the people, notwithstanding they had sworn unto him to do all manner of iniquity according to that which he desired.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.11
    scripture: book-of-mormon
    name: Ether 9:11
    book: Ether
    chapter: 9
    verse: 11
    ordinal: 6223
    text: Now the people of Akish were desirous for gain, even as Akish was desirous for power; wherefore, the sons of Akish did offer them money, by which means they drew away the more part of the people after them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.12
    scripture: book-of-mormon
    name: Ether 9:12
    book: Ether
    chapter: 9
    verse: 12
    ordinal: 6224
    text: And there began to be a war between the sons of Akish and Akish, which lasted for the space of many years, yea, unto the destruction of nearly all the people of the kingdom, yea, even all, save it were thirty souls, and they who fled with the house of Omer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.13
    scripture: book-of-mormon
    name: Ether 9:13
    book: Ether
    chapter: 9
    verse: 13
    ordinal: 6225
    text: Wherefore, Omer was restored again to the land of his inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.14
    scripture: book-of-mormon
    name: Ether 9:14
    book: Ether
    chapter: 9
    verse: 14
    ordinal: 6226
    text: And it came to pass that Omer began to be old; nevertheless, in his old age he begat Emer; and he anointed Emer to be king to reign in his stead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.15
    scripture: book-of-mormon
    name: Ether 9:15
    book: Ether
    chapter: 9
    verse: 15
    ordinal: 6227
    text: And after that he had anointed Emer to be king he saw peace in the land for the space of two years, and he died, having seen exceedingly many days, which were full of sorrow. And it came to pass that Emer did reign in his stead, and did fill the steps of his father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.16
    scripture: book-of-mormon
    name: Ether 9:16
    book: Ether
    chapter: 9
    verse: 16
    ordinal: 6228
    text: And the Lord began again to take the curse from off the land, and the house of Emer did prosper exceedingly under the reign of Emer; and in the space of sixty and two years they had become exceedingly strong, insomuch that they became exceedingly rich—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.17
    scripture: book-of-mormon
    name: Ether 9:17
    book: Ether
    chapter: 9
    verse: 17
    ordinal: 6229
    text: Having all manner of fruit, and of grain, and of silks, and of fine linen, and of gold, and of silver, and of precious things;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.18
    scripture: book-of-mormon
    name: Ether 9:18
    book: Ether
    chapter: 9
    verse: 18
    ordinal: 6230
    text: And also all manner of cattle, of oxen, and cows, and of sheep, and of swine, and of goats, and also many other kinds of animals which were useful for the food of man.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.19
    scripture: book-of-mormon
    name: Ether 9:19
    book: Ether
    chapter: 9
    verse: 19
    ordinal: 6231
    text: And they also had horses, and asses, and there were elephants and cureloms and cumoms; all of which were useful unto man, and more especially the elephants and cureloms and cumoms.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.20
    scripture: book-of-mormon
    name: Ether 9:20
    book: Ether
    chapter: 9
    verse: 20
    ordinal: 6232
    text: 'And thus the Lord did pour out his blessings upon this land, which was choice above all other lands; and he commanded that whoso should possess the land should possess it unto the Lord, or they should be destroyed when they were ripened in iniquity; for upon such, saith the Lord: I will pour out the fulness of my wrath.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.21
    scripture: book-of-mormon
    name: Ether 9:21
    book: Ether
    chapter: 9
    verse: 21
    ordinal: 6233
    text: And Emer did execute judgment in righteousness all his days, and he begat many sons and daughters; and he begat Coriantum, and he anointed Coriantum to reign in his stead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.22
    scripture: book-of-mormon
    name: Ether 9:22
    book: Ether
    chapter: 9
    verse: 22
    ordinal: 6234
    text: And after he had anointed Coriantum to reign in his stead he lived four years, and he saw peace in the land; yea, and he even saw the Son of Righteousness, and did rejoice and glory in his day; and he died in peace.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.23
    scripture: book-of-mormon
    name: Ether 9:23
    book: Ether
    chapter: 9
    verse: 23
    ordinal: 6235
    text: And it came to pass that Coriantum did walk in the steps of his father, and did build many mighty cities, and did administer that which was good unto his people in all his days. And it came to pass that he had no children even until he was exceedingly old.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.24
    scripture: book-of-mormon
    name: Ether 9:24
    book: Ether
    chapter: 9
    verse: 24
    ordinal: 6236
    text: And it came to pass that his wife died, being an hundred and two years old. And it came to pass that Coriantum took to wife, in his old age, a young maid, and begat sons and daughters; wherefore he lived until he was an hundred and forty and two years old.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.25
    scripture: book-of-mormon
    name: Ether 9:25
    book: Ether
    chapter: 9
    verse: 25
    ordinal: 6237
    text: And it came to pass that he begat Com, and Com reigned in his stead; and he reigned forty and nine years, and he begat Heth; and he also begat other sons and daughters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.26
    scripture: book-of-mormon
    name: Ether 9:26
    book: Ether
    chapter: 9
    verse: 26
    ordinal: 6238
    text: And the people had spread again over all the face of the land, and there began again to be an exceedingly great wickedness upon the face of the land, and Heth began to embrace the secret plans again of old, to destroy his father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.27
    scripture: book-of-mormon
    name: Ether 9:27
    book: Ether
    chapter: 9
    verse: 27
    ordinal: 6239
    text: And it came to pass that he did dethrone his father, for he slew him with his own sword; and he did reign in his stead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.28
    scripture: book-of-mormon
    name: Ether 9:28
    book: Ether
    chapter: 9
    verse: 28
    ordinal: 6240
    text: And there came prophets in the land again, crying repentance unto them—that they must prepare the way of the Lord or there should come a curse upon the face of the land; yea, even there should be a great famine, in which they should be destroyed if they did not repent.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.29
    scripture: book-of-mormon
    name: Ether 9:29
    book: Ether
    chapter: 9
    verse: 29
    ordinal: 6241
    text: But the people believed not the words of the prophets, but they cast them out; and some of them they cast into pits and left them to perish. And it came to pass that they did all these things according to the commandment of the king, Heth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.30
    scripture: book-of-mormon
    name: Ether 9:30
    book: Ether
    chapter: 9
    verse: 30
    ordinal: 6242
    text: And it came to pass that there began to be a great dearth upon the land, and the inhabitants began to be destroyed exceedingly fast because of the dearth, for there was no rain upon the face of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.31
    scripture: book-of-mormon
    name: Ether 9:31
    book: Ether
    chapter: 9
    verse: 31
    ordinal: 6243
    text: And there came forth poisonous serpents also upon the face of the land, and did poison many people. And it came to pass that their flocks began to flee before the poisonous serpents, towards the land southward, which was called by the Nephites Zarahemla.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.32
    scripture: book-of-mormon
    name: Ether 9:32
    book: Ether
    chapter: 9
    verse: 32
    ordinal: 6244
    text: And it came to pass that there were many of them which did perish by the way; nevertheless, there were some which fled into the land southward.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.33
    scripture: book-of-mormon
    name: Ether 9:33
    book: Ether
    chapter: 9
    verse: 33
    ordinal: 6245
    text: And it came to pass that the Lord did cause the serpents that they should pursue them no more, but that they should hedge up the way that the people could not pass, that whoso should attempt to pass might fall by the poisonous serpents.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.34
    scripture: book-of-mormon
    name: Ether 9:34
    book: Ether
    chapter: 9
    verse: 34
    ordinal: 6246
    text: And it came to pass that the people did follow the course of the beasts, and did devour the carcasses of them which fell by the way, until they had devoured them all. Now when the people saw that they must perish they began to repent of their iniquities and cry unto the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.9.35
    scripture: book-of-mormon
    name: Ether 9:35
    book: Ether
    chapter: 9
    verse: 35
    ordinal: 6247
    text: And it came to pass that when they had humbled themselves sufficiently before the Lord he did send rain upon the face of the earth; and the people began to revive again, and there began to be fruit in the north countries, and in all the countries round about. And the Lord did show forth his power unto them in preserving them from famine.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.9
- type: BomVerse
  data:
    ref: ether.10.1
    scripture: book-of-mormon
    name: Ether 10:1
    book: Ether
    chapter: 10
    verse: 1
    ordinal: 6248
    text: And it came to pass that Shez, who was a descendant of Heth—for Heth had perished by the famine, and all his household save it were Shez—wherefore, Shez began to build up again a broken people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.2
    scripture: book-of-mormon
    name: Ether 10:2
    book: Ether
    chapter: 10
    verse: 2
    ordinal: 6249
    text: And it came to pass that Shez did remember the destruction of his fathers, and he did build up a righteous kingdom; for he remembered what the Lord had done in bringing Jared and his brother across the deep; and he did walk in the ways of the Lord; and he begat sons and daughters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.3
    scripture: book-of-mormon
    name: Ether 10:3
    book: Ether
    chapter: 10
    verse: 3
    ordinal: 6250
    text: And his eldest son, whose name was Shez, did rebel against him; nevertheless, Shez was smitten by the hand of a robber, because of his exceeding riches, which brought peace again unto his father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.4
    scripture: book-of-mormon
    name: Ether 10:4
    book: Ether
    chapter: 10
    verse: 4
    ordinal: 6251
    text: And it came to pass that his father did build up many cities upon the face of the land, and the people began again to spread over all the face of the land. And Shez did live to an exceedingly old age; and he begat Riplakish. And he died, and Riplakish reigned in his stead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.5
    scripture: book-of-mormon
    name: Ether 10:5
    book: Ether
    chapter: 10
    verse: 5
    ordinal: 6252
    text: And it came to pass that Riplakish did not do that which was right in the sight of the Lord, for he did have many wives and concubines, and did lay that upon men's shoulders which was grievous to be borne; yea, he did tax them with heavy taxes; and with the taxes he did build many spacious buildings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.6
    scripture: book-of-mormon
    name: Ether 10:6
    book: Ether
    chapter: 10
    verse: 6
    ordinal: 6253
    text: And he did erect him an exceedingly beautiful throne; and he did build many prisons, and whoso would not be subject unto taxes he did cast into prison; and whoso was not able to pay taxes he did cast into prison; and he did cause that they should labor continually for their support; and whoso refused to labor he did cause to be put to death.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.7
    scripture: book-of-mormon
    name: Ether 10:7
    book: Ether
    chapter: 10
    verse: 7
    ordinal: 6254
    text: Wherefore he did obtain all his fine work, yea, even his fine gold he did cause to be refined in prison; and all manner of fine workmanship he did cause to be wrought in prison. And it came to pass that he did afflict the people with his whoredoms and abominations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.8
    scripture: book-of-mormon
    name: Ether 10:8
    book: Ether
    chapter: 10
    verse: 8
    ordinal: 6255
    text: And when he had reigned for the space of forty and two years the people did rise up in rebellion against him; and there began to be war again in the land, insomuch that Riplakish was killed, and his descendants were driven out of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.9
    scripture: book-of-mormon
    name: Ether 10:9
    book: Ether
    chapter: 10
    verse: 9
    ordinal: 6256
    text: And it came to pass after the space of many years, Morianton, (he being a descendant of Riplakish) gathered together an army of outcasts, and went forth and gave battle unto the people; and he gained power over many cities; and the war became exceedingly sore, and did last for the space of many years; and he did gain power over all the land, and did establish himself king over all the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.10
    scripture: book-of-mormon
    name: Ether 10:10
    book: Ether
    chapter: 10
    verse: 10
    ordinal: 6257
    text: And after that he had established himself king he did ease the burden of the people, by which he did gain favor in the eyes of the people, and they did anoint him to be their king.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.11
    scripture: book-of-mormon
    name: Ether 10:11
    book: Ether
    chapter: 10
    verse: 11
    ordinal: 6258
    text: And he did do justice unto the people, but not unto himself because of his many whoredoms; wherefore he was cut off from the presence of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.12
    scripture: book-of-mormon
    name: Ether 10:12
    book: Ether
    chapter: 10
    verse: 12
    ordinal: 6259
    text: And it came to pass that Morianton built up many cities, and the people became exceedingly rich under his reign, both in buildings, and in gold and silver, and in raising grain, and in flocks, and herds, and such things which had been restored unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.13
    scripture: book-of-mormon
    name: Ether 10:13
    book: Ether
    chapter: 10
    verse: 13
    ordinal: 6260
    text: And Morianton did live to an exceedingly great age, and then he begat Kim; and Kim did reign in the stead of his father; and he did reign eight years, and his father died. And it came to pass that Kim did not reign in righteousness, wherefore he was not favored of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.14
    scripture: book-of-mormon
    name: Ether 10:14
    book: Ether
    chapter: 10
    verse: 14
    ordinal: 6261
    text: And his brother did rise up in rebellion against him, by which he did bring him into captivity; and he did remain in captivity all his days; and he begat sons and daughters in captivity, and in his old age he begat Levi; and he died.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.15
    scripture: book-of-mormon
    name: Ether 10:15
    book: Ether
    chapter: 10
    verse: 15
    ordinal: 6262
    text: And it came to pass that Levi did serve in captivity after the death of his father, for the space of forty and two years. And he did make war against the king of the land, by which he did obtain unto himself the kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.16
    scripture: book-of-mormon
    name: Ether 10:16
    book: Ether
    chapter: 10
    verse: 16
    ordinal: 6263
    text: And after he had obtained unto himself the kingdom he did that which was right in the sight of the Lord; and the people did prosper in the land; and he did live to a good old age, and begat sons and daughters; and he also begat Corom, whom he anointed king in his stead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.17
    scripture: book-of-mormon
    name: Ether 10:17
    book: Ether
    chapter: 10
    verse: 17
    ordinal: 6264
    text: And it came to pass that Corom did that which was good in the sight of the Lord all his days; and he begat many sons and daughters; and after he had seen many days he did pass away, even like unto the rest of the earth; and Kish reigned in his stead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.18
    scripture: book-of-mormon
    name: Ether 10:18
    book: Ether
    chapter: 10
    verse: 18
    ordinal: 6265
    text: And it came to pass that Kish passed away also, and Lib reigned in his stead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.19
    scripture: book-of-mormon
    name: Ether 10:19
    book: Ether
    chapter: 10
    verse: 19
    ordinal: 6266
    text: And it came to pass that Lib also did that which was good in the sight of the Lord. And in the days of Lib the poisonous serpents were destroyed. Wherefore they did go into the land southward, to hunt food for the people of the land, for the land was covered with animals of the forest. And Lib also himself became a great hunter.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.20
    scripture: book-of-mormon
    name: Ether 10:20
    book: Ether
    chapter: 10
    verse: 20
    ordinal: 6267
    text: And they built a great city by the narrow neck of land, by the place where the sea divides the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.21
    scripture: book-of-mormon
    name: Ether 10:21
    book: Ether
    chapter: 10
    verse: 21
    ordinal: 6268
    text: And they did preserve the land southward for a wilderness, to get game. And the whole face of the land northward was covered with inhabitants.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.22
    scripture: book-of-mormon
    name: Ether 10:22
    book: Ether
    chapter: 10
    verse: 22
    ordinal: 6269
    text: And they were exceedingly industrious, and they did buy and sell and traffic one with another, that they might get gain.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.23
    scripture: book-of-mormon
    name: Ether 10:23
    book: Ether
    chapter: 10
    verse: 23
    ordinal: 6270
    text: And they did work in all manner of ore, and they did make gold, and silver, and iron, and brass, and all manner of metals; and they did dig it out of the earth; wherefore, they did cast up mighty heaps of earth to get ore, of gold, and of silver, and of iron, and of copper. And they did work all manner of fine work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.24
    scripture: book-of-mormon
    name: Ether 10:24
    book: Ether
    chapter: 10
    verse: 24
    ordinal: 6271
    text: And they did have silks, and fine-twined linen; and they did work all manner of cloth, that they might clothe themselves from their nakedness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.25
    scripture: book-of-mormon
    name: Ether 10:25
    book: Ether
    chapter: 10
    verse: 25
    ordinal: 6272
    text: And they did make all manner of tools to till the earth, both to plow and to sow, to reap and to hoe, and also to thrash.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.26
    scripture: book-of-mormon
    name: Ether 10:26
    book: Ether
    chapter: 10
    verse: 26
    ordinal: 6273
    text: And they did make all manner of tools with which they did work their beasts.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.27
    scripture: book-of-mormon
    name: Ether 10:27
    book: Ether
    chapter: 10
    verse: 27
    ordinal: 6274
    text: And they did make all manner of weapons of war. And they did work all manner of work of exceedingly curious workmanship.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.28
    scripture: book-of-mormon
    name: Ether 10:28
    book: Ether
    chapter: 10
    verse: 28
    ordinal: 6275
    text: And never could be a people more blessed than were they, and more prospered by the hand of the Lord. And they were in a land that was choice above all lands, for the Lord had spoken it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.29
    scripture: book-of-mormon
    name: Ether 10:29
    book: Ether
    chapter: 10
    verse: 29
    ordinal: 6276
    text: And it came to pass that Lib did live many years, and begat sons and daughters; and he also begat Hearthom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.30
    scripture: book-of-mormon
    name: Ether 10:30
    book: Ether
    chapter: 10
    verse: 30
    ordinal: 6277
    text: And it came to pass that Hearthom reigned in the stead of his father. And when Hearthom had reigned twenty and four years, behold, the kingdom was taken away from him. And he served many years in captivity, yea, even all the remainder of his days.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.31
    scripture: book-of-mormon
    name: Ether 10:31
    book: Ether
    chapter: 10
    verse: 31
    ordinal: 6278
    text: And he begat Heth, and Heth lived in captivity all his days. And Heth begat Aaron, and Aaron dwelt in captivity all his days; and he begat Amnigaddah, and Amnigaddah also dwelt in captivity all his days; and he begat Coriantum, and Coriantum dwelt in captivity all his days; and he begat Com.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.32
    scripture: book-of-mormon
    name: Ether 10:32
    book: Ether
    chapter: 10
    verse: 32
    ordinal: 6279
    text: And it came to pass that Com drew away the half of the kingdom. And he reigned over the half of the kingdom forty and two years; and he went to battle against the king, Amgid, and they fought for the space of many years, during which time Com gained power over Amgid, and obtained power over the remainder of the kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.33
    scripture: book-of-mormon
    name: Ether 10:33
    book: Ether
    chapter: 10
    verse: 33
    ordinal: 6280
    text: And in the days of Com there began to be robbers in the land; and they adopted the old plans, and administered oaths after the manner of the ancients, and sought again to destroy the kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.10.34
    scripture: book-of-mormon
    name: Ether 10:34
    book: Ether
    chapter: 10
    verse: 34
    ordinal: 6281
    text: Now Com did fight against them much; nevertheless, he did not prevail against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.10
- type: BomVerse
  data:
    ref: ether.11.1
    scripture: book-of-mormon
    name: Ether 11:1
    book: Ether
    chapter: 11
    verse: 1
    ordinal: 6282
    text: And there came also in the days of Com many prophets, and prophesied of the destruction of that great people except they should repent, and turn unto the Lord, and forsake their murders and wickedness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.2
    scripture: book-of-mormon
    name: Ether 11:2
    book: Ether
    chapter: 11
    verse: 2
    ordinal: 6283
    text: And it came to pass that the prophets were rejected by the people, and they fled unto Com for protection, for the people sought to destroy them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.3
    scripture: book-of-mormon
    name: Ether 11:3
    book: Ether
    chapter: 11
    verse: 3
    ordinal: 6284
    text: And they prophesied unto Com many things; and he was blessed in all the remainder of his days.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.4
    scripture: book-of-mormon
    name: Ether 11:4
    book: Ether
    chapter: 11
    verse: 4
    ordinal: 6285
    text: And he lived to a good old age, and begat Shiblom; and Shiblom reigned in his stead. And the brother of Shiblom rebelled against him, and there began to be an exceedingly great war in all the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.5
    scripture: book-of-mormon
    name: Ether 11:5
    book: Ether
    chapter: 11
    verse: 5
    ordinal: 6286
    text: And it came to pass that the brother of Shiblom caused that all the prophets who prophesied of the destruction of the people should be put to death;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.6
    scripture: book-of-mormon
    name: Ether 11:6
    book: Ether
    chapter: 11
    verse: 6
    ordinal: 6287
    text: And there was great calamity in all the land, for they had testified that a great curse should come upon the land, and also upon the people, and that there should be a great destruction among them, such an one as never had been upon the face of the earth, and their bones should become as heaps of earth upon the face of the land except they should repent of their wickedness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.7
    scripture: book-of-mormon
    name: Ether 11:7
    book: Ether
    chapter: 11
    verse: 7
    ordinal: 6288
    text: And they hearkened not unto the voice of the Lord, because of their wicked combinations; wherefore, there began to be wars and contentions in all the land, and also many famines and pestilences, insomuch that there was a great destruction, such an one as never had been known upon the face of the earth; and all this came to pass in the days of Shiblom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.8
    scripture: book-of-mormon
    name: Ether 11:8
    book: Ether
    chapter: 11
    verse: 8
    ordinal: 6289
    text: And the people began to repent of their iniquity; and inasmuch as they did the Lord did have mercy on them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.9
    scripture: book-of-mormon
    name: Ether 11:9
    book: Ether
    chapter: 11
    verse: 9
    ordinal: 6290
    text: And it came to pass that Shiblom was slain, and Seth was brought into captivity, and did dwell in captivity all his days.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.10
    scripture: book-of-mormon
    name: Ether 11:10
    book: Ether
    chapter: 11
    verse: 10
    ordinal: 6291
    text: And it came to pass that Ahah, his son, did obtain the kingdom; and he did reign over the people all his days. And he did do all manner of iniquity in his days, by which he did cause the shedding of much blood; and few were his days.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.11
    scripture: book-of-mormon
    name: Ether 11:11
    book: Ether
    chapter: 11
    verse: 11
    ordinal: 6292
    text: And Ethem, being a descendant of Ahah, did obtain the kingdom; and he also did do that which was wicked in his days.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.12
    scripture: book-of-mormon
    name: Ether 11:12
    book: Ether
    chapter: 11
    verse: 12
    ordinal: 6293
    text: And it came to pass that in the days of Ethem there came many prophets, and prophesied again unto the people; yea, they did prophesy that the Lord would utterly destroy them from off the face of the earth except they repented of their iniquities.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.13
    scripture: book-of-mormon
    name: Ether 11:13
    book: Ether
    chapter: 11
    verse: 13
    ordinal: 6294
    text: And it came to pass that the people hardened their hearts, and would not hearken unto their words; and the prophets mourned and withdrew from among the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.14
    scripture: book-of-mormon
    name: Ether 11:14
    book: Ether
    chapter: 11
    verse: 14
    ordinal: 6295
    text: And it came to pass that Ethem did execute judgment in wickedness all his days; and he begat Moron. And it came to pass that Moron did reign in his stead; and Moron did that which was wicked before the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.15
    scripture: book-of-mormon
    name: Ether 11:15
    book: Ether
    chapter: 11
    verse: 15
    ordinal: 6296
    text: And it came to pass that there arose a rebellion among the people, because of that secret combination which was built up to get power and gain; and there arose a mighty man among them in iniquity, and gave battle unto Moron, in which he did overthrow the half of the kingdom; and he did maintain the half of the kingdom for many years.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.16
    scripture: book-of-mormon
    name: Ether 11:16
    book: Ether
    chapter: 11
    verse: 16
    ordinal: 6297
    text: And it came to pass that Moron did overthrow him, and did obtain the kingdom again.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.17
    scripture: book-of-mormon
    name: Ether 11:17
    book: Ether
    chapter: 11
    verse: 17
    ordinal: 6298
    text: And it came to pass that there arose another mighty man; and he was a descendant of the brother of Jared.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.18
    scripture: book-of-mormon
    name: Ether 11:18
    book: Ether
    chapter: 11
    verse: 18
    ordinal: 6299
    text: And it came to pass that he did overthrow Moron and obtain the kingdom; wherefore, Moron dwelt in captivity all the remainder of his days; and he begat Coriantor.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.19
    scripture: book-of-mormon
    name: Ether 11:19
    book: Ether
    chapter: 11
    verse: 19
    ordinal: 6300
    text: And it came to pass that Coriantor dwelt in captivity all his days.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.20
    scripture: book-of-mormon
    name: Ether 11:20
    book: Ether
    chapter: 11
    verse: 20
    ordinal: 6301
    text: And in the days of Coriantor there also came many prophets, and prophesied of great and marvelous things, and cried repentance unto the people, and except they should repent the Lord God would execute judgment against them to their utter destruction;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.21
    scripture: book-of-mormon
    name: Ether 11:21
    book: Ether
    chapter: 11
    verse: 21
    ordinal: 6302
    text: And that the Lord God would send or bring forth another people to possess the land, by his power, after the manner by which he brought their fathers.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.22
    scripture: book-of-mormon
    name: Ether 11:22
    book: Ether
    chapter: 11
    verse: 22
    ordinal: 6303
    text: And they did reject all the words of the prophets, because of their secret society and wicked abominations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.11.23
    scripture: book-of-mormon
    name: Ether 11:23
    book: Ether
    chapter: 11
    verse: 23
    ordinal: 6304
    text: And it came to pass that Coriantor begat Ether, and he died, having dwelt in captivity all his days.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.11
- type: BomVerse
  data:
    ref: ether.12.1
    scripture: book-of-mormon
    name: Ether 12:1
    book: Ether
    chapter: 12
    verse: 1
    ordinal: 6305
    text: And it came to pass that the days of Ether were in the days of Coriantumr; and Coriantumr was king over all the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.2
    scripture: book-of-mormon
    name: Ether 12:2
    book: Ether
    chapter: 12
    verse: 2
    ordinal: 6306
    text: And Ether was a prophet of the Lord; wherefore Ether came forth in the days of Coriantumr, and began to prophesy unto the people, for he could not be restrained because of the Spirit of the Lord which was in him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.3
    scripture: book-of-mormon
    name: Ether 12:3
    book: Ether
    chapter: 12
    verse: 3
    ordinal: 6307
    text: For he did cry from the morning, even until the going down of the sun, exhorting the people to believe in God unto repentance lest they should be destroyed, saying unto them that by faith all things are fulfilled—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.4
    scripture: book-of-mormon
    name: Ether 12:4
    book: Ether
    chapter: 12
    verse: 4
    ordinal: 6308
    text: Wherefore, whoso believeth in God might with surety hope for a better world, yea, even a place at the right hand of God, which hope cometh of faith, maketh an anchor to the souls of men, which would make them sure and steadfast, always abounding in good works, being led to glorify God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.5
    scripture: book-of-mormon
    name: Ether 12:5
    book: Ether
    chapter: 12
    verse: 5
    ordinal: 6309
    text: And it came to pass that Ether did prophesy great and marvelous things unto the people, which they did not believe, because they saw them not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.6
    scripture: book-of-mormon
    name: Ether 12:6
    book: Ether
    chapter: 12
    verse: 6
    ordinal: 6310
    text: And now, I, Moroni, would speak somewhat concerning these things; I would show unto the world that faith is things which are hoped for and not seen; wherefore, dispute not because ye see not, for ye receive no witness until after the trial of your faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.7
    scripture: book-of-mormon
    name: Ether 12:7
    book: Ether
    chapter: 12
    verse: 7
    ordinal: 6311
    text: For it was by faith that Christ showed himself unto our fathers, after he had risen from the dead; and he showed not himself unto them until after they had faith in him; wherefore, it must needs be that some had faith in him, for he showed himself not unto the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.8
    scripture: book-of-mormon
    name: Ether 12:8
    book: Ether
    chapter: 12
    verse: 8
    ordinal: 6312
    text: But because of the faith of men he has shown himself unto the world, and glorified the name of the Father, and prepared a way that thereby others might be partakers of the heavenly gift, that they might hope for those things which they have not seen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.9
    scripture: book-of-mormon
    name: Ether 12:9
    book: Ether
    chapter: 12
    verse: 9
    ordinal: 6313
    text: Wherefore, ye may also have hope, and be partakers of the gift, if ye will but have faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.10
    scripture: book-of-mormon
    name: Ether 12:10
    book: Ether
    chapter: 12
    verse: 10
    ordinal: 6314
    text: Behold it was by faith that they of old were called after the holy order of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.11
    scripture: book-of-mormon
    name: Ether 12:11
    book: Ether
    chapter: 12
    verse: 11
    ordinal: 6315
    text: Wherefore, by faith was the law of Moses given. But in the gift of his Son hath God prepared a more excellent way; and it is by faith that it hath been fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.12
    scripture: book-of-mormon
    name: Ether 12:12
    book: Ether
    chapter: 12
    verse: 12
    ordinal: 6316
    text: For if there be no faith among the children of men God can do no miracle among them; wherefore, he showed not himself until after their faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.13
    scripture: book-of-mormon
    name: Ether 12:13
    book: Ether
    chapter: 12
    verse: 13
    ordinal: 6317
    text: Behold, it was the faith of Alma and Amulek that caused the prison to tumble to the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.14
    scripture: book-of-mormon
    name: Ether 12:14
    book: Ether
    chapter: 12
    verse: 14
    ordinal: 6318
    text: Behold, it was the faith of Nephi and Lehi that wrought the change upon the Lamanites, that they were baptized with fire and with the Holy Ghost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.15
    scripture: book-of-mormon
    name: Ether 12:15
    book: Ether
    chapter: 12
    verse: 15
    ordinal: 6319
    text: Behold, it was the faith of Ammon and his brethren which wrought so great a miracle among the Lamanites.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.16
    scripture: book-of-mormon
    name: Ether 12:16
    book: Ether
    chapter: 12
    verse: 16
    ordinal: 6320
    text: Yea, and even all they who wrought miracles wrought them by faith, even those who were before Christ and also those who were after.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.17
    scripture: book-of-mormon
    name: Ether 12:17
    book: Ether
    chapter: 12
    verse: 17
    ordinal: 6321
    text: And it was by faith that the three disciples obtained a promise that they should not taste of death; and they obtained not the promise until after their faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.18
    scripture: book-of-mormon
    name: Ether 12:18
    book: Ether
    chapter: 12
    verse: 18
    ordinal: 6322
    text: And neither at any time hath any wrought miracles until after their faith; wherefore they first believed in the Son of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.19
    scripture: book-of-mormon
    name: Ether 12:19
    book: Ether
    chapter: 12
    verse: 19
    ordinal: 6323
    text: And there were many whose faith was so exceedingly strong, even before Christ came, who could not be kept from within the veil, but truly saw with their eyes the things which they had beheld with an eye of faith, and they were glad.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.20
    scripture: book-of-mormon
    name: Ether 12:20
    book: Ether
    chapter: 12
    verse: 20
    ordinal: 6324
    text: And behold, we have seen in this record that one of these was the brother of Jared; for so great was his faith in God, that when God put forth his finger he could not hide it from the sight of the brother of Jared, because of his word which he had spoken unto him, which word he had obtained by faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.21
    scripture: book-of-mormon
    name: Ether 12:21
    book: Ether
    chapter: 12
    verse: 21
    ordinal: 6325
    text: And after the brother of Jared had beheld the finger of the Lord, because of the promise which the brother of Jared had obtained by faith, the Lord could not withhold anything from his sight; wherefore he showed him all things, for he could no longer be kept without the veil.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.22
    scripture: book-of-mormon
    name: Ether 12:22
    book: Ether
    chapter: 12
    verse: 22
    ordinal: 6326
    text: And it is by faith that my fathers have obtained the promise that these things should come unto their brethren through the Gentiles; therefore the Lord hath commanded me, yea, even Jesus Christ.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.23
    scripture: book-of-mormon
    name: Ether 12:23
    book: Ether
    chapter: 12
    verse: 23
    ordinal: 6327
    text: 'And I said unto him: Lord, the Gentiles will mock at these things, because of our weakness in writing; for Lord thou hast made us mighty in word by faith, but thou hast not made us mighty in writing; for thou hast made all this people that they could speak much, because of the Holy Ghost which thou hast given them;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.24
    scripture: book-of-mormon
    name: Ether 12:24
    book: Ether
    chapter: 12
    verse: 24
    ordinal: 6328
    text: And thou hast made us that we could write but little, because of the awkwardness of our hands. Behold, thou hast not made us mighty in writing like unto the brother of Jared, for thou madest him that the things which he wrote were mighty even as thou art, unto the overpowering of man to read them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.25
    scripture: book-of-mormon
    name: Ether 12:25
    book: Ether
    chapter: 12
    verse: 25
    ordinal: 6329
    text: Thou hast also made our words powerful and great, even that we cannot write them; wherefore, when we write we behold our weakness, and stumble because of the placing of our words; and I fear lest the Gentiles shall mock at our words.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.26
    scripture: book-of-mormon
    name: Ether 12:26
    book: Ether
    chapter: 12
    verse: 26
    ordinal: 6330
    text: 'And when I had said this, the Lord spake unto me, saying: Fools mock, but they shall mourn; and my grace is sufficient for the meek, that they shall take no advantage of your weakness;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.27
    scripture: book-of-mormon
    name: Ether 12:27
    book: Ether
    chapter: 12
    verse: 27
    ordinal: 6331
    text: And if men come unto me I will show unto them their weakness. I give unto men weakness that they may be humble; and my grace is sufficient for all men that humble themselves before me; for if they humble themselves before me, and have faith in me, then will I make weak things become strong unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.28
    scripture: book-of-mormon
    name: Ether 12:28
    book: Ether
    chapter: 12
    verse: 28
    ordinal: 6332
    text: Behold, I will show unto the Gentiles their weakness, and I will show unto them that faith, hope and charity bringeth unto me—the fountain of all righteousness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.29
    scripture: book-of-mormon
    name: Ether 12:29
    book: Ether
    chapter: 12
    verse: 29
    ordinal: 6333
    text: 'And I, Moroni, having heard these words, was comforted, and said: O Lord, thy righteous will be done, for I know that thou workest unto the children of men according to their faith;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.30
    scripture: book-of-mormon
    name: Ether 12:30
    book: Ether
    chapter: 12
    verse: 30
    ordinal: 6334
    text: For the brother of Jared said unto the mountain Zerin, Remove—and it was removed. And if he had not had faith it would not have moved; wherefore thou workest after men have faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.31
    scripture: book-of-mormon
    name: Ether 12:31
    book: Ether
    chapter: 12
    verse: 31
    ordinal: 6335
    text: For thus didst thou manifest thyself unto thy disciples; for after they had faith, and did speak in thy name, thou didst show thyself unto them in great power.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.32
    scripture: book-of-mormon
    name: Ether 12:32
    book: Ether
    chapter: 12
    verse: 32
    ordinal: 6336
    text: And I also remember that thou hast said that thou hast prepared a house for man, yea, even among the mansions of thy Father, in which man might have a more excellent hope; wherefore man must hope, or he cannot receive an inheritance in the place which thou hast prepared.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.33
    scripture: book-of-mormon
    name: Ether 12:33
    book: Ether
    chapter: 12
    verse: 33
    ordinal: 6337
    text: And again, I remember that thou hast said that thou hast loved the world, even unto the laying down of thy life for the world, that thou mightest take it again to prepare a place for the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.34
    scripture: book-of-mormon
    name: Ether 12:34
    book: Ether
    chapter: 12
    verse: 34
    ordinal: 6338
    text: And now I know that this love which thou hast had for the children of men is charity; wherefore, except men shall have charity they cannot inherit that place which thou hast prepared in the mansions of thy Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.35
    scripture: book-of-mormon
    name: Ether 12:35
    book: Ether
    chapter: 12
    verse: 35
    ordinal: 6339
    text: Wherefore, I know by this thing which thou hast said, that if the Gentiles have not charity, because of our weakness, that thou wilt prove them, and take away their talent, yea, even that which they have received, and give unto them who shall have more abundantly.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.36
    scripture: book-of-mormon
    name: Ether 12:36
    book: Ether
    chapter: 12
    verse: 36
    ordinal: 6340
    text: And it came to pass that I prayed unto the Lord that he would give unto the Gentiles grace, that they might have charity.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.37
    scripture: book-of-mormon
    name: Ether 12:37
    book: Ether
    chapter: 12
    verse: 37
    ordinal: 6341
    text: 'And it came to pass that the Lord said unto me: If they have not charity it mattereth not unto thee, thou hast been faithful; wherefore, thy garments shall be made clean. And because thou hast seen thy weakness thou shalt be made strong, even unto the sitting down in the place which I have prepared in the mansions of my Father.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.38
    scripture: book-of-mormon
    name: Ether 12:38
    book: Ether
    chapter: 12
    verse: 38
    ordinal: 6342
    text: And now I, Moroni, bid farewell unto the Gentiles, yea, and also unto my brethren whom I love, until we shall meet before the judgment-seat of Christ, where all men shall know that my garments are not spotted with your blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.39
    scripture: book-of-mormon
    name: Ether 12:39
    book: Ether
    chapter: 12
    verse: 39
    ordinal: 6343
    text: And then shall ye know that I have seen Jesus, and that he hath talked with me face to face, and that he told me in plain humility, even as a man telleth another in mine own language, concerning these things;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.40
    scripture: book-of-mormon
    name: Ether 12:40
    book: Ether
    chapter: 12
    verse: 40
    ordinal: 6344
    text: And only a few have I written, because of my weakness in writing.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.12.41
    scripture: book-of-mormon
    name: Ether 12:41
    book: Ether
    chapter: 12
    verse: 41
    ordinal: 6345
    text: And now, I would commend you to seek this Jesus of whom the prophets and apostles have written, that the grace of God the Father, and also the Lord Jesus Christ, and the Holy Ghost, which beareth record of them, may be and abide in you forever. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.12
- type: BomVerse
  data:
    ref: ether.13.1
    scripture: book-of-mormon
    name: Ether 13:1
    book: Ether
    chapter: 13
    verse: 1
    ordinal: 6346
    text: And now I, Moroni, proceed to finish my record concerning the destruction of the people of whom I have been writing.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.2
    scripture: book-of-mormon
    name: Ether 13:2
    book: Ether
    chapter: 13
    verse: 2
    ordinal: 6347
    text: For behold, they rejected all the words of Ether; for he truly told them of all things, from the beginning of man; and that after the waters had receded from off the face of this land it became a choice land above all other lands, a chosen land of the Lord; wherefore the Lord would have that all men should serve him who dwell upon the face thereof;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.3
    scripture: book-of-mormon
    name: Ether 13:3
    book: Ether
    chapter: 13
    verse: 3
    ordinal: 6348
    text: And that it was the place of the New Jerusalem, which should come down out of heaven, and the holy sanctuary of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.4
    scripture: book-of-mormon
    name: Ether 13:4
    book: Ether
    chapter: 13
    verse: 4
    ordinal: 6349
    text: Behold, Ether saw the days of Christ, and he spake concerning a New Jerusalem upon this land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.5
    scripture: book-of-mormon
    name: Ether 13:5
    book: Ether
    chapter: 13
    verse: 5
    ordinal: 6350
    text: And he spake also concerning the house of Israel, and the Jerusalem from whence Lehi should come—after it should be destroyed it should be built up again, a holy city unto the Lord; wherefore, it could not be a new Jerusalem for it had been in a time of old; but it should be built up again, and become a holy city of the Lord; and it should be built unto the house of Israel—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.6
    scripture: book-of-mormon
    name: Ether 13:6
    book: Ether
    chapter: 13
    verse: 6
    ordinal: 6351
    text: And that a New Jerusalem should be built up upon this land, unto the remnant of the seed of Joseph, for which things there has been a type.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.7
    scripture: book-of-mormon
    name: Ether 13:7
    book: Ether
    chapter: 13
    verse: 7
    ordinal: 6352
    text: For as Joseph brought his father down into the land of Egypt, even so he died there; wherefore, the Lord brought a remnant of the seed of Joseph out of the land of Jerusalem, that he might be merciful unto the seed of Joseph that they should perish not, even as he was merciful unto the father of Joseph that he should perish not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.8
    scripture: book-of-mormon
    name: Ether 13:8
    book: Ether
    chapter: 13
    verse: 8
    ordinal: 6353
    text: Wherefore, the remnant of the house of Joseph shall be built upon this land; and it shall be a land of their inheritance; and they shall build up a holy city unto the Lord, like unto the Jerusalem of old; and they shall no more be confounded, until the end come when the earth shall pass away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.9
    scripture: book-of-mormon
    name: Ether 13:9
    book: Ether
    chapter: 13
    verse: 9
    ordinal: 6354
    text: And there shall be a new heaven and a new earth; and they shall be like unto the old save the old have passed away, and all things have become new.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.10
    scripture: book-of-mormon
    name: Ether 13:10
    book: Ether
    chapter: 13
    verse: 10
    ordinal: 6355
    text: And then cometh the New Jerusalem; and blessed are they who dwell therein, for it is they whose garments are white through the blood of the Lamb; and they are they who are numbered among the remnant of the seed of Joseph, who were of the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.11
    scripture: book-of-mormon
    name: Ether 13:11
    book: Ether
    chapter: 13
    verse: 11
    ordinal: 6356
    text: And then also cometh the Jerusalem of old; and the inhabitants thereof, blessed are they, for they have been washed in the blood of the Lamb; and they are they who were scattered and gathered in from the four quarters of the earth, and from the north countries, and are partakers of the fulfilling of the covenant which God made with their father, Abraham.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.12
    scripture: book-of-mormon
    name: Ether 13:12
    book: Ether
    chapter: 13
    verse: 12
    ordinal: 6357
    text: And when these things come, bringeth to pass the scripture which saith, there are they who were first, who shall be last; and there are they who were last, who shall be first.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.13
    scripture: book-of-mormon
    name: Ether 13:13
    book: Ether
    chapter: 13
    verse: 13
    ordinal: 6358
    text: And I was about to write more, but I am forbidden; but great and marvelous were the prophecies of Ether; but they esteemed him as naught, and cast him out; and he hid himself in the cavity of a rock by day, and by night he went forth viewing the things which should come upon the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.14
    scripture: book-of-mormon
    name: Ether 13:14
    book: Ether
    chapter: 13
    verse: 14
    ordinal: 6359
    text: And as he dwelt in the cavity of a rock he made the remainder of this record, viewing the destructions which came upon the people, by night.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.15
    scripture: book-of-mormon
    name: Ether 13:15
    book: Ether
    chapter: 13
    verse: 15
    ordinal: 6360
    text: And it came to pass that in that same year in which he was cast out from among the people there began to be a great war among the people, for there were many who rose up, who were mighty men, and sought to destroy Coriantumr by their secret plans of wickedness, of which hath been spoken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.16
    scripture: book-of-mormon
    name: Ether 13:16
    book: Ether
    chapter: 13
    verse: 16
    ordinal: 6361
    text: And now Coriantumr, having studied, himself, in all the arts of war and all the cunning of the world, wherefore he gave battle unto them who sought to destroy him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.17
    scripture: book-of-mormon
    name: Ether 13:17
    book: Ether
    chapter: 13
    verse: 17
    ordinal: 6362
    text: But he repented not, neither his fair sons nor daughters; neither the fair sons and daughters of Cohor; neither the fair sons and daughters of Corihor; and in fine, there were none of the fair sons and daughters upon the face of the whole earth who repented of their sins.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.18
    scripture: book-of-mormon
    name: Ether 13:18
    book: Ether
    chapter: 13
    verse: 18
    ordinal: 6363
    text: Wherefore, it came to pass that in the first year that Ether dwelt in the cavity of a rock, there were many people who were slain by the sword of those secret combinations, fighting against Coriantumr that they might obtain the kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.19
    scripture: book-of-mormon
    name: Ether 13:19
    book: Ether
    chapter: 13
    verse: 19
    ordinal: 6364
    text: And it came to pass that the sons of Coriantumr fought much and bled much.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.20
    scripture: book-of-mormon
    name: Ether 13:20
    book: Ether
    chapter: 13
    verse: 20
    ordinal: 6365
    text: And in the second year the word of the Lord came to Ether, that he should go and prophesy unto Coriantumr that, if he would repent, and all his household, the Lord would give unto him his kingdom and spare the people—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.21
    scripture: book-of-mormon
    name: Ether 13:21
    book: Ether
    chapter: 13
    verse: 21
    ordinal: 6366
    text: Otherwise they should be destroyed, and all his household save it were himself. And he should only live to see the fulfilling of the prophecies which had been spoken concerning another people receiving the land for their inheritance; and Coriantumr should receive a burial by them; and every soul should be destroyed save it were Coriantumr.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.22
    scripture: book-of-mormon
    name: Ether 13:22
    book: Ether
    chapter: 13
    verse: 22
    ordinal: 6367
    text: And it came to pass that Coriantumr repented not, neither his household, neither the people; and the wars ceased not; and they sought to kill Ether, but he fled from before them and hid again in the cavity of the rock.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.23
    scripture: book-of-mormon
    name: Ether 13:23
    book: Ether
    chapter: 13
    verse: 23
    ordinal: 6368
    text: And it came to pass that there arose up Shared, and he also gave battle unto Coriantumr; and he did beat him, insomuch that in the third year he did bring him into captivity.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.24
    scripture: book-of-mormon
    name: Ether 13:24
    book: Ether
    chapter: 13
    verse: 24
    ordinal: 6369
    text: And the sons of Coriantumr, in the fourth year, did beat Shared, and did obtain the kingdom again unto their father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.25
    scripture: book-of-mormon
    name: Ether 13:25
    book: Ether
    chapter: 13
    verse: 25
    ordinal: 6370
    text: Now there began to be a war upon all the face of the land, every man with his band fighting for that which he desired.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.26
    scripture: book-of-mormon
    name: Ether 13:26
    book: Ether
    chapter: 13
    verse: 26
    ordinal: 6371
    text: And there were robbers, and in fine, all manner of wickedness upon all the face of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.27
    scripture: book-of-mormon
    name: Ether 13:27
    book: Ether
    chapter: 13
    verse: 27
    ordinal: 6372
    text: And it came to pass that Coriantumr was exceedingly angry with Shared, and he went against him with his armies to battle; and they did meet in great anger, and they did meet in the valley of Gilgal; and the battle became exceedingly sore.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.28
    scripture: book-of-mormon
    name: Ether 13:28
    book: Ether
    chapter: 13
    verse: 28
    ordinal: 6373
    text: And it came to pass that Shared fought against him for the space of three days. And it came to pass that Coriantumr beat him, and did pursue him until he came to the plains of Heshlon.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.29
    scripture: book-of-mormon
    name: Ether 13:29
    book: Ether
    chapter: 13
    verse: 29
    ordinal: 6374
    text: And it came to pass that Shared gave him battle again upon the plains; and behold, he did beat Coriantumr, and drove him back again to the valley of Gilgal.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.30
    scripture: book-of-mormon
    name: Ether 13:30
    book: Ether
    chapter: 13
    verse: 30
    ordinal: 6375
    text: And Coriantumr gave Shared battle again in the valley of Gilgal, in which he beat Shared and slew him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.13.31
    scripture: book-of-mormon
    name: Ether 13:31
    book: Ether
    chapter: 13
    verse: 31
    ordinal: 6376
    text: And Shared wounded Coriantumr in his thigh, that he did not go to battle again for the space of two years, in which time all the people upon the face of the land were shedding blood, and there was none to restrain them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.13
- type: BomVerse
  data:
    ref: ether.14.1
    scripture: book-of-mormon
    name: Ether 14:1
    book: Ether
    chapter: 14
    verse: 1
    ordinal: 6377
    text: And now there began to be a great curse upon all the land because of the iniquity of the people, in which, if a man should lay his tool or his sword upon his shelf, or upon the place whither he would keep it, behold, upon the morrow, he could not find it, so great was the curse upon the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.2
    scripture: book-of-mormon
    name: Ether 14:2
    book: Ether
    chapter: 14
    verse: 2
    ordinal: 6378
    text: Wherefore every man did cleave unto that which was his own, with his hands, and would not borrow neither would he lend; and every man kept the hilt of his sword in his right hand, in the defence of his property and his own life and of his wives and children.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.3
    scripture: book-of-mormon
    name: Ether 14:3
    book: Ether
    chapter: 14
    verse: 3
    ordinal: 6379
    text: And now, after the space of two years, and after the death of Shared, behold, there arose the brother of Shared and he gave battle unto Coriantumr, in which Coriantumr did beat him and did pursue him to the wilderness of Akish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.4
    scripture: book-of-mormon
    name: Ether 14:4
    book: Ether
    chapter: 14
    verse: 4
    ordinal: 6380
    text: And it came to pass that the brother of Shared did give battle unto him in the wilderness of Akish; and the battle became exceedingly sore, and many thousands fell by the sword.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.5
    scripture: book-of-mormon
    name: Ether 14:5
    book: Ether
    chapter: 14
    verse: 5
    ordinal: 6381
    text: And it came to pass that Coriantumr did lay siege to the wilderness; and the brother of Shared did march forth out of the wilderness by night, and slew a part of the army of Coriantumr, as they were drunken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.6
    scripture: book-of-mormon
    name: Ether 14:6
    book: Ether
    chapter: 14
    verse: 6
    ordinal: 6382
    text: And he came forth to the land of Moron, and placed himself upon the throne of Coriantumr.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.7
    scripture: book-of-mormon
    name: Ether 14:7
    book: Ether
    chapter: 14
    verse: 7
    ordinal: 6383
    text: And it came to pass that Coriantumr dwelt with his army in the wilderness for the space of two years, in which he did receive great strength to his army.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.8
    scripture: book-of-mormon
    name: Ether 14:8
    book: Ether
    chapter: 14
    verse: 8
    ordinal: 6384
    text: Now the brother of Shared, whose name was Gilead, also received great strength to his army, because of secret combinations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.9
    scripture: book-of-mormon
    name: Ether 14:9
    book: Ether
    chapter: 14
    verse: 9
    ordinal: 6385
    text: And it came to pass that his high priest murdered him as he sat upon his throne.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.10
    scripture: book-of-mormon
    name: Ether 14:10
    book: Ether
    chapter: 14
    verse: 10
    ordinal: 6386
    text: And it came to pass that one of the secret combinations murdered him in a secret pass, and obtained unto himself the kingdom; and his name was Lib; and Lib was a man of great stature, more than any other man among all the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.11
    scripture: book-of-mormon
    name: Ether 14:11
    book: Ether
    chapter: 14
    verse: 11
    ordinal: 6387
    text: And it came to pass that in the first year of Lib, Coriantumr came up unto the land of Moron, and gave battle unto Lib.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.12
    scripture: book-of-mormon
    name: Ether 14:12
    book: Ether
    chapter: 14
    verse: 12
    ordinal: 6388
    text: And it came to pass that he fought with Lib, in which Lib did smite upon his arm that he was wounded; nevertheless, the army of Coriantumr did press forward upon Lib, that he fled to the borders upon the seashore.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.13
    scripture: book-of-mormon
    name: Ether 14:13
    book: Ether
    chapter: 14
    verse: 13
    ordinal: 6389
    text: And it came to pass that Coriantumr pursued him; and Lib gave battle unto him upon the seashore.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.14
    scripture: book-of-mormon
    name: Ether 14:14
    book: Ether
    chapter: 14
    verse: 14
    ordinal: 6390
    text: And it came to pass that Lib did smite the army of Coriantumr, that they fled again to the wilderness of Akish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.15
    scripture: book-of-mormon
    name: Ether 14:15
    book: Ether
    chapter: 14
    verse: 15
    ordinal: 6391
    text: And it came to pass that Lib did pursue him until he came to the plains of Agosh. And Coriantumr had taken all the people with him as he fled before Lib in that quarter of the land whither he fled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.16
    scripture: book-of-mormon
    name: Ether 14:16
    book: Ether
    chapter: 14
    verse: 16
    ordinal: 6392
    text: And when he had come to the plains of Agosh he gave battle unto Lib, and he smote upon him until he died; nevertheless, the brother of Lib did come against Coriantumr in the stead thereof, and the battle became exceedingly sore, in the which Coriantumr fled again before the army of the brother of Lib.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.17
    scripture: book-of-mormon
    name: Ether 14:17
    book: Ether
    chapter: 14
    verse: 17
    ordinal: 6393
    text: Now the name of the brother of Lib was called Shiz. And it came to pass that Shiz pursued after Coriantumr, and he did overthrow many cities, and he did slay both women and children, and he did burn the cities.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.18
    scripture: book-of-mormon
    name: Ether 14:18
    book: Ether
    chapter: 14
    verse: 18
    ordinal: 6394
    text: And there went a fear of Shiz throughout all the land; yea, a cry went forth throughout the land—Who can stand before the army of Shiz? Behold, he sweepeth the earth before him!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.19
    scripture: book-of-mormon
    name: Ether 14:19
    book: Ether
    chapter: 14
    verse: 19
    ordinal: 6395
    text: And it came to pass that the people began to flock together in armies, throughout all the face of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.20
    scripture: book-of-mormon
    name: Ether 14:20
    book: Ether
    chapter: 14
    verse: 20
    ordinal: 6396
    text: And they were divided; and a part of them fled to the army of Shiz, and a part of them fled to the army of Coriantumr.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.21
    scripture: book-of-mormon
    name: Ether 14:21
    book: Ether
    chapter: 14
    verse: 21
    ordinal: 6397
    text: And so great and lasting had been the war, and so long had been the scene of bloodshed and carnage, that the whole face of the land was covered with the bodies of the dead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.22
    scripture: book-of-mormon
    name: Ether 14:22
    book: Ether
    chapter: 14
    verse: 22
    ordinal: 6398
    text: And so swift and speedy was the war that there was none left to bury the dead, but they did march forth from the shedding of blood to the shedding of blood, leaving the bodies of both men, women, and children strewed upon the face of the land, to become a prey to the worms of the flesh.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.23
    scripture: book-of-mormon
    name: Ether 14:23
    book: Ether
    chapter: 14
    verse: 23
    ordinal: 6399
    text: And the scent thereof went forth upon the face of the land, even upon all the face of the land; wherefore the people became troubled by day and by night, because of the scent thereof.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.24
    scripture: book-of-mormon
    name: Ether 14:24
    book: Ether
    chapter: 14
    verse: 24
    ordinal: 6400
    text: Nevertheless, Shiz did not cease to pursue Coriantumr; for he had sworn to avenge himself upon Coriantumr of the blood of his brother, who had been slain, and the word of the Lord which came to Ether that Coriantumr should not fall by the sword.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.25
    scripture: book-of-mormon
    name: Ether 14:25
    book: Ether
    chapter: 14
    verse: 25
    ordinal: 6401
    text: And thus we see that the Lord did visit them in the fulness of his wrath, and their wickedness and abominations had prepared a way for their everlasting destruction.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.26
    scripture: book-of-mormon
    name: Ether 14:26
    book: Ether
    chapter: 14
    verse: 26
    ordinal: 6402
    text: And it came to pass that Shiz did pursue Coriantumr eastward, even to the borders by the seashore, and there he gave battle unto Shiz for the space of three days.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.27
    scripture: book-of-mormon
    name: Ether 14:27
    book: Ether
    chapter: 14
    verse: 27
    ordinal: 6403
    text: And so terrible was the destruction among the armies of Shiz that the people began to be frightened, and began to flee before the armies of Coriantumr; and they fled to the land of Corihor, and swept off the inhabitants before them, all them that would not join them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.28
    scripture: book-of-mormon
    name: Ether 14:28
    book: Ether
    chapter: 14
    verse: 28
    ordinal: 6404
    text: And they pitched their tents in the valley of Corihor; and Coriantumr pitched his tents in the valley of Shurr. Now the valley of Shurr was near the hill Comnor; wherefore, Coriantumr did gather his armies together upon the hill Comnor, and did sound a trumpet unto the armies of Shiz to invite them forth to battle.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.29
    scripture: book-of-mormon
    name: Ether 14:29
    book: Ether
    chapter: 14
    verse: 29
    ordinal: 6405
    text: And it came to pass that they came forth, but were driven again; and they came the second time, and they were driven again the second time. And it came to pass that they came again the third time, and the battle became exceedingly sore.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.30
    scripture: book-of-mormon
    name: Ether 14:30
    book: Ether
    chapter: 14
    verse: 30
    ordinal: 6406
    text: And it came to pass that Shiz smote upon Coriantumr that he gave him many deep wounds; and Coriantumr, having lost his blood, fainted, and was carried away as though he were dead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.14.31
    scripture: book-of-mormon
    name: Ether 14:31
    book: Ether
    chapter: 14
    verse: 31
    ordinal: 6407
    text: Now the loss of men, women and children on both sides was so great that Shiz commanded his people that they should not pursue the armies of Coriantumr; wherefore, they returned to their camp.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.14
- type: BomVerse
  data:
    ref: ether.15.1
    scripture: book-of-mormon
    name: Ether 15:1
    book: Ether
    chapter: 15
    verse: 1
    ordinal: 6408
    text: And it came to pass when Coriantumr had recovered of his wounds, he began to remember the words which Ether had spoken unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.2
    scripture: book-of-mormon
    name: Ether 15:2
    book: Ether
    chapter: 15
    verse: 2
    ordinal: 6409
    text: He saw that there had been slain by the sword already nearly two millions of his people, and he began to sorrow in his heart; yea, there had been slain two millions of mighty men, and also their wives and their children.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.3
    scripture: book-of-mormon
    name: Ether 15:3
    book: Ether
    chapter: 15
    verse: 3
    ordinal: 6410
    text: He began to repent of the evil which he had done; he began to remember the words which had been spoken by the mouth of all the prophets, and he saw them that they were fulfilled thus far, every whit; and his soul mourned and refused to be comforted.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.4
    scripture: book-of-mormon
    name: Ether 15:4
    book: Ether
    chapter: 15
    verse: 4
    ordinal: 6411
    text: And it came to pass that he wrote an epistle unto Shiz, desiring him that he would spare the people, and he would give up the kingdom for the sake of the lives of the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.5
    scripture: book-of-mormon
    name: Ether 15:5
    book: Ether
    chapter: 15
    verse: 5
    ordinal: 6412
    text: And it came to pass that when Shiz had received his epistle he wrote an epistle unto Coriantumr, that if he would give himself up, that he might slay him with his own sword, that he would spare the lives of the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.6
    scripture: book-of-mormon
    name: Ether 15:6
    book: Ether
    chapter: 15
    verse: 6
    ordinal: 6413
    text: And it came to pass that the people repented not of their iniquity; and the people of Coriantumr were stirred up to anger against the people of Shiz; and the people of Shiz were stirred up to anger against the people of Coriantumr; wherefore, the people of Shiz did give battle unto the people of Coriantumr.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.7
    scripture: book-of-mormon
    name: Ether 15:7
    book: Ether
    chapter: 15
    verse: 7
    ordinal: 6414
    text: And when Coriantumr saw that he was about to fall he fled again before the people of Shiz.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.8
    scripture: book-of-mormon
    name: Ether 15:8
    book: Ether
    chapter: 15
    verse: 8
    ordinal: 6415
    text: And it came to pass that he came to the waters of Ripliancum, which, by interpretation, is large, or to exceed all; wherefore, when they came to these waters they pitched their tents; and Shiz also pitched his tents near unto them; and therefore on the morrow they did come to battle.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.9
    scripture: book-of-mormon
    name: Ether 15:9
    book: Ether
    chapter: 15
    verse: 9
    ordinal: 6416
    text: And it came to pass that they fought an exceedingly sore battle, in which Coriantumr was wounded again, and he fainted with the loss of blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.10
    scripture: book-of-mormon
    name: Ether 15:10
    book: Ether
    chapter: 15
    verse: 10
    ordinal: 6417
    text: And it came to pass that the armies of Coriantumr did press upon the armies of Shiz that they beat them, that they caused them to flee before them; and they did flee southward, and did pitch their tents in a place which was called Ogath.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.11
    scripture: book-of-mormon
    name: Ether 15:11
    book: Ether
    chapter: 15
    verse: 11
    ordinal: 6418
    text: And it came to pass that the army of Coriantumr did pitch their tents by the hill Ramah; and it was that same hill where my father Mormon did hide up the records unto the Lord, which were sacred.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.12
    scripture: book-of-mormon
    name: Ether 15:12
    book: Ether
    chapter: 15
    verse: 12
    ordinal: 6419
    text: And it came to pass that they did gather together all the people upon all the face of the land, who had not been slain, save it was Ether.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.13
    scripture: book-of-mormon
    name: Ether 15:13
    book: Ether
    chapter: 15
    verse: 13
    ordinal: 6420
    text: And it came to pass that Ether did behold all the doings of the people; and he beheld that the people who were for Coriantumr were gathered together to the army of Coriantumr; and the people who were for Shiz were gathered together to the army of Shiz.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.14
    scripture: book-of-mormon
    name: Ether 15:14
    book: Ether
    chapter: 15
    verse: 14
    ordinal: 6421
    text: Wherefore, they were for the space of four years gathering together the people, that they might get all who were upon the face of the land, and that they might receive all the strength which it was possible that they could receive.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.15
    scripture: book-of-mormon
    name: Ether 15:15
    book: Ether
    chapter: 15
    verse: 15
    ordinal: 6422
    text: And it came to pass that when they were all gathered together, every one to the army which he would, with their wives and their children—both men, women and children being armed with weapons of war, having shields, and breastplates, and head-plates, and being clothed after the manner of war—they did march forth one against another to battle; and they fought all that day, and conquered not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.16
    scripture: book-of-mormon
    name: Ether 15:16
    book: Ether
    chapter: 15
    verse: 16
    ordinal: 6423
    text: And it came to pass that when it was night they were weary, and retired to their camps; and after they had retired to their camps they took up a howling and a lamentation for the loss of the slain of their people; and so great were their cries, their howlings and lamentations, that they did rend the air exceedingly.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.17
    scripture: book-of-mormon
    name: Ether 15:17
    book: Ether
    chapter: 15
    verse: 17
    ordinal: 6424
    text: And it came to pass that on the morrow they did go again to battle, and great and terrible was that day; nevertheless, they conquered not, and when the night came again they did rend the air with their cries, and their howlings, and their mournings, for the loss of the slain of their people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.18
    scripture: book-of-mormon
    name: Ether 15:18
    book: Ether
    chapter: 15
    verse: 18
    ordinal: 6425
    text: And it came to pass that Coriantumr wrote again an epistle unto Shiz, desiring that he would not come again to battle, but that he would take the kingdom, and spare the lives of the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.19
    scripture: book-of-mormon
    name: Ether 15:19
    book: Ether
    chapter: 15
    verse: 19
    ordinal: 6426
    text: But behold, the Spirit of the Lord had ceased striving with them, and Satan had full power over the hearts of the people; for they were given up unto the hardness of their hearts, and the blindness of their minds that they might be destroyed; wherefore they went again to battle.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.20
    scripture: book-of-mormon
    name: Ether 15:20
    book: Ether
    chapter: 15
    verse: 20
    ordinal: 6427
    text: And it came to pass that they fought all that day, and when the night came they slept upon their swords.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.21
    scripture: book-of-mormon
    name: Ether 15:21
    book: Ether
    chapter: 15
    verse: 21
    ordinal: 6428
    text: And on the morrow they fought even until the night came.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.22
    scripture: book-of-mormon
    name: Ether 15:22
    book: Ether
    chapter: 15
    verse: 22
    ordinal: 6429
    text: And when the night came they were drunken with anger, even as a man who is drunken with wine; and they slept again upon their swords.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.23
    scripture: book-of-mormon
    name: Ether 15:23
    book: Ether
    chapter: 15
    verse: 23
    ordinal: 6430
    text: And on the morrow they fought again; and when the night came they had all fallen by the sword save it were fifty and two of the people of Coriantumr, and sixty and nine of the people of Shiz.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.24
    scripture: book-of-mormon
    name: Ether 15:24
    book: Ether
    chapter: 15
    verse: 24
    ordinal: 6431
    text: And it came to pass that they slept upon their swords that night, and on the morrow they fought again, and they contended in their might with their swords and with their shields, all that day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.25
    scripture: book-of-mormon
    name: Ether 15:25
    book: Ether
    chapter: 15
    verse: 25
    ordinal: 6432
    text: And when the night came there were thirty and two of the people of Shiz, and twenty and seven of the people of Coriantumr.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.26
    scripture: book-of-mormon
    name: Ether 15:26
    book: Ether
    chapter: 15
    verse: 26
    ordinal: 6433
    text: And it came to pass that they ate and slept, and prepared for death on the morrow. And they were large and mighty men as to the strength of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.27
    scripture: book-of-mormon
    name: Ether 15:27
    book: Ether
    chapter: 15
    verse: 27
    ordinal: 6434
    text: And it came to pass that they fought for the space of three hours, and they fainted with the loss of blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.28
    scripture: book-of-mormon
    name: Ether 15:28
    book: Ether
    chapter: 15
    verse: 28
    ordinal: 6435
    text: And it came to pass that when the men of Coriantumr had received sufficient strength that they could walk, they were about to flee for their lives; but behold, Shiz arose, and also his men, and he swore in his wrath that he would slay Coriantumr or he would perish by the sword.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.29
    scripture: book-of-mormon
    name: Ether 15:29
    book: Ether
    chapter: 15
    verse: 29
    ordinal: 6436
    text: Wherefore, he did pursue them, and on the morrow he did overtake them; and they fought again with the sword. And it came to pass that when they had all fallen by the sword, save it were Coriantumr and Shiz, behold Shiz had fainted with the loss of blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.30
    scripture: book-of-mormon
    name: Ether 15:30
    book: Ether
    chapter: 15
    verse: 30
    ordinal: 6437
    text: And it came to pass that when Coriantumr had leaned upon his sword, that he rested a little, he smote off the head of Shiz.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.31
    scripture: book-of-mormon
    name: Ether 15:31
    book: Ether
    chapter: 15
    verse: 31
    ordinal: 6438
    text: And it came to pass that after he had smitten off the head of Shiz, that Shiz raised up on his hands and fell; and after that he had struggled for breath, he died.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.32
    scripture: book-of-mormon
    name: Ether 15:32
    book: Ether
    chapter: 15
    verse: 32
    ordinal: 6439
    text: And it came to pass that Coriantumr fell to the earth, and became as if he had no life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.33
    scripture: book-of-mormon
    name: Ether 15:33
    book: Ether
    chapter: 15
    verse: 33
    ordinal: 6440
    text: 'And the Lord spake unto Ether, and said unto him: Go forth. And he went forth, and beheld that the words of the Lord had all been fulfilled; and he finished his record; (and the hundredth part I have not written) and he hid them in a manner that the people of Limhi did find them.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
- type: BomVerse
  data:
    ref: ether.15.34
    scripture: book-of-mormon
    name: Ether 15:34
    book: Ether
    chapter: 15
    verse: 34
    ordinal: 6441
    text: 'Now the last words which are written by Ether are these: Whether the Lord will that I be translated, or that I suffer the will of the Lord in the flesh, it mattereth not, if it so be that I am saved in the kingdom of God. Amen.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: ether.15
