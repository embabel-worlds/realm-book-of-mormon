    chapter: 3
    verse: 2
    ordinal: 46
    text: 'And it came to pass that he spake unto me, saying: Behold I have dreamed a dream, in the which the Lord hath commanded me that thou and thy brethren shall return to Jerusalem.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.3
    scripture: book-of-mormon
    name: 1 Nephi 3:3
    book: 1 Nephi
    chapter: 3
    verse: 3
    ordinal: 47
    text: For behold, Laban hath the record of the Jews and also a genealogy of my forefathers, and they are engraven upon plates of brass.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.4
    scripture: book-of-mormon
    name: 1 Nephi 3:4
    book: 1 Nephi
    chapter: 3
    verse: 4
    ordinal: 48
    text: Wherefore, the Lord hath commanded me that thou and thy brothers should go unto the house of Laban, and seek the records, and bring them down hither into the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.5
    scripture: book-of-mormon
    name: 1 Nephi 3:5
    book: 1 Nephi
    chapter: 3
    verse: 5
    ordinal: 49
    text: And now, behold thy brothers murmur, saying it is a hard thing which I have required of them; but behold I have not required it of them, but it is a commandment of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.6
    scripture: book-of-mormon
    name: 1 Nephi 3:6
    book: 1 Nephi
    chapter: 3
    verse: 6
    ordinal: 50
    text: Therefore go, my son, and thou shalt be favored of the Lord, because thou hast not murmured.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.7
    scripture: book-of-mormon
    name: 1 Nephi 3:7
    book: 1 Nephi
    chapter: 3
    verse: 7
    ordinal: 51
    text: 'And it came to pass that I, Nephi, said unto my father: I will go and do the things which the Lord hath commanded, for I know that the Lord giveth no commandments unto the children of men, save he shall prepare a way for them that they may accomplish the thing which he commandeth them.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.8
    scripture: book-of-mormon
    name: 1 Nephi 3:8
    book: 1 Nephi
    chapter: 3
    verse: 8
    ordinal: 52
    text: And it came to pass that when my father had heard these words he was exceedingly glad, for he knew that I had been blessed of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.9
    scripture: book-of-mormon
    name: 1 Nephi 3:9
    book: 1 Nephi
    chapter: 3
    verse: 9
    ordinal: 53
    text: And I, Nephi, and my brethren took our journey in the wilderness, with our tents, to go up to the land of Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.10
    scripture: book-of-mormon
    name: 1 Nephi 3:10
    book: 1 Nephi
    chapter: 3
    verse: 10
    ordinal: 54
    text: And it came to pass that when we had gone up to the land of Jerusalem, I and my brethren did consult one with another.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.11
    scripture: book-of-mormon
    name: 1 Nephi 3:11
    book: 1 Nephi
    chapter: 3
    verse: 11
    ordinal: 55
    text: And we cast lots—who of us should go in unto the house of Laban. And it came to pass that the lot fell upon Laman; and Laman went in unto the house of Laban, and he talked with him as he sat in his house.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.12
    scripture: book-of-mormon
    name: 1 Nephi 3:12
    book: 1 Nephi
    chapter: 3
    verse: 12
    ordinal: 56
    text: And he desired of Laban the records which were engraven upon the plates of brass, which contained the genealogy of my father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.13
    scripture: book-of-mormon
    name: 1 Nephi 3:13
    book: 1 Nephi
    chapter: 3
    verse: 13
    ordinal: 57
    text: 'And behold, it came to pass that Laban was angry, and thrust him out from his presence; and he would not that he should have the records. Wherefore, he said unto him: Behold thou art a robber, and I will slay thee.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.14
    scripture: book-of-mormon
    name: 1 Nephi 3:14
    book: 1 Nephi
    chapter: 3
    verse: 14
    ordinal: 58
    text: But Laman fled out of his presence, and told the things which Laban had done, unto us. And we began to be exceedingly sorrowful, and my brethren were about to return unto my father in the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.15
    scripture: book-of-mormon
    name: 1 Nephi 3:15
    book: 1 Nephi
    chapter: 3
    verse: 15
    ordinal: 59
    text: 'But behold I said unto them that: As the Lord liveth, and as we live, we will not go down unto our father in the wilderness until we have accomplished the thing which the Lord hath commanded us.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.16
    scripture: book-of-mormon
    name: 1 Nephi 3:16
    book: 1 Nephi
    chapter: 3
    verse: 16
    ordinal: 60
    text: Wherefore, let us be faithful in keeping the commandments of the Lord; therefore let us go down to the land of our father's inheritance, for behold he left gold and silver, and all manner of riches. And all this he hath done because of the commandments of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.17
    scripture: book-of-mormon
    name: 1 Nephi 3:17
    book: 1 Nephi
    chapter: 3
    verse: 17
    ordinal: 61
    text: For he knew that Jerusalem must be destroyed, because of the wickedness of the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.18
    scripture: book-of-mormon
    name: 1 Nephi 3:18
    book: 1 Nephi
    chapter: 3
    verse: 18
    ordinal: 62
    text: For behold, they have rejected the words of the prophets. Wherefore, if my father should dwell in the land after he hath been commanded to flee out of the land, behold, he would also perish. Wherefore, it must needs be that he flee out of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.19
    scripture: book-of-mormon
    name: 1 Nephi 3:19
    book: 1 Nephi
    chapter: 3
    verse: 19
    ordinal: 63
    text: And behold, it is wisdom in God that we should obtain these records, that we may preserve unto our children the language of our fathers;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.20
    scripture: book-of-mormon
    name: 1 Nephi 3:20
    book: 1 Nephi
    chapter: 3
    verse: 20
    ordinal: 64
    text: And also that we may preserve unto them the words which have been spoken by the mouth of all the holy prophets, which have been delivered unto them by the Spirit and power of God, since the world began, even down unto this present time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.21
    scripture: book-of-mormon
    name: 1 Nephi 3:21
    book: 1 Nephi
    chapter: 3
    verse: 21
    ordinal: 65
    text: And it came to pass that after this manner of language did I persuade my brethren, that they might be faithful in keeping the commandments of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.22
    scripture: book-of-mormon
    name: 1 Nephi 3:22
    book: 1 Nephi
    chapter: 3
    verse: 22
    ordinal: 66
    text: And it came to pass that we went down to the land of our inheritance, and we did gather together our gold, and our silver, and our precious things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.23
    scripture: book-of-mormon
    name: 1 Nephi 3:23
    book: 1 Nephi
    chapter: 3
    verse: 23
    ordinal: 67
    text: And after we had gathered these things together, we went up again unto the house of Laban.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.24
    scripture: book-of-mormon
    name: 1 Nephi 3:24
    book: 1 Nephi
    chapter: 3
    verse: 24
    ordinal: 68
    text: And it came to pass that we went in unto Laban, and desired him that he would give unto us the records which were engraven upon the plates of brass, for which we would give unto him our gold, and our silver, and all our precious things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.25
    scripture: book-of-mormon
    name: 1 Nephi 3:25
    book: 1 Nephi
    chapter: 3
    verse: 25
    ordinal: 69
    text: And it came to pass that when Laban saw our property, and that it was exceedingly great, he did lust after it, insomuch that he thrust us out, and sent his servants to slay us, that he might obtain our property.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.26
    scripture: book-of-mormon
    name: 1 Nephi 3:26
    book: 1 Nephi
    chapter: 3
    verse: 26
    ordinal: 70
    text: And it came to pass that we did flee before the servants of Laban, and we were obliged to leave behind our property, and it fell into the hands of Laban.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.27
    scripture: book-of-mormon
    name: 1 Nephi 3:27
    book: 1 Nephi
    chapter: 3
    verse: 27
    ordinal: 71
    text: And it came to pass that we fled into the wilderness, and the servants of Laban did not overtake us, and we hid ourselves in the cavity of a rock.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.28
    scripture: book-of-mormon
    name: 1 Nephi 3:28
    book: 1 Nephi
    chapter: 3
    verse: 28
    ordinal: 72
    text: And it came to pass that Laman was angry with me, and also with my father; and also was Lemuel, for he hearkened unto the words of Laman. Wherefore Laman and Lemuel did speak many hard words unto us, their younger brothers, and they did smite us even with a rod.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.29
    scripture: book-of-mormon
    name: 1 Nephi 3:29
    book: 1 Nephi
    chapter: 3
    verse: 29
    ordinal: 73
    text: 'And it came to pass as they smote us with a rod, behold, an angel of the Lord came and stood before them, and he spake unto them, saying: Why do ye smite your younger brother with a rod? Know ye not that the Lord hath chosen him to be a ruler over you, and this because of your iniquities? Behold ye shall go up to Jerusalem again, and the Lord will deliver Laban into your hands.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.30
    scripture: book-of-mormon
    name: 1 Nephi 3:30
    book: 1 Nephi
    chapter: 3
    verse: 30
    ordinal: 74
    text: And after the angel had spoken unto us, he departed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.3.31
    scripture: book-of-mormon
    name: 1 Nephi 3:31
    book: 1 Nephi
    chapter: 3
    verse: 31
    ordinal: 75
    text: 'And after the angel had departed, Laman and Lemuel again began to murmur, saying: How is it possible that the Lord will deliver Laban into our hands? Behold, he is a mighty man, and he can command fifty, yea, even he can slay fifty; then why not us?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.3
- type: BomVerse
  data:
    ref: 1-nephi.4.1
    scripture: book-of-mormon
    name: 1 Nephi 4:1
    book: 1 Nephi
    chapter: 4
    verse: 1
    ordinal: 76
    text: 'And it came to pass that I spake unto my brethren, saying: Let us go up again unto Jerusalem, and let us be faithful in keeping the commandments of the Lord; for behold he is mightier than all the earth, then why not mightier than Laban and his fifty, yea, or even than his tens of thousands?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.2
    scripture: book-of-mormon
    name: 1 Nephi 4:2
    book: 1 Nephi
    chapter: 4
    verse: 2
    ordinal: 77
    text: Therefore let us go up; let us be strong like unto Moses; for he truly spake unto the waters of the Red Sea and they divided hither and thither, and our fathers came through, out of captivity, on dry ground, and the armies of Pharaoh did follow and were drowned in the waters of the Red Sea.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.3
    scripture: book-of-mormon
    name: 1 Nephi 4:3
    book: 1 Nephi
    chapter: 4
    verse: 3
    ordinal: 78
    text: Now behold ye know that this is true; and ye also know that an angel hath spoken unto you; wherefore can ye doubt? Let us go up; the Lord is able to deliver us, even as our fathers, and to destroy Laban, even as the Egyptians.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.4
    scripture: book-of-mormon
    name: 1 Nephi 4:4
    book: 1 Nephi
    chapter: 4
    verse: 4
    ordinal: 79
    text: Now when I had spoken these words, they were yet wroth, and did still continue to murmur; nevertheless they did follow me up until we came without the walls of Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.5
    scripture: book-of-mormon
    name: 1 Nephi 4:5
    book: 1 Nephi
    chapter: 4
    verse: 5
    ordinal: 80
    text: And it was by night; and I caused that they should hide themselves without the walls. And after they had hid themselves, I, Nephi, crept into the city and went forth towards the house of Laban.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.6
    scripture: book-of-mormon
    name: 1 Nephi 4:6
    book: 1 Nephi
    chapter: 4
    verse: 6
    ordinal: 81
    text: And I was led by the Spirit, not knowing beforehand the things which I should do.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.7
    scripture: book-of-mormon
    name: 1 Nephi 4:7
    book: 1 Nephi
    chapter: 4
    verse: 7
    ordinal: 82
    text: Nevertheless I went forth, and as I came near unto the house of Laban I beheld a man, and he had fallen to the earth before me, for he was drunken with wine.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.8
    scripture: book-of-mormon
    name: 1 Nephi 4:8
    book: 1 Nephi
    chapter: 4
    verse: 8
    ordinal: 83
    text: And when I came to him I found that it was Laban.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.9
    scripture: book-of-mormon
    name: 1 Nephi 4:9
    book: 1 Nephi
    chapter: 4
    verse: 9
    ordinal: 84
    text: And I beheld his sword, and I drew it forth from the sheath thereof; and the hilt thereof was of pure gold, and the workmanship thereof was exceedingly fine, and I saw that the blade thereof was of the most precious steel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.10
    scripture: book-of-mormon
    name: 1 Nephi 4:10
    book: 1 Nephi
    chapter: 4
    verse: 10
    ordinal: 85
    text: 'And it came to pass that I was constrained by the Spirit that I should kill Laban; but I said in my heart: Never at any time have I shed the blood of man. And I shrunk and would that I might not slay him.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.11
    scripture: book-of-mormon
    name: 1 Nephi 4:11
    book: 1 Nephi
    chapter: 4
    verse: 11
    ordinal: 86
    text: 'And the Spirit said unto me again: Behold the Lord hath delivered him into thy hands. Yea, and I also knew that he had sought to take away mine own life; yea, and he would not hearken unto the commandments of the Lord; and he also had taken away our property.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.12
    scripture: book-of-mormon
    name: 1 Nephi 4:12
    book: 1 Nephi
    chapter: 4
    verse: 12
    ordinal: 87
    text: 'And it came to pass that the Spirit said unto me again: Slay him, for the Lord hath delivered him into thy hands;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.13
    scripture: book-of-mormon
    name: 1 Nephi 4:13
    book: 1 Nephi
    chapter: 4
    verse: 13
    ordinal: 88
    text: Behold the Lord slayeth the wicked to bring forth his righteous purposes. It is better that one man should perish than that a nation should dwindle and perish in unbelief.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.14
    scripture: book-of-mormon
    name: 1 Nephi 4:14
    book: 1 Nephi
    chapter: 4
    verse: 14
    ordinal: 89
    text: 'And now, when I, Nephi, had heard these words, I remembered the words of the Lord which he spake unto me in the wilderness, saying that: Inasmuch as thy seed shall keep my commandments, they shall prosper in the land of promise.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.15
    scripture: book-of-mormon
    name: 1 Nephi 4:15
    book: 1 Nephi
    chapter: 4
    verse: 15
    ordinal: 90
    text: Yea, and I also thought that they could not keep the commandments of the Lord according to the law of Moses, save they should have the law.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.16
    scripture: book-of-mormon
    name: 1 Nephi 4:16
    book: 1 Nephi
    chapter: 4
    verse: 16
    ordinal: 91
    text: And I also knew that the law was engraven upon the plates of brass.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.17
    scripture: book-of-mormon
    name: 1 Nephi 4:17
    book: 1 Nephi
    chapter: 4
    verse: 17
    ordinal: 92
    text: And again, I knew that the Lord had delivered Laban into my hands for this cause—that I might obtain the records according to his commandments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.18
    scripture: book-of-mormon
    name: 1 Nephi 4:18
    book: 1 Nephi
    chapter: 4
    verse: 18
    ordinal: 93
    text: Therefore I did obey the voice of the Spirit, and took Laban by the hair of the head, and I smote off his head with his own sword.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.19
    scripture: book-of-mormon
    name: 1 Nephi 4:19
    book: 1 Nephi
    chapter: 4
    verse: 19
    ordinal: 94
    text: And after I had smitten off his head with his own sword, I took the garments of Laban and put them upon mine own body; yea, even every whit; and I did gird on his armor about my loins.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.20
    scripture: book-of-mormon
    name: 1 Nephi 4:20
    book: 1 Nephi
    chapter: 4
    verse: 20
    ordinal: 95
    text: And after I had done this, I went forth unto the treasury of Laban. And as I went forth towards the treasury of Laban, behold, I saw the servant of Laban who had the keys of the treasury. And I commanded him in the voice of Laban, that he should go with me into the treasury.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.21
    scripture: book-of-mormon
    name: 1 Nephi 4:21
    book: 1 Nephi
    chapter: 4
    verse: 21
    ordinal: 96
    text: And he supposed me to be his master, Laban, for he beheld the garments and also the sword girded about my loins.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.22
    scripture: book-of-mormon
    name: 1 Nephi 4:22
    book: 1 Nephi
    chapter: 4
    verse: 22
    ordinal: 97
    text: And he spake unto me concerning the elders of the Jews, he knowing that his master, Laban, had been out by night among them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.23
    scripture: book-of-mormon
    name: 1 Nephi 4:23
    book: 1 Nephi
    chapter: 4
    verse: 23
    ordinal: 98
    text: And I spake unto him as if it had been Laban.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.24
    scripture: book-of-mormon
    name: 1 Nephi 4:24
    book: 1 Nephi
    chapter: 4
    verse: 24
    ordinal: 99
    text: And I also spake unto him that I should carry the engravings, which were upon the plates of brass, to my elder brethren, who were without the walls.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.25
    scripture: book-of-mormon
    name: 1 Nephi 4:25
    book: 1 Nephi
    chapter: 4
    verse: 25
    ordinal: 100
    text: And I also bade him that he should follow me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.26
    scripture: book-of-mormon
    name: 1 Nephi 4:26
    book: 1 Nephi
    chapter: 4
    verse: 26
    ordinal: 101
    text: And he, supposing that I spake of the brethren of the church, and that I was truly that Laban whom I had slain, wherefore he did follow me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.27
    scripture: book-of-mormon
    name: 1 Nephi 4:27
    book: 1 Nephi
    chapter: 4
    verse: 27
    ordinal: 102
    text: And he spake unto me many times concerning the elders of the Jews, as I went forth unto my brethren, who were without the walls.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.28
    scripture: book-of-mormon
    name: 1 Nephi 4:28
    book: 1 Nephi
    chapter: 4
    verse: 28
    ordinal: 103
    text: And it came to pass that when Laman saw me he was exceedingly frightened, and also Lemuel and Sam. And they fled from before my presence; for they supposed it was Laban, and that he had slain me and had sought to take away their lives also.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.29
    scripture: book-of-mormon
    name: 1 Nephi 4:29
    book: 1 Nephi
    chapter: 4
    verse: 29
    ordinal: 104
    text: And it came to pass that I called after them, and they did hear me; wherefore they did cease to flee from my presence.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.30
    scripture: book-of-mormon
    name: 1 Nephi 4:30
    book: 1 Nephi
    chapter: 4
    verse: 30
    ordinal: 105
    text: And it came to pass that when the servant of Laban beheld my brethren he began to tremble, and was about to flee from before me and return to the city of Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.31
    scripture: book-of-mormon
    name: 1 Nephi 4:31
    book: 1 Nephi
    chapter: 4
    verse: 31
    ordinal: 106
    text: And now I, Nephi, being a man large in stature, and also having received much strength of the Lord, therefore I did seize upon the servant of Laban, and held him, that he should not flee.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.32
    scripture: book-of-mormon
    name: 1 Nephi 4:32
    book: 1 Nephi
    chapter: 4
    verse: 32
    ordinal: 107
    text: And it came to pass that I spake with him, that if he would hearken unto my words, as the Lord liveth, and as I live, even so that if he would hearken unto our words, we would spare his life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.33
    scripture: book-of-mormon
    name: 1 Nephi 4:33
    book: 1 Nephi
    chapter: 4
    verse: 33
    ordinal: 108
    text: And I spake unto him, even with an oath, that he need not fear; that he should be a free man like unto us if he would go down in the wilderness with us.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.34
    scripture: book-of-mormon
    name: 1 Nephi 4:34
    book: 1 Nephi
    chapter: 4
    verse: 34
    ordinal: 109
    text: 'And I also spake unto him, saying: Surely the Lord hath commanded us to do this thing; and shall we not be diligent in keeping the commandments of the Lord? Therefore, if thou wilt go down into the wilderness to my father thou shalt have place with us.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.35
    scripture: book-of-mormon
    name: 1 Nephi 4:35
    book: 1 Nephi
    chapter: 4
    verse: 35
    ordinal: 110
    text: And it came to pass that Zoram did take courage at the words which I spake. Now Zoram was the name of the servant; and he promised that he would go down into the wilderness unto our father. Yea, and he also made an oath unto us that he would tarry with us from that time forth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.36
    scripture: book-of-mormon
    name: 1 Nephi 4:36
    book: 1 Nephi
    chapter: 4
    verse: 36
    ordinal: 111
    text: Now we were desirous that he should tarry with us for this cause, that the Jews might not know concerning our flight into the wilderness, lest they should pursue us and destroy us.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.37
    scripture: book-of-mormon
    name: 1 Nephi 4:37
    book: 1 Nephi
    chapter: 4
    verse: 37
    ordinal: 112
    text: And it came to pass that when Zoram had made an oath unto us, our fears did cease concerning him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.4.38
    scripture: book-of-mormon
    name: 1 Nephi 4:38
    book: 1 Nephi
    chapter: 4
    verse: 38
    ordinal: 113
    text: And it came to pass that we took the plates of brass and the servant of Laban, and departed into the wilderness, and journeyed unto the tent of our father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.4
- type: BomVerse
  data:
    ref: 1-nephi.5.1
    scripture: book-of-mormon
    name: 1 Nephi 5:1
    book: 1 Nephi
    chapter: 5
    verse: 1
    ordinal: 114
    text: And it came to pass that after we had come down into the wilderness unto our father, behold, he was filled with joy, and also my mother, Sariah, was exceedingly glad, for she truly had mourned because of us.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.2
    scripture: book-of-mormon
    name: 1 Nephi 5:2
    book: 1 Nephi
    chapter: 5
    verse: 2
    ordinal: 115
    text: 'For she had supposed that we had perished in the wilderness; and she also had complained against my father, telling him that he was a visionary man; saying: Behold thou hast led us forth from the land of our inheritance, and my sons are no more, and we perish in the wilderness.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.3
    scripture: book-of-mormon
    name: 1 Nephi 5:3
    book: 1 Nephi
    chapter: 5
    verse: 3
    ordinal: 116
    text: And after this manner of language had my mother complained against my father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.4
    scripture: book-of-mormon
    name: 1 Nephi 5:4
    book: 1 Nephi
    chapter: 5
    verse: 4
    ordinal: 117
    text: 'And it had come to pass that my father spake unto her, saying: I know that I am a visionary man; for if I had not seen the things of God in a vision I should not have known the goodness of God, but had tarried at Jerusalem, and had perished with my brethren.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.5
    scripture: book-of-mormon
    name: 1 Nephi 5:5
    book: 1 Nephi
    chapter: 5
    verse: 5
    ordinal: 118
    text: But behold, I have obtained a land of promise, in the which things I do rejoice; yea, and I know that the Lord will deliver my sons out of the hands of Laban, and bring them down again unto us in the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.6
    scripture: book-of-mormon
    name: 1 Nephi 5:6
    book: 1 Nephi
    chapter: 5
    verse: 6
    ordinal: 119
    text: And after this manner of language did my father, Lehi, comfort my mother, Sariah, concerning us, while we journeyed in the wilderness up to the land of Jerusalem, to obtain the record of the Jews.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.7
    scripture: book-of-mormon
    name: 1 Nephi 5:7
    book: 1 Nephi
    chapter: 5
    verse: 7
    ordinal: 120
    text: And when we had returned to the tent of my father, behold their joy was full, and my mother was comforted.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.8
    scripture: book-of-mormon
    name: 1 Nephi 5:8
    book: 1 Nephi
    chapter: 5
    verse: 8
    ordinal: 121
    text: 'And she spake, saying: Now I know of a surety that the Lord hath commanded my husband to flee into the wilderness; yea, and I also know of a surety that the Lord hath protected my sons, and delivered them out of the hands of Laban, and given them power whereby they could accomplish the thing which the Lord hath commanded them. And after this manner of language did she speak.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.9
    scripture: book-of-mormon
    name: 1 Nephi 5:9
    book: 1 Nephi
    chapter: 5
    verse: 9
    ordinal: 122
    text: And it came to pass that they did rejoice exceedingly, and did offer sacrifice and burnt offerings unto the Lord; and they gave thanks unto the God of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.10
    scripture: book-of-mormon
    name: 1 Nephi 5:10
    book: 1 Nephi
    chapter: 5
    verse: 10
    ordinal: 123
    text: And after they had given thanks unto the God of Israel, my father, Lehi, took the records which were engraven upon the plates of brass, and he did search them from the beginning.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.11
    scripture: book-of-mormon
    name: 1 Nephi 5:11
    book: 1 Nephi
    chapter: 5
    verse: 11
    ordinal: 124
    text: And he beheld that they did contain the five books of Moses, which gave an account of the creation of the world, and also of Adam and Eve, who were our first parents;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.12
    scripture: book-of-mormon
    name: 1 Nephi 5:12
    book: 1 Nephi
    chapter: 5
    verse: 12
    ordinal: 125
    text: And also a record of the Jews from the beginning, even down to the commencement of the reign of Zedekiah, king of Judah;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.13
    scripture: book-of-mormon
    name: 1 Nephi 5:13
    book: 1 Nephi
    chapter: 5
    verse: 13
    ordinal: 126
    text: And also the prophecies of the holy prophets, from the beginning, even down to the commencement of the reign of Zedekiah; and also many prophecies which have been spoken by the mouth of Jeremiah.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.14
    scripture: book-of-mormon
    name: 1 Nephi 5:14
    book: 1 Nephi
    chapter: 5
    verse: 14
    ordinal: 127
    text: And it came to pass that my father, Lehi, also found upon the plates of brass a genealogy of his fathers; wherefore he knew that he was a descendant of Joseph; yea, even that Joseph who was the son of Jacob, who was sold into Egypt, and who was preserved by the hand of the Lord, that he might preserve his father, Jacob, and all his household from perishing with famine.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.15
    scripture: book-of-mormon
    name: 1 Nephi 5:15
    book: 1 Nephi
    chapter: 5
    verse: 15
    ordinal: 128
    text: And they were also led out of captivity and out of the land of Egypt, by that same God who had preserved them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.16
    scripture: book-of-mormon
    name: 1 Nephi 5:16
    book: 1 Nephi
    chapter: 5
    verse: 16
    ordinal: 129
    text: And thus my father, Lehi, did discover the genealogy of his fathers. And Laban also was a descendant of Joseph, wherefore he and his fathers had kept the records.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.17
    scripture: book-of-mormon
    name: 1 Nephi 5:17
    book: 1 Nephi
    chapter: 5
    verse: 17
    ordinal: 130
    text: And now when my father saw all these things, he was filled with the Spirit, and began to prophesy concerning his seed—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.18
    scripture: book-of-mormon
    name: 1 Nephi 5:18
    book: 1 Nephi
    chapter: 5
    verse: 18
    ordinal: 131
    text: That these plates of brass should go forth unto all nations, kindreds, tongues, and people who were of his seed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.19
    scripture: book-of-mormon
    name: 1 Nephi 5:19
    book: 1 Nephi
    chapter: 5
    verse: 19
    ordinal: 132
    text: Wherefore, he said that these plates of brass should never perish; neither should they be dimmed any more by time. And he prophesied many things concerning his seed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.20
    scripture: book-of-mormon
    name: 1 Nephi 5:20
    book: 1 Nephi
    chapter: 5
    verse: 20
    ordinal: 133
    text: And it came to pass that thus far I and my father had kept the commandments wherewith the Lord had commanded us.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.21
    scripture: book-of-mormon
    name: 1 Nephi 5:21
    book: 1 Nephi
    chapter: 5
    verse: 21
    ordinal: 134
    text: And we had obtained the records which the Lord had commanded us, and searched them and found that they were desirable; yea, even of great worth unto us, insomuch that we could preserve the commandments of the Lord unto our children.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.5.22
    scripture: book-of-mormon
    name: 1 Nephi 5:22
    book: 1 Nephi
    chapter: 5
    verse: 22
    ordinal: 135
    text: Wherefore, it was wisdom in the Lord that we should carry them with us, as we journeyed in the wilderness towards the land of promise.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.5
- type: BomVerse
  data:
    ref: 1-nephi.6.1
    scripture: book-of-mormon
    name: 1 Nephi 6:1
    book: 1 Nephi
    chapter: 6
    verse: 1
    ordinal: 136
    text: And now I, Nephi, do not give the genealogy of my fathers in this part of my record; neither at any time shall I give it after upon these plates which I am writing; for it is given in the record which has been kept by my father; wherefore, I do not write it in this work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.6
- type: BomVerse
  data:
    ref: 1-nephi.6.2
    scripture: book-of-mormon
    name: 1 Nephi 6:2
    book: 1 Nephi
    chapter: 6
    verse: 2
    ordinal: 137
    text: For it sufficeth me to say that we are descendants of Joseph.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.6
- type: BomVerse
  data:
    ref: 1-nephi.6.3
    scripture: book-of-mormon
    name: 1 Nephi 6:3
    book: 1 Nephi
    chapter: 6
    verse: 3
    ordinal: 138
    text: And it mattereth not to me that I am particular to give a full account of all the things of my father, for they cannot be written upon these plates, for I desire the room that I may write of the things of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.6
- type: BomVerse
  data:
    ref: 1-nephi.6.4
    scripture: book-of-mormon
    name: 1 Nephi 6:4
    book: 1 Nephi
    chapter: 6
    verse: 4
    ordinal: 139
    text: For the fulness of mine intent is that I may persuade men to come unto the God of Abraham, and the God of Isaac, and the God of Jacob, and be saved.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.6
- type: BomVerse
  data:
    ref: 1-nephi.6.5
    scripture: book-of-mormon
    name: 1 Nephi 6:5
    book: 1 Nephi
    chapter: 6
    verse: 5
    ordinal: 140
    text: Wherefore, the things which are pleasing unto the world I do not write, but the things which are pleasing unto God and unto those who are not of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.6
- type: BomVerse
  data:
    ref: 1-nephi.6.6
    scripture: book-of-mormon
    name: 1 Nephi 6:6
    book: 1 Nephi
    chapter: 6
    verse: 6
    ordinal: 141
    text: Wherefore, I shall give commandment unto my seed, that they shall not occupy these plates with things which are not of worth unto the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.6
- type: BomVerse
  data:
    ref: 1-nephi.7.1
    scripture: book-of-mormon
    name: 1 Nephi 7:1
    book: 1 Nephi
    chapter: 7
    verse: 1
    ordinal: 142
    text: And now I would that ye might know, that after my father, Lehi, had made an end of prophesying concerning his seed, it came to pass that the Lord spake unto him again, saying that it was not meet for him, Lehi, that he should take his family into the wilderness alone; but that his sons should take daughters to wife, that they might raise up seed unto the Lord in the land of promise.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.2
    scripture: book-of-mormon
    name: 1 Nephi 7:2
    book: 1 Nephi
    chapter: 7
    verse: 2
    ordinal: 143
    text: And it came to pass that the Lord commanded him that I, Nephi, and my brethren, should again return unto the land of Jerusalem, and bring down Ishmael and his family into the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.3
    scripture: book-of-mormon
    name: 1 Nephi 7:3
    book: 1 Nephi
    chapter: 7
    verse: 3
    ordinal: 144
    text: And it came to pass that I, Nephi, did again, with my brethren, go forth into the wilderness to go up to Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.4
    scripture: book-of-mormon
    name: 1 Nephi 7:4
    book: 1 Nephi
    chapter: 7
    verse: 4
    ordinal: 145
    text: And it came to pass that we went up unto the house of Ishmael, and we did gain favor in the sight of Ishmael, insomuch that we did speak unto him the words of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.5
    scripture: book-of-mormon
    name: 1 Nephi 7:5
    book: 1 Nephi
    chapter: 7
    verse: 5
    ordinal: 146
    text: And it came to pass that the Lord did soften the heart of Ishmael, and also his household, insomuch that they took their journey with us down into the wilderness to the tent of our father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.6
    scripture: book-of-mormon
    name: 1 Nephi 7:6
    book: 1 Nephi
    chapter: 7
    verse: 6
    ordinal: 147
    text: And it came to pass that as we journeyed in the wilderness, behold Laman and Lemuel, and two of the daughters of Ishmael, and the two sons of Ishmael and their families, did rebel against us; yea, against me, Nephi, and Sam, and their father, Ishmael, and his wife, and his three other daughters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.7
    scripture: book-of-mormon
    name: 1 Nephi 7:7
    book: 1 Nephi
    chapter: 7
    verse: 7
    ordinal: 148
    text: And it came to pass in the which rebellion, they were desirous to return unto the land of Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.8
    scripture: book-of-mormon
    name: 1 Nephi 7:8
    book: 1 Nephi
    chapter: 7
    verse: 8
    ordinal: 149
    text: 'And now I, Nephi, being grieved for the hardness of their hearts, therefore I spake unto them, saying, yea, even unto Laman and unto Lemuel: Behold ye are mine elder brethren, and how is it that ye are so hard in your hearts, and so blind in your minds, that ye have need that I, your younger brother, should speak unto you, yea, and set an example for you?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.9
    scripture: book-of-mormon
    name: 1 Nephi 7:9
    book: 1 Nephi
    chapter: 7
    verse: 9
    ordinal: 150
    text: How is it that ye have not hearkened unto the word of the Lord?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.10
    scripture: book-of-mormon
    name: 1 Nephi 7:10
    book: 1 Nephi
    chapter: 7
    verse: 10
    ordinal: 151
    text: How is it that ye have forgotten that ye have seen an angel of the Lord?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.11
    scripture: book-of-mormon
    name: 1 Nephi 7:11
    book: 1 Nephi
    chapter: 7
    verse: 11
    ordinal: 152
    text: Yea, and how is it that ye have forgotten what great things the Lord hath done for us, in delivering us out of the hands of Laban, and also that we should obtain the record?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.12
    scripture: book-of-mormon
    name: 1 Nephi 7:12
    book: 1 Nephi
    chapter: 7
    verse: 12
    ordinal: 153
    text: Yea, and how is it that ye have forgotten that the Lord is able to do all things according to his will, for the children of men, if it so be that they exercise faith in him? Wherefore, let us be faithful to him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.13
    scripture: book-of-mormon
    name: 1 Nephi 7:13
    book: 1 Nephi
    chapter: 7
    verse: 13
    ordinal: 154
    text: And if it so be that we are faithful to him, we shall obtain the land of promise; and ye shall know at some future period that the word of the Lord shall be fulfilled concerning the destruction of Jerusalem; for all things which the Lord hath spoken concerning the destruction of Jerusalem must be fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.14
    scripture: book-of-mormon
    name: 1 Nephi 7:14
    book: 1 Nephi
    chapter: 7
    verse: 14
    ordinal: 155
    text: For behold, the Spirit of the Lord ceaseth soon to strive with them; for behold, they have rejected the prophets, and Jeremiah have they cast into prison. And they have sought to take away the life of my father, insomuch that they have driven him out of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.15
    scripture: book-of-mormon
    name: 1 Nephi 7:15
    book: 1 Nephi
    chapter: 7
    verse: 15
    ordinal: 156
    text: Now behold, I say unto you that if ye will return unto Jerusalem ye shall also perish with them. And now, if ye have choice, go up to the land, and remember the words which I speak unto you, that if ye go ye will also perish; for thus the Spirit of the Lord constraineth me that I should speak.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.16
    scripture: book-of-mormon
    name: 1 Nephi 7:16
    book: 1 Nephi
    chapter: 7
    verse: 16
    ordinal: 157
    text: And it came to pass that when I, Nephi, had spoken these words unto my brethren, they were angry with me. And it came to pass that they did lay their hands upon me, for behold, they were exceedingly wroth, and they did bind me with cords, for they sought to take away my life, that they might leave me in the wilderness to be devoured by wild beasts.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.17
    scripture: book-of-mormon
    name: 1 Nephi 7:17
    book: 1 Nephi
    chapter: 7
    verse: 17
    ordinal: 158
    text: 'But it came to pass that I prayed unto the Lord, saying: O Lord, according to my faith which is in thee, wilt thou deliver me from the hands of my brethren; yea, even give me strength that I may burst these bands with which I am bound.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.18
    scripture: book-of-mormon
    name: 1 Nephi 7:18
    book: 1 Nephi
    chapter: 7
    verse: 18
    ordinal: 159
    text: And it came to pass that when I had said these words, behold, the bands were loosed from off my hands and feet, and I stood before my brethren, and I spake unto them again.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.19
    scripture: book-of-mormon
    name: 1 Nephi 7:19
    book: 1 Nephi
    chapter: 7
    verse: 19
    ordinal: 160
    text: And it came to pass that they were angry with me again, and sought to lay hands upon me; but behold, one of the daughters of Ishmael, yea, and also her mother, and one of the sons of Ishmael, did plead with my brethren, insomuch that they did soften their hearts; and they did cease striving to take away my life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.20
    scripture: book-of-mormon
    name: 1 Nephi 7:20
    book: 1 Nephi
    chapter: 7
    verse: 20
    ordinal: 161
    text: And it came to pass that they were sorrowful, because of their wickedness, insomuch that they did bow down before me, and did plead with me that I would forgive them of the thing that they had done against me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.21
    scripture: book-of-mormon
    name: 1 Nephi 7:21
    book: 1 Nephi
    chapter: 7
    verse: 21
    ordinal: 162
    text: And it came to pass that I did frankly forgive them all that they had done, and I did exhort them that they would pray unto the Lord their God for forgiveness. And it came to pass that they did so. And after they had done praying unto the Lord we did again travel on our journey towards the tent of our father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.7.22
    scripture: book-of-mormon
    name: 1 Nephi 7:22
    book: 1 Nephi
    chapter: 7
    verse: 22
    ordinal: 163
    text: And it came to pass that we did come down unto the tent of our father. And after I and my brethren and all the house of Ishmael had come down unto the tent of my father, they did give thanks unto the Lord their God; and they did offer sacrifice and burnt offerings unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.7
- type: BomVerse
  data:
    ref: 1-nephi.8.1
    scripture: book-of-mormon
    name: 1 Nephi 8:1
    book: 1 Nephi
    chapter: 8
    verse: 1
    ordinal: 164
    text: And it came to pass that we had gathered together all manner of seeds of every kind, both of grain of every kind, and also of the seeds of fruit of every kind.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.2
    scripture: book-of-mormon
    name: 1 Nephi 8:2
    book: 1 Nephi
    chapter: 8
    verse: 2
    ordinal: 165
    text: 'And it came to pass that while my father tarried in the wilderness he spake unto us, saying: Behold, I have dreamed a dream; or, in other words, I have seen a vision.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.3
    scripture: book-of-mormon
    name: 1 Nephi 8:3
    book: 1 Nephi
    chapter: 8
    verse: 3
    ordinal: 166
    text: And behold, because of the thing which I have seen, I have reason to rejoice in the Lord because of Nephi and also of Sam; for I have reason to suppose that they, and also many of their seed, will be saved.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.4
    scripture: book-of-mormon
    name: 1 Nephi 8:4
    book: 1 Nephi
    chapter: 8
    verse: 4
    ordinal: 167
    text: But behold, Laman and Lemuel, I fear exceedingly because of you; for behold, methought I saw in my dream, a dark and dreary wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.5
    scripture: book-of-mormon
    name: 1 Nephi 8:5
    book: 1 Nephi
    chapter: 8
    verse: 5
    ordinal: 168
    text: And it came to pass that I saw a man, and he was dressed in a white robe; and he came and stood before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.6
    scripture: book-of-mormon
    name: 1 Nephi 8:6
    book: 1 Nephi
    chapter: 8
    verse: 6
    ordinal: 169
    text: And it came to pass that he spake unto me, and bade me follow him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.7
    scripture: book-of-mormon
    name: 1 Nephi 8:7
    book: 1 Nephi
    chapter: 8
    verse: 7
    ordinal: 170
    text: And it came to pass that as I followed him I beheld myself that I was in a dark and dreary waste.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.8
    scripture: book-of-mormon
    name: 1 Nephi 8:8
    book: 1 Nephi
    chapter: 8
    verse: 8
    ordinal: 171
    text: And after I had traveled for the space of many hours in darkness, I began to pray unto the Lord that he would have mercy on me, according to the multitude of his tender mercies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.9
    scripture: book-of-mormon
    name: 1 Nephi 8:9
    book: 1 Nephi
    chapter: 8
    verse: 9
    ordinal: 172
    text: And it came to pass after I had prayed unto the Lord I beheld a large and spacious field.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.10
    scripture: book-of-mormon
    name: 1 Nephi 8:10
    book: 1 Nephi
    chapter: 8
    verse: 10
    ordinal: 173
    text: And it came to pass that I beheld a tree, whose fruit was desirable to make one happy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.11
    scripture: book-of-mormon
    name: 1 Nephi 8:11
    book: 1 Nephi
    chapter: 8
    verse: 11
    ordinal: 174
    text: And it came to pass that I did go forth and partake of the fruit thereof; and I beheld that it was most sweet, above all that I ever before tasted. Yea, and I beheld that the fruit thereof was white, to exceed all the whiteness that I had ever seen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.12
    scripture: book-of-mormon
    name: 1 Nephi 8:12
    book: 1 Nephi
    chapter: 8
    verse: 12
    ordinal: 175
    text: And as I partook of the fruit thereof it filled my soul with exceedingly great joy; wherefore, I began to be desirous that my family should partake of it also; for I knew that it was desirable above all other fruit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.13
    scripture: book-of-mormon
    name: 1 Nephi 8:13
    book: 1 Nephi
    chapter: 8
    verse: 13
    ordinal: 176
    text: And as I cast my eyes round about, that perhaps I might discover my family also, I beheld a river of water; and it ran along, and it was near the tree of which I was partaking the fruit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.14
    scripture: book-of-mormon
    name: 1 Nephi 8:14
    book: 1 Nephi
    chapter: 8
    verse: 14
    ordinal: 177
    text: And I looked to behold from whence it came; and I saw the head thereof a little way off; and at the head thereof I beheld your mother Sariah, and Sam, and Nephi; and they stood as if they knew not whither they should go.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.15
    scripture: book-of-mormon
    name: 1 Nephi 8:15
    book: 1 Nephi
    chapter: 8
    verse: 15
    ordinal: 178
    text: And it came to pass that I beckoned unto them; and I also did say unto them with a loud voice that they should come unto me, and partake of the fruit, which was desirable above all other fruit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.16
    scripture: book-of-mormon
    name: 1 Nephi 8:16
    book: 1 Nephi
    chapter: 8
    verse: 16
    ordinal: 179
    text: And it came to pass that they did come unto me and partake of the fruit also.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.17
    scripture: book-of-mormon
    name: 1 Nephi 8:17
    book: 1 Nephi
    chapter: 8
    verse: 17
    ordinal: 180
    text: And it came to pass that I was desirous that Laman and Lemuel should come and partake of the fruit also; wherefore, I cast mine eyes towards the head of the river, that perhaps I might see them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.18
    scripture: book-of-mormon
    name: 1 Nephi 8:18
    book: 1 Nephi
    chapter: 8
    verse: 18
    ordinal: 181
    text: And it came to pass that I saw them, but they would not come unto me and partake of the fruit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.19
    scripture: book-of-mormon
    name: 1 Nephi 8:19
    book: 1 Nephi
    chapter: 8
    verse: 19
    ordinal: 182
    text: And I beheld a rod of iron, and it extended along the bank of the river, and led to the tree by which I stood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.20
    scripture: book-of-mormon
    name: 1 Nephi 8:20
    book: 1 Nephi
    chapter: 8
    verse: 20
    ordinal: 183
    text: And I also beheld a strait and narrow path, which came along by the rod of iron, even to the tree by which I stood; and it also led by the head of the fountain, unto a large and spacious field, as if it had been a world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.21
    scripture: book-of-mormon
    name: 1 Nephi 8:21
    book: 1 Nephi
    chapter: 8
    verse: 21
    ordinal: 184
    text: And I saw numberless concourses of people, many of whom were pressing forward, that they might obtain the path which led unto the tree by which I stood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.22
    scripture: book-of-mormon
    name: 1 Nephi 8:22
    book: 1 Nephi
    chapter: 8
    verse: 22
    ordinal: 185
    text: And it came to pass that they did come forth, and commence in the path which led to the tree.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.23
    scripture: book-of-mormon
    name: 1 Nephi 8:23
    book: 1 Nephi
    chapter: 8
    verse: 23
    ordinal: 186
    text: And it came to pass that there arose a mist of darkness; yea, even an exceedingly great mist of darkness, insomuch that they who had commenced in the path did lose their way, that they wandered off and were lost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.24
    scripture: book-of-mormon
    name: 1 Nephi 8:24
    book: 1 Nephi
    chapter: 8
    verse: 24
    ordinal: 187
    text: And it came to pass that I beheld others pressing forward, and they came forth and caught hold of the end of the rod of iron; and they did press forward through the mist of darkness, clinging to the rod of iron, even until they did come forth and partake of the fruit of the tree.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.25
    scripture: book-of-mormon
    name: 1 Nephi 8:25
    book: 1 Nephi
    chapter: 8
    verse: 25
    ordinal: 188
    text: And after they had partaken of the fruit of the tree they did cast their eyes about as if they were ashamed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.26
    scripture: book-of-mormon
    name: 1 Nephi 8:26
    book: 1 Nephi
    chapter: 8
    verse: 26
    ordinal: 189
    text: And I also cast my eyes round about, and beheld, on the other side of the river of water, a great and spacious building; and it stood as it were in the air, high above the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.27
    scripture: book-of-mormon
    name: 1 Nephi 8:27
    book: 1 Nephi
    chapter: 8
    verse: 27
    ordinal: 190
    text: And it was filled with people, both old and young, both male and female; and their manner of dress was exceedingly fine; and they were in the attitude of mocking and pointing their fingers towards those who had come at and were partaking of the fruit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.28
    scripture: book-of-mormon
    name: 1 Nephi 8:28
    book: 1 Nephi
    chapter: 8
    verse: 28
    ordinal: 191
    text: And after they had tasted of the fruit they were ashamed, because of those that were scoffing at them; and they fell away into forbidden paths and were lost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.29
    scripture: book-of-mormon
    name: 1 Nephi 8:29
    book: 1 Nephi
    chapter: 8
    verse: 29
    ordinal: 192
    text: And now I, Nephi, do not speak all the words of my father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.30
    scripture: book-of-mormon
    name: 1 Nephi 8:30
    book: 1 Nephi
    chapter: 8
    verse: 30
    ordinal: 193
    text: But, to be short in writing, behold, he saw other multitudes pressing forward; and they came and caught hold of the end of the rod of iron; and they did press their way forward, continually holding fast to the rod of iron, until they came forth and fell down and partook of the fruit of the tree.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.31
    scripture: book-of-mormon
    name: 1 Nephi 8:31
    book: 1 Nephi
    chapter: 8
    verse: 31
    ordinal: 194
    text: And he also saw other multitudes feeling their way towards that great and spacious building.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.32
    scripture: book-of-mormon
    name: 1 Nephi 8:32
    book: 1 Nephi
    chapter: 8
    verse: 32
    ordinal: 195
    text: And it came to pass that many were drowned in the depths of the fountain; and many were lost from his view, wandering in strange roads.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.33
    scripture: book-of-mormon
    name: 1 Nephi 8:33
    book: 1 Nephi
    chapter: 8
    verse: 33
    ordinal: 196
    text: And great was the multitude that did enter into that strange building. And after they did enter into that building they did point the finger of scorn at me and those that were partaking of the fruit also; but we heeded them not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.34
    scripture: book-of-mormon
    name: 1 Nephi 8:34
    book: 1 Nephi
    chapter: 8
    verse: 34
    ordinal: 197
    text: 'These are the words of my father: For as many as heeded them, had fallen away.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.35
    scripture: book-of-mormon
    name: 1 Nephi 8:35
    book: 1 Nephi
    chapter: 8
    verse: 35
    ordinal: 198
    text: And Laman and Lemuel partook not of the fruit, said my father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.36
    scripture: book-of-mormon
    name: 1 Nephi 8:36
    book: 1 Nephi
    chapter: 8
    verse: 36
    ordinal: 199
    text: And it came to pass after my father had spoken all the words of his dream or vision, which were many, he said unto us, because of these things which he saw in a vision, he exceedingly feared for Laman and Lemuel; yea, he feared lest they should be cast off from the presence of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.37
    scripture: book-of-mormon
    name: 1 Nephi 8:37
    book: 1 Nephi
    chapter: 8
    verse: 37
    ordinal: 200
    text: And he did exhort them then with all the feeling of a tender parent, that they would hearken to his words, that perhaps the Lord would be merciful to them, and not cast them off; yea, my father did preach unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.8.38
    scripture: book-of-mormon
    name: 1 Nephi 8:38
    book: 1 Nephi
    chapter: 8
    verse: 38
    ordinal: 201
    text: And after he had preached unto them, and also prophesied unto them of many things, he bade them to keep the commandments of the Lord; and he did cease speaking unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.8
- type: BomVerse
  data:
    ref: 1-nephi.9.1
    scripture: book-of-mormon
    name: 1 Nephi 9:1
    book: 1 Nephi
    chapter: 9
    verse: 1
    ordinal: 202
    text: And all these things did my father see, and hear, and speak, as he dwelt in a tent, in the valley of Lemuel, and also a great many more things, which cannot be written upon these plates.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.9
- type: BomVerse
  data:
    ref: 1-nephi.9.2
    scripture: book-of-mormon
    name: 1 Nephi 9:2
    book: 1 Nephi
    chapter: 9
    verse: 2
    ordinal: 203
    text: And now, as I have spoken concerning these plates, behold they are not the plates upon which I make a full account of the history of my people; for the plates upon which I make a full account of my people I have given the name of Nephi; wherefore, they are called the plates of Nephi, after mine own name; and these plates also are called the plates of Nephi.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.9
- type: BomVerse
  data:
    ref: 1-nephi.9.3
    scripture: book-of-mormon
    name: 1 Nephi 9:3
    book: 1 Nephi
    chapter: 9
    verse: 3
    ordinal: 204
    text: Nevertheless, I have received a commandment of the Lord that I should make these plates, for the special purpose that there should be an account engraven of the ministry of my people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.9
- type: BomVerse
  data:
    ref: 1-nephi.9.4
    scripture: book-of-mormon
    name: 1 Nephi 9:4
    book: 1 Nephi
    chapter: 9
    verse: 4
    ordinal: 205
    text: Upon the other plates should be engraven an account of the reign of the kings, and the wars and contentions of my people; wherefore these plates are for the more part of the ministry; and the other plates are for the more part of the reign of the kings and the wars and contentions of my people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.9
- type: BomVerse
  data:
    ref: 1-nephi.9.5
    scripture: book-of-mormon
    name: 1 Nephi 9:5
    book: 1 Nephi
    chapter: 9
    verse: 5
    ordinal: 206
    text: Wherefore, the Lord hath commanded me to make these plates for a wise purpose in him, which purpose I know not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.9
- type: BomVerse
  data:
    ref: 1-nephi.9.6
    scripture: book-of-mormon
    name: 1 Nephi 9:6
    book: 1 Nephi
    chapter: 9
    verse: 6
    ordinal: 207
    text: But the Lord knoweth all things from the beginning; wherefore, he prepareth a way to accomplish all his works among the children of men; for behold, he hath all power unto the fulfilling of all his words. And thus it is. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.9
- type: BomVerse
  data:
    ref: 1-nephi.10.1
    scripture: book-of-mormon
    name: 1 Nephi 10:1
    book: 1 Nephi
    chapter: 10
    verse: 1
    ordinal: 208
    text: And now I, Nephi, proceed to give an account upon these plates of my proceedings, and my reign and ministry; wherefore, to proceed with mine account, I must speak somewhat of the things of my father, and also of my brethren.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.2
    scripture: book-of-mormon
    name: 1 Nephi 10:2
    book: 1 Nephi
    chapter: 10
    verse: 2
    ordinal: 209
    text: For behold, it came to pass after my father had made an end of speaking the words of his dream, and also of exhorting them to all diligence, he spake unto them concerning the Jews—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.3
    scripture: book-of-mormon
    name: 1 Nephi 10:3
    book: 1 Nephi
    chapter: 10
    verse: 3
    ordinal: 210
    text: That after they should be destroyed, even that great city Jerusalem, and many be carried away captive into Babylon, according to the own due time of the Lord, they should return again, yea, even be brought back out of captivity; and after they should be brought back out of captivity they should possess again the land of their inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.4
    scripture: book-of-mormon
    name: 1 Nephi 10:4
    book: 1 Nephi
    chapter: 10
    verse: 4
    ordinal: 211
    text: Yea, even six hundred years from the time that my father left Jerusalem, a prophet would the Lord God raise up among the Jews—even a Messiah, or, in other words, a Savior of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.5
    scripture: book-of-mormon
    name: 1 Nephi 10:5
    book: 1 Nephi
    chapter: 10
    verse: 5
    ordinal: 212
    text: And he also spake concerning the prophets, how great a number had testified of these things, concerning this Messiah, of whom he had spoken, or this Redeemer of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.6
    scripture: book-of-mormon
    name: 1 Nephi 10:6
    book: 1 Nephi
    chapter: 10
    verse: 6
    ordinal: 213
    text: Wherefore, all mankind were in a lost and in a fallen state, and ever would be save they should rely on this Redeemer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.7
    scripture: book-of-mormon
    name: 1 Nephi 10:7
    book: 1 Nephi
    chapter: 10
    verse: 7
    ordinal: 214
    text: And he spake also concerning a prophet who should come before the Messiah, to prepare the way of the Lord—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.8
    scripture: book-of-mormon
    name: 1 Nephi 10:8
    book: 1 Nephi
    chapter: 10
    verse: 8
    ordinal: 215
    text: 'Yea, even he should go forth and cry in the wilderness: Prepare ye the way of the Lord, and make his paths straight; for there standeth one among you whom ye know not; and he is mightier than I, whose shoe''s latchet I am not worthy to unloose. And much spake my father concerning this thing.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.9
    scripture: book-of-mormon
    name: 1 Nephi 10:9
    book: 1 Nephi
    chapter: 10
    verse: 9
    ordinal: 216
    text: And my father said he should baptize in Bethabara, beyond Jordan; and he also said he should baptize with water; even that he should baptize the Messiah with water.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.10
    scripture: book-of-mormon
    name: 1 Nephi 10:10
    book: 1 Nephi
    chapter: 10
    verse: 10
    ordinal: 217
    text: And after he had baptized the Messiah with water, he should behold and bear record that he had baptized the Lamb of God, who should take away the sins of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.11
    scripture: book-of-mormon
    name: 1 Nephi 10:11
    book: 1 Nephi
    chapter: 10
    verse: 11
    ordinal: 218
    text: And it came to pass after my father had spoken these words he spake unto my brethren concerning the gospel which should be preached among the Jews, and also concerning the dwindling of the Jews in unbelief. And after they had slain the Messiah, who should come, and after he had been slain he should rise from the dead, and should make himself manifest, by the Holy Ghost, unto the Gentiles.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.12
    scripture: book-of-mormon
    name: 1 Nephi 10:12
    book: 1 Nephi
    chapter: 10
    verse: 12
    ordinal: 219
    text: Yea, even my father spake much concerning the Gentiles, and also concerning the house of Israel, that they should be compared like unto an olive tree, whose branches should be broken off and should be scattered upon all the face of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.13
    scripture: book-of-mormon
    name: 1 Nephi 10:13
    book: 1 Nephi
    chapter: 10
    verse: 13
    ordinal: 220
    text: Wherefore, he said it must needs be that we should be led with one accord into the land of promise, unto the fulfilling of the word of the Lord, that we should be scattered upon all the face of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.14
    scripture: book-of-mormon
    name: 1 Nephi 10:14
    book: 1 Nephi
    chapter: 10
    verse: 14
    ordinal: 221
    text: And after the house of Israel should be scattered they should be gathered together again; or, in fine, after the Gentiles had received the fulness of the Gospel, the natural branches of the olive tree, or the remnants of the house of Israel, should be grafted in, or come to the knowledge of the true Messiah, their Lord and their Redeemer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.15
    scripture: book-of-mormon
    name: 1 Nephi 10:15
    book: 1 Nephi
    chapter: 10
    verse: 15
    ordinal: 222
    text: And after this manner of language did my father prophesy and speak unto my brethren, and also many more things which I do not write in this book; for I have written as many of them as were expedient for me in mine other book.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.16
    scripture: book-of-mormon
    name: 1 Nephi 10:16
    book: 1 Nephi
    chapter: 10
    verse: 16
    ordinal: 223
    text: And all these things, of which I have spoken, were done as my father dwelt in a tent, in the valley of Lemuel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.17
    scripture: book-of-mormon
    name: 1 Nephi 10:17
    book: 1 Nephi
    chapter: 10
    verse: 17
    ordinal: 224
    text: And it came to pass after I, Nephi, having heard all the words of my father, concerning the things which he saw in a vision, and also the things which he spake by the power of the Holy Ghost, which power he received by faith on the Son of God—and the Son of God was the Messiah who should come—I, Nephi, was desirous also that I might see, and hear, and know of these things, by the power of the Holy Ghost, which is the gift of God unto all those who diligently seek him, as well in times of old as in the time that he should manifest himself unto the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.18
    scripture: book-of-mormon
    name: 1 Nephi 10:18
    book: 1 Nephi
    chapter: 10
    verse: 18
    ordinal: 225
    text: For he is the same yesterday, today, and forever; and the way is prepared for all men from the foundation of the world, if it so be that they repent and come unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.19
    scripture: book-of-mormon
    name: 1 Nephi 10:19
    book: 1 Nephi
    chapter: 10
    verse: 19
    ordinal: 226
    text: For he that diligently seeketh shall find; and the mysteries of God shall be unfolded unto them, by the power of the Holy Ghost, as well in these times as in times of old, and as well in times of old as in times to come; wherefore, the course of the Lord is one eternal round.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.20
    scripture: book-of-mormon
    name: 1 Nephi 10:20
    book: 1 Nephi
    chapter: 10
    verse: 20
    ordinal: 227
    text: Therefore remember, O man, for all thy doings thou shalt be brought into judgment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.21
    scripture: book-of-mormon
    name: 1 Nephi 10:21
    book: 1 Nephi
    chapter: 10
    verse: 21
    ordinal: 228
    text: Wherefore, if ye have sought to do wickedly in the days of your probation, then ye are found unclean before the judgment-seat of God; and no unclean thing can dwell with God; wherefore, ye must be cast off forever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.10.22
    scripture: book-of-mormon
    name: 1 Nephi 10:22
    book: 1 Nephi
    chapter: 10
    verse: 22
    ordinal: 229
    text: And the Holy Ghost giveth authority that I should speak these things, and deny them not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.10
- type: BomVerse
  data:
    ref: 1-nephi.11.1
    scripture: book-of-mormon
    name: 1 Nephi 11:1
    book: 1 Nephi
    chapter: 11
    verse: 1
    ordinal: 230
    text: For it came to pass after I had desired to know the things that my father had seen, and believing that the Lord was able to make them known unto me, as I sat pondering in mine heart I was caught away in the Spirit of the Lord, yea, into an exceedingly high mountain, which I never had before seen, and upon which I never had before set my foot.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.2
    scripture: book-of-mormon
    name: 1 Nephi 11:2
    book: 1 Nephi
    chapter: 11
    verse: 2
    ordinal: 231
    text: 'And the Spirit said unto me: Behold, what desirest thou?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.3
    scripture: book-of-mormon
    name: 1 Nephi 11:3
    book: 1 Nephi
    chapter: 11
    verse: 3
    ordinal: 232
    text: 'And I said: I desire to behold the things which my father saw.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.4
    scripture: book-of-mormon
    name: 1 Nephi 11:4
    book: 1 Nephi
    chapter: 11
    verse: 4
    ordinal: 233
    text: 'And the Spirit said unto me: Believest thou that thy father saw the tree of which he hath spoken?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.5
    scripture: book-of-mormon
    name: 1 Nephi 11:5
    book: 1 Nephi
    chapter: 11
    verse: 5
    ordinal: 234
    text: 'And I said: Yea, thou knowest that I believe all the words of my father.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.6
    scripture: book-of-mormon
    name: 1 Nephi 11:6
    book: 1 Nephi
    chapter: 11
    verse: 6
    ordinal: 235
    text: 'And when I had spoken these words, the Spirit cried with a loud voice, saying: Hosanna to the Lord, the most high God; for he is God over all the earth, yea, even above all. And blessed art thou, Nephi, because thou believest in the Son of the most high God; wherefore, thou shalt behold the things which thou hast desired.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.7
    scripture: book-of-mormon
    name: 1 Nephi 11:7
    book: 1 Nephi
    chapter: 11
    verse: 7
    ordinal: 236
    text: And behold this thing shall be given unto thee for a sign, that after thou hast beheld the tree which bore the fruit which thy father tasted, thou shalt also behold a man descending out of heaven, and him shall ye witness; and after ye have witnessed him ye shall bear record that it is the Son of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.8
    scripture: book-of-mormon
    name: 1 Nephi 11:8
    book: 1 Nephi
    chapter: 11
    verse: 8
    ordinal: 237
    text: 'And it came to pass that the Spirit said unto me: Look! And I looked and beheld a tree; and it was like unto the tree which my father had seen; and the beauty thereof was far beyond, yea, exceeding of all beauty; and the whiteness thereof did exceed the whiteness of the driven snow.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.9
    scripture: book-of-mormon
    name: 1 Nephi 11:9
    book: 1 Nephi
    chapter: 11
    verse: 9
    ordinal: 238
    text: 'And it came to pass after I had seen the tree, I said unto the Spirit: I behold thou hast shown unto me the tree which is precious above all.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.10
    scripture: book-of-mormon
    name: 1 Nephi 11:10
    book: 1 Nephi
    chapter: 11
    verse: 10
    ordinal: 239
    text: 'And he said unto me: What desirest thou?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.11
    scripture: book-of-mormon
    name: 1 Nephi 11:11
    book: 1 Nephi
    chapter: 11
    verse: 11
    ordinal: 240
    text: 'And I said unto him: To know the interpretation thereof—for I spake unto him as a man speaketh; for I beheld that he was in the form of a man; yet nevertheless, I knew that it was the Spirit of the Lord; and he spake unto me as a man speaketh with another.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.12
    scripture: book-of-mormon
    name: 1 Nephi 11:12
    book: 1 Nephi
    chapter: 11
    verse: 12
    ordinal: 241
    text: 'And it came to pass that he said unto me: Look! And I looked as if to look upon him, and I saw him not; for he had gone from before my presence.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.13
    scripture: book-of-mormon
    name: 1 Nephi 11:13
    book: 1 Nephi
    chapter: 11
    verse: 13
    ordinal: 242
    text: And it came to pass that I looked and beheld the great city of Jerusalem, and also other cities. And I beheld the city of Nazareth; and in the city of Nazareth I beheld a virgin, and she was exceedingly fair and white.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.14
    scripture: book-of-mormon
    name: 1 Nephi 11:14
    book: 1 Nephi
    chapter: 11
    verse: 14
    ordinal: 243
    text: 'And it came to pass that I saw the heavens open; and an angel came down and stood before me; and he said unto me: Nephi, what beholdest thou?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.15
    scripture: book-of-mormon
    name: 1 Nephi 11:15
    book: 1 Nephi
    chapter: 11
    verse: 15
    ordinal: 244
    text: 'And I said unto him: A virgin, most beautiful and fair above all other virgins.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.16
    scripture: book-of-mormon
    name: 1 Nephi 11:16
    book: 1 Nephi
    chapter: 11
    verse: 16
    ordinal: 245
    text: 'And he said unto me: Knowest thou the condescension of God?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.17
    scripture: book-of-mormon
    name: 1 Nephi 11:17
    book: 1 Nephi
    chapter: 11
    verse: 17
    ordinal: 246
    text: 'And I said unto him: I know that he loveth his children; nevertheless, I do not know the meaning of all things.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.18
    scripture: book-of-mormon
    name: 1 Nephi 11:18
    book: 1 Nephi
    chapter: 11
    verse: 18
    ordinal: 247
    text: 'And he said unto me: Behold, the virgin whom thou seest is the mother of the Son of God, after the manner of the flesh.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.19
    scripture: book-of-mormon
    name: 1 Nephi 11:19
    book: 1 Nephi
    chapter: 11
    verse: 19
    ordinal: 248
    text: 'And it came to pass that I beheld that she was carried away in the Spirit; and after she had been carried away in the Spirit for the space of a time the angel spake unto me, saying: Look!'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.20
    scripture: book-of-mormon
    name: 1 Nephi 11:20
    book: 1 Nephi
    chapter: 11
    verse: 20
    ordinal: 249
    text: And I looked and beheld the virgin again, bearing a child in her arms.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.21
    scripture: book-of-mormon
    name: 1 Nephi 11:21
    book: 1 Nephi
    chapter: 11
    verse: 21
    ordinal: 250
    text: 'And the angel said unto me: Behold the Lamb of God, yea, even the Son of the Eternal Father! Knowest thou the meaning of the tree which thy father saw?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.22
    scripture: book-of-mormon
    name: 1 Nephi 11:22
    book: 1 Nephi
    chapter: 11
    verse: 22
    ordinal: 251
    text: 'And I answered him, saying: Yea, it is the love of God, which sheddeth itself abroad in the hearts of the children of men; wherefore, it is the most desirable above all things.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.23
    scripture: book-of-mormon
    name: 1 Nephi 11:23
    book: 1 Nephi
    chapter: 11
    verse: 23
    ordinal: 252
    text: 'And he spake unto me, saying: Yea, and the most joyous to the soul.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.24
    scripture: book-of-mormon
    name: 1 Nephi 11:24
    book: 1 Nephi
    chapter: 11
    verse: 24
    ordinal: 253
    text: 'And after he had said these words, he said unto me: Look! And I looked, and I beheld the Son of God going forth among the children of men; and I saw many fall down at his feet and worship him.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.25
    scripture: book-of-mormon
    name: 1 Nephi 11:25
    book: 1 Nephi
    chapter: 11
    verse: 25
    ordinal: 254
    text: And it came to pass that I beheld that the rod of iron, which my father had seen, was the word of God, which led to the fountain of living waters, or to the tree of life; which waters are a representation of the love of God; and I also beheld that the tree of life was a representation of the love of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.26
    scripture: book-of-mormon
    name: 1 Nephi 11:26
    book: 1 Nephi
    chapter: 11
    verse: 26
    ordinal: 255
    text: 'And the angel said unto me again: Look and behold the condescension of God!'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.27
    scripture: book-of-mormon
    name: 1 Nephi 11:27
    book: 1 Nephi
    chapter: 11
    verse: 27
    ordinal: 256
    text: And I looked and beheld the Redeemer of the world, of whom my father had spoken; and I also beheld the prophet who should prepare the way before him. And the Lamb of God went forth and was baptized of him; and after he was baptized, I beheld the heavens open, and the Holy Ghost come down out of heaven and abide upon him in the form of a dove.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.28
    scripture: book-of-mormon
    name: 1 Nephi 11:28
    book: 1 Nephi
    chapter: 11
    verse: 28
    ordinal: 257
    text: And I beheld that he went forth ministering unto the people, in power and great glory; and the multitudes were gathered together to hear him; and I beheld that they cast him out from among them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.29
    scripture: book-of-mormon
    name: 1 Nephi 11:29
    book: 1 Nephi
    chapter: 11
    verse: 29
    ordinal: 258
    text: And I also beheld twelve others following him. And it came to pass that they were carried away in the Spirit from before my face, and I saw them not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.30
    scripture: book-of-mormon
    name: 1 Nephi 11:30
    book: 1 Nephi
    chapter: 11
    verse: 30
    ordinal: 259
    text: 'And it came to pass that the angel spake unto me again, saying: Look! And I looked, and I beheld the heavens open again, and I saw angels descending upon the children of men; and they did minister unto them.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.31
    scripture: book-of-mormon
    name: 1 Nephi 11:31
    book: 1 Nephi
    chapter: 11
    verse: 31
    ordinal: 260
    text: 'And he spake unto me again, saying: Look! And I looked, and I beheld the Lamb of God going forth among the children of men. And I beheld multitudes of people who were sick, and who were afflicted with all manner of diseases, and with devils and unclean spirits; and the angel spake and showed all these things unto me. And they were healed by the power of the Lamb of God; and the devils and the unclean spirits were cast out.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.32
    scripture: book-of-mormon
    name: 1 Nephi 11:32
    book: 1 Nephi
    chapter: 11
    verse: 32
    ordinal: 261
    text: 'And it came to pass that the angel spake unto me again, saying: Look! And I looked and beheld the Lamb of God, that he was taken by the people; yea, the Son of the everlasting God was judged of the world; and I saw and bear record.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.33
    scripture: book-of-mormon
    name: 1 Nephi 11:33
    book: 1 Nephi
    chapter: 11
    verse: 33
    ordinal: 262
    text: And I, Nephi, saw that he was lifted up upon the cross and slain for the sins of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.34
    scripture: book-of-mormon
    name: 1 Nephi 11:34
    book: 1 Nephi
    chapter: 11
    verse: 34
    ordinal: 263
    text: And after he was slain I saw the multitudes of the earth, that they were gathered together to fight against the apostles of the Lamb; for thus were the twelve called by the angel of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.35
    scripture: book-of-mormon
    name: 1 Nephi 11:35
    book: 1 Nephi
    chapter: 11
    verse: 35
    ordinal: 264
    text: 'And the multitude of the earth was gathered together; and I beheld that they were in a large and spacious building, like unto the building which my father saw. And the angel of the Lord spake unto me again, saying: Behold the world and the wisdom thereof; yea, behold the house of Israel hath gathered together to fight against the twelve apostles of the Lamb.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.11.36
    scripture: book-of-mormon
    name: 1 Nephi 11:36
    book: 1 Nephi
    chapter: 11
    verse: 36
    ordinal: 265
    text: 'And it came to pass that I saw and bear record, that the great and spacious building was the pride of the world; and it fell, and the fall thereof was exceedingly great. And the angel of the Lord spake unto me again, saying: Thus shall be the destruction of all nations, kindreds, tongues, and people, that shall fight against the twelve apostles of the Lamb.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.11
- type: BomVerse
  data:
    ref: 1-nephi.12.1
    scripture: book-of-mormon
    name: 1 Nephi 12:1
    book: 1 Nephi
    chapter: 12
    verse: 1
    ordinal: 266
    text: 'And it came to pass that the angel said unto me: Look, and behold thy seed, and also the seed of thy brethren. And I looked and beheld the land of promise; and I beheld multitudes of people, yea, even as it were in number as many as the sand of the sea.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.2
    scripture: book-of-mormon
    name: 1 Nephi 12:2
    book: 1 Nephi
    chapter: 12
    verse: 2
    ordinal: 267
    text: And it came to pass that I beheld multitudes gathered together to battle, one against the other; and I beheld wars, and rumors of wars, and great slaughters with the sword among my people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.3
    scripture: book-of-mormon
    name: 1 Nephi 12:3
    book: 1 Nephi
    chapter: 12
    verse: 3
    ordinal: 268
    text: And it came to pass that I beheld many generations pass away, after the manner of wars and contentions in the land; and I beheld many cities, yea, even that I did not number them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.4
    scripture: book-of-mormon
    name: 1 Nephi 12:4
    book: 1 Nephi
    chapter: 12
    verse: 4
    ordinal: 269
    text: And it came to pass that I saw a mist of darkness on the face of the land of promise; and I saw lightnings, and I heard thunderings, and earthquakes, and all manner of tumultuous noises; and I saw the earth and the rocks, that they rent; and I saw mountains tumbling into pieces; and I saw the plains of the earth, that they were broken up; and I saw many cities that they were sunk; and I saw many that they were burned with fire; and I saw many that did tumble to the earth, because of the quaking thereof.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.5
    scripture: book-of-mormon
    name: 1 Nephi 12:5
    book: 1 Nephi
    chapter: 12
    verse: 5
    ordinal: 270
    text: And it came to pass after I saw these things, I saw the vapor of darkness, that it passed from off the face of the earth; and behold, I saw multitudes who had not fallen because of the great and terrible judgments of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.6
    scripture: book-of-mormon
    name: 1 Nephi 12:6
    book: 1 Nephi
    chapter: 12
    verse: 6
    ordinal: 271
    text: And I saw the heavens open, and the Lamb of God descending out of heaven; and he came down and showed himself unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.7
    scripture: book-of-mormon
    name: 1 Nephi 12:7
    book: 1 Nephi
    chapter: 12
    verse: 7
    ordinal: 272
    text: And I also saw and bear record that the Holy Ghost fell upon twelve others; and they were ordained of God, and chosen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.8
    scripture: book-of-mormon
    name: 1 Nephi 12:8
    book: 1 Nephi
    chapter: 12
    verse: 8
    ordinal: 273
    text: 'And the angel spake unto me, saying: Behold the twelve disciples of the Lamb, who are chosen to minister unto thy seed.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.9
    scripture: book-of-mormon
    name: 1 Nephi 12:9
    book: 1 Nephi
    chapter: 12
    verse: 9
    ordinal: 274
    text: 'And he said unto me: Thou rememberest the twelve apostles of the Lamb? Behold they are they who shall judge the twelve tribes of Israel; wherefore, the twelve ministers of thy seed shall be judged of them; for ye are of the house of Israel.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.10
    scripture: book-of-mormon
    name: 1 Nephi 12:10
    book: 1 Nephi
    chapter: 12
    verse: 10
    ordinal: 275
    text: And these twelve ministers whom thou beholdest shall judge thy seed. And, behold, they are righteous forever; for because of their faith in the Lamb of God their garments are made white in his blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.11
    scripture: book-of-mormon
    name: 1 Nephi 12:11
    book: 1 Nephi
    chapter: 12
    verse: 11
    ordinal: 276
    text: 'And the angel said unto me: Look! And I looked, and beheld three generations pass away in righteousness; and their garments were white even like unto the Lamb of God. And the angel said unto me: These are made white in the blood of the Lamb, because of their faith in him.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.12
    scripture: book-of-mormon
    name: 1 Nephi 12:12
    book: 1 Nephi
    chapter: 12
    verse: 12
    ordinal: 277
    text: And I, Nephi, also saw many of the fourth generation who passed away in righteousness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.13
    scripture: book-of-mormon
    name: 1 Nephi 12:13
    book: 1 Nephi
    chapter: 12
    verse: 13
    ordinal: 278
    text: And it came to pass that I saw the multitudes of the earth gathered together.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.14
    scripture: book-of-mormon
    name: 1 Nephi 12:14
    book: 1 Nephi
    chapter: 12
    verse: 14
    ordinal: 279
    text: 'And the angel said unto me: Behold thy seed, and also the seed of thy brethren.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.15
    scripture: book-of-mormon
    name: 1 Nephi 12:15
    book: 1 Nephi
    chapter: 12
    verse: 15
    ordinal: 280
    text: And it came to pass that I looked and beheld the people of my seed gathered together in multitudes against the seed of my brethren; and they were gathered together to battle.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.16
    scripture: book-of-mormon
    name: 1 Nephi 12:16
    book: 1 Nephi
    chapter: 12
    verse: 16
    ordinal: 281
    text: 'And the angel spake unto me, saying: Behold the fountain of filthy water which thy father saw; yea, even the river of which he spake; and the depths thereof are the depths of hell.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.17
    scripture: book-of-mormon
    name: 1 Nephi 12:17
    book: 1 Nephi
    chapter: 12
    verse: 17
    ordinal: 282
    text: And the mists of darkness are the temptations of the devil, which blindeth the eyes, and hardeneth the hearts of the children of men, and leadeth them away into broad roads, that they perish and are lost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.18
    scripture: book-of-mormon
    name: 1 Nephi 12:18
    book: 1 Nephi
    chapter: 12
    verse: 18
    ordinal: 283
    text: And the large and spacious building, which thy father saw, is vain imaginations and the pride of the children of men. And a great and a terrible gulf divideth them; yea, even the word of the justice of the Eternal God, and the Messiah who is the Lamb of God, of whom the Holy Ghost beareth record, from the beginning of the world until this time, and from this time henceforth and forever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.19
    scripture: book-of-mormon
    name: 1 Nephi 12:19
    book: 1 Nephi
    chapter: 12
    verse: 19
    ordinal: 284
    text: And while the angel spake these words, I beheld and saw that the seed of my brethren did contend against my seed, according to the word of the angel; and because of the pride of my seed, and the temptations of the devil, I beheld that the seed of my brethren did overpower the people of my seed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.20
    scripture: book-of-mormon
    name: 1 Nephi 12:20
    book: 1 Nephi
    chapter: 12
    verse: 20
    ordinal: 285
    text: And it came to pass that I beheld, and saw the people of the seed of my brethren that they had overcome my seed; and they went forth in multitudes upon the face of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.21
    scripture: book-of-mormon
    name: 1 Nephi 12:21
    book: 1 Nephi
    chapter: 12
    verse: 21
    ordinal: 286
    text: And I saw them gathered together in multitudes; and I saw wars and rumors of wars among them; and in wars and rumors of wars I saw many generations pass away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.22
    scripture: book-of-mormon
    name: 1 Nephi 12:22
    book: 1 Nephi
    chapter: 12
    verse: 22
    ordinal: 287
    text: 'And the angel said unto me: Behold these shall dwindle in unbelief.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.12.23
    scripture: book-of-mormon
    name: 1 Nephi 12:23
    book: 1 Nephi
    chapter: 12
    verse: 23
    ordinal: 288
    text: And it came to pass that I beheld, after they had dwindled in unbelief they became a dark, and loathsome, and a filthy people, full of idleness and all manner of abominations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.12
- type: BomVerse
  data:
    ref: 1-nephi.13.1
    scripture: book-of-mormon
    name: 1 Nephi 13:1
    book: 1 Nephi
    chapter: 13
    verse: 1
    ordinal: 289
    text: 'And it came to pass that the angel spake unto me, saying: Look! And I looked and beheld many nations and kingdoms.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.2
    scripture: book-of-mormon
    name: 1 Nephi 13:2
    book: 1 Nephi
    chapter: 13
    verse: 2
    ordinal: 290
    text: 'And the angel said unto me: What beholdest thou? And I said: I behold many nations and kingdoms.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.3
    scripture: book-of-mormon
    name: 1 Nephi 13:3
    book: 1 Nephi
    chapter: 13
    verse: 3
    ordinal: 291
    text: 'And he said unto me: These are the nations and kingdoms of the Gentiles.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.4
    scripture: book-of-mormon
    name: 1 Nephi 13:4
    book: 1 Nephi
    chapter: 13
    verse: 4
    ordinal: 292
    text: And it came to pass that I saw among the nations of the Gentiles the formation of a great church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.5
    scripture: book-of-mormon
    name: 1 Nephi 13:5
    book: 1 Nephi
    chapter: 13
    verse: 5
    ordinal: 293
    text: 'And the angel said unto me: Behold the formation of a church which is most abominable above all other churches, which slayeth the saints of God, yea, and tortureth them and bindeth them down, and yoketh them with a yoke of iron, and bringeth them down into captivity.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.6
    scripture: book-of-mormon
    name: 1 Nephi 13:6
    book: 1 Nephi
    chapter: 13
    verse: 6
    ordinal: 294
    text: And it came to pass that I beheld this great and abominable church; and I saw the devil that he was the founder of it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.7
    scripture: book-of-mormon
    name: 1 Nephi 13:7
    book: 1 Nephi
    chapter: 13
    verse: 7
    ordinal: 295
    text: And I also saw gold, and silver, and silks, and scarlets, and fine-twined linen, and all manner of precious clothing; and I saw many harlots.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.8
    scripture: book-of-mormon
    name: 1 Nephi 13:8
    book: 1 Nephi
    chapter: 13
    verse: 8
    ordinal: 296
    text: 'And the angel spake unto me, saying: Behold the gold, and the silver, and the silks, and the scarlets, and the fine-twined linen, and the precious clothing, and the harlots, are the desires of this great and abominable church.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.9
    scripture: book-of-mormon
    name: 1 Nephi 13:9
    book: 1 Nephi
    chapter: 13
    verse: 9
    ordinal: 297
    text: And also for the praise of the world do they destroy the saints of God, and bring them down into captivity.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.10
    scripture: book-of-mormon
    name: 1 Nephi 13:10
    book: 1 Nephi
    chapter: 13
    verse: 10
    ordinal: 298
    text: And it came to pass that I looked and beheld many waters; and they divided the Gentiles from the seed of my brethren.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.11
    scripture: book-of-mormon
    name: 1 Nephi 13:11
    book: 1 Nephi
    chapter: 13
    verse: 11
    ordinal: 299
    text: 'And it came to pass that the angel said unto me: Behold the wrath of God is upon the seed of thy brethren.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.12
    scripture: book-of-mormon
    name: 1 Nephi 13:12
    book: 1 Nephi
    chapter: 13
    verse: 12
    ordinal: 300
    text: And I looked and beheld a man among the Gentiles, who was separated from the seed of my brethren by the many waters; and I beheld the Spirit of God, that it came down and wrought upon the man; and he went forth upon the many waters, even unto the seed of my brethren, who were in the promised land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.13
    scripture: book-of-mormon
    name: 1 Nephi 13:13
    book: 1 Nephi
    chapter: 13
    verse: 13
    ordinal: 301
    text: And it came to pass that I beheld the Spirit of God, that it wrought upon other Gentiles; and they went forth out of captivity, upon the many waters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.14
    scripture: book-of-mormon
    name: 1 Nephi 13:14
    book: 1 Nephi
    chapter: 13
    verse: 14
    ordinal: 302
    text: And it came to pass that I beheld many multitudes of the Gentiles upon the land of promise; and I beheld the wrath of God, that it was upon the seed of my brethren; and they were scattered before the Gentiles and were smitten.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.15
    scripture: book-of-mormon
    name: 1 Nephi 13:15
    book: 1 Nephi
    chapter: 13
    verse: 15
    ordinal: 303
    text: And I beheld the Spirit of the Lord, that it was upon the Gentiles, and they did prosper and obtain the land for their inheritance; and I beheld that they were white, and exceedingly fair and beautiful, like unto my people before they were slain.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.16
    scripture: book-of-mormon
    name: 1 Nephi 13:16
    book: 1 Nephi
    chapter: 13
    verse: 16
    ordinal: 304
    text: And it came to pass that I, Nephi, beheld that the Gentiles who had gone forth out of captivity did humble themselves before the Lord; and the power of the Lord was with them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.17
    scripture: book-of-mormon
    name: 1 Nephi 13:17
    book: 1 Nephi
    chapter: 13
    verse: 17
    ordinal: 305
    text: And I beheld that their mother Gentiles were gathered together upon the waters, and upon the land also, to battle against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.18
    scripture: book-of-mormon
    name: 1 Nephi 13:18
    book: 1 Nephi
    chapter: 13
    verse: 18
    ordinal: 306
    text: And I beheld that the power of God was with them, and also that the wrath of God was upon all those that were gathered together against them to battle.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.19
    scripture: book-of-mormon
    name: 1 Nephi 13:19
    book: 1 Nephi
    chapter: 13
    verse: 19
    ordinal: 307
    text: And I, Nephi, beheld that the Gentiles that had gone out of captivity were delivered by the power of God out of the hands of all other nations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.20
    scripture: book-of-mormon
    name: 1 Nephi 13:20
    book: 1 Nephi
    chapter: 13
    verse: 20
    ordinal: 308
    text: And it came to pass that I, Nephi, beheld that they did prosper in the land; and I beheld a book, and it was carried forth among them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.21
    scripture: book-of-mormon
    name: 1 Nephi 13:21
    book: 1 Nephi
    chapter: 13
    verse: 21
    ordinal: 309
    text: 'And the angel said unto me: Knowest thou the meaning of the book?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.22
    scripture: book-of-mormon
    name: 1 Nephi 13:22
    book: 1 Nephi
    chapter: 13
    verse: 22
    ordinal: 310
    text: 'And I said unto him: I know not.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.23
    scripture: book-of-mormon
    name: 1 Nephi 13:23
    book: 1 Nephi
    chapter: 13
    verse: 23
    ordinal: 311
    text: 'And he said: Behold it proceedeth out of the mouth of a Jew. And I, Nephi, beheld it; and he said unto me: The book that thou beholdest is a record of the Jews, which contains the covenants of the Lord, which he hath made unto the house of Israel; and it also containeth many of the prophecies of the holy prophets; and it is a record like unto the engravings which are upon the plates of brass, save there are not so many; nevertheless, they contain the covenants of the Lord, which he hath made unto the house of Israel; wherefore, they are of great worth unto the Gentiles.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.24
    scripture: book-of-mormon
    name: 1 Nephi 13:24
    book: 1 Nephi
    chapter: 13
    verse: 24
    ordinal: 312
    text: 'And the angel of the Lord said unto me: Thou hast beheld that the book proceeded forth from the mouth of a Jew; and when it proceeded forth from the mouth of a Jew it contained the fulness of the gospel of the Lord, of whom the twelve apostles bear record; and they bear record according to the truth which is in the Lamb of God.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.25
    scripture: book-of-mormon
    name: 1 Nephi 13:25
    book: 1 Nephi
    chapter: 13
    verse: 25
    ordinal: 313
    text: Wherefore, these things go forth from the Jews in purity unto the Gentiles, according to the truth which is in God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.26
    scripture: book-of-mormon
    name: 1 Nephi 13:26
    book: 1 Nephi
    chapter: 13
    verse: 26
    ordinal: 314
    text: And after they go forth by the hand of the twelve apostles of the Lamb, from the Jews unto the Gentiles, thou seest the formation of that great and abominable church, which is most abominable above all other churches; for behold, they have taken away from the gospel of the Lamb many parts which are plain and most precious; and also many covenants of the Lord have they taken away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.27
    scripture: book-of-mormon
    name: 1 Nephi 13:27
    book: 1 Nephi
    chapter: 13
    verse: 27
    ordinal: 315
    text: And all this have they done that they might pervert the right ways of the Lord, that they might blind the eyes and harden the hearts of the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.28
    scripture: book-of-mormon
    name: 1 Nephi 13:28
    book: 1 Nephi
    chapter: 13
    verse: 28
    ordinal: 316
    text: Wherefore, thou seest that after the book hath gone forth through the hands of the great and abominable church, that there are many plain and precious things taken away from the book, which is the book of the Lamb of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.29
    scripture: book-of-mormon
    name: 1 Nephi 13:29
    book: 1 Nephi
    chapter: 13
    verse: 29
    ordinal: 317
    text: And after these plain and precious things were taken away it goeth forth unto all the nations of the Gentiles; and after it goeth forth unto all the nations of the Gentiles, yea, even across the many waters which thou hast seen with the Gentiles which have gone forth out of captivity, thou seest—because of the many plain and precious things which have been taken out of the book, which were plain unto the understanding of the children of men, according to the plainness which is in the Lamb of God—because of these things which are taken away out of the gospel of the Lamb, an exceedingly great many do stumble, yea, insomuch that Satan hath great power over them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.30
    scripture: book-of-mormon
    name: 1 Nephi 13:30
    book: 1 Nephi
    chapter: 13
    verse: 30
    ordinal: 318
    text: Nevertheless, thou beholdest that the Gentiles who have gone forth out of captivity, and have been lifted up by the power of God above all other nations, upon the face of the land which is choice above all other lands, which is the land that the Lord God hath covenanted with thy father that his seed should have for the land of their inheritance; wherefore, thou seest that the Lord God will not suffer that the Gentiles will utterly destroy the mixture of thy seed, which are among thy brethren.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.31
    scripture: book-of-mormon
    name: 1 Nephi 13:31
    book: 1 Nephi
    chapter: 13
    verse: 31
    ordinal: 319
    text: Neither will he suffer that the Gentiles shall destroy the seed of thy brethren.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.32
    scripture: book-of-mormon
    name: 1 Nephi 13:32
    book: 1 Nephi
    chapter: 13
    verse: 32
    ordinal: 320
    text: Neither will the Lord God suffer that the Gentiles shall forever remain in that awful state of blindness, which thou beholdest they are in, because of the plain and most precious parts of the gospel of the Lamb which have been kept back by that abominable church, whose formation thou hast seen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.33
    scripture: book-of-mormon
    name: 1 Nephi 13:33
    book: 1 Nephi
    chapter: 13
    verse: 33
    ordinal: 321
    text: 'Wherefore saith the Lamb of God: I will be merciful unto the Gentiles, unto the visiting of the remnant of the house of Israel in great judgment.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.34
    scripture: book-of-mormon
    name: 1 Nephi 13:34
    book: 1 Nephi
    chapter: 13
    verse: 34
    ordinal: 322
    text: 'And it came to pass that the angel of the Lord spake unto me, saying: Behold, saith the Lamb of God, after I have visited the remnant of the house of Israel—and this remnant of whom I speak is the seed of thy father—wherefore, after I have visited them in judgment, and smitten them by the hand of the Gentiles, and after the Gentiles do stumble exceedingly, because of the most plain and precious parts of the gospel of the Lamb which have been kept back by that abominable church, which is the mother of harlots, saith the Lamb—I will be merciful unto the Gentiles in that day, insomuch that I will bring forth unto them, in mine own power, much of my gospel, which shall be plain and precious, saith the Lamb.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.35
    scripture: book-of-mormon
    name: 1 Nephi 13:35
    book: 1 Nephi
    chapter: 13
    verse: 35
    ordinal: 323
    text: 'For, behold, saith the Lamb: I will manifest myself unto thy seed, that they shall write many things which I shall minister unto them, which shall be plain and precious; and after thy seed shall be destroyed, and dwindle in unbelief, and also the seed of thy brethren, behold, these things shall be hid up, to come forth unto the Gentiles, by the gift and power of the Lamb.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.36
    scripture: book-of-mormon
    name: 1 Nephi 13:36
    book: 1 Nephi
    chapter: 13
    verse: 36
    ordinal: 324
    text: And in them shall be written my gospel, saith the Lamb, and my rock and my salvation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.37
    scripture: book-of-mormon
    name: 1 Nephi 13:37
    book: 1 Nephi
    chapter: 13
    verse: 37
    ordinal: 325
    text: And blessed are they who shall seek to bring forth my Zion at that day, for they shall have the gift and the power of the Holy Ghost; and if they endure unto the end they shall be lifted up at the last day, and shall be saved in the everlasting kingdom of the Lamb; and whoso shall publish peace, yea, tidings of great joy, how beautiful upon the mountains shall they be.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.38
    scripture: book-of-mormon
    name: 1 Nephi 13:38
    book: 1 Nephi
    chapter: 13
    verse: 38
    ordinal: 326
    text: And it came to pass that I beheld the remnant of the seed of my brethren, and also the book of the Lamb of God, which had proceeded forth from the mouth of the Jew, that it came forth from the Gentiles unto the remnant of the seed of my brethren.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.39
    scripture: book-of-mormon
    name: 1 Nephi 13:39
    book: 1 Nephi
    chapter: 13
    verse: 39
    ordinal: 327
    text: And after it had come forth unto them I beheld other books, which came forth by the power of the Lamb, from the Gentiles unto them, unto the convincing of the Gentiles and the remnant of the seed of my brethren, and also the Jews who were scattered upon all the face of the earth, that the records of the prophets and of the twelve apostles of the Lamb are true.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.40
    scripture: book-of-mormon
    name: 1 Nephi 13:40
    book: 1 Nephi
    chapter: 13
    verse: 40
    ordinal: 328
    text: 'And the angel spake unto me, saying: These last records, which thou hast seen among the Gentiles, shall establish the truth of the first, which are of the twelve apostles of the Lamb, and shall make known the plain and precious things which have been taken away from them; and shall make known to all kindreds, tongues, and people, that the Lamb of God is the Son of the Eternal Father, and the Savior of the world; and that all men must come unto him, or they cannot be saved.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.41
    scripture: book-of-mormon
    name: 1 Nephi 13:41
    book: 1 Nephi
    chapter: 13
    verse: 41
    ordinal: 329
    text: And they must come according to the words which shall be established by the mouth of the Lamb; and the words of the Lamb shall be made known in the records of thy seed, as well as in the records of the twelve apostles of the Lamb; wherefore they both shall be established in one; for there is one God and one Shepherd over all the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.13.42
    scripture: book-of-mormon
    name: 1 Nephi 13:42
    book: 1 Nephi
    chapter: 13
    verse: 42
    ordinal: 330
    text: And the time cometh that he shall manifest himself unto all nations, both unto the Jews and also unto the Gentiles; and after he has manifested himself unto the Jews and also unto the Gentiles, then he shall manifest himself unto the Gentiles and also unto the Jews, and the last shall be first, and the first shall be last.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.13
- type: BomVerse
  data:
    ref: 1-nephi.14.1
    scripture: book-of-mormon
    name: 1 Nephi 14:1
    book: 1 Nephi
    chapter: 14
    verse: 1
    ordinal: 331
    text: And it shall come to pass, that if the Gentiles shall hearken unto the Lamb of God in that day that he shall manifest himself unto them in word, and also in power, in very deed, unto the taking away of their stumbling blocks—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.2
    scripture: book-of-mormon
    name: 1 Nephi 14:2
    book: 1 Nephi
    chapter: 14
    verse: 2
    ordinal: 332
    text: And harden not their hearts against the Lamb of God, they shall be numbered among the seed of thy father; yea, they shall be numbered among the house of Israel; and they shall be a blessed people upon the promised land forever; they shall be no more brought down into captivity; and the house of Israel shall no more be confounded.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.3
    scripture: book-of-mormon
    name: 1 Nephi 14:3
    book: 1 Nephi
    chapter: 14
    verse: 3
    ordinal: 333
    text: And that great pit, which hath been digged for them by that great and abominable church, which was founded by the devil and his children, that he might lead away the souls of men down to hell—yea, that great pit which hath been digged for the destruction of men shall be filled by those who digged it, unto their utter destruction, saith the Lamb of God; not the destruction of the soul, save it be the casting of it into that hell which hath no end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.4
    scripture: book-of-mormon
    name: 1 Nephi 14:4
    book: 1 Nephi
    chapter: 14
    verse: 4
    ordinal: 334
    text: For behold, this is according to the captivity of the devil, and also according to the justice of God, upon all those who will work wickedness and abomination before him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.5
    scripture: book-of-mormon
    name: 1 Nephi 14:5
    book: 1 Nephi
    chapter: 14
    verse: 5
    ordinal: 335
    text: 'And it came to pass that the angel spake unto me, Nephi, saying: Thou hast beheld that if the Gentiles repent it shall be well with them; and thou also knowest concerning the covenants of the Lord unto the house of Israel; and thou also hast heard that whoso repenteth not must perish.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.6
    scripture: book-of-mormon
    name: 1 Nephi 14:6
    book: 1 Nephi
    chapter: 14
    verse: 6
    ordinal: 336
    text: Therefore, wo be unto the Gentiles if it so be that they harden their hearts against the Lamb of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.7
    scripture: book-of-mormon
    name: 1 Nephi 14:7
    book: 1 Nephi
    chapter: 14
    verse: 7
    ordinal: 337
    text: For the time cometh, saith the Lamb of God, that I will work a great and a marvelous work among the children of men; a work which shall be everlasting, either on the one hand or on the other—either to the convincing of them unto peace and life eternal, or unto the deliverance of them to the hardness of their hearts and the blindness of their minds unto their being brought down into captivity, and also into destruction, both temporally and spiritually, according to the captivity of the devil, of which I have spoken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.8
    scripture: book-of-mormon
    name: 1 Nephi 14:8
    book: 1 Nephi
    chapter: 14
    verse: 8
    ordinal: 338
    text: 'And it came to pass that when the angel had spoken these words, he said unto me: Rememberest thou the covenants of the Father unto the house of Israel? I said unto him, Yea.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.9
    scripture: book-of-mormon
    name: 1 Nephi 14:9
    book: 1 Nephi
    chapter: 14
    verse: 9
    ordinal: 339
    text: 'And it came to pass that he said unto me: Look, and behold that great and abominable church, which is the mother of abominations, whose founder is the devil.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.10
    scripture: book-of-mormon
    name: 1 Nephi 14:10
    book: 1 Nephi
    chapter: 14
    verse: 10
    ordinal: 340
    text: 'And he said unto me: Behold there are save two churches only; the one is the church of the Lamb of God, and the other is the church of the devil; wherefore, whoso belongeth not to the church of the Lamb of God belongeth to that great church, which is the mother of abominations; and she is the whore of all the earth.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.11
    scripture: book-of-mormon
    name: 1 Nephi 14:11
    book: 1 Nephi
    chapter: 14
    verse: 11
    ordinal: 341
    text: And it came to pass that I looked and beheld the whore of all the earth, and she sat upon many waters; and she had dominion over all the earth, among all nations, kindreds, tongues, and people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.12
    scripture: book-of-mormon
    name: 1 Nephi 14:12
    book: 1 Nephi
    chapter: 14
    verse: 12
    ordinal: 342
    text: And it came to pass that I beheld the church of the Lamb of God, and its numbers were few, because of the wickedness and abominations of the whore who sat upon many waters; nevertheless, I beheld that the church of the Lamb, who were the saints of God, were also upon all the face of the earth; and their dominions upon the face of the earth were small, because of the wickedness of the great whore whom I saw.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.13
    scripture: book-of-mormon
    name: 1 Nephi 14:13
    book: 1 Nephi
    chapter: 14
    verse: 13
    ordinal: 343
    text: And it came to pass that I beheld that the great mother of abominations did gather together multitudes upon the face of all the earth, among all the nations of the Gentiles, to fight against the Lamb of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.14
    scripture: book-of-mormon
    name: 1 Nephi 14:14
    book: 1 Nephi
    chapter: 14
    verse: 14
    ordinal: 344
    text: And it came to pass that I, Nephi, beheld the power of the Lamb of God, that it descended upon the saints of the church of the Lamb, and upon the covenant people of the Lord, who were scattered upon all the face of the earth; and they were armed with righteousness and with the power of God in great glory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.15
    scripture: book-of-mormon
    name: 1 Nephi 14:15
    book: 1 Nephi
    chapter: 14
    verse: 15
    ordinal: 345
    text: And it came to pass that I beheld that the wrath of God was poured out upon that great and abominable church, insomuch that there were wars and rumors of wars among all the nations and kindreds of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.16
    scripture: book-of-mormon
    name: 1 Nephi 14:16
    book: 1 Nephi
    chapter: 14
    verse: 16
    ordinal: 346
    text: 'And as there began to be wars and rumors of wars among all the nations which belonged to the mother of abominations, the angel spake unto me, saying: Behold, the wrath of God is upon the mother of harlots; and behold, thou seest all these things—'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.17
    scripture: book-of-mormon
    name: 1 Nephi 14:17
    book: 1 Nephi
    chapter: 14
    verse: 17
    ordinal: 347
    text: And when the day cometh that the wrath of God is poured out upon the mother of harlots, which is the great and abominable church of all the earth, whose founder is the devil, then, at that day, the work of the Father shall commence, in preparing the way for the fulfilling of his covenants, which he hath made to his people who are of the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.18
    scripture: book-of-mormon
    name: 1 Nephi 14:18
    book: 1 Nephi
    chapter: 14
    verse: 18
    ordinal: 348
    text: 'And it came to pass that the angel spake unto me, saying: Look!'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.19
    scripture: book-of-mormon
    name: 1 Nephi 14:19
    book: 1 Nephi
    chapter: 14
    verse: 19
    ordinal: 349
    text: And I looked and beheld a man, and he was dressed in a white robe.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.20
    scripture: book-of-mormon
    name: 1 Nephi 14:20
    book: 1 Nephi
    chapter: 14
    verse: 20
    ordinal: 350
    text: 'And the angel said unto me: Behold one of the twelve apostles of the Lamb.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.21
    scripture: book-of-mormon
    name: 1 Nephi 14:21
    book: 1 Nephi
    chapter: 14
    verse: 21
    ordinal: 351
    text: Behold, he shall see and write the remainder of these things; yea, and also many things which have been.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.22
    scripture: book-of-mormon
    name: 1 Nephi 14:22
    book: 1 Nephi
    chapter: 14
    verse: 22
    ordinal: 352
    text: And he shall also write concerning the end of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.23
    scripture: book-of-mormon
    name: 1 Nephi 14:23
    book: 1 Nephi
    chapter: 14
    verse: 23
    ordinal: 353
    text: Wherefore, the things which he shall write are just and true; and behold they are written in the book which thou beheld proceeding out of the mouth of the Jew; and at the time they proceeded out of the mouth of the Jew, or, at the time the book proceeded out of the mouth of the Jew, the things which were written were plain and pure, and most precious and easy to the understanding of all men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.24
    scripture: book-of-mormon
    name: 1 Nephi 14:24
    book: 1 Nephi
    chapter: 14
    verse: 24
    ordinal: 354
    text: And behold, the things which this apostle of the Lamb shall write are many things which thou hast seen; and behold, the remainder shalt thou see.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.25
    scripture: book-of-mormon
    name: 1 Nephi 14:25
    book: 1 Nephi
    chapter: 14
    verse: 25
    ordinal: 355
    text: But the things which thou shalt see hereafter thou shalt not write; for the Lord God hath ordained the apostle of the Lamb of God that he should write them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.26
    scripture: book-of-mormon
    name: 1 Nephi 14:26
    book: 1 Nephi
    chapter: 14
    verse: 26
    ordinal: 356
    text: And also others who have been, to them hath he shown all things, and they have written them; and they are sealed up to come forth in their purity, according to the truth which is in the Lamb, in the own due time of the Lord, unto the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.27
    scripture: book-of-mormon
    name: 1 Nephi 14:27
    book: 1 Nephi
    chapter: 14
    verse: 27
    ordinal: 357
    text: And I, Nephi, heard and bear record, that the name of the apostle of the Lamb was John, according to the word of the angel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.28
    scripture: book-of-mormon
    name: 1 Nephi 14:28
    book: 1 Nephi
    chapter: 14
    verse: 28
    ordinal: 358
    text: And behold, I, Nephi, am forbidden that I should write the remainder of the things which I saw and heard; wherefore the things which I have written sufficeth me; and I have written but a small part of the things which I saw.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.29
    scripture: book-of-mormon
    name: 1 Nephi 14:29
    book: 1 Nephi
    chapter: 14
    verse: 29
    ordinal: 359
    text: And I bear record that I saw the things which my father saw, and the angel of the Lord did make them known unto me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.14.30
    scripture: book-of-mormon
    name: 1 Nephi 14:30
    book: 1 Nephi
    chapter: 14
    verse: 30
    ordinal: 360
    text: And now I make an end of speaking concerning the things which I saw while I was carried away in the Spirit; and if all the things which I saw are not written, the things which I have written are true. And thus it is. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.14
- type: BomVerse
  data:
    ref: 1-nephi.15.1
    scripture: book-of-mormon
    name: 1 Nephi 15:1
    book: 1 Nephi
    chapter: 15
    verse: 1
    ordinal: 361
    text: And it came to pass that after I, Nephi, had been carried away in the Spirit, and seen all these things, I returned to the tent of my father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.2
    scripture: book-of-mormon
    name: 1 Nephi 15:2
    book: 1 Nephi
    chapter: 15
    verse: 2
    ordinal: 362
    text: And it came to pass that I beheld my brethren, and they were disputing one with another concerning the things which my father had spoken unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.3
    scripture: book-of-mormon
    name: 1 Nephi 15:3
    book: 1 Nephi
    chapter: 15
    verse: 3
    ordinal: 363
    text: For he truly spake many great things unto them, which were hard to be understood, save a man should inquire of the Lord; and they being hard in their hearts, therefore they did not look unto the Lord as they ought.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.4
    scripture: book-of-mormon
    name: 1 Nephi 15:4
    book: 1 Nephi
    chapter: 15
    verse: 4
    ordinal: 364
    text: And now I, Nephi, was grieved because of the hardness of their hearts, and also, because of the things which I had seen, and knew they must unavoidably come to pass because of the great wickedness of the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.5
    scripture: book-of-mormon
    name: 1 Nephi 15:5
    book: 1 Nephi
    chapter: 15
    verse: 5
    ordinal: 365
    text: And it came to pass that I was overcome because of my afflictions, for I considered that mine afflictions were great above all, because of the destruction of my people, for I had beheld their fall.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.6
    scripture: book-of-mormon
    name: 1 Nephi 15:6
    book: 1 Nephi
    chapter: 15
    verse: 6
    ordinal: 366
    text: And it came to pass that after I had received strength I spake unto my brethren, desiring to know of them the cause of their disputations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.7
    scripture: book-of-mormon
    name: 1 Nephi 15:7
    book: 1 Nephi
    chapter: 15
    verse: 7
    ordinal: 367
    text: 'And they said: Behold, we cannot understand the words which our father hath spoken concerning the natural branches of the olive tree, and also concerning the Gentiles.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.8
    scripture: book-of-mormon
    name: 1 Nephi 15:8
    book: 1 Nephi
    chapter: 15
    verse: 8
    ordinal: 368
    text: 'And I said unto them: Have ye inquired of the Lord?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.9
    scripture: book-of-mormon
    name: 1 Nephi 15:9
    book: 1 Nephi
    chapter: 15
    verse: 9
    ordinal: 369
    text: 'And they said unto me: We have not; for the Lord maketh no such thing known unto us.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.10
    scripture: book-of-mormon
    name: 1 Nephi 15:10
    book: 1 Nephi
    chapter: 15
    verse: 10
    ordinal: 370
    text: 'Behold, I said unto them: How is it that ye do not keep the commandments of the Lord? How is it that ye will perish, because of the hardness of your hearts?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.11
    scripture: book-of-mormon
    name: 1 Nephi 15:11
    book: 1 Nephi
    chapter: 15
    verse: 11
    ordinal: 371
    text: Do ye not remember the things which the Lord hath said?—If ye will not harden your hearts, and ask me in faith, believing that ye shall receive, with diligence in keeping my commandments, surely these things shall be made known unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.12
    scripture: book-of-mormon
    name: 1 Nephi 15:12
    book: 1 Nephi
    chapter: 15
    verse: 12
    ordinal: 372
    text: Behold, I say unto you, that the house of Israel was compared unto an olive tree, by the Spirit of the Lord which was in our father; and behold are we not broken off from the house of Israel, and are we not a branch of the house of Israel?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.13
    scripture: book-of-mormon
    name: 1 Nephi 15:13
    book: 1 Nephi
    chapter: 15
    verse: 13
    ordinal: 373
    text: And now, the thing which our father meaneth concerning the grafting in of the natural branches through the fulness of the Gentiles, is, that in the latter days, when our seed shall have dwindled in unbelief, yea, for the space of many years, and many generations after the Messiah shall be manifested in body unto the children of men, then shall the fulness of the gospel of the Messiah come unto the Gentiles, and from the Gentiles unto the remnant of our seed—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.14
    scripture: book-of-mormon
    name: 1 Nephi 15:14
    book: 1 Nephi
    chapter: 15
    verse: 14
    ordinal: 374
    text: And at that day shall the remnant of our seed know that they are of the house of Israel, and that they are the covenant people of the Lord; and then shall they know and come to the knowledge of their forefathers, and also to the knowledge of the gospel of their Redeemer, which was ministered unto their fathers by him; wherefore, they shall come to the knowledge of their Redeemer and the very points of his doctrine, that they may know how to come unto him and be saved.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.15
    scripture: book-of-mormon
    name: 1 Nephi 15:15
    book: 1 Nephi
    chapter: 15
    verse: 15
    ordinal: 375
    text: And then at that day will they not rejoice and give praise unto their everlasting God, their rock and their salvation? Yea, at that day, will they not receive the strength and nourishment from the true vine? Yea, will they not come unto the true fold of God?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.16
    scripture: book-of-mormon
    name: 1 Nephi 15:16
    book: 1 Nephi
    chapter: 15
    verse: 16
    ordinal: 376
    text: Behold, I say unto you, Yea; they shall be remembered again among the house of Israel; they shall be grafted in, being a natural branch of the olive tree, into the true olive tree.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.17
    scripture: book-of-mormon
    name: 1 Nephi 15:17
    book: 1 Nephi
    chapter: 15
    verse: 17
    ordinal: 377
    text: And this is what our father meaneth; and he meaneth that it will not come to pass until after they are scattered by the Gentiles; and he meaneth that it shall come by way of the Gentiles, that the Lord may show his power unto the Gentiles, for the very cause that he shall be rejected of the Jews, or of the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.18
    scripture: book-of-mormon
    name: 1 Nephi 15:18
    book: 1 Nephi
    chapter: 15
    verse: 18
    ordinal: 378
    text: 'Wherefore, our father hath not spoken of our seed alone, but also of all the house of Israel, pointing to the covenant which should be fulfilled in the latter days; which covenant the Lord made to our father Abraham, saying: In thy seed shall all the kindreds of the earth be blessed.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.19
    scripture: book-of-mormon
    name: 1 Nephi 15:19
    book: 1 Nephi
    chapter: 15
    verse: 19
    ordinal: 379
    text: And it came to pass that I, Nephi, spake much unto them concerning these things; yea, I spake unto them concerning the restoration of the Jews in the latter days.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.20
    scripture: book-of-mormon
    name: 1 Nephi 15:20
    book: 1 Nephi
    chapter: 15
    verse: 20
    ordinal: 380
    text: And I did rehearse unto them the words of Isaiah, who spake concerning the restoration of the Jews, or of the house of Israel; and after they were restored they should no more be confounded, neither should they be scattered again. And it came to pass that I did speak many words unto my brethren, that they were pacified and did humble themselves before the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.21
    scripture: book-of-mormon
    name: 1 Nephi 15:21
    book: 1 Nephi
    chapter: 15
    verse: 21
    ordinal: 381
    text: 'And it came to pass that they did speak unto me again, saying: What meaneth this thing which our father saw in a dream? What meaneth the tree which he saw?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.22
    scripture: book-of-mormon
    name: 1 Nephi 15:22
    book: 1 Nephi
    chapter: 15
    verse: 22
    ordinal: 382
    text: 'And I said unto them: It was a representation of the tree of life.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.23
    scripture: book-of-mormon
    name: 1 Nephi 15:23
    book: 1 Nephi
    chapter: 15
    verse: 23
    ordinal: 383
    text: 'And they said unto me: What meaneth the rod of iron which our father saw, that led to the tree?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.24
    scripture: book-of-mormon
    name: 1 Nephi 15:24
    book: 1 Nephi
    chapter: 15
    verse: 24
    ordinal: 384
    text: And I said unto them that it was the word of God; and whoso would hearken unto the word of God, and would hold fast unto it, they would never perish; neither could the temptations and the fiery darts of the adversary overpower them unto blindness, to lead them away to destruction.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.25
    scripture: book-of-mormon
    name: 1 Nephi 15:25
    book: 1 Nephi
    chapter: 15
    verse: 25
    ordinal: 385
    text: Wherefore, I, Nephi, did exhort them to give heed unto the word of the Lord; yea, I did exhort them with all the energies of my soul, and with all the faculty which I possessed, that they would give heed to the word of God and remember to keep his commandments always in all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.26
    scripture: book-of-mormon
    name: 1 Nephi 15:26
    book: 1 Nephi
    chapter: 15
    verse: 26
    ordinal: 386
    text: 'And they said unto me: What meaneth the river of water which our father saw?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.27
    scripture: book-of-mormon
    name: 1 Nephi 15:27
    book: 1 Nephi
    chapter: 15
    verse: 27
    ordinal: 387
    text: And I said unto them that the water which my father saw was filthiness; and so much was his mind swallowed up in other things that he beheld not the filthiness of the water.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.28
    scripture: book-of-mormon
    name: 1 Nephi 15:28
    book: 1 Nephi
    chapter: 15
    verse: 28
    ordinal: 388
    text: And I said unto them that it was an awful gulf, which separated the wicked from the tree of life, and also from the saints of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.29
    scripture: book-of-mormon
    name: 1 Nephi 15:29
    book: 1 Nephi
    chapter: 15
    verse: 29
    ordinal: 389
    text: And I said unto them that it was a representation of that awful hell, which the angel said unto me was prepared for the wicked.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.30
    scripture: book-of-mormon
    name: 1 Nephi 15:30
    book: 1 Nephi
    chapter: 15
    verse: 30
    ordinal: 390
    text: And I said unto them that our father also saw that the justice of God did also divide the wicked from the righteous; and the brightness thereof was like unto the brightness of a flaming fire, which ascendeth up unto God forever and ever, and hath no end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.31
    scripture: book-of-mormon
    name: 1 Nephi 15:31
    book: 1 Nephi
    chapter: 15
    verse: 31
    ordinal: 391
    text: 'And they said unto me: Doth this thing mean the torment of the body in the days of probation, or doth it mean the final state of the soul after the death of the temporal body, or doth it speak of the things which are temporal?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.32
    scripture: book-of-mormon
    name: 1 Nephi 15:32
    book: 1 Nephi
    chapter: 15
    verse: 32
    ordinal: 392
    text: And it came to pass that I said unto them that it was a representation of things both temporal and spiritual; for the day should come that they must be judged of their works, yea, even the works which were done by the temporal body in their days of probation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.33
    scripture: book-of-mormon
    name: 1 Nephi 15:33
    book: 1 Nephi
    chapter: 15
    verse: 33
    ordinal: 393
    text: Wherefore, if they should die in their wickedness they must be cast off also, as to the things which are spiritual, which are pertaining to righteousness; wherefore, they must be brought to stand before God, to be judged of their works; and if their works have been filthiness they must needs be filthy; and if they be filthy it must needs be that they cannot dwell in the kingdom of God; if so, the kingdom of God must be filthy also.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.34
    scripture: book-of-mormon
    name: 1 Nephi 15:34
    book: 1 Nephi
    chapter: 15
    verse: 34
    ordinal: 394
    text: But behold, I say unto you, the kingdom of God is not filthy, and there cannot any unclean thing enter into the kingdom of God; wherefore there must needs be a place of filthiness prepared for that which is filthy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.35
    scripture: book-of-mormon
    name: 1 Nephi 15:35
    book: 1 Nephi
    chapter: 15
    verse: 35
    ordinal: 395
    text: And there is a place prepared, yea, even that awful hell of which I have spoken, and the devil is the preparator of it; wherefore the final state of the souls of men is to dwell in the kingdom of God, or to be cast out because of that justice of which I have spoken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.15.36
    scripture: book-of-mormon
    name: 1 Nephi 15:36
    book: 1 Nephi
    chapter: 15
    verse: 36
    ordinal: 396
    text: Wherefore, the wicked are rejected from the righteous, and also from that tree of life, whose fruit is most precious and most desirable above all other fruits; yea, and it is the greatest of all the gifts of God. And thus I spake unto my brethren. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.15
- type: BomVerse
  data:
    ref: 1-nephi.16.1
    scripture: book-of-mormon
    name: 1 Nephi 16:1
    book: 1 Nephi
    chapter: 16
    verse: 1
    ordinal: 397
    text: 'And now it came to pass that after I, Nephi, had made an end of speaking to my brethren, behold they said unto me: Thou hast declared unto us hard things, more than we are able to bear.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.2
    scripture: book-of-mormon
    name: 1 Nephi 16:2
    book: 1 Nephi
    chapter: 16
    verse: 2
    ordinal: 398
    text: And it came to pass that I said unto them that I knew that I had spoken hard things against the wicked, according to the truth; and the righteous have I justified, and testified that they should be lifted up at the last day; wherefore, the guilty taketh the truth to be hard, for it cutteth them to the very center.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.3
    scripture: book-of-mormon
    name: 1 Nephi 16:3
    book: 1 Nephi
    chapter: 16
    verse: 3
    ordinal: 399
    text: 'And now my brethren, if ye were righteous and were willing to hearken to the truth, and give heed unto it, that ye might walk uprightly before God, then ye would not murmur because of the truth, and say: Thou speakest hard things against us.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.4
    scripture: book-of-mormon
    name: 1 Nephi 16:4
    book: 1 Nephi
    chapter: 16
    verse: 4
    ordinal: 400
    text: And it came to pass that I, Nephi, did exhort my brethren, with all diligence, to keep the commandments of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.5
    scripture: book-of-mormon
    name: 1 Nephi 16:5
    book: 1 Nephi
    chapter: 16
    verse: 5
    ordinal: 401
    text: And it came to pass that they did humble themselves before the Lord; insomuch that I had joy and great hopes of them, that they would walk in the paths of righteousness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.6
    scripture: book-of-mormon
    name: 1 Nephi 16:6
    book: 1 Nephi
    chapter: 16
    verse: 6
    ordinal: 402
    text: Now, all these things were said and done as my father dwelt in a tent in the valley which he called Lemuel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.7
    scripture: book-of-mormon
    name: 1 Nephi 16:7
    book: 1 Nephi
    chapter: 16
    verse: 7
    ordinal: 403
    text: And it came to pass that I, Nephi, took one of the daughters of Ishmael to wife; and also, my brethren took of the daughters of Ishmael to wife; and also Zoram took the eldest daughter of Ishmael to wife.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.8
    scripture: book-of-mormon
    name: 1 Nephi 16:8
    book: 1 Nephi
    chapter: 16
    verse: 8
    ordinal: 404
    text: And thus my father had fulfilled all the commandments of the Lord which had been given unto him. And also, I, Nephi, had been blessed of the Lord exceedingly.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.9
    scripture: book-of-mormon
    name: 1 Nephi 16:9
    book: 1 Nephi
    chapter: 16
    verse: 9
    ordinal: 405
    text: And it came to pass that the voice of the Lord spake unto my father by night, and commanded him that on the morrow he should take his journey into the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.10
    scripture: book-of-mormon
    name: 1 Nephi 16:10
    book: 1 Nephi
    chapter: 16
    verse: 10
    ordinal: 406
    text: And it came to pass that as my father arose in the morning, and went forth to the tent door, to his great astonishment he beheld upon the ground a round ball of curious workmanship; and it was of fine brass. And within the ball were two spindles; and the one pointed the way whither we should go into the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.11
    scripture: book-of-mormon
    name: 1 Nephi 16:11
    book: 1 Nephi
    chapter: 16
    verse: 11
    ordinal: 407
    text: And it came to pass that we did gather together whatsoever things we should carry into the wilderness, and all the remainder of our provisions which the Lord had given unto us; and we did take seed of every kind that we might carry into the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.12
    scripture: book-of-mormon
    name: 1 Nephi 16:12
    book: 1 Nephi
    chapter: 16
    verse: 12
    ordinal: 408
    text: And it came to pass that we did take our tents and depart into the wilderness, across the river Laman.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.13
    scripture: book-of-mormon
    name: 1 Nephi 16:13
    book: 1 Nephi
    chapter: 16
    verse: 13
    ordinal: 409
    text: And it came to pass that we traveled for the space of four days, nearly a south-southeast direction, and we did pitch our tents again; and we did call the name of the place Shazer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.14
    scripture: book-of-mormon
    name: 1 Nephi 16:14
    book: 1 Nephi
    chapter: 16
    verse: 14
    ordinal: 410
    text: And it came to pass that we did take our bows and our arrows, and go forth into the wilderness to slay food for our families; and after we had slain food for our families we did return again to our families in the wilderness, to the place of Shazer. And we did go forth again in the wilderness, following the same direction, keeping in the most fertile parts of the wilderness, which were in the borders near the Red Sea.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.15
    scripture: book-of-mormon
    name: 1 Nephi 16:15
    book: 1 Nephi
    chapter: 16
    verse: 15
    ordinal: 411
    text: And it came to pass that we did travel for the space of many days, slaying food by the way, with our bows and our arrows and our stones and our slings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.16
    scripture: book-of-mormon
    name: 1 Nephi 16:16
    book: 1 Nephi
    chapter: 16
    verse: 16
    ordinal: 412
    text: And we did follow the directions of the ball, which led us in the more fertile parts of the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.17
    scripture: book-of-mormon
    name: 1 Nephi 16:17
    book: 1 Nephi
    chapter: 16
    verse: 17
    ordinal: 413
    text: And after we had traveled for the space of many days, we did pitch our tents for the space of a time, that we might again rest ourselves and obtain food for our families.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.18
    scripture: book-of-mormon
    name: 1 Nephi 16:18
    book: 1 Nephi
    chapter: 16
    verse: 18
    ordinal: 414
    text: And it came to pass that as I, Nephi, went forth to slay food, behold, I did break my bow, which was made of fine steel; and after I did break my bow, behold, my brethren were angry with me because of the loss of my bow, for we did obtain no food.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.19
    scripture: book-of-mormon
    name: 1 Nephi 16:19
    book: 1 Nephi
    chapter: 16
    verse: 19
    ordinal: 415
    text: And it came to pass that we did return without food to our families, and being much fatigued, because of their journeying, they did suffer much for the want of food.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.20
    scripture: book-of-mormon
    name: 1 Nephi 16:20
    book: 1 Nephi
    chapter: 16
    verse: 20
    ordinal: 416
    text: And it came to pass that Laman and Lemuel and the sons of Ishmael did begin to murmur exceedingly, because of their sufferings and afflictions in the wilderness; and also my father began to murmur against the Lord his God; yea, and they were all exceedingly sorrowful, even that they did murmur against the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.21
    scripture: book-of-mormon
    name: 1 Nephi 16:21
    book: 1 Nephi
    chapter: 16
    verse: 21
    ordinal: 417
    text: Now it came to pass that I, Nephi, having been afflicted with my brethren because of the loss of my bow, and their bows having lost their springs, it began to be exceedingly difficult, yea, insomuch that we could obtain no food.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.22
    scripture: book-of-mormon
    name: 1 Nephi 16:22
    book: 1 Nephi
    chapter: 16
    verse: 22
    ordinal: 418
    text: And it came to pass that I, Nephi, did speak much unto my brethren, because they had hardened their hearts again, even unto complaining against the Lord their God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.23
    scripture: book-of-mormon
    name: 1 Nephi 16:23
    book: 1 Nephi
    chapter: 16
    verse: 23
    ordinal: 419
    text: 'And it came to pass that I, Nephi, did make out of wood a bow, and out of a straight stick, an arrow; wherefore, I did arm myself with a bow and an arrow, with a sling and with stones. And I said unto my father: Whither shall I go to obtain food?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.24
    scripture: book-of-mormon
    name: 1 Nephi 16:24
    book: 1 Nephi
    chapter: 16
    verse: 24
    ordinal: 420
    text: And it came to pass that he did inquire of the Lord, for they had humbled themselves because of my words; for I did say many things unto them in the energy of my soul.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.25
    scripture: book-of-mormon
    name: 1 Nephi 16:25
    book: 1 Nephi
    chapter: 16
    verse: 25
    ordinal: 421
    text: And it came to pass that the voice of the Lord came unto my father; and he was truly chastened because of his murmuring against the Lord, insomuch that he was brought down into the depths of sorrow.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.26
    scripture: book-of-mormon
    name: 1 Nephi 16:26
    book: 1 Nephi
    chapter: 16
    verse: 26
    ordinal: 422
    text: 'And it came to pass that the voice of the Lord said unto him: Look upon the ball, and behold the things which are written.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.27
    scripture: book-of-mormon
    name: 1 Nephi 16:27
    book: 1 Nephi
    chapter: 16
    verse: 27
    ordinal: 423
    text: And it came to pass that when my father beheld the things which were written upon the ball, he did fear and tremble exceedingly, and also my brethren and the sons of Ishmael and our wives.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.28
    scripture: book-of-mormon
    name: 1 Nephi 16:28
    book: 1 Nephi
    chapter: 16
    verse: 28
    ordinal: 424
    text: And it came to pass that I, Nephi, beheld the pointers which were in the ball, that they did work according to the faith and diligence and heed which we did give unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.29
    scripture: book-of-mormon
    name: 1 Nephi 16:29
    book: 1 Nephi
    chapter: 16
    verse: 29
    ordinal: 425
    text: And there was also written upon them a new writing, which was plain to be read, which did give us understanding concerning the ways of the Lord; and it was written and changed from time to time, according to the faith and diligence which we gave unto it. And thus we see that by small means the Lord can bring about great things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.30
    scripture: book-of-mormon
    name: 1 Nephi 16:30
    book: 1 Nephi
    chapter: 16
    verse: 30
    ordinal: 426
    text: And it came to pass that I, Nephi, did go forth up into the top of the mountain, according to the directions which were given upon the ball.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.31
    scripture: book-of-mormon
    name: 1 Nephi 16:31
    book: 1 Nephi
    chapter: 16
    verse: 31
    ordinal: 427
    text: And it came to pass that I did slay wild beasts, insomuch that I did obtain food for our families.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.32
    scripture: book-of-mormon
    name: 1 Nephi 16:32
    book: 1 Nephi
    chapter: 16
    verse: 32
    ordinal: 428
    text: And it came to pass that I did return to our tents, bearing the beasts which I had slain; and now when they beheld that I had obtained food, how great was their joy! And it came to pass that they did humble themselves before the Lord, and did give thanks unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.33
    scripture: book-of-mormon
    name: 1 Nephi 16:33
    book: 1 Nephi
    chapter: 16
    verse: 33
    ordinal: 429
    text: And it came to pass that we did again take our journey, traveling nearly the same course as in the beginning; and after we had traveled for the space of many days we did pitch our tents again, that we might tarry for the space of a time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.34
    scripture: book-of-mormon
    name: 1 Nephi 16:34
    book: 1 Nephi
    chapter: 16
    verse: 34
    ordinal: 430
    text: And it came to pass that Ishmael died, and was buried in the place which was called Nahom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.35
    scripture: book-of-mormon
    name: 1 Nephi 16:35
    book: 1 Nephi
    chapter: 16
    verse: 35
    ordinal: 431
    text: 'And it came to pass that the daughters of Ishmael did mourn exceedingly, because of the loss of their father, and because of their afflictions in the wilderness; and they did murmur against my father, because he had brought them out of the land of Jerusalem, saying: Our father is dead; yea, and we have wandered much in the wilderness, and we have suffered much affliction, hunger, thirst, and fatigue; and after all these sufferings we must perish in the wilderness with hunger.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.36
    scripture: book-of-mormon
    name: 1 Nephi 16:36
    book: 1 Nephi
    chapter: 16
    verse: 36
    ordinal: 432
    text: And thus they did murmur against my father, and also against me; and they were desirous to return again to Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.37
    scripture: book-of-mormon
    name: 1 Nephi 16:37
    book: 1 Nephi
    chapter: 16
    verse: 37
    ordinal: 433
    text: 'And Laman said unto Lemuel and also unto the sons of Ishmael: Behold, let us slay our father, and also our brother Nephi, who has taken it upon him to be our ruler and our teacher, who are his elder brethren.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.38
    scripture: book-of-mormon
    name: 1 Nephi 16:38
    book: 1 Nephi
    chapter: 16
    verse: 38
    ordinal: 434
    text: Now, he says that the Lord has talked with him, and also that angels have ministered unto him. But behold, we know that he lies unto us; and he tells us these things, and he worketh many things by his cunning arts, that he may deceive our eyes, thinking, perhaps, that he may lead us away into some strange wilderness; and after he has led us away, he has thought to make himself a king and a ruler over us, that he may do with us according to his will and pleasure. And after this manner did my brother Laman stir up their hearts to anger.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.16.39
    scripture: book-of-mormon
    name: 1 Nephi 16:39
    book: 1 Nephi
    chapter: 16
    verse: 39
    ordinal: 435
    text: And it came to pass that the Lord was with us, yea, even the voice of the Lord came and did speak many words unto them, and did chasten them exceedingly; and after they were chastened by the voice of the Lord they did turn away their anger, and did repent of their sins, insomuch that the Lord did bless us again with food, that we did not perish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.16
- type: BomVerse
  data:
    ref: 1-nephi.17.1
    scripture: book-of-mormon
    name: 1 Nephi 17:1
    book: 1 Nephi
    chapter: 17
    verse: 1
    ordinal: 436
    text: And it came to pass that we did again take our journey in the wilderness; and we did travel nearly eastward from that time forth. And we did travel and wade through much affliction in the wilderness; and our women did bear children in the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.2
    scripture: book-of-mormon
    name: 1 Nephi 17:2
    book: 1 Nephi
    chapter: 17
    verse: 2
    ordinal: 437
    text: And so great were the blessings of the Lord upon us, that while we did live upon raw meat in the wilderness, our women did give plenty of suck for their children, and were strong, yea, even like unto the men; and they began to bear their journeyings without murmurings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.3
    scripture: book-of-mormon
    name: 1 Nephi 17:3
    book: 1 Nephi
    chapter: 17
    verse: 3
    ordinal: 438
    text: And thus we see that the commandments of God must be fulfilled. And if it so be that the children of men keep the commandments of God he doth nourish them, and strengthen them, and provide means whereby they can accomplish the thing which he has commanded them; wherefore, he did provide means for us while we did sojourn in the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.4
    scripture: book-of-mormon
    name: 1 Nephi 17:4
    book: 1 Nephi
    chapter: 17
    verse: 4
    ordinal: 439
    text: And we did sojourn for the space of many years, yea, even eight years in the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.5
    scripture: book-of-mormon
    name: 1 Nephi 17:5
    book: 1 Nephi
    chapter: 17
    verse: 5
    ordinal: 440
    text: And we did come to the land which we called Bountiful, because of its much fruit and also wild honey; and all these things were prepared of the Lord that we might not perish. And we beheld the sea, which we called Irreantum, which, being interpreted, is many waters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.6
    scripture: book-of-mormon
    name: 1 Nephi 17:6
    book: 1 Nephi
    chapter: 17
    verse: 6
    ordinal: 441
    text: And it came to pass that we did pitch our tents by the seashore; and notwithstanding we had suffered many afflictions and much difficulty, yea, even so much that we cannot write them all, we were exceedingly rejoiced when we came to the seashore; and we called the place Bountiful, because of its much fruit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.7
    scripture: book-of-mormon
    name: 1 Nephi 17:7
    book: 1 Nephi
    chapter: 17
    verse: 7
    ordinal: 442
    text: 'And it came to pass that after I, Nephi, had been in the land of Bountiful for the space of many days, the voice of the Lord came unto me, saying: Arise, and get thee into the mountain. And it came to pass that I arose and went up into the mountain, and cried unto the Lord.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.8
    scripture: book-of-mormon
    name: 1 Nephi 17:8
    book: 1 Nephi
    chapter: 17
    verse: 8
    ordinal: 443
    text: 'And it came to pass that the Lord spake unto me, saying: Thou shalt construct a ship, after the manner which I shall show thee, that I may carry thy people across these waters.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.9
    scripture: book-of-mormon
    name: 1 Nephi 17:9
    book: 1 Nephi
    chapter: 17
    verse: 9
    ordinal: 444
    text: 'And I said: Lord, whither shall I go that I may find ore to molten, that I may make tools to construct the ship after the manner which thou hast shown unto me?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.10
    scripture: book-of-mormon
    name: 1 Nephi 17:10
    book: 1 Nephi
    chapter: 17
    verse: 10
    ordinal: 445
    text: And it came to pass that the Lord told me whither I should go to find ore, that I might make tools.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.11
    scripture: book-of-mormon
    name: 1 Nephi 17:11
    book: 1 Nephi
    chapter: 17
    verse: 11
    ordinal: 446
    text: And it came to pass that I, Nephi, did make a bellows wherewith to blow the fire, of the skins of beasts; and after I had made a bellows, that I might have wherewith to blow the fire, I did smite two stones together that I might make fire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.12
    scripture: book-of-mormon
    name: 1 Nephi 17:12
    book: 1 Nephi
    chapter: 17
    verse: 12
    ordinal: 447
    text: 'For the Lord had not hitherto suffered that we should make much fire, as we journeyed in the wilderness; for he said: I will make thy food become sweet, that ye cook it not;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.13
    scripture: book-of-mormon
    name: 1 Nephi 17:13
    book: 1 Nephi
    chapter: 17
    verse: 13
    ordinal: 448
    text: And I will also be your light in the wilderness; and I will prepare the way before you, if it so be that ye shall keep my commandments; wherefore, inasmuch as ye shall keep my commandments ye shall be led towards the promised land; and ye shall know that it is by me that ye are led.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.14
    scripture: book-of-mormon
    name: 1 Nephi 17:14
    book: 1 Nephi
    chapter: 17
    verse: 14
    ordinal: 449
    text: 'Yea, and the Lord said also that: After ye have arrived in the promised land, ye shall know that I, the Lord, am God; and that I, the Lord, did deliver you from destruction; yea, that I did bring you out of the land of Jerusalem.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.15
    scripture: book-of-mormon
    name: 1 Nephi 17:15
    book: 1 Nephi
    chapter: 17
    verse: 15
    ordinal: 450
    text: Wherefore, I, Nephi, did strive to keep the commandments of the Lord, and I did exhort my brethren to faithfulness and diligence.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.16
    scripture: book-of-mormon
    name: 1 Nephi 17:16
    book: 1 Nephi
    chapter: 17
    verse: 16
    ordinal: 451
    text: And it came to pass that I did make tools of the ore which I did molten out of the rock.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.17
    scripture: book-of-mormon
    name: 1 Nephi 17:17
    book: 1 Nephi
    chapter: 17
    verse: 17
    ordinal: 452
    text: 'And when my brethren saw that I was about to build a ship, they began to murmur against me, saying: Our brother is a fool, for he thinketh that he can build a ship; yea, and he also thinketh that he can cross these great waters.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.18
    scripture: book-of-mormon
    name: 1 Nephi 17:18
    book: 1 Nephi
    chapter: 17
    verse: 18
    ordinal: 453
    text: And thus my brethren did complain against me, and were desirous that they might not labor, for they did not believe that I could build a ship; neither would they believe that I was instructed of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.19
    scripture: book-of-mormon
    name: 1 Nephi 17:19
    book: 1 Nephi
    chapter: 17
    verse: 19
    ordinal: 454
    text: 'And now it came to pass that I, Nephi, was exceedingly sorrowful because of the hardness of their hearts; and now when they saw that I began to be sorrowful they were glad in their hearts, insomuch that they did rejoice over me, saying: We knew that ye could not construct a ship, for we knew that ye were lacking in judgment; wherefore, thou canst not accomplish so great a work.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.20
    scripture: book-of-mormon
    name: 1 Nephi 17:20
    book: 1 Nephi
    chapter: 17
    verse: 20
    ordinal: 455
    text: And thou art like unto our father, led away by the foolish imaginations of his heart; yea, he hath led us out of the land of Jerusalem, and we have wandered in the wilderness for these many years; and our women have toiled, being big with child; and they have borne children in the wilderness and suffered all things, save it were death; and it would have been better that they had died before they came out of Jerusalem than to have suffered these afflictions.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.21
    scripture: book-of-mormon
    name: 1 Nephi 17:21
    book: 1 Nephi
    chapter: 17
    verse: 21
    ordinal: 456
    text: Behold, these many years we have suffered in the wilderness, which time we might have enjoyed our possessions and the land of our inheritance; yea, and we might have been happy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.22
    scripture: book-of-mormon
    name: 1 Nephi 17:22
    book: 1 Nephi
    chapter: 17
    verse: 22
    ordinal: 457
    text: And we know that the people who were in the land of Jerusalem were a righteous people; for they kept the statutes and judgments of the Lord, and all his commandments, according to the law of Moses; wherefore, we know that they are a righteous people; and our father hath judged them, and hath led us away because we would hearken unto his words; yea, and our brother is like unto him. And after this manner of language did my brethren murmur and complain against us.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.23
    scripture: book-of-mormon
    name: 1 Nephi 17:23
    book: 1 Nephi
    chapter: 17
    verse: 23
    ordinal: 458
    text: 'And it came to pass that I, Nephi, spake unto them, saying: Do ye believe that our fathers, who were the children of Israel, would have been led away out of the hands of the Egyptians if they had not hearkened unto the words of the Lord?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.24
    scripture: book-of-mormon
    name: 1 Nephi 17:24
    book: 1 Nephi
    chapter: 17
    verse: 24
    ordinal: 459
    text: Yea, do ye suppose that they would have been led out of bondage, if the Lord had not commanded Moses that he should lead them out of bondage?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.25
    scripture: book-of-mormon
    name: 1 Nephi 17:25
    book: 1 Nephi
    chapter: 17
    verse: 25
    ordinal: 460
    text: Now ye know that the children of Israel were in bondage; and ye know that they were laden with tasks, which were grievous to be borne; wherefore, ye know that it must needs be a good thing for them, that they should be brought out of bondage.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.26
    scripture: book-of-mormon
    name: 1 Nephi 17:26
    book: 1 Nephi
    chapter: 17
    verse: 26
    ordinal: 461
    text: Now ye know that Moses was commanded of the Lord to do that great work; and ye know that by his word the waters of the Red Sea were divided hither and thither, and they passed through on dry ground.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.27
    scripture: book-of-mormon
    name: 1 Nephi 17:27
    book: 1 Nephi
    chapter: 17
    verse: 27
    ordinal: 462
    text: But ye know that the Egyptians were drowned in the Red Sea, who were the armies of Pharaoh.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.28
    scripture: book-of-mormon
    name: 1 Nephi 17:28
    book: 1 Nephi
    chapter: 17
    verse: 28
    ordinal: 463
    text: And ye also know that they were fed with manna in the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.29
    scripture: book-of-mormon
    name: 1 Nephi 17:29
    book: 1 Nephi
    chapter: 17
    verse: 29
    ordinal: 464
    text: Yea, and ye also know that Moses, by his word according to the power of God which was in him, smote the rock, and there came forth water, that the children of Israel might quench their thirst.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.30
    scripture: book-of-mormon
    name: 1 Nephi 17:30
    book: 1 Nephi
    chapter: 17
    verse: 30
    ordinal: 465
    text: And notwithstanding they being led, the Lord their God, their Redeemer, going before them, leading them by day and giving light unto them by night, and doing all things for them which were expedient for man to receive, they hardened their hearts and blinded their minds, and reviled against Moses and against the true and living God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.31
    scripture: book-of-mormon
    name: 1 Nephi 17:31
    book: 1 Nephi
    chapter: 17
    verse: 31
    ordinal: 466
    text: And it came to pass that according to his word he did destroy them; and according to his word he did lead them; and according to his word he did do all things for them; and there was not any thing done save it were by his word.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.32
    scripture: book-of-mormon
    name: 1 Nephi 17:32
    book: 1 Nephi
    chapter: 17
    verse: 32
    ordinal: 467
    text: And after they had crossed the river Jordan he did make them mighty unto the driving out of the children of the land, yea, unto the scattering them to destruction.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.33
    scripture: book-of-mormon
    name: 1 Nephi 17:33
    book: 1 Nephi
    chapter: 17
    verse: 33
    ordinal: 468
    text: And now, do ye suppose that the children of this land, who were in the land of promise, who were driven out by our fathers, do ye suppose that they were righteous? Behold, I say unto you, Nay.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.34
    scripture: book-of-mormon
    name: 1 Nephi 17:34
    book: 1 Nephi
    chapter: 17
    verse: 34
    ordinal: 469
    text: Do ye suppose that our fathers would have been more choice than they if they had been righteous? I say unto you, Nay.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.35
    scripture: book-of-mormon
    name: 1 Nephi 17:35
    book: 1 Nephi
    chapter: 17
    verse: 35
    ordinal: 470
    text: Behold, the Lord esteemeth all flesh in one; he that is righteous is favored of God. But behold, this people had rejected every word of God, and they were ripe in iniquity; and the fulness of the wrath of God was upon them; and the Lord did curse the land against them, and bless it unto our fathers; yea, he did curse it against them unto their destruction, and he did bless it unto our fathers unto their obtaining power over it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.36
    scripture: book-of-mormon
    name: 1 Nephi 17:36
    book: 1 Nephi
    chapter: 17
    verse: 36
    ordinal: 471
    text: Behold, the Lord hath created the earth that it should be inhabited; and he hath created his children that they should possess it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.37
    scripture: book-of-mormon
    name: 1 Nephi 17:37
    book: 1 Nephi
    chapter: 17
    verse: 37
    ordinal: 472
    text: And he raiseth up a righteous nation, and destroyeth the nations of the wicked.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.38
    scripture: book-of-mormon
    name: 1 Nephi 17:38
    book: 1 Nephi
    chapter: 17
    verse: 38
    ordinal: 473
    text: And he leadeth away the righteous into precious lands, and the wicked he destroyeth, and curseth the land unto them for their sakes.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.39
    scripture: book-of-mormon
    name: 1 Nephi 17:39
    book: 1 Nephi
    chapter: 17
    verse: 39
    ordinal: 474
    text: He ruleth high in the heavens, for it is his throne, and this earth is his footstool.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.40
    scripture: book-of-mormon
    name: 1 Nephi 17:40
    book: 1 Nephi
    chapter: 17
    verse: 40
    ordinal: 475
    text: And he loveth those who will have him to be their God. Behold, he loved our fathers, and he covenanted with them, yea, even Abraham, Isaac, and Jacob; and he remembered the covenants which he had made; wherefore, he did bring them out of the land of Egypt.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.41
    scripture: book-of-mormon
    name: 1 Nephi 17:41
    book: 1 Nephi
    chapter: 17
    verse: 41
    ordinal: 476
    text: And he did straiten them in the wilderness with his rod; for they hardened their hearts, even as ye have; and the Lord straitened them because of their iniquity. He sent fiery flying serpents among them; and after they were bitten he prepared a way that they might be healed; and the labor which they had to perform was to look; and because of the simpleness of the way, or the easiness of it, there were many who perished.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.42
    scripture: book-of-mormon
    name: 1 Nephi 17:42
    book: 1 Nephi
    chapter: 17
    verse: 42
    ordinal: 477
    text: And they did harden their hearts from time to time, and they did revile against Moses, and also against God; nevertheless, ye know that they were led forth by his matchless power into the land of promise.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.43
    scripture: book-of-mormon
    name: 1 Nephi 17:43
    book: 1 Nephi
    chapter: 17
    verse: 43
    ordinal: 478
    text: And now, after all these things, the time has come that they have become wicked, yea, nearly unto ripeness; and I know not but they are at this day about to be destroyed; for I know that the day must surely come that they must be destroyed, save a few only, who shall be led away into captivity.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.44
    scripture: book-of-mormon
    name: 1 Nephi 17:44
    book: 1 Nephi
    chapter: 17
    verse: 44
    ordinal: 479
    text: Wherefore, the Lord commanded my father that he should depart into the wilderness; and the Jews also sought to take away his life; yea, and ye also have sought to take away his life; wherefore, ye are murderers in your hearts and ye are like unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.45
    scripture: book-of-mormon
    name: 1 Nephi 17:45
    book: 1 Nephi
    chapter: 17
    verse: 45
    ordinal: 480
    text: Ye are swift to do iniquity but slow to remember the Lord your God. Ye have seen an angel, and he spake unto you; yea, ye have heard his voice from time to time; and he hath spoken unto you in a still small voice, but ye were past feeling, that ye could not feel his words; wherefore, he has spoken unto you like unto the voice of thunder, which did cause the earth to shake as if it were to divide asunder.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.46
    scripture: book-of-mormon
    name: 1 Nephi 17:46
    book: 1 Nephi
    chapter: 17
    verse: 46
    ordinal: 481
    text: And ye also know that by the power of his almighty word he can cause the earth that it shall pass away; yea, and ye know that by his word he can cause the rough places to be made smooth, and smooth places shall be broken up. O, then, why is it, that ye can be so hard in your hearts?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.47
    scripture: book-of-mormon
    name: 1 Nephi 17:47
    book: 1 Nephi
    chapter: 17
    verse: 47
    ordinal: 482
    text: Behold, my soul is rent with anguish because of you, and my heart is pained; I fear lest ye shall be cast off forever. Behold, I am full of the Spirit of God, insomuch that my frame has no strength.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.48
    scripture: book-of-mormon
    name: 1 Nephi 17:48
    book: 1 Nephi
    chapter: 17
    verse: 48
    ordinal: 483
    text: 'And now it came to pass that when I had spoken these words they were angry with me, and were desirous to throw me into the depths of the sea; and as they came forth to lay their hands upon me I spake unto them, saying: In the name of the Almighty God, I command you that ye touch me not, for I am filled with the power of God, even unto the consuming of my flesh; and whoso shall lay his hands upon me shall wither even as a dried reed; and he shall be as naught before the power of God, for God shall smite him.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.49
    scripture: book-of-mormon
    name: 1 Nephi 17:49
    book: 1 Nephi
    chapter: 17
    verse: 49
    ordinal: 484
    text: And it came to pass that I, Nephi, said unto them that they should murmur no more against their father; neither should they withhold their labor from me, for God had commanded me that I should build a ship.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.50
    scripture: book-of-mormon
    name: 1 Nephi 17:50
    book: 1 Nephi
    chapter: 17
    verse: 50
    ordinal: 485
    text: 'And I said unto them: If God had commanded me to do all things I could do them. If he should command me that I should say unto this water, be thou earth, it should be earth; and if I should say it, it would be done.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.51
    scripture: book-of-mormon
    name: 1 Nephi 17:51
    book: 1 Nephi
    chapter: 17
    verse: 51
    ordinal: 486
    text: And now, if the Lord has such great power, and has wrought so many miracles among the children of men, how is it that he cannot instruct me, that I should build a ship?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.52
    scripture: book-of-mormon
    name: 1 Nephi 17:52
    book: 1 Nephi
    chapter: 17
    verse: 52
    ordinal: 487
    text: And it came to pass that I, Nephi, said many things unto my brethren, insomuch that they were confounded and could not contend against me; neither durst they lay their hands upon me nor touch me with their fingers, even for the space of many days. Now they durst not do this lest they should wither before me, so powerful was the Spirit of God; and thus it had wrought upon them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.53
    scripture: book-of-mormon
    name: 1 Nephi 17:53
    book: 1 Nephi
    chapter: 17
    verse: 53
    ordinal: 488
    text: 'And it came to pass that the Lord said unto me: Stretch forth thine hand again unto thy brethren, and they shall not wither before thee, but I will shock them, saith the Lord, and this will I do, that they may know that I am the Lord their God.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.54
    scripture: book-of-mormon
    name: 1 Nephi 17:54
    book: 1 Nephi
    chapter: 17
    verse: 54
    ordinal: 489
    text: And it came to pass that I stretched forth my hand unto my brethren, and they did not wither before me; but the Lord did shake them, even according to the word which he had spoken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.17.55
    scripture: book-of-mormon
    name: 1 Nephi 17:55
    book: 1 Nephi
    chapter: 17
    verse: 55
    ordinal: 490
    text: 'And now, they said: We know of a surety that the Lord is with thee, for we know that it is the power of the Lord that has shaken us. And they fell down before me, and were about to worship me, but I would not suffer them, saying: I am thy brother, yea, even thy younger brother; wherefore, worship the Lord thy God, and honor thy father and thy mother, that thy days may be long in the land which the Lord thy God shall give thee.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.17
- type: BomVerse
  data:
    ref: 1-nephi.18.1
    scripture: book-of-mormon
    name: 1 Nephi 18:1
    book: 1 Nephi
    chapter: 18
    verse: 1
    ordinal: 491
    text: And it came to pass that they did worship the Lord, and did go forth with me; and we did work timbers of curious workmanship. And the Lord did show me from time to time after what manner I should work the timbers of the ship.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.2
    scripture: book-of-mormon
    name: 1 Nephi 18:2
    book: 1 Nephi
    chapter: 18
    verse: 2
    ordinal: 492
    text: Now I, Nephi, did not work the timbers after the manner which was learned by men, neither did I build the ship after the manner of men; but I did build it after the manner which the Lord had shown unto me; wherefore, it was not after the manner of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.3
    scripture: book-of-mormon
    name: 1 Nephi 18:3
    book: 1 Nephi
    chapter: 18
    verse: 3
    ordinal: 493
    text: And I, Nephi, did go into the mount oft, and I did pray oft unto the Lord; wherefore the Lord showed unto me great things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.4
    scripture: book-of-mormon
    name: 1 Nephi 18:4
    book: 1 Nephi
    chapter: 18
    verse: 4
    ordinal: 494
    text: And it came to pass that after I had finished the ship, according to the word of the Lord, my brethren beheld that it was good, and that the workmanship thereof was exceedingly fine; wherefore, they did humble themselves again before the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.5
    scripture: book-of-mormon
    name: 1 Nephi 18:5
    book: 1 Nephi
    chapter: 18
    verse: 5
    ordinal: 495
    text: And it came to pass that the voice of the Lord came unto my father, that we should arise and go down into the ship.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.6
    scripture: book-of-mormon
    name: 1 Nephi 18:6
    book: 1 Nephi
    chapter: 18
    verse: 6
    ordinal: 496
    text: And it came to pass that on the morrow, after we had prepared all things, much fruits and meat from the wilderness, and honey in abundance, and provisions according to that which the Lord had commanded us, we did go down into the ship, with all our loading and our seeds, and whatsoever thing we had brought with us, every one according to his age; wherefore, we did all go down into the ship, with our wives and our children.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.7
    scripture: book-of-mormon
    name: 1 Nephi 18:7
    book: 1 Nephi
    chapter: 18
    verse: 7
    ordinal: 497
    text: And now, my father had begat two sons in the wilderness; the elder was called Jacob and the younger Joseph.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.8
    scripture: book-of-mormon
    name: 1 Nephi 18:8
    book: 1 Nephi
    chapter: 18
    verse: 8
    ordinal: 498
    text: And it came to pass after we had all gone down into the ship, and had taken with us our provisions and things which had been commanded us, we did put forth into the sea and were driven forth before the wind towards the promised land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.9
    scripture: book-of-mormon
    name: 1 Nephi 18:9
    book: 1 Nephi
    chapter: 18
    verse: 9
    ordinal: 499
    text: And after we had been driven forth before the wind for the space of many days, behold, my brethren and the sons of Ishmael and also their wives began to make themselves merry, insomuch that they began to dance, and to sing, and to speak with much rudeness, yea, even that they did forget by what power they had been brought thither; yea, they were lifted up unto exceeding rudeness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.10
    scripture: book-of-mormon
    name: 1 Nephi 18:10
    book: 1 Nephi
    chapter: 18
    verse: 10
    ordinal: 500
    text: 'And I, Nephi, began to fear exceedingly lest the Lord should be angry with us, and smite us because of our iniquity, that we should be swallowed up in the depths of the sea; wherefore, I, Nephi, began to speak to them with much soberness; but behold they were angry with me, saying: We will not that our younger brother shall be a ruler over us.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.11
    scripture: book-of-mormon
    name: 1 Nephi 18:11
    book: 1 Nephi
    chapter: 18
    verse: 11
    ordinal: 501
    text: And it came to pass that Laman and Lemuel did take me and bind me with cords, and they did treat me with much harshness; nevertheless, the Lord did suffer it that he might show forth his power, unto the fulfilling of his word which he had spoken concerning the wicked.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.12
    scripture: book-of-mormon
    name: 1 Nephi 18:12
    book: 1 Nephi
    chapter: 18
    verse: 12
    ordinal: 502
    text: And it came to pass that after they had bound me insomuch that I could not move, the compass, which had been prepared of the Lord, did cease to work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.13
    scripture: book-of-mormon
    name: 1 Nephi 18:13
    book: 1 Nephi
    chapter: 18
    verse: 13
    ordinal: 503
    text: Wherefore, they knew not whither they should steer the ship, insomuch that there arose a great storm, yea, a great and terrible tempest, and we were driven back upon the waters for the space of three days; and they began to be frightened exceedingly lest they should be drowned in the sea; nevertheless they did not loose me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.14
    scripture: book-of-mormon
    name: 1 Nephi 18:14
    book: 1 Nephi
    chapter: 18
    verse: 14
    ordinal: 504
    text: And on the fourth day, which we had been driven back, the tempest began to be exceedingly sore.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.15
    scripture: book-of-mormon
    name: 1 Nephi 18:15
    book: 1 Nephi
    chapter: 18
    verse: 15
    ordinal: 505
    text: And it came to pass that we were about to be swallowed up in the depths of the sea. And after we had been driven back upon the waters for the space of four days, my brethren began to see that the judgments of God were upon them, and that they must perish save that they should repent of their iniquities; wherefore, they came unto me, and loosed the bands which were upon my wrists, and behold they had swollen exceedingly; and also mine ankles were much swollen, and great was the soreness thereof.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.16
    scripture: book-of-mormon
    name: 1 Nephi 18:16
    book: 1 Nephi
    chapter: 18
    verse: 16
    ordinal: 506
    text: Nevertheless, I did look unto my God, and I did praise him all the day long; and I did not murmur against the Lord because of mine afflictions.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.17
    scripture: book-of-mormon
    name: 1 Nephi 18:17
    book: 1 Nephi
    chapter: 18
    verse: 17
    ordinal: 507
    text: Now my father, Lehi, had said many things unto them, and also unto the sons of Ishmael; but, behold, they did breathe out much threatenings against anyone that should speak for me; and my parents being stricken in years, and having suffered much grief because of their children, they were brought down, yea, even upon their sick-beds.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.18
    scripture: book-of-mormon
    name: 1 Nephi 18:18
    book: 1 Nephi
    chapter: 18
    verse: 18
    ordinal: 508
    text: Because of their grief and much sorrow, and the iniquity of my brethren, they were brought near even to be carried out of this time to meet their God; yea, their grey hairs were about to be brought down to lie low in the dust; yea, even they were near to be cast with sorrow into a watery grave.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.19
    scripture: book-of-mormon
    name: 1 Nephi 18:19
    book: 1 Nephi
    chapter: 18
    verse: 19
    ordinal: 509
    text: And Jacob and Joseph also, being young, having need of much nourishment, were grieved because of the afflictions of their mother; and also my wife with her tears and prayers, and also my children, did not soften the hearts of my brethren that they would loose me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.20
    scripture: book-of-mormon
    name: 1 Nephi 18:20
    book: 1 Nephi
    chapter: 18
    verse: 20
    ordinal: 510
    text: And there was nothing save it were the power of God, which threatened them with destruction, could soften their hearts; wherefore, when they saw that they were about to be swallowed up in the depths of the sea they repented of the thing which they had done, insomuch that they loosed me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.21
    scripture: book-of-mormon
    name: 1 Nephi 18:21
    book: 1 Nephi
    chapter: 18
    verse: 21
    ordinal: 511
    text: And it came to pass after they had loosed me, behold, I took the compass, and it did work whither I desired it. And it came to pass that I prayed unto the Lord; and after I had prayed the winds did cease, and the storm did cease, and there was a great calm.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.22
    scripture: book-of-mormon
    name: 1 Nephi 18:22
    book: 1 Nephi
    chapter: 18
    verse: 22
    ordinal: 512
    text: And it came to pass that I, Nephi, did guide the ship, that we sailed again towards the promised land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.23
    scripture: book-of-mormon
    name: 1 Nephi 18:23
    book: 1 Nephi
    chapter: 18
    verse: 23
    ordinal: 513
    text: And it came to pass that after we had sailed for the space of many days we did arrive at the promised land; and we went forth upon the land, and did pitch our tents; and we did call it the promised land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.24
    scripture: book-of-mormon
    name: 1 Nephi 18:24
    book: 1 Nephi
    chapter: 18
    verse: 24
    ordinal: 514
    text: And it came to pass that we did begin to till the earth, and we began to plant seeds; yea, we did put all our seeds into the earth, which we had brought from the land of Jerusalem. And it came to pass that they did grow exceedingly; wherefore, we were blessed in abundance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.18.25
    scripture: book-of-mormon
    name: 1 Nephi 18:25
    book: 1 Nephi
    chapter: 18
    verse: 25
    ordinal: 515
    text: And it came to pass that we did find upon the land of promise, as we journeyed in the wilderness, that there were beasts in the forests of every kind, both the cow and the ox, and the ass and the horse, and the goat and the wild goat, and all manner of wild animals, which were for the use of men. And we did find all manner of ore, both of gold, and of silver, and of copper.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.18
- type: BomVerse
  data:
    ref: 1-nephi.19.1
    scripture: book-of-mormon
    name: 1 Nephi 19:1
    book: 1 Nephi
    chapter: 19
    verse: 1
    ordinal: 516
    text: And it came to pass that the Lord commanded me, wherefore I did make plates of ore that I might engraven upon them the record of my people. And upon the plates which I made I did engraven the record of my father, and also our journeyings in the wilderness, and the prophecies of my father; and also many of mine own prophecies have I engraven upon them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.2
    scripture: book-of-mormon
    name: 1 Nephi 19:2
    book: 1 Nephi
    chapter: 19
    verse: 2
    ordinal: 517
    text: And I knew not at the time when I made them that I should be commanded of the Lord to make these plates; wherefore, the record of my father, and the genealogy of his fathers, and the more part of all our proceedings in the wilderness are engraven upon those first plates of which I have spoken; wherefore, the things which transpired before I made these plates are, of a truth, more particularly made mention upon the first plates.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.3
    scripture: book-of-mormon
    name: 1 Nephi 19:3
    book: 1 Nephi
    chapter: 19
    verse: 3
    ordinal: 518
    text: And after I had made these plates by way of commandment, I, Nephi, received a commandment that the ministry and the prophecies, the more plain and precious parts of them, should be written upon these plates; and that the things which were written should be kept for the instruction of my people, who should possess the land, and also for other wise purposes, which purposes are known unto the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.4
    scripture: book-of-mormon
    name: 1 Nephi 19:4
    book: 1 Nephi
    chapter: 19
    verse: 4
    ordinal: 519
    text: Wherefore, I, Nephi, did make a record upon the other plates, which gives an account, or which gives a greater account of the wars and contentions and destructions of my people. And this have I done, and commanded my people what they should do after I was gone; and that these plates should be handed down from one generation to another, or from one prophet to another, until further commandments of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.5
    scripture: book-of-mormon
    name: 1 Nephi 19:5
    book: 1 Nephi
    chapter: 19
    verse: 5
    ordinal: 520
    text: And an account of my making these plates shall be given hereafter; and then, behold, I proceed according to that which I have spoken; and this I do that the more sacred things may be kept for the knowledge of my people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.6
    scripture: book-of-mormon
    name: 1 Nephi 19:6
    book: 1 Nephi
    chapter: 19
    verse: 6
    ordinal: 521
    text: Nevertheless, I do not write anything upon plates save it be that I think it be sacred. And now, if I do err, even did they err of old; not that I would excuse myself because of other men, but because of the weakness which is in me, according to the flesh, I would excuse myself.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.7
    scripture: book-of-mormon
    name: 1 Nephi 19:7
    book: 1 Nephi
    chapter: 19
    verse: 7
    ordinal: 522
    text: For the things which some men esteem to be of great worth, both to the body and soul, others set at naught and trample under their feet. Yea, even the very God of Israel do men trample under their feet; I say, trample under their feet but I would speak in other words—they set him at naught, and hearken not to the voice of his counsels.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.8
    scripture: book-of-mormon
    name: 1 Nephi 19:8
    book: 1 Nephi
    chapter: 19
    verse: 8
    ordinal: 523
    text: And behold he cometh, according to the words of the angel, in six hundred years from the time my father left Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.9
    scripture: book-of-mormon
    name: 1 Nephi 19:9
    book: 1 Nephi
    chapter: 19
    verse: 9
    ordinal: 524
    text: And the world, because of their iniquity, shall judge him to be a thing of naught; wherefore they scourge him, and he suffereth it; and they smite him, and he suffereth it. Yea, they spit upon him, and he suffereth it, because of his loving kindness and his long-suffering towards the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.10
    scripture: book-of-mormon
    name: 1 Nephi 19:10
    book: 1 Nephi
    chapter: 19
    verse: 10
    ordinal: 525
    text: And the God of our fathers, who were led out of Egypt, out of bondage, and also were preserved in the wilderness by him, yea, the God of Abraham, and of Isaac, and the God of Jacob, yieldeth himself, according to the words of the angel, as a man, into the hands of wicked men, to be lifted up, according to the words of Zenock, and to be crucified, according to the words of Neum, and to be buried in a sepulchre, according to the words of Zenos, which he spake concerning the three days of darkness, which should be a sign given of his death unto those who should inhabit the isles of the sea, more especially given unto those who are of the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.11
    scripture: book-of-mormon
    name: 1 Nephi 19:11
    book: 1 Nephi
    chapter: 19
    verse: 11
    ordinal: 526
    text: 'For thus spake the prophet: The Lord God surely shall visit all the house of Israel at that day, some with his voice, because of their righteousness, unto their great joy and salvation, and others with the thunderings and the lightnings of his power, by tempest, by fire, and by smoke, and vapor of darkness, and by the opening of the earth, and by mountains which shall be carried up.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.12
    scripture: book-of-mormon
    name: 1 Nephi 19:12
    book: 1 Nephi
    chapter: 19
    verse: 12
    ordinal: 527
    text: 'And all these things must surely come, saith the prophet Zenos. And the rocks of the earth must rend; and because of the groanings of the earth, many of the kings of the isles of the sea shall be wrought upon by the Spirit of God, to exclaim: The God of nature suffers.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.13
    scripture: book-of-mormon
    name: 1 Nephi 19:13
    book: 1 Nephi
    chapter: 19
    verse: 13
    ordinal: 528
    text: And as for those who are at Jerusalem, saith the prophet, they shall be scourged by all people, because they crucify the God of Israel, and turn their hearts aside, rejecting signs and wonders, and the power and glory of the God of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.14
    scripture: book-of-mormon
    name: 1 Nephi 19:14
    book: 1 Nephi
    chapter: 19
    verse: 14
    ordinal: 529
    text: And because they turn their hearts aside, saith the prophet, and have despised the Holy One of Israel, they shall wander in the flesh, and perish, and become a hiss and a byword, and be hated among all nations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.15
    scripture: book-of-mormon
    name: 1 Nephi 19:15
    book: 1 Nephi
    chapter: 19
    verse: 15
    ordinal: 530
    text: Nevertheless, when that day cometh, saith the prophet, that they no more turn aside their hearts against the Holy One of Israel, then will he remember the covenants which he made to their fathers.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.16
    scripture: book-of-mormon
    name: 1 Nephi 19:16
    book: 1 Nephi
    chapter: 19
    verse: 16
    ordinal: 531
    text: Yea, then will he remember the isles of the sea; yea, and all the people who are of the house of Israel, will I gather in, saith the Lord, according to the words of the prophet Zenos, from the four quarters of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.17
    scripture: book-of-mormon
    name: 1 Nephi 19:17
    book: 1 Nephi
    chapter: 19
    verse: 17
    ordinal: 532
    text: Yea, and all the earth shall see the salvation of the Lord, saith the prophet; every nation, kindred, tongue and people shall be blessed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.18
    scripture: book-of-mormon
    name: 1 Nephi 19:18
    book: 1 Nephi
    chapter: 19
    verse: 18
    ordinal: 533
    text: And I, Nephi, have written these things unto my people, that perhaps I might persuade them that they would remember the Lord their Redeemer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.19
    scripture: book-of-mormon
    name: 1 Nephi 19:19
    book: 1 Nephi
    chapter: 19
    verse: 19
    ordinal: 534
    text: Wherefore, I speak unto all the house of Israel, if it so be that they should obtain these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.20
    scripture: book-of-mormon
    name: 1 Nephi 19:20
    book: 1 Nephi
    chapter: 19
    verse: 20
    ordinal: 535
    text: For behold, I have workings in the spirit, which doth weary me even that all my joints are weak, for those who are at Jerusalem; for had not the Lord been merciful, to show unto me concerning them, even as he had prophets of old, I should have perished also.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.21
    scripture: book-of-mormon
    name: 1 Nephi 19:21
    book: 1 Nephi
    chapter: 19
    verse: 21
    ordinal: 536
    text: And he surely did show unto the prophets of old all things concerning them; and also he did show unto many concerning us; wherefore, it must needs be that we know concerning them for they are written upon the plates of brass.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.22
    scripture: book-of-mormon
    name: 1 Nephi 19:22
    book: 1 Nephi
    chapter: 19
    verse: 22
    ordinal: 537
    text: Now it came to pass that I, Nephi, did teach my brethren these things; and it came to pass that I did read many things to them, which were engraven upon the plates of brass, that they might know concerning the doings of the Lord in other lands, among people of old.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.23
    scripture: book-of-mormon
    name: 1 Nephi 19:23
    book: 1 Nephi
    chapter: 19
    verse: 23
    ordinal: 538
    text: And I did read many things unto them which were written in the books of Moses; but that I might more fully persuade them to believe in the Lord their Redeemer I did read unto them that which was written by the prophet Isaiah; for I did liken all scriptures unto us, that it might be for our profit and learning.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.19.24
    scripture: book-of-mormon
    name: 1 Nephi 19:24
    book: 1 Nephi
    chapter: 19
    verse: 24
    ordinal: 539
    text: 'Wherefore I spake unto them, saying: Hear ye the words of the prophet, ye who are a remnant of the house of Israel, a branch who have been broken off; hear ye the words of the prophet, which were written unto all the house of Israel, and liken them unto yourselves, that ye may have hope as well as your brethren from whom ye have been broken off; for after this manner has the prophet written.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.19
- type: BomVerse
  data:
    ref: 1-nephi.20.1
    scripture: book-of-mormon
    name: 1 Nephi 20:1
    book: 1 Nephi
    chapter: 20
    verse: 1
    ordinal: 540
    text: Hearken and hear this, O house of Jacob, who are called by the name of Israel, and are come forth out of the waters of Judah, or out of the waters of baptism, who swear by the name of the Lord, and make mention of the God of Israel, yet they swear not in truth nor in righteousness.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 48:1
    kjvOsis:
    - Isa.48.1
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.20
- type: BomVerse
  data:
    ref: 1-nephi.20.2
    scripture: book-of-mormon
    name: 1 Nephi 20:2
    book: 1 Nephi
    chapter: 20
    verse: 2
    ordinal: 541
    text: Nevertheless, they call themselves of the holy city, but they do not stay themselves upon the God of Israel, who is the Lord of Hosts; yea, the Lord of Hosts is his name.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 48:2
    kjvOsis:
    - Isa.48.2
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.20
- type: BomVerse
  data:
    ref: 1-nephi.20.3
    scripture: book-of-mormon
    name: 1 Nephi 20:3
    book: 1 Nephi
    chapter: 20
    verse: 3
    ordinal: 542
    text: Behold, I have declared the former things from the beginning; and they went forth out of my mouth, and I showed them. I did show them suddenly.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 48:3
    kjvOsis:
    - Isa.48.3
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.20
- type: BomVerse
  data:
    ref: 1-nephi.20.4
    scripture: book-of-mormon
    name: 1 Nephi 20:4
    book: 1 Nephi
    chapter: 20
    verse: 4
    ordinal: 543
    text: And I did it because I knew that thou art obstinate, and thy neck is an iron sinew, and thy brow brass;
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 48:4
    kjvOsis:
    - Isa.48.4
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.20
- type: BomVerse
  data:
    ref: 1-nephi.20.5
    scripture: book-of-mormon
    name: 1 Nephi 20:5
    book: 1 Nephi
    chapter: 20
    verse: 5
    ordinal: 544
    text: And I have even from the beginning declared to thee; before it came to pass I showed them thee; and I showed them for fear lest thou shouldst say—Mine idol hath done them, and my graven image, and my molten image hath commanded them.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 48:5
    kjvOsis:
    - Isa.48.5
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 1-nephi.20
- type: BomVerse
  data:
    ref: 1-nephi.20.6
    scripture: book-of-mormon
    name: 1 Nephi 20:6
    book: 1 Nephi
    chapter: 20
    verse: 6
    ordinal: 545
    text: Thou hast seen and heard all this; and will ye not declare them? And that I have showed thee new things from this time, even hidden things, and thou didst not know them.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 48:6
