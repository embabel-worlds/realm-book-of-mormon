    scripture: book-of-mormon
    name: 3 Nephi 22:8
    book: 3 Nephi
    chapter: 22
    verse: 8
    ordinal: 5580
    text: In a little wrath I hid my face from thee for a moment, but with everlasting kindness will I have mercy on thee, saith the Lord thy Redeemer.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 54:8
    kjvOsis:
    - Isa.54.8
  relations:
