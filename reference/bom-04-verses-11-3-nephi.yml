    scripture: book-of-mormon
    name: 3 Nephi 22:5
    book: 3 Nephi
    chapter: 22
    verse: 5
    ordinal: 5577
    text: For thy maker, thy husband, the Lord of Hosts is his name; and thy Redeemer, the Holy One of Israel—the God of the whole earth shall he be called.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Isaiah 54:5
    kjvOsis:
    - Isa.54.5
