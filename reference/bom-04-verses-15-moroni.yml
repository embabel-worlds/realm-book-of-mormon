  - predicate: IN
    to:
      type: BomChapter
      ref: moroni.3
- type: BomVerse
  data:
    ref: moroni.3.2
    scripture: book-of-mormon
    name: Moroni 3:2
    book: Moroni
    chapter: 3
    verse: 2
    ordinal: 6450
    text: 'After they had prayed unto the Father in the name of Christ, they laid their hands upon them, and said:'
    translation: 2013 edition
    original: ''
