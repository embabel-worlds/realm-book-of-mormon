    - Micah 5:10
    kjvOsis:
    - Mic.5.10
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
- type: BomVerse
  data:
    ref: 3-nephi.21.15
    scripture: book-of-mormon
    name: 3 Nephi 21:15
    book: 3 Nephi
    chapter: 21
    verse: 15
    ordinal: 5558
    text: And I will cut off the cities of thy land, and throw down all thy strongholds;
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Micah 5:11
    kjvOsis:
    - Mic.5.11
  relations:
  - predicate: IN
    to:
      type: BomChapter
      ref: 3-nephi.21
